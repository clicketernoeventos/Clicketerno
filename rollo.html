/* ── ruteo según el estado del rollo ── */
/* ¿el invitado ya vio algo de verdad? La pantalla arranca con un "Cargando…"
   que no cuenta: si la señal se cae en el primer pedido, sin esto se queda
   mirando ese cartel para siempre, sin saber si esperar o recargar. */
let vistaViva=false;
/* El invitado salió de la cámara con fotos sin gastar. Vive acá y no en la
   base a propósito: es de ESTA visita, no del rollo. Si recarga la página
   vuelve a entrar derecho a la cámara, que es lo que quiere. Lo mira
   rutear(), porque el sondeo de estado lo devolvía solo a la cámara cada
   quince segundos. */
let pausado=false;
/* El cuarto oscuro se ve UNA vez por rollo. Esto lo pide de nuevo a mano,
   que es lo que usa el botón "Ver cómo se revela" de la demostración. */
let forzarRevelado=false;
async function consultarEstado(m,guardado){
  try{
    const estado=await SB.rpc('ce_mi_rollo',{p_codigo:m.codigo,p_token:guardado.token,p_nombre:guardado.nombre});
    rutear(m,guardado,estado);
  }catch(e){
    /* Con algo ya dibujado seguimos como estábamos y probamos en el
       próximo tic. Sin nada dibujado, se lo decimos. */
    if(!vistaViva && !app.querySelector('#sinSenal')) vSinSenal(m,guardado);
  }
}
function vSinSenal(m,guardado){
  detenerPoll(); vistaViva=false;
  app.innerHTML=`<div class="centro" id="sinSenal"><img src="marca.webp" style="width:110px;margin:0 auto 22px;opacity:.7" alt="">
    <p class="espaciado">Cámara descartable</p>
    <h1 class="ital" style="font-size:26px;margin-top:12px">No pude conectar</h1>
    <p class="info">Puede ser la señal del salón. Seguimos probando solos.</p>
    <button class="hilo-btn" id="reintentar" style="margin-top:20px">Probar de nuevo</button></div>`;
  const b=app.querySelector('#reintentar');
  b.onclick=()=>{ b.disabled=true; b.textContent='Probando…';
    consultarEstado(m,guardado).then(()=>{ if(b.isConnected){ b.disabled=false; b.textContent='Probar de nuevo'; } }); };
  cadaTanto(()=>consultarEstado(m,guardado),8000);
}

function rutear(m,guardado,estado){
  if(!estado) return vSinSenal(m,guardado);
  if(estado.revelado) return vAlbum(m,guardado);
  if(estado.cerrado)  return vCerrado(m,guardado);
  /* Si cupo viniera vacío, "0 >= null" da verdadero en JavaScript y al
     invitado le aparecía "ya sacaste tus  fotos" sin haber sacado ninguna:
     la cámara no se abría nunca. */
  const cupo=cupoDe(estado), hechos=Number(estado.disparos)||0;
  const est={...estado, cupo, disparos:hechos};
  if(hechos>=cupo) return vEsperando(m,guardado,est);
  /* Va DESPUÉS de revelado y cerrado: esos dos mandan siempre. Si el
     organizador cierra el rollo mientras el invitado está en pausa, la
     próxima vuelta del sondeo lo saca de acá. */
  if(pausado) return vPausa(m,guardado,est);
  return vCamara(m,guardado,est);
}

/* ── el rollo guardado para después ──
   Probado en un iPhone: se entraba a la cámara y no había forma de salir
   hasta gastar las 24 fotos. Una fiesta dura seis horas; el invitado saca
   dos en la entrada, guarda el teléfono, y vuelve en el brindis. Y
   mientras tanto la cámara quedaba PRENDIDA, comiéndole la batería. */
function vPausa(m,guardado,estado){
  detenerCamara(); olvidarVigilia();
  /* El sondeo la vuelve a llamar cada quince segundos. Redibujar acá sería
     pisarle la pantalla al invitado sin que nada haya cambiado: lo que
     cambia —el cierre y el revelado— ya lo atajó rutear() más arriba. */
  if(app.querySelector('#pausa')) return;
  detenerPoll(); vistaViva=true;
  const quedan=Math.max(0,cupoDe(estado)-(Number(estado.disparos)||0));
  app.innerHTML=`
  <div class="centro" id="pausa">
    ${ESTRELLA}
    <p class="espaciado" style="margin-top:16px">Tu rollo te espera</p>
    <h1 class="ital" style="font-size:clamp(24px,7vw,30px);margin-top:8px">
      Te ${quedan===1?'queda':'quedan'} ${quedan} ${quedan===1?'foto':'fotos'}</h1>
    <p class="info">Las que sacaste ya están guardadas. Volvé cuando quieras:
      el rollo sigue abierto hasta que lo cierre el organizador.</p>
    <button class="oro-btn" id="seguir" style="max-width:280px;margin:26px auto 0">Seguir sacando fotos</button>
  </div>`;
  app.querySelector('#seguir').onclick=()=>{
    pausado=false;
    /* Se vuelve a preguntar en vez de confiar en lo que teníamos: si el
       organizador cerró el rollo o lo reveló mientras el invitado estaba
       acá, tiene que ir a donde corresponde y no a la cámara. */
    consultarEstado(m,guardado);
  };
  if(guardado) cadaTanto(()=>consultarEstado(m,guardado),15000);
}

function vCerrado(m,guardado){
  detenerPoll(); vistaViva=true;
  app.innerHTML=`<div class="centro"><img src="marca.webp" style="width:110px;margin:0 auto 22px;opacity:.7" alt="">
    <p class="espaciado">Cámara descartable</p>
    <h1 class="ital" style="font-size:26px;margin-top:12px">La cámara ya cerró</h1>
    <p class="info">Cuando el organizador revele el rollo, va a aparecer acá mismo.</p></div>`;
  /* Sin esto el invitado se quedaba acá para siempre: el revelado llegaba
     y él seguía mirando el cartel de cerrado. */
  if(guardado) cadaTanto(()=>consultarEstado(m,guardado),15000);
}

/* el organizador puede volver a ocultar las fotos desde Ajustes */
function vGuardado(m,guardado){
  detenerPoll(); vistaViva=true;
  app.innerHTML=`<div class="centro"><img src="marca.webp" style="width:110px;margin:0 auto 22px;opacity:.7" alt="">
    <p class="espaciado">Cámara descartable</p>
    <h1 class="ital" style="font-size:26px;margin-top:12px">El álbum se guardó de nuevo</h1>
    <p class="info">El organizador lo ocultó. Cuando lo abra otra vez, aparece acá mismo.</p></div>`;
  if(guardado) cadaTanto(()=>consultarEstado(m,guardado),15000);
}

/* ── esperando el revelado ── */
function vEsperando(m,guardado,estado){
  detenerPoll(); vistaViva=true;
  app.innerHTML=`
  <div class="centro">
    ${ESTRELLA}
    <p class="espaciado" style="margin-top:16px">Rollo completo</p>
    <h1 class="ital" style="font-size:clamp(24px,7vw,30px);margin-top:8px">Ya sacaste tus ${esc(estado.cupo)} fotos</h1>
    <p class="info">${estado.revela_en?'Se revela solo cuando llegue la hora.':'El organizador todavía no reveló el rollo.'}</p>
    ${estado.revela_en?`<div class="cuenta-rev" id="cuenta"></div>`:''}
    <div class="filete" style="max-width:220px;margin:26px auto 0">${ESTRELLA}</div>
  </div>`;
  if(estado.revela_en){
    const cuenta=app.querySelector('#cuenta');
    let pedido=false;
    const pintar=()=>{
      const f=new Date(estado.revela_en).getTime()-Date.now();
      /* Al llegar a cero se pide UNA vez. Antes pedía cada segundo: si el
         reloj del teléfono iba adelantado, eso era un pedido por segundo
         para siempre, con la fiesta entera haciendo lo mismo. */
      if(f<=0){ cuenta.textContent='Revelando…';
        if(!pedido){ pedido=true; consultarEstado(m,guardado); } return; }
      const h=Math.floor(f/3600000), mi=Math.floor(f%3600000/60000), s=Math.floor(f%60000/1000);
      cuenta.textContent=(h?h+'h ':'')+String(mi).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
    };
    pintar();
    cadaTanto(pintar,1000);
    /* Aunque haya hora puesta, el organizador puede apretar "Revelar ahora":
       si solo miráramos el reloj, el invitado se quedaba esperando de gusto. */
    cadaTanto(()=>consultarEstado(m,guardado),20000);
  } else {
    cadaTanto(()=>consultarEstado(m,guardado),15000);
  }
}

/* ── la cámara ── */
let stream=null, video=null, filtroActual=FILTROS[0], usarTrasera=true, disparando=false;
function detenerCamara(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
/* El oído que vuelve a prender la cámara cuando iOS la corta. Vive fuera de
   la vista porque hay que poder sacarlo: si se acumulaba uno por cada vez
   que entrábamos a la cámara, el de la vista vieja le apagaba el stream a
   la nueva. */
let alVolverActual=null;
function olvidarVigilia(){
  if(!alVolverActual) return;
  document.removeEventListener('visibilitychange',alVolverActual);
  removeEventListener('pageshow',alVolverActual);
  alVolverActual=null;
}

async function vCamara(m,guardado,estado){
  detenerPoll(); olvidarVigilia(); vistaViva=true;
  const {token}=guardado;
  app.innerHTML=`
  <div class="camara">
    <div class="lente">
      <video id="video" autoplay playsinline muted></video>
      <div class="grano-visor" id="granoVisor"></div>
      <div class="flash" id="flash"></div>
      <div class="velo-arr"></div><div class="velo-aba"></div>
    </div>
    <div class="cam-arriba">
      <button class="salir-cam" id="salirCam" aria-label="Guardar el rollo para después">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span class="nombre-ev">${esc(m.nombre)}</span>
      <button class="girar" id="girar" aria-label="Girar cámara" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 13.9-4M20 15a8 8 0 0 1-13.9 4"/><path d="M18 3v5h-5M6 21v-5h5"/></svg>
      </button>
    </div>
    <!-- El rollo, arriba y a la vista. Antes el "quedan 21" era un número
         chico en un rincón de abajo, del mismo tamaño que todo lo demás, y
         lo que hace que esto sea una cámara descartable y no una app de
         fotos es justamente que las fotos se ACABAN. Los cuadraditos se
         van apagando: se VE el rollo gastándose. -->
    <div class="rollo-tira" id="rolloTira">
      <div class="cuadros" id="cuadros" aria-hidden="true"></div>
      <!-- "21 DE 24" se lee de las dos maneras: puede entenderse como "vas
           por la foto 21 de 24", o sea tres, que es lo contrario. La
           palabra "quedan" no se presta. El total lo dicen los cuadraditos;
           cuando son tantos que no se dibujan, se escribe. -->
      <p class="rollo-cuenta"><b id="cRestan">${cupoDe(estado)-(Number(estado.disparos)||0)}</b><span>quedan${cupoDe(estado)>36?` de ${cupoDe(estado)}`:''}</span></p>
    </div>
    <label class="native-alt" id="altNativa" hidden>Usar la cámara del teléfono
      <input type="file" accept="image/*" capture="environment" hidden></label>
    <div class="cam-abajo">
      <!-- Los filtros se eligen una vez, no por foto, pero la vista previa
           EN VIVO de los cinco es lo mejor que tenemos: se muestra abierta
           al principio —ese es el momento en que impresiona— y después de
           la primera foto se pliega a una sola ficha. Así abajo queda UNA
           cosa para tocar: el disparador. -->
      <div class="filtros-caja" id="filtrosCaja">
        <div class="tira-filtros" id="filtros" role="group" aria-label="Filtro"></div>
        <button class="filtro-chip" id="filtroChip" hidden aria-expanded="false">
          <i class="pto"></i><span id="filtroNombre"></span><em>cambiar</em></button>
      </div>
      <div class="fila-disparo">
        <button class="disparar" id="disparo" aria-label="Sacar foto"></button>
      </div>
      <!-- Una sola línea, y cambia sola según dónde está el invitado: la
           primera foto, las últimas tres, la última. Antes era un párrafo
           fijo que explicaba lo mismo para siempre. -->
      <p class="pie-camara" id="pieCamara"></p>
    </div>
  </div>`;

  video=app.querySelector('#video');
  /* el que ya eligió su filtro en este teléfono no tiene que volver a
     elegirlo cada vez que entra a la cámara */
  try{
    const guardadoF=localStorage.getItem('ce:filtro');
    const f=guardadoF&&FILTROS.find(x=>x.id===guardadoF);
    if(f) filtroActual=f;
  }catch(e){}
  const filtrosEl=app.querySelector('#filtros');
  filtrosEl.innerHTML=FILTROS.map(f=>`
    <button class="filtro-op" data-f="${f.id}" aria-pressed="${f.id===filtroActual.id}">
      <canvas width="112" height="112"></canvas><span>${esc(f.corto||f.nombre)}</span></button>`).join('');

  /* Cada filtro se muestra aplicado a lo que la cámara está viendo AHORA,
     no a un degradado ni a una foto de archivo. Es la diferencia entre
     adivinar cómo va a salir y verlo. */
  let relojMuestras=null;
  function pintarMuestras(){
    if(!video||!video.videoWidth) return;
    /* con la tira plegada los cinco canvas no se ven: dibujarlos tres
       veces por segundo es batería del invitado tirada al vidrio */
    if(typeof filtrosAbiertos!=='undefined' && !filtrosAbiertos) return;
    const lado=Math.min(video.videoWidth,video.videoHeight);
    const cx=(video.videoWidth-lado)/2, cy=(video.videoHeight-lado)/2;
    filtrosEl.querySelectorAll('[data-f]').forEach(b=>{
      const f=FILTROS.find(x=>x.id===b.dataset.f);
      const c=b.querySelector('canvas'); if(!c||!f) return;
      const x=c.getContext('2d');
      x.save();
      if(!usarTrasera){ x.translate(c.width,0); x.scale(-1,1); }
      x.drawImage(video, cx,cy,lado,lado, 0,0,c.width,c.height);
      x.restore();
      aplicarFiltro(x,c.width,c.height,f.css,f.grano);
    });
  }
  const granoVisor=app.querySelector('#granoVisor');
  const pintarGranoVisor=()=>{ if(granoVisor) granoVisor.style.opacity=String((filtroActual.grano||0)/26); };
  /* ── la tira se pliega ──
     Los cinco filtros en vivo son lo mejor que tiene esta pantalla, pero
     el filtro se elige UNA vez y el disparador se toca veinticuatro. Con
     la tira siempre abierta, abajo había cinco cosas para tocar del mismo
     tamaño que el disparador, y 170 de los 844 píxeles del teléfono
     ocupados para siempre por una decisión ya tomada.
     Abierta al entrar —ese es el momento en que impresiona— y plegada a
     una ficha en cuanto elegís o sacás la primera. */
  const cajaFiltros=app.querySelector('#filtrosCaja');
  const chip=app.querySelector('#filtroChip');
  const chipNombre=app.querySelector('#filtroNombre');
  let filtrosAbiertos=true;
  function pintarChip(){
    if(chipNombre) chipNombre.textContent=filtroActual.nombre;
    const pto=chip&&chip.querySelector('.pto');
    /* la muestra del filtro en la ficha: el mismo degradé que usa la tira */
    if(pto) pto.style.background=filtroActual.muestra||'var(--oro)';
  }
  function mostrarFiltros(abrir){
    filtrosAbiertos=!!abrir;
    filtrosEl.hidden=!filtrosAbiertos;
    if(chip){ chip.hidden=filtrosAbiertos; chip.setAttribute('aria-expanded',String(filtrosAbiertos)); }
    pintarChip();
  }
  if(chip) chip.onclick=()=>mostrarFiltros(true);
  filtrosEl.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    filtroActual=FILTROS.find(f=>f.id===b.dataset.f);
    filtrosEl.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    if(video) video.style.filter=filtroActual.css;
    pintarGranoVisor();
    /* Se recuerda en el aparato: el que vuelve a entrar a la cámara no
       tiene que volver a elegir. */
    try{ localStorage.setItem('ce:filtro', filtroActual.id); }catch(e){}
    mostrarFiltros(false);
  });
  pintarGranoVisor();
  pintarChip();

  const btnDisparo=app.querySelector('#disparo');
  const btnGirar=app.querySelector('#girar');
  /* Guardar el rollo para después. Sin esto el invitado entraba a la cámara
     y no salía hasta gastar las 24: probado en un iPhone. Se apaga la
     cámara —si no le come la batería toda la noche— y se lo lleva a una
     pantalla que le dice cuántas le quedan y cómo volver. */
  app.querySelector('#salirCam').onclick=()=>{
    pausado=true;
    detenerCamara(); olvidarVigilia();
    vPausa(m,guardado,{...estado, disparos:cupoDe(estado)-restantes});
  };
  const altNativa=app.querySelector('#altNativa');
  let restantes=cupoDe(estado)-(Number(estado.disparos)||0);
  /* ¿el teléfono nos dejó prender la cámara? Si no, el botón grande abre la
     cámara nativa: antes quedaba ahí sin hacer nada y el invitado no sabía
     que tenía que tocar el renglón chiquito de abajo. */
  let sinCamara=false;

  async function prender(){
    detenerCamara();
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:usarTrasera?'environment':'user'}, audio:false
      });
      video.srcObject=stream; video.style.filter=filtroActual.css;
      video.style.transform=usarTrasera?'none':'scaleX(-1)';
      try{ await video.play(); }catch(_){}
      sinCamara=false;
      btnGirar.hidden=false; altNativa.hidden=true;
      btnDisparo.setAttribute('aria-label','Sacar foto');
      /* iOS corta la cámara solo (al bloquear el teléfono, al atender un
         llamado, al cambiar de app). Cuando eso pasa la volvemos a prender
         en vez de dejar al invitado disparando a una imagen congelada. */
      const pista=stream.getVideoTracks()[0];
      if(pista){
        pista.onended = ()=>{ if(vivaLaVista()) prender(); };
        pista.onmute  = ()=>{ setTimeout(()=>{ if(vivaLaVista()&&!camaraViva()) prender(); }, 600); };
      }
    }catch(e){
      sinCamara=true;
      altNativa.hidden=false; btnGirar.hidden=true;
      btnDisparo.setAttribute('aria-label','Usar la cámara del teléfono');
      avisar('No pude prender la cámara acá. Tocá el botón grande y usá la del teléfono.');
    }
  }
  /* ¿seguimos en la pantalla de la cámara? (si no, no reabrir nada) */
  const vivaLaVista=()=>!!document.getElementById('disparo');
  /* ¿la cámara está realmente dando imagen? */
  const camaraViva=()=>{
    if(!stream||!video) return false;
    const t=stream.getVideoTracks()[0];
    return !!(t && t.readyState==='live' && !t.muted) && video.videoWidth>0;
  };
  /* Al volver a la pestaña: si quedó congelada, reabrirla. */
  const alVolver=async()=>{
    if(document.hidden||!vivaLaVista()) return;
    try{ await video.play(); }catch(_){}
    if(!camaraViva()) prender();
  };
  alVolverActual=alVolver;
  document.addEventListener('visibilitychange',alVolver);
  addEventListener('pageshow',alVolver);
  btnGirar.onclick=()=>{ usarTrasera=!usarTrasera; prender(); };
  await prender();
  pintarMuestras();
  relojMuestras=setInterval(()=>{ if(!document.hidden && camaraViva()) pintarMuestras(); }, 1500);
  relojes.push(relojMuestras);

  /* Una foto totalmente negra es la marca de la cámara congelada de iOS.
     Antes de gastarle una foto al invitado, la reabrimos. */
  function fotoNegra(fuente){
    try{
      const c=document.createElement('canvas'); c.width=32; c.height=24;
      const x=c.getContext('2d'); x.drawImage(fuente,0,0,32,24);
      const d=x.getImageData(0,0,32,24).data;
      for(let i=0;i<d.length;i+=4) if(d[i]>8||d[i+1]>8||d[i+2]>8) return false;
      return true;
    }catch(e){ return false; }
  }

  function flash(){
    const f=app.querySelector('#flash'); if(!f) return;
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  }
  /* ── el rollo y la línea que guía ──
     Las dos cosas que faltaban en esta pantalla: VER que las fotos se
     acaban, y que la app diga qué pasa sin que haya que preguntarle. */
  const TOPE_CUADROS=36;          // más que esto y las rayitas no dicen nada
  const cupoTotal=cupoDe(estado);
  const tiraRollo=app.querySelector('#rolloTira');
  const cuadros=app.querySelector('#cuadros');
  const pie=app.querySelector('#pieCamara');
  if(cuadros){
    if(cupoTotal>TOPE_CUADROS) cuadros.hidden=true;
    else cuadros.innerHTML='<i></i>'.repeat(cupoTotal);
  }
  const DEMO_PIE=HAY_DEMO
    ? '<br><span style="color:var(--oro)">Es una prueba: el rollo se vuelve a llenar solo.</span>' : '';
  /* Lo que dice cambia según dónde está, no según lo que quisimos explicar
     una vez. Un párrafo fijo debajo del disparador lo lee nadie a partir
     de la segunda foto. */
  function textoGuia(reciente){
    /* El acuse y el aviso son el MISMO renglón: si el acuse va solo, en la
       foto que más importa —la última— tapa justo el aviso, y el aviso
       recién aparece tres segundos después, cuando ya disparó otra vez. */
    if(reciente){
      if(restantes<=0)  return 'Esa fue la última. Ahora a esperar el revelado.';
      if(restantes===1) return 'Salió. Te queda 1: la última.';
      if(restantes<=3)  return `Salió. Te quedan ${restantes}, guardalas para lo mejor.`;
      return `Salió. Te quedan ${restantes}.`;
    }
    if(restantes<=0)        return 'Rollo completo.';
    if(restantes===1)       return 'Última foto. Elegí bien.';
    if(restantes<=3)        return `Te quedan ${restantes}. Guardalas para lo mejor.`;
    if(restantes===cupoTotal) return 'Sacá la primera. Nadie la ve hasta el revelado, ni vos.';
    return 'Una vez que sale, sale: sin repetir y sin verla todavía.';
  }
  let avisoReciente=null;
  function pintarContador(reciente){
    const c=app.querySelector('#cRestan'); if(c) c.textContent=restantes;
    if(cuadros && !cuadros.hidden){
      const gastadas=cupoTotal-restantes;
      cuadros.querySelectorAll('i').forEach((n,i)=>n.classList.toggle('gastado', i<gastadas));
    }
    if(tiraRollo){
      tiraRollo.classList.toggle('poquitas', restantes>0 && restantes<=3);
      tiraRollo.classList.toggle('ultima', restantes===1);
    }
    if(pie){
      pie.innerHTML=textoGuia(reciente)+DEMO_PIE;
      /* el "salió" es un acuse, no un estado: vuelve solo a la línea de
         siempre para no dejar un mensaje viejo colgado toda la noche */
      clearTimeout(avisoReciente);
      if(reciente) avisoReciente=setTimeout(()=>{ if(pie.isConnected) pie.innerHTML=textoGuia(false)+DEMO_PIE; },3200);
    }
  }

  async function subirDisparo(canvas){
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',.86));
    if(!blob) throw new Error('No se pudo preparar la foto');
    const ruta=`${m.codigo}/${token}/${nuevoId()}.jpg`;
    /* Primero se anota el disparo y después se sube el archivo: es el único
       orden en que la base puede garantizar el cupo. Si la subida falla, hay
       que devolver la foto, si no el invitado la pierde sin haber sacado nada
       (en un salón con mala señal, pasa todo el tiempo). */
    const r=await SB.rpc('ce_tomar_foto',{p_codigo:m.codigo,p_token:token,p_filtro:filtroActual.id,p_ruta:ruta});
    try{
      await SB.subir(ruta,blob);
    }catch(e){
      /* Si la devolución tampoco se pudo, el mensaje NO puede decir que se
         devolvió: es la regla de no mentirle al usuario. Le decimos que la
         intente de nuevo, que es lo único cierto que le sirve. */
      let devuelta=false;
      try{ await SB.rpc('ce_devolver_foto',{p_codigo:m.codigo,p_token:token,p_ruta:ruta}); devuelta=true; }
      catch(_){}
      throw new Error(devuelta ? 'no se pudo subir, la foto te la devolvimos'
                               : 'no se pudo subir, probá de nuevo');
    }
    const quedan=Number(r&&r.restantes);
    restantes=Number.isFinite(quedan)?quedan:Math.max(0,restantes-1);
    pintarContador(true); flash();
    /* Sacada la primera, el filtro ya está elegido: abajo queda una sola
       cosa para tocar. */
    if(filtrosAbiertos) mostrarFiltros(false);
    if(restantes<=0){
      detenerCamara(); olvidarVigilia();
      rutear(m,guardado,{...estado, disparos:cupoDe(estado)});
      /* por si el rollo se reveló mientras sacaba la última */
      consultarEstado(m,guardado);
    }
  }

  btnDisparo.onclick=async()=>{
    if(disparando) return;
    if(sinCamara||!stream) return altNativa.querySelector('input').click();
    if(!video.videoWidth) return;
    if(!camaraViva()||fotoNegra(video)){
      avisar('La cámara se había colgado, ya la reinicié. Probá de nuevo.');
      return prender();
    }
    disparando=true; btnDisparo.disabled=true;
    try{
      const canvas=document.createElement('canvas');
      const ancho=Math.min(video.videoWidth,1280);
      canvas.width=ancho; canvas.height=Math.round(ancho*video.videoHeight/video.videoWidth);
      const ctx=canvas.getContext('2d');
      if(!usarTrasera){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      ctx.setTransform(1,0,0,1,0,0);
      aplicarFiltro(ctx,canvas.width,canvas.height,filtroActual.css,filtroActual.grano);
      await subirDisparo(canvas);
    }catch(e){ avisar('No se pudo tomar la foto: '+(e.message||e)); }
    disparando=false; btnDisparo.disabled=false;
  };

  altNativa.querySelector('input').onchange=async e=>{
    const a=e.target.files[0]; if(!a) return;
    if(disparando) return; disparando=true;
    try{
      /* la dirección temporal hay que soltarla: una por foto importada
         se iba acumulando en la memoria del celular */
      const dir=URL.createObjectURL(a);
      let img;
      try{
        img=await new Promise((res,rej)=>{ const im=new Image();
          im.onload=()=>res(im);
          /* onerror trae un Event, no un Error: sin esto el aviso al
             invitado terminaba en "[object Event]" */
          im.onerror=()=>rej(new Error('no pude abrir esa foto'));
          im.src=dir; });
      }finally{ URL.revokeObjectURL(dir); }
      const canvas=document.createElement('canvas');
      const ancho=Math.min(img.naturalWidth,1280);
      canvas.width=ancho; canvas.height=Math.round(ancho*img.naturalHeight/img.naturalWidth);
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      aplicarFiltro(ctx,canvas.width,canvas.height,filtroActual.css,filtroActual.grano);
      await subirDisparo(canvas);
    }catch(err){ avisar('No se pudo usar esa foto: '+(err.message||err)); }
    e.target.value=''; disparando=false;
  };

  /* Los cuadraditos del rollo y la línea que guía, dibujados al entrar:
     hasta acá pintarContador solo corría DESPUÉS de una foto, así que el
     invitado veía la pantalla en blanco justo en el momento en que más
     falta hace que le digan qué hacer. */
  pintarContador();
}

/* ══════════════════════════════════════════════════════════
   EL ORGANIZADOR
   La regla acá es una sola: en cada pantalla hay UNA cosa
   importante para tocar, y arriba dice qué. Nada de listas de
   tarjetas donde no se sabe por dónde empezar.
   ══════════════════════════════════════════════════════════ */
/* La hoja de tarjetas va en A4. Se saca al salir de la pantalla: si
   queda puesta, cualquier otra impresión sale con ese tamaño. */
function hojaA4(activar){
  let e=document.getElementById('hojaA4');
  if(activar){
    if(!e){ e=document.createElement('style'); e.id='hojaA4';
      e.textContent='@page{size:A4;margin:0}'; document.head.appendChild(e); }
  }else if(e) e.remove();
}
/* ── traer una librería recién cuando hace falta ──
   Las dos (el dibujante de QR y el armador de zip) eran <script src>
   sincrónicos arriba de todo: nada empezaba hasta que bajaban. Y el
   invitado, que es el que está colgado del wifi del salón, no usa
   ninguna. Se memoriza la promesa, así dos llamadas seguidas piden el
   archivo una sola vez; y si falló se olvida, para que el siguiente que
   la necesite pueda volver a intentar. */
const LIBS={};
function cargarLib(src){
  if(LIBS[src]) return LIBS[src];
  return LIBS[src]=new Promise((listo,no)=>{
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>listo(true);
    s.onerror=()=>{ delete LIBS[src]; no(new Error('no se pudo cargar '+src)); };
    document.head.appendChild(s);
  });
}
/* Sincrónica a propósito: ver el comentario gemelo en muro.html. */
function pintarQR(nodo,texto,tam){
  if(!nodo) return;
  nodo.innerHTML='';
  if(window.QRCode){ try{ new QRCode(nodo,{text:texto,width:tam,height:tam,correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){} }
  cargarLib('lib/qrcode.min.js')
    .then(()=>{ if(nodo.isConnected && window.QRCode) pintarQR(nodo,texto,tam); })
    .catch(()=>{});
  /* Sin el dibujante de códigos (el wifi del salón, o el CDN caído) quedaba
     la dirección entera escrita adentro del cuadrito del QR, encimada sobre
     sí misma y sin poder leerse. Mejor decir qué pasó y dejar el link a
     mano, que para eso está el botón de copiar justo abajo. */
  nodo.innerHTML=`<div style="width:${tam}px;height:${tam}px;box-sizing:border-box;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;
    color:#2A1B08;font:400 12px/1.5 Jost,system-ui,sans-serif;text-align:center">
    <b style="font-weight:500">No pude dibujar el código</b>
    <span style="word-break:break-all;opacity:.75;font-size:10.5px">${esc(texto)}</span>
    </div>`;
}
async function copiar(texto,aviso){
  try{
    if(!navigator.clipboard) throw new Error('sin portapapeles');
    await navigator.clipboard.writeText(texto);
    return avisar(aviso||'Copiado');
  }catch(e){
    const t=document.createElement('textarea');
    t.value=texto; t.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(t); t.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    t.remove();
    avisar(ok?(aviso||'Copiado'):texto);
  }
}

   La clave vive en el navegador que lo creó. Si el organizador cambia de
   teléfono, o le borran los datos del navegador, sin esto perdía el panel
   para siempre. */
function vPedirClave(codigoPrevio){
  app.innerHTML=`
  ${cabP('Entrar con la clave','')}
  <div class="wrap" style="padding-top:20px">
    <p class="bajada">Es la clave que te dimos al crear el rollo. Está en
      Ajustes, en el teléfono donde lo creaste.<br>
      <small style="opacity:.7">También sirve la clave de administrador.</small></p>
    <div class="campo"><label for="codClave">Código del evento</label>
      <input id="codClave" type="text" autocapitalize="characters" autocomplete="off"
        value="${esc(codigoPrevio)}" placeholder="QUI-7FCE64" style="letter-spacing:.14em"></div>
    <div class="campo"><label for="laClave">Clave</label>
      <input id="laClave" type="text" autocapitalize="characters" autocomplete="off"
        placeholder="ABC234" style="letter-spacing:.14em"></div>
    <button class="oro-btn" id="entrarClave">Entrar</button>
  </div>`;
  const $=x=>app.querySelector(x);
  const entrar=async()=>{
    const cod=$('#codClave').value.trim().toUpperCase();
    const cl=$('#laClave').value.trim().toUpperCase();
    if(cod.length<4) return avisar('Escribí el código del evento');
    if(cl.length<4)  return avisar('Escribí la clave');
    const b=$('#entrarClave'); b.disabled=true; b.textContent='Entrando…';
    try{
      const ev=await eventoPorCodigo(cod,'codigo,tono');
      if(!ev) throw new Error('No encontré ese evento');
      const r=[ev];
      /* La única forma de saber si la clave sirve es usarla: escribimos algo
         que no cambia nada. Si la clave está mal, la base rechaza. */
      await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{tono:r[0].tono||'#D9AE72'},cl);
      /* ¿Era la maestra? Entonces NO va al disco. Antes se guardaba en
         ce:claves como si fuera la clave de ese evento: la llave que abre
         todos los eventos de todos los clientes quedaba escrita en el
         localStorage de ese teléfono, para siempre y sin que nadie lo
         supiera. Va a sessionStorage, y se muere al cerrar la pestaña. */
      let maestra=false;
      try{ const q=await SB.rpc('ce_quien_soy',{p_codigo:cod},cl); maestra=!!(q&&q.es_maestra); }
      catch(e){ /* base vieja sin ce_quien_soy: se guarda como siempre */ }
      if(maestra){
        claveMaestra=cl; guarda.escribirSesion('ce:maestra',cl);
        avisar('Entraste con la clave de administrador');
      }else{
        guardarClaveDe(cod,cl);
      }
      irA('ev/'+cod);
    }catch(e){
      b.disabled=false; b.textContent='Entrar';
      avisar(/clave|permis|denied|row-level/i.test(String(e.message||e))
        ? 'Esa clave no es de este evento' : ('No se pudo: '+(e.message||e)));
    }
  };
  $('#entrarClave').onclick=entrar;
  app.querySelectorAll('.campo input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); }));
}

    const filas=await Promise.all(codigos.map(async c=>{

      }).join('');
  mios.querySelectorAll('[data-cod]').forEach(b=>b.onclick=()=>irA('ev/'+encodeURIComponent(b.dataset.cod)));
}

           tener el permiso de imagen, sobre todo el de los menores. Sin la
           casilla no se crea el rollo, y el momento queda en la fila. -->
      <label class="acepto"><input type="checkbox" id="aceptoT">
        <span>Me hago cargo de avisarles a mis invitados que va a haber una
        cámara, y de tener el permiso de las personas que aparezcan —incluidos
        los menores, de sus padres o tutores—.
        <a href="/terminos#responsable" target="_blank" rel="noopener">Leer los Términos</a>.</span></label>`;
    }
  };
  app.innerHTML=`
  <div class="paso-cab">
    <button class="atras" id="atras" aria-label="Volver">←</button>
    <div class="barra"><i style="width:${(paso/PASOS)*100}%"></i></div>
  </div>
  <div class="wrap paso-cuerpo">${cuerpos[paso]()}</div>
  <div class="pie-fijo">
    <button class="oro-btn" id="sig">${paso===PASOS?'Crear el rollo':'Siguiente'}</button>
  </div>`;

  app.querySelector('#atras').onclick=()=>{ paso===1?irA(''):irA('nuevo/'+(paso-1)); };
  const campo=app.querySelector('#dato');
  if(campo){ campo.focus(); campo.addEventListener('keydown',e=>{ if(e.key==='Enter') seguir(); }); }
  app.querySelectorAll('#tipos [data-t]').forEach(b=>b.onclick=()=>{
    nuevo.tipo=b.dataset.t;
    app.querySelectorAll('#tipos [data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  });
  app.querySelectorAll('#cuando [data-c]').forEach(b=>b.onclick=()=>{
    nuevo.cuando=b.dataset.c;
    app.querySelectorAll('#cuando [data-c]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    app.querySelector('#zonaHora').hidden = nuevo.cuando!=='hora';
  });
  /* Sugerencias del nombre: en un teléfono, escribir es lo que más cuesta.
     No reemplazan lo escrito, lo empiezan: "Los 15 de " y sigue él. */
  app.querySelectorAll('#sugerencias [data-s]').forEach(b=>b.onclick=()=>{
    const c=app.querySelector('#dato');
    c.value = /\bde$/.test(b.dataset.s) ? b.dataset.s+' ' : b.dataset.s;
    c.focus();
    try{ c.setSelectionRange(c.value.length,c.value.length); }catch(e){}
  });
  const gente=app.querySelector('#gente');
  if(gente){
    const marcar=()=>app.querySelectorAll('#cuantos [data-g]').forEach(x=>
      x.setAttribute('aria-pressed', String(Number(x.dataset.g)===Number(gente.value))));
    app.querySelectorAll('#cuantos [data-g]').forEach(b=>b.onclick=()=>{
      gente.value=b.dataset.g; marcar();
    });
    gente.addEventListener('input',marcar);
  }
  const bm=app.querySelector('#menos');
  if(bm){
    const pintar=()=>{ app.querySelector('#cupoTxt').textContent=nuevo.cupo; };
    bm.onclick=()=>{ nuevo.cupo=Math.max(6,nuevo.cupo-6); pintar(); };
    app.querySelector('#mas').onclick=()=>{ nuevo.cupo=Math.min(60,nuevo.cupo+6); pintar(); };
  }

  function seguir(){
    if(paso===1){
      const v=app.querySelector('#dato').value.trim();
      if(!v) return avisar('Ponele un nombre a la fiesta');
      nuevo.nombre=v;
    }
    if(paso===2) nuevo.fecha=app.querySelector('#fecha').value||hoy();
    if(paso===3){
      nuevo.revela=app.querySelector('#revela')?app.querySelector('#revela').value:'';
      if(nuevo.cuando==='hora'){
        if(!nuevo.revela) return avisar('Elegí el día y la hora');
        /* un rollo no puede nacer revelado */
        if(yaPaso(nuevo.revela)) return avisar('Esa hora ya pasó. Elegí una que venga.');
      }
    }
    if(paso===5){
      const g=Math.round(Number(app.querySelector('#gente').value));
      /* El tope de la base es 2000 (ce_cupos_sanos). Si se manda más, el
         insert falla con un error de Postgres que no dice nada: mejor
         atajarlo acá y decirlo en castellano. */
      if(!Number.isFinite(g)||g<1) return avisar('¿Cuántos invitados esperás?');
      if(g>2000) return avisar('El tope es 2000 invitados. Si son más, escribinos.');
      nuevo.gente=g;
    }
    if(paso===PASOS){
      const casilla=app.querySelector('#aceptoT');
      if(casilla && !casilla.checked){
        casilla.closest('.acepto').classList.add('falta');
        return avisar('Falta aceptar: sos vos quien tiene el permiso de tus invitados');
      }
    }
    if(paso<PASOS) return irA('nuevo/'+(paso+1));
    crearRollo();
  }
  app.querySelector('#sig').onclick=seguir;
}

/* Seis caracteres al azar de verdad. Math.random().toString(16) a veces
   devuelve menos dígitos de los que uno espera (0.5 da "0.8"), y ahí salía
   un código de una letra. Y como guardar un evento es un "upsert", dos
   códigos iguales no dan error: uno pisa al otro. */
const nuevoCodigo=tipo=>{
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const n=new Uint32Array(6);
  try{ crypto.getRandomValues(n); }
  catch(e){ for(let i=0;i<n.length;i++) n[i]=Math.floor(Math.random()*4294967296); }
  return TIPOS[tipo]+'-'+[...n].map(x=>abc[x%abc.length]).join('');
};
/* ¿ese código ya es de alguien? Preguntar es barato y pisarle la fiesta a
   otro no tiene arreglo. Si no hay señal para preguntar, seguimos igual:
   con seis caracteres al azar la chance es ínfima. */
async function codigoLibre(codigo){
  try{ return !(await eventoPorCodigo(codigo,'codigo')); }
  catch(e){ return true; }
}

async function crearRollo(){
  const b=app.querySelector('#sig');
  if(b.disabled) return;
  b.disabled=true; b.textContent='Creando…';
  /* El código y la clave se sortean UNA vez y quedan guardados en `nuevo`:
     si el pedido se corta por la señal y el organizador vuelve a apretar,
     tiene que reintentar el MISMO evento, no crear un segundo. */
  if(!nuevo.codigo){
    let intento=nuevoCodigo(nuevo.tipo), vueltas=0;
    while(!(await codigoLibre(intento)) && ++vueltas<5) intento=nuevoCodigo(nuevo.tipo);
    nuevo.codigo=intento;
    nuevo.clave=nuevaClave();
  }
  const codigo=nuevo.codigo, claveEv=nuevo.clave;
  /* La clave se guarda ANTES de crear. Si el pedido llega a la base pero la
     respuesta se pierde en el camino, el evento queda creado y sin esto el
     organizador no lo podría manejar nunca más. Una clave de un evento que
     al final no se creó no molesta: la lista de la puerta solo muestra los
     que la base confirma. */
  guardarClaveDe(codigo,claveEv);
  /* 90 días, igual que el muro (ver DIAS_QUE_VIVE en muro.html): si no
     vence nunca, el depósito crece todos los meses y no para. */
  const vence=new Date(nuevo.fecha); vence.setDate(vence.getDate()+DIAS_QUE_VIVE);
  const fila={
    codigo, nombre:nuevo.nombre, fecha:nuevo.fecha, tipo:nuevo.tipo, tono:'#D9AE72',
    vence:vence.toISOString().slice(0,10), moderar:false, cerrado:false, creado:Date.now(),
    camara:true, cupo_fotos:nuevo.cupo, cupo_invitados:nuevo.gente, revelado:false,
    acepto:Date.now(),
    revela_en: nuevo.cuando==='hora' ? aUTC(nuevo.revela) : null
  };
  /* Primero la web, después el SQL: si blindaje2.sql todavía no se corrió,
     la columna "acepto" no existe y PostgREST rechaza el alta ENTERA. Se
     saca y se reintenta, igual que hace el muro con COLUMNAS_NUEVAS. */
  const sinAcepto=()=>{ const {acepto,...resto}=fila; return resto; };
  try{
    try{
      try{ await SB.crear('ce_eventos', fila, claveEv); }
      catch(eCol){
        if(!/acepto/i.test(String((eCol&&eCol.message)||eCol))) throw eCol;
        await SB.crear('ce_eventos', sinAcepto(), claveEv);
      }
    }catch(e1){
      /* Código repetido quiere decir que el pedido anterior SÍ llegó y se
         perdió la respuesta en el camino. La clave ya la dejó guardada el
         disparador, así que ahora el upsert pasa y termina de guardar lo
         mismo; si el código fuera de otro, ese upsert rebota por RLS, que
         es lo que tiene que pasar. Sin esto, reintentar después de un
         corte le decía "no se pudo" sobre un rollo que ya existía. */
      if(!/duplicate key|already exists|23505/i.test(String((e1&&e1.message)||e1))) throw e1;
      await SB.guardar('ce_eventos', fila, claveEv);
    }
    nuevo.codigo=''; nuevo.clave='';      // el próximo rollo arranca limpio
    irA('ev/'+codigo);
  }catch(err){
    b.disabled=false; b.textContent='Crear el rollo';
    avisar('No se pudo crear: '+(err.message||err));
  }
}

/* ── el rollo: una instrucción arriba y un botón grande ── */

      pill:'Sacando fotos', clase:'vivo',

      pie:'Cuando termine la fiesta, revelá el rollo y todos ven las fotos juntos.'

      pill:'Revelado', clase:'oro',

    }catch(e){ bR.disabled=false; bR.textContent='Revelar el rollo'; avisar('No se pudo: '+(e.message||e)); }
  };
}

/* ── llevarse todas las fotos ──
   Se arma el zip en el teléfono: se bajan las fotos de a una y se van
   metiendo en el archivo. No hay servidor que lo haga por nosotros, así
   que hay que avisar cuánto falta o parece colgado. */
async function bajarTodas(m, boton){
  /* El zip se pide acá, que es el único lugar del rollo que lo usa. */
  try{ await cargarLib('lib/jszip.min.js'); }catch(e){}
  if(!window.JSZip) return avisar('No pude cargar el armador de archivos. Probá desde una computadora.');
  const original=boton.textContent;
  const paso=t=>{ boton.textContent=t; };
  boton.disabled=true;
  try{
    paso('Buscando las fotos…');
    /* ce_album_de corta en 400: es lo que se puede dibujar en una pantalla.
       Acá hay que traerlas TODAS, de a tandas, o el casamiento de 1450
       fotos se bajaba con 400 y decía "listo". */
    const fotos=[];
    for(let desde=0; ; desde+=500){
      paso(`Buscando las fotos… ${fotos.length||''}`);
      const tanda=await SB.rpc('ce_album_pagina',
        {p_codigo:m.codigo, p_desde:desde, p_cuanto:500}, claveDe(m.codigo));
      if(!Array.isArray(tanda)||!tanda.length) break;
      fotos.push(...tanda);
      if(tanda.length<500) break;
      if(fotos.length>20000) break;          // freno de mano, por las dudas
    }
    if(!fotos.length){ boton.disabled=false; paso(original); return avisar('Todavía no hay fotos'); }

    /* Un casamiento de cien invitados son miles de fotos, y el zip se arma
       entero en la memoria del teléfono. Antes de que se le muera a la
       mitad, le decimos que lo haga desde una computadora. */
    if(fotos.length>250 && !confirm(
        `Son ${fotos.length} fotos. Armar el archivo acá puede colgar el teléfono: `
        +`desde una computadora sale mucho mejor.\n\n¿Querés intentarlo igual?`)){
      boton.disabled=false; paso(original); return;
    }

    const zip=new JSZip();
    let listas=0, fallaron=0;
    /* Las direcciones firmadas duran una hora. Con muchas fotos y mala
       señal, las últimas se vencían antes de que les llegara el turno: se
       firman de a cien, recién cuando toca bajarlas. */
    let mapa={};
    for(let i=0;i<fotos.length;i++){
      const f=fotos[i];
      if(i%100===0){
        paso(`Preparando ${i+1} de ${fotos.length}…`);
        mapa=await SB.firmar(fotos.slice(i,i+100).map(x=>x.ruta));
      }
      paso(`Bajando ${listas+1} de ${fotos.length}…`);
      try{
        /* Sin URL firmada, fetch(undefined) baja ESTA PÁGINA y la mete en
           el zip como si fuera una foto. Mejor contarla como fallada. */
        if(!mapa[f.ruta]) throw new Error('sin archivo');
        const r=await fetch(mapa[f.ruta]);
        if(!r.ok) throw new Error('HTTP '+r.status);
        const tipo=(r.headers.get('content-type')||'');
        if(tipo && !/^image\//i.test(tipo)) throw new Error('no es una foto');
        const quien=(f.nombre||'invitado').replace(/[^\wáéíóúñÁÉÍÓÚÑ .-]/g,'').trim().slice(0,24)||'invitado';
        zip.file(`${String(listas+1).padStart(3,'0')} - ${quien}.jpg`, await r.blob());
        listas++;
      }catch(e){ fallaron++; }
    }
    if(!listas) throw new Error('no se pudo bajar ninguna');

    paso('Armando el archivo…');
    const blob=await zip.generateAsync({type:'blob'});
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u; a.download=`${(m.nombre||'rollo').replace(/[^\w\s-]/g,'').trim().slice(0,40)||'rollo'}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),8000);
    /* "Listo" a secas solo si están TODAS. Si faltó alguna hay que decirlo:
       el organizador guarda el zip y no vuelve a mirar hasta dentro de un
       año, cuando ya no se puede arreglar. */
    avisar(fallaron?`Bajé ${listas} de ${fotos.length} · ${fallaron} no se pudieron`:`Listo · ${listas} fotos`);
  }catch(e){
    avisar('No se pudo: '+(e.message||e));
  }
  boton.disabled=false; paso(original);
}

/* ── ajustes: lo que casi nunca se toca, fuera del camino ── */
async function vAjustes(codigo){
  if(!claveDe(codigo)) return irA('clave/'+encodeURIComponent(codigo));
  let m=null;
  try{ m=await eventoConClave(codigo); }catch(e){}
  if(!m) return vError('No encontré ese rollo.');
  const clave=claveDe(codigo);
  /* La pantalla donde se elige el color tiene que estar PINTADA de ese
     color: si no, el organizador ve la pastilla de Salvia marcada y todo
     lo demás dorado, y no sabe cuál de las dos le está mintiendo. */
  tono(m.tono);
  const revelado=!!m.revelado || (m.revela_en && new Date(m.revela_en)<=new Date());
  let cupo=Number(m.cupo_fotos||24);

  app.innerHTML=`
  ${cabP('Ajustes','ev/'+codigo)}
  <div class="wrap">
    <p class="rotulito" style="margin-top:6px">Fotos por invitado</p>
    <div class="stepper"><button id="menos">−</button><b id="cupoTxt">${cupo}</b><button id="mas">+</button></div>
    <button class="hilo-btn" id="guardarCupo">Guardar</button>

    <p class="rotulito">Revelado automático</p>
    <p class="ayudita" style="margin:0 0 12px">Dejalo vacío si preferís revelarlo vos a mano.</p>
    <input id="revela" type="datetime-local" value="${esc(aLocal(m.revela_en))}">
    <button class="hilo-btn" id="guardarHora">Guardar la hora</button>
    ${revelado?`<button class="hilo-btn" id="ocultar">Volver a ocultar las fotos</button>
      <p class="ayudita" style="margin:8px 0 0">Se ocultan para el que entre de ahora en adelante. El que
        ya tenía el álbum abierto puede seguir viéndolas hasta una hora: las
        direcciones de las fotos se firman por ese rato y no se pueden anular
        antes.</p>`:''}

    <p class="rotulito">La clave de este rollo</p>
    ${clave?`<p class="clave-gr">${esc(clave)}</p>
      <p class="ayudita">Guardala. Desde otro teléfono te la vamos a pedir para manejar este rollo.</p>
      <button class="hilo-btn" id="copiarClave">Copiar la clave</button>`
      :`<p class="ayudita">En este teléfono no está guardada.</p>`}

    <!-- El color de la fiesta. Es lo único que hace que la cámara del
         invitado se parezca a ESTA fiesta y no a todas las demás: hasta
         acá todos los rollos nacían del mismo dorado y no había dónde
         cambiarlo. Se aplica al tocar, sin botón de guardar: el cambio se
         ve en el momento y eso ES la confirmación. -->
    <p class="rotulito">El color de la fiesta</p>
    <p class="ayudita" style="margin:0 0 12px">Tiñe la cámara del invitado y el álbum.</p>
    <div class="tonos" id="tonos">${TONOS.map(t=>`
      <button class="tono" data-c="${t.c}" title="${esc(t.n)}" aria-label="${esc(t.n)}"
        aria-pressed="${(m.tono||'#D9AE72').toLowerCase()===t.c.toLowerCase()}"
        style="background:${t.c}"></button>`).join('')}</div>

    <div class="llave-fila">
      <p>Rollo cerrado<small>Corta las fotos. El álbum sigue disponible.</small></p>
      <button class="palanca" id="cerrar" aria-pressed="${!!m.cerrado}"></button>
    </div>

    <!-- La salida cuando la fiesta se queda sin cámaras. El token lo
         inventa el teléfono, así que cualquiera que tenga el código puede
         abrir cámaras hasta agotar el cupo y dejar afuera a los invitados
         de verdad. La base lo frena y lo cura sola a las tres horas, pero
         una fiesta dura una noche: esto lo arregla en el momento. Borra
         SOLO las que no tienen ni una foto. -->
    <p class="rotulito">Si no les abre la cámara</p>
    <p class="ayudita" style="margin:0 0 12px">Libera las cámaras que nadie usó —las que no
      tienen ni una foto— para que entren los invitados que faltan. No toca ninguna foto.</p>
    <button class="hilo-btn" id="liberar">Liberar las cámaras sin usar</button>
  </div>`;

  const $=s=>app.querySelector(s);
  const guardar=async(campos,aviso)=>{
    try{
      await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(codigo)}`,campos,clave);
      avisar(aviso); vAjustes(codigo);
    }catch(e){ avisar('No se pudo guardar: '+(e.message||e)); }
  };
  $('#menos').onclick=()=>{ cupo=Math.max(6,cupo-6); $('#cupoTxt').textContent=cupo; };
  $('#mas').onclick=()=>{ cupo=Math.min(60,cupo+6); $('#cupoTxt').textContent=cupo; };
  $('#guardarCupo').onclick=()=>guardar({cupo_fotos:cupo},'Listo · '+cupo+' fotos por invitado');
  $('#guardarHora').onclick=()=>{
    const v=$('#revela').value;
    if(v && yaPaso(v)) return avisar('Esa hora ya pasó. Si querés revelarlo ya, usá "Revelar el rollo".');
    guardar({revela_en:aUTC(v)}, v?'Listo · se revela solo':'Lo revelás vos a mano');
  };
  const bO=$('#ocultar'); if(bO) bO.onclick=()=>guardar({revelado:false,revela_en:null},'Oculto de nuevo');
  const bC=$('#copiarClave'); if(bC) bC.onclick=()=>copiar(clave,'Clave copiada');
  $('#cerrar').onclick=()=>guardar({cerrado:!m.cerrado}, m.cerrado?'Rollo abierto':'Rollo cerrado');
  /* Primero la web y después el SQL: mientras camaras.sql no esté corrido
     la función no existe y PostgREST contesta PGRST202. Eso no es un error
     del organizador y no se le puede mostrar como tal. */
  $('#liberar').onclick=async(e)=>{
    const b=e.currentTarget, antes=b.textContent;
    b.disabled=true; b.textContent='Liberando…';
    try{
      const r=await SB.rpc('ce_liberar_vacias',{p_codigo:codigo},clave);
      const n=Number(r&&r.liberadas)||0;
      avisar(n?`Listo · ${n} cámara${n===1?'':'s'} liberada${n===1?'':'s'}`
              :'No había ninguna cámara sin usar');
    }catch(err){
      const t=String((err&&err.message)||err);
      avisar(/PGRST202|does not exist|Could not find the function/i.test(t)
        ? 'Todavía no está puesta esta función en la base.'
        : 'No se pudo: '+t);
    }
    b.disabled=false; b.textContent=antes;
  };
  /* Se pinta ANTES de guardar: si la señal está mal, el organizador ve el
     color igual y el aviso le dice si quedó o no. Y no se redibuja la
     pantalla —guardar() lo hace— para no moverle el piso justo cuando
     está comparando dos tonos. */
  app.querySelectorAll('#tonos .tono').forEach(b=>b.onclick=async()=>{
    app.querySelectorAll('#tonos .tono').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    const c=b.dataset.c;
    tono(c);
    try{
      await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(codigo)}`,{tono:c},clave);
      m.tono=c;
      avisar('Listo · '+(b.getAttribute('aria-label')||'color cambiado'));
    }catch(e){
      /* No mentirle: si no se guardó, se vuelve el color de antes. */
      tono(m.tono);
      app.querySelectorAll('#tonos .tono').forEach(x=>x.setAttribute('aria-pressed',
        String((m.tono||'#D9AE72').toLowerCase()===x.dataset.c.toLowerCase())));
      avisar('No se pudo guardar el color: '+(e.message||e));
    }
  });
}

/* ── el cuarto de revelado ──
   Se ve una sola vez por teléfono: la segunda vez que entrás al álbum ya
   no tiene gracia, y encima molesta. Se puede saltear tocando. */
/* Cuánto tarda en caer la copia siguiente. NO es un número de gusto: las
   copias caen todas en el MISMO lugar de la bandeja, una encima de la otra,
   y la imagen tarda ~2,4 s en subir desde el papel. Estaba en 680 ms, así
   que la siguiente tapaba a la anterior cuando iba por la cuarta parte del
   revelado: de las cinco copias se veía revelarse UNA, la última. Probado
   en un iPhone de verdad y medido en pruebas/rollo_revelado.js.
   Si se vuelve a bajar, el efecto sigue existiendo y deja de verse. */
const PASO_COPIA = 1400;
function cuartoOscuro(m, fotos, mapa, alApagarse){
  return new Promise(res=>{
    const c=document.createElement('div');
    c.className='cuarto';
    c.innerHTML=`
      <div class="luz"></div><div class="polvillo"></div>
      <div class="rotulo"><p id="rotuloTope">Revelando</p><b>${esc(m.nombre)}</b></div>
      <div class="bandeja" id="bandeja"></div>
      <div class="tinte"></div>
      <div class="saltear" id="saltear">Tocá para saltear</div>`;
    document.body.appendChild(c);
    const bandeja=c.querySelector('#bandeja');
    const relojitos=[];
    let listo=false;
    const terminar=()=>{
      if(listo) return; listo=true;
      relojitos.forEach(clearTimeout);
      /* Si el cuarto ya no está en la pantalla, el invitado se fue a otro
         lado mientras revelaba: nos vamos sin dibujar nada. Sin esto, ocho
         segundos después el álbum le pisaba la pantalla en la que estuviera. */
      if(!c.isConnected) return res();
      /* el álbum se dibuja ANTES de que el cuarto se desvanezca: así uno
         cruza con el otro en vez de pasar por una pantalla en negro */
      try{ if(alApagarse) alApagarse(); }catch(e){}
      c.classList.add('saliendo');
      setTimeout(()=>{ c.remove(); res(); }, 900);
    };
    c.onclick=terminar;
    /* para que cerrarCapas() pueda apagarlo sin dejar relojes dando vueltas */
    c._cortar=()=>{ listo=true; relojitos.forEach(clearTimeout); res(); };
    const t=(fn,ms)=>relojitos.push(setTimeout(fn,ms));

    fotos.forEach((f,i)=>{
      t(()=>{
        if(!c.isConnected) return;
        const cop=document.createElement('div');
        cop.className='copia';
        /* cada copia cae un poco torcida, como si la dejaran en la bandeja */
        cop.style.setProperty('--giro', ((i%2?1:-1)*(1.2+Math.random()*2.4)).toFixed(2)+'deg');
        cop.innerHTML=`<img src="${esc(mapa[f.ruta]||'')}" alt="">`;
        bandeja.appendChild(cop);
        requestAnimationFrame(()=>{
          cop.classList.add('puesta');
          /* empieza a subir cuando el papel ya está apoyado, no mientras cae */
          t(()=>cop.classList.add('revelada'), 320);
        });
      }, 520 + i*PASO_COPIA);
    });

    t(()=>c.querySelector('#saltear').classList.add('visible'), 1400);
    const finCopias = 520 + (fotos.length-1)*PASO_COPIA + 2400;
    /* se prenden las luces: el rojo se va y aparecen los colores */
    t(()=>{
      c.classList.add('luces');
      const r=c.querySelector('#rotuloTope');
      if(r) r.textContent='Se reveló';
    }, finCopias);
    t(terminar, finCopias + 1900);
  });
}

/* ── el álbum, una vez revelado ── */
async function vAlbum(m,guardado){
  const token=(guardado&&guardado.token)||guardado;
  detenerPoll(); olvidarVigilia(); detenerCamara();
  app.innerHTML=`<div class="centro">${ESTRELLA}<p class="espaciado" style="margin-top:16px">Se reveló el rollo</p>
    <h1 class="ital" style="font-size:clamp(26px,7vw,32px);margin-top:8px">${esc(m.nombre)}</h1></div>`;
  let datos;
  try{ datos=await SB.rpc('ce_album_de',{p_codigo:m.codigo,p_token:token}); }
  catch(e){ return vSinSenal(m,{token,nombre:(guardado&&guardado.nombre)||''}); }
  /* El organizador puede volver a ocultarlo justo entre que preguntamos el
     estado y que pedimos el álbum. */
  if(!datos||datos.revelado===false) return vGuardado(m,guardado&&guardado.token?guardado:null);
  const mias=Array.isArray(datos.mias)?datos.mias:[];
  const todas=Array.isArray(datos.todas)?datos.todas:[];
  /* El álbum trae hasta 400 fotos: más que eso no entra en una pantalla de
     teléfono. Si la fiesta tuvo más, se dice, porque si no el invitado
     cuenta las que ve, le da distinto del número de arriba y no entiende. */
  const hayMas = datos.total_fotos!=null && datos.total_fotos>todas.length;

  /* Las URLs firmadas se guardan acá para no pedirlas dos veces: las mismas
     que usa el cuarto de revelado sirven después para la grilla. */
  const firmadas={};
  const kVisto=`ce:revelado:${m.codigo}`;
  const enBandeja=(mias.length?mias:todas).slice(0,5);
  const quieteQuieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pintarAlbum=()=>{
  vistaViva=true;
  app.innerHTML=`
  <div class="cab"><img src="marca.webp" alt="Click Eterno"><p class="espaciado">Se reveló el rollo</p>
    <h1>${esc(m.nombre)}</h1>
    ${HAY_DEMO?`<button class="hilo-btn" id="verRevelado"
      style="width:auto;margin:14px auto 0;padding:11px 20px;font-size:11px">Ver cómo se revela</button>`:''}</div>
  <div class="wrap">
    <p style="text-align:center;color:#B5AC9E;font-size:13.5px;margin-top:6px">
      ${esc(datos.total_fotos!=null?datos.total_fotos:todas.length)} fotos de ${esc(datos.total_invitados!=null?datos.total_invitados:'?')} invitados esta noche</p>
    ${hayMas?`<p style="text-align:center;color:var(--mute);font-size:12.5px;margin:-4px 0 4px">
      En el álbum completo se ven las ${esc(todas.length)} últimas.</p>`:''}
    <div class="tabs" role="tablist">
      <button data-t="mias" aria-pressed="true">Tus fotos</button>
      <button data-t="todas" aria-pressed="false">Álbum completo</button>
    </div>
    <div class="grilla" id="grillaMias"></div>
    <div class="grilla" id="grillaTodas" hidden></div>
  </div>`;
  };

  /* ── por qué la demostración NO arranca por el cuarto oscuro ──
     El revelado dura unos diez segundos y empieza en negro. En el
     escritorio se lee como lo que es; en el teléfono del dueño se leyó
     como "no muestra nada": abrís /rollo?demo=1, ves una pantalla negra
     y te vas. La demostración tiene que caer DERECHO en el álbum, que es
     lo que se vende, y el revelado queda a un toque de distancia con su
     propio botón. En un rollo de verdad no cambia nada: ahí el cuarto
     oscuro es el momento y se ve una vez, la primera. */
  if(enBandeja.length && !quieteQuieto
     && (forzarRevelado || (!guarda.leer(kVisto) && !HAY_DEMO))){
    forzarRevelado=false;
    guarda.escribir(kVisto,'1');
    try{
      Object.assign(firmadas, await SB.firmar(enBandeja.map(f=>f.ruta)));
      /* Solo las que de verdad tienen imagen: una copia en blanco cayendo
         en la bandeja del revelado es peor que una copia menos. */
      const bandeja=enBandeja.filter(f=>firmadas[f.ruta]);
      if(!bandeja.length) throw new Error('sin copias');
      /* Y que lleguen con la foto adentro: si la bajada va lenta, la copia
         caía en la bandeja vacía y la imagen aparecía de golpe después,
         justo al revés de lo que tiene que pasar en un revelado. */
      await Promise.race([
        Promise.all(bandeja.map(f=>new Promise(ok=>{
          const im=new Image(); im.onload=ok; im.onerror=ok; im.src=firmadas[f.ruta];
        }))),
        new Promise(ok=>setTimeout(ok,4000))   // nadie espera para siempre
      ]);
      app.innerHTML='';                      // nada atrás que se transparente
      await cuartoOscuro(m, bandeja, firmadas, pintarAlbum);
    }catch(e){ if(!app.querySelector('.grilla')) pintarAlbum(); }
  } else {
    pintarAlbum();
  }

  /* Volver a verlo: se vuelve a entrar al álbum entero, que es lo que
     reengancha los botones de la grilla. Pintar el cuarto oscuro encima
     de una pantalla ya dibujada dejaba la grilla sin oyentes. */
  const bVer=app.querySelector('#verRevelado');
  if(bVer) bVer.onclick=()=>{ forzarRevelado=true; vAlbum(m,guardado); };

  const gMias=app.querySelector('#grillaMias'), gTodas=app.querySelector('#grillaTodas');
  /* El cuarto de revelado se puede cortar a mitad de camino porque el
     invitado se fue a otra pantalla. Si pasó eso, el álbum ya no es de
     nadie: no hay dónde dibujarlo y seguir acá era reventar. */
  if(!gMias||!gTodas) return;

  /* ── el visor: la grilla sola no alcanza, la gracia es mirar la foto ── */
  function abrirVisor(fotos, mapa, desde){
    let i=desde;
    const cap=document.createElement('div');
    cap.className='visorf';
    cap.innerHTML=`
      <div class="barra">
        <button class="redondo" id="bajarF" aria-label="Descargar">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg></button>
        <span class="sep"></span>
        <button class="redondo" id="cerrarF" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="marco">
        <button class="flecha izq" aria-label="Anterior">‹</button>
        <img id="fotoF" alt="">
        <button class="flecha der" aria-label="Siguiente">›</button>
      </div>
      <div class="pie" id="pieF"></div>`;
    document.body.appendChild(cap);
    const img=cap.querySelector('#fotoF'), pie=cap.querySelector('#pieF');
    const pintar=()=>{
      const f=fotos[i];
      img.src=mapa[f.ruta]||'';
      pie.innerHTML=`${f.nombre?`<b>${esc(f.nombre)}</b>`:''}${i+1} / ${fotos.length}`;
      cap.querySelector('.izq').style.visibility=i>0?'visible':'hidden';
      cap.querySelector('.der').style.visibility=i<fotos.length-1?'visible':'hidden';
    };
    const mover=d=>{ const n=i+d; if(n>=0&&n<fotos.length){ i=n; pintar(); } };
    const cerrar=()=>{ cap.remove(); document.removeEventListener('keydown',teclas); };
    const teclas=e=>{
      /* si el visor se cerró por un cambio de pantalla, nos vamos con él */
      if(!cap.isConnected) return document.removeEventListener('keydown',teclas);
      if(e.key==='Escape') cerrar();
      if(e.key==='ArrowLeft') mover(-1);
      if(e.key==='ArrowRight') mover(1);
    };
    cap.querySelector('.izq').onclick=()=>mover(-1);
    cap.querySelector('.der').onclick=()=>mover(1);
    cap.querySelector('#cerrarF').onclick=cerrar;
    document.addEventListener('keydown',teclas);
    /* deslizar con el dedo, que es como se mira un álbum en el celular */
    let x0=null;
    cap.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
    cap.addEventListener('touchend',e=>{
      if(x0===null) return;
      const d=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(d)>50) mover(d<0?1:-1);
    },{passive:true});
    /* Descargar: el atributo "download" no sirve con una dirección de otro
       dominio (la abre en otra pestaña en vez de bajarla), así que traemos
       la foto y la bajamos desde acá. */
    cap.querySelector('#bajarF').onclick=async e=>{
      const b=e.currentTarget; b.disabled=true;
      try{
        const dir=mapa[fotos[i].ruta];
        if(!dir) throw new Error('sin archivo');
        const r=await fetch(dir);
        if(!r.ok) throw new Error('HTTP '+r.status);
        const blob=await r.blob();
        const u=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=u; a.download=`${(m.nombre||'foto').replace(/[^\w\s-]/g,'').trim().slice(0,30)||'foto'}-${i+1}.jpg`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(u),4000);
      }catch(err){ avisar('No pude descargarla'); }
      b.disabled=false;
    };
    pintar();
  }

  const pintarGrilla=async(el,todasLasFotos)=>{
    if(!todasLasFotos.length){ el.innerHTML=`<p style="grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0">Todavía no hay fotos acá.</p>`; return; }
    const faltan=todasLasFotos.map(f=>f.ruta).filter(r=>!firmadas[r]);
    try{ Object.assign(firmadas, await SB.firmar(faltan)); }
    catch(e){ el.innerHTML=`<p style="grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0">No pude traer las fotos. Recargá la página.</p>`; return; }
    const mapa=firmadas;
    /* Las que no volvieron firmadas no se dibujan: un cuadro roto en el
       álbum parece una foto perdida. Y el visor tiene que recorrer esta
       misma lista, o las flechas caen en el vacío. */
    const fotos=todasLasFotos.filter(f=>mapa[f.ruta]);
    if(!fotos.length){ el.innerHTML=`<p style="grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0">No pude traer las fotos. Recargá la página.</p>`; return; }
    el.innerHTML=fotos.map(f=>`
      <figure class="${f.mia?'mia':''}" data-ruta="${esc(f.ruta)}">
        <img src="${esc(mapa[f.ruta]||'')}" alt="" loading="lazy">
        ${f.nombre?`<figcaption>${esc(f.nombre)}</figcaption>`:''}
      </figure>`).join('');
    [...el.querySelectorAll('figure')].forEach((fig,i)=>{
      fig.onclick=()=>abrirVisor(fotos,mapa,i);
    });
    requestAnimationFrame(()=>{
      [...el.querySelectorAll('figure')].forEach((fig,i)=>{
        setTimeout(()=>fig.classList.add('rev'), 90*Math.min(i,14));
      });
    });
  };
  await pintarGrilla(gMias, mias);

  let todasCargadas=false;
  app.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=async()=>{
    app.querySelectorAll('.tabs [data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    const esMias=b.dataset.t==='mias';
    gMias.hidden=!esMias; gTodas.hidden=esMias;
    if(!esMias&&!todasCargadas){ todasCargadas=true; await pintarGrilla(gTodas, todas); }
  });
}

/* Al cambiar de pantalla hay que barrer lo que vive colgado del body: el
   visor y el cuarto de revelado no están adentro de #app, así que una
   navegación (el botón atrás del teléfono, por ejemplo) los dejaba tapando
   la pantalla nueva. */
const cerrarCapas=()=>document.querySelectorAll('.visorf,.cuarto').forEach(c=>{
  if(c._cortar) c._cortar();
  c.remove();
});

/* ── arranque ──
   Dos puertas en la misma dirección: el invitado llega con ?e=CODIGO
   (del QR) y el organizador entra por #panel. */
async function arranqueInvitado(){
  let m;
  try{
    m=await eventoPorCodigo(codigo,'codigo,nombre,tono,camara,cerrado,portada,cupo_fotos,fecha');
  }catch(e){ return vError('No pude conectar. Probá de nuevo en un rato.'); }
  if(!m) return vError('No encontré ese evento.');
  tono(m.tono);
  if(!m.camara) return vError('Esta fiesta todavía no tiene la cámara activada.');
  const guardado=leerRollo(codigo);
  if(!guardado) return vPedirNombre(m);
  await consultarEstado(m,guardado);
}

function pintar(){
  detenerPoll(); detenerCamara(); olvidarVigilia(); cerrarCapas(); hojaA4(false);
  /* El color vuelve al de la casa en cada pantalla, y cada vista pone el
     suyo cuando sabe de qué evento se trata. Sin esto, el tono del último
     rollo que abriste se quedaba puesto en la portada, en el alta y en el
     rollo siguiente: la pantalla de crear una fiesta salía del color de la
     fiesta de otro. */
  tono();
  const h=location.hash.slice(1);
  window.scrollTo(0,0);
  let p;
  try{
    /* En demostración no se crea nada ni se administra nada: lo que se
       muestra es lo que ve el invitado. "Crear el rollo de mi fiesta" no es
       una prueba, es el formulario de alta. */
    if(HAY_DEMO && (h.startsWith('nuevo')||h.startsWith('ev/')||h.startsWith('ajustes/')||h.startsWith('tarjetas/')
                    ||h==='codigo'||h.startsWith('clave')))
      return location.replace(location.pathname+location.search.replace(/[?&]camara=1/,'')+'#');
    if(h.startsWith('nuevo'))        p=vNuevo(h.split('/')[1]||1);
    else if(h.startsWith('ev/'))     p=vRollo(h.slice(3));
    else if(h.startsWith('ajustes/'))p=vAjustes(h.slice(8));
    else if(h.startsWith('tarjetas/'))p=vTarjetas(h.slice(9));
    else if(h==='codigo')            p=vPedirCodigo();
    else if(h.startsWith('clave'))   p=vPedirClave(h.split('/')[1]||'');
    /* el invitado llega del QR con ?e=CODIGO; el resto ve la puerta */
    else if(codigo)                  p=arranqueInvitado();
    else                             p=vInicio();
  }catch(e){ console.error(e); return vError('Algo se cortó. Recargá la página.'); }
  if(p&&p.catch) p.catch(e=>{ console.error(e); vError('Algo se cortó. Recargá la página.'); });
}
/* La foto del álbum se marca cuando carga y el CSS hace el resto. En
   captura: "load" de un <img> no burbujea. */
/* En DOCUMENT, no en window. Medido: el "error" de un <img> sí llega a
   window en captura —por eso el respaldo de las miniaturas funciona—
   pero el "load" NO: en window, "load" es el de la página. Puesto en
   window esto no marcaba una sola foto y el álbum quedaba invisible
   entero. */
document.addEventListener('load',e=>{
  const n=e.target;
  if(n && n.tagName==='IMG' && n.closest && n.closest('.grilla')) n.dataset.lista='1';
}, true);
addEventListener('hashchange',pintar);
addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-ir]');
  if(b) location.hash=b.dataset.ir;
});
if(HAY_DEMO){
  if(!EN_MARCO){
    document.body.classList.add('en-demo');
    const enCamara=/(?:^|[?&])camara=1(?:&|$)/.test(location.search);
    document.body.insertAdjacentHTML('afterbegin',
      '<div id="cinta-demo"><span class="mini">Demostración</span>'
      +'<span><b>Demostración</b> · la fiesta y las fotos son inventadas</span>'
      /* Los dos lados del rollo en un botón. La prueba entra por el álbum
         revelado, que es lo que hay que vender, pero lo otro —el invitado
         gastando fotos sin ver ninguna— también es el producto, y sin esto
         solo se llegaba escribiendo ?camara=1 a mano. */
      +'<button id="otroLado">'+(enCamara?'Ver el álbum revelado':'Ver la cámara del invitado')+'</button>'
      +'<button id="deNuevo">Empezar de nuevo</button>'
      +(ENMARCADO?'':'<a href="/">Salir</a>')
      +'<button class="plegar" id="plegarCinta" aria-label="Achicar este aviso">✕</button></div>');
    const bo=document.getElementById('otroLado');
    if(bo) bo.onclick=()=>location.replace(
      location.pathname+'?demo=1'+(enCamara?'':'&camara=1'));
    /* Plegar y desplegar. Plegada, toda la tira es el botón de volver a
       abrirla: 18px de alto son poco para apuntarle, pero es el ancho
       entero de la pantalla. */
    const cinta=document.getElementById('cinta-demo');
    const plegar=document.getElementById('plegarCinta');
    if(plegar) plegar.onclick=e=>{ e.stopPropagation();
      document.body.classList.add('cinta-chica'); };
    if(cinta) cinta.onclick=()=>{
      if(document.body.classList.contains('cinta-chica'))
        document.body.classList.remove('cinta-chica');
      medirCinta();
    };
    /* Cuánto mide de verdad, después de dibujarla. Darla por supuesta es
       lo que dejaba el ✕ fuera de la pantalla. */
    var medirCinta=function(){
      if(!cinta) return;
      requestAnimationFrame(function(){
        document.body.style.setProperty('--cinta',(cinta.offsetHeight||38)+'px');
      });
    };
    if(plegar) plegar.addEventListener('click',medirCinta);
    addEventListener('resize',medirCinta);
    addEventListener('orientationchange',medirCinta);
    medirCinta();
  }
  /* Es un modo prueba: volver a empezar es recargar. Todo lo de la
     demostración vive en memoria, así que la recarga lo limpia entero. */
  const bn=document.getElementById('deNuevo');
  if(bn) bn.onclick=()=>location.replace(location.pathname+'?demo=1');
  /* Derecho a lo que hay que mostrar. Sin ?e= en la dirección, el que entra
     es "un invitado de la fiesta inventada": con el rollo ya revelado eso
     cae en el álbum, que es el momento del producto. */
  /* Ojo: esto corre en el cuerpo del archivo, no adentro de una función.
     Un "return" acá es un error de sintaxis y la app no arranca. */
  if(!codigo){
    const q=new URLSearchParams(location.search);
    q.set('demo','1'); q.set('e',DEMO_COD);
    if(EN_MARCO) q.set('marco','1');
    location.replace(location.pathname+'?'+q.toString());
  }else{
    history.replaceState(null,'','');
  }
}
pintar();
addEventListener('pagehide',detenerCamara);
addEventListener('unhandledrejection',e=>{ console.error(e.reason); avisar('Algo falló: probá de nuevo'); e.preventDefault(); });
/* Y lo que revienta SIN promesa de por medio. El muro ya lo tenía y el
   rollo no: un toque que fallaba adentro de su propio manejador no dejaba
   nada en pantalla, y del otro lado lo único que llega es "no anda".
   El filtro del target es para no confundir una imagen rota con esto: los
   errores de un <img> también llegan acá. */
addEventListener('error',e=>{
  if(e&&e.target&&e.target!==window) return;
  console.error('error suelto',e.error||e.message);
  try{ avisar('Algo falló: probá de nuevo'); }catch(_){}
});
</script>
