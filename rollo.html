<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Click Eterno · Rollo eterno</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="marca.webp" type="image/webp">
<!-- Que se pueda poner en la pantalla del teléfono, como cualquier app.
     En el iPhone eso es "Compartir → Añadir a pantalla de inicio" y alcanza
     con esto. A propósito NO hay service worker: en un sitio sin build que
     se publica solo con cada push, un service worker es la forma más
     rápida de dejarle a un cliente una versión vieja pegada para siempre.
     En Android eso hace que no salte el cartel automático de "instalar",
     pero la opción del menú del navegador funciona igual. -->
<link rel="manifest" href="/rollo.webmanifest">
<link rel="apple-touch-icon" href="/iconos/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rollo eterno">
<meta name="mobile-web-app-capable" content="yes">
<!-- En el repo, no en un CDN: ver el comentario de muro.html. Y no se
     cargan acá: se piden con cargarLib() cuando hacen falta. Acá estaban
     incluso ANTES del preconnect, así que la cámara del invitado esperaba
     a 117 KB de librerías que no iba a usar antes de empezar nada. -->
<link rel="preconnect" href="https://kuqlqgrwsospwjexodqa.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@200;300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@200;300;400;500;600&display=swap"></noscript>
<style>
:root{
  color-scheme: dark;   /* si no, el calendario del teléfono sale blanco sobre negro */
  --negro:#000; --carbon:#0A0908; --humo:#131110;
  --oro:#D9AE72; --oro-hondo:#A87B43; --champan:#EFDCBC;
  --texto:#F6F2EA; --mute:#9B9287;
  --hilo:rgba(217,174,114,.24); --hilo2:rgba(217,174,114,.5); --gris:rgba(255,255,255,.09);
  --e:cubic-bezier(.22,.7,.24,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
html,body{margin:0;background:var(--negro);color:var(--texto)}
body{font-family:Jost,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
button,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{max-width:100%;display:block}
.serif{font-family:'Bodoni Moda',serif}
.ital{font-family:'Bodoni Moda',serif;font-style:italic}
.wrap{max-width:520px;margin:0 auto;padding:0 22px 60px}
.espaciado{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute)}
.estrella{display:inline-block;width:13px;height:13px;vertical-align:middle;color:var(--oro)}
.estrella svg{display:block;width:100%;height:100%}
.filete{display:flex;align-items:center;gap:14px;margin:26px 0;color:var(--oro)}
.filete:before,.filete:after{content:'';height:1px;background:linear-gradient(90deg,transparent,var(--hilo2),transparent);flex:1}

#brillo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%,rgba(217,174,114,.1),transparent 60%)}
#grano{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.04;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:2;min-height:100svh}

/* ── cinta de la demostración ── */
/* Alto AUTOMÁTICO y medido, no clavado en 38px: en un teléfono los
   botones no entran en una línea, y con alto fijo lo que sobra se sale de
   la pantalla —el ✕ y "Salir" quedaban afuera, sin forma de llegar—.
   Envuelve, y el JS pone el alto real en --cinta. */
#cinta-demo{position:fixed;top:0;left:0;right:0;z-index:90;min-height:38px;display:flex;
  flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;padding:6px 12px;
  background:linear-gradient(90deg,#D9AE72,#EFDCBC);color:#2A1B08;
  font:500 11.5px/1 Jost,system-ui,sans-serif;letter-spacing:.06em}
#cinta-demo b{font-weight:600}
#cinta-demo a{color:#2A1B08;text-decoration:underline;white-space:nowrap;flex:none;opacity:.85}
#cinta-demo button{font:500 11px/1 Jost,system-ui,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:#2A1B08;background:rgba(42,27,8,.12);
  border:1px solid rgba(42,27,8,.3);border-radius:20px;padding:5px 12px;cursor:pointer;
  white-space:nowrap;flex:none}
#cinta-demo button:hover{background:rgba(42,27,8,.2)}
body.en-demo{--cinta:38px;padding-top:var(--cinta)}
body.en-demo .pie-fijo{bottom:0}
/* position:fixed no lo corre el padding del body. La cámara, el cuarto
   oscuro y el visor de fotos se dibujan con inset:0, así que sin esto la
   cinta les tapa la barra de arriba —el botón de cerrar incluido—. */
body.en-demo .camara,
body.en-demo .cuarto,
body.en-demo .visorf{top:var(--cinta)}
/* ── la cinta se pliega ──
   En un teléfono, 38px fijos arriba le comen la pantalla a la app. Con el
   ✕ queda una tira de 18px que se toca y vuelve, así no se pierde "Salir"
   ni "Empezar de nuevo" (que es lo que pasaría escondiéndola del todo). */
#cinta-demo .plegar{padding:5px 9px;border-radius:50%;line-height:1;font-size:12px;
  letter-spacing:0;border-color:transparent;background:transparent}
#cinta-demo .mini{display:none;font-size:9px;letter-spacing:.26em;
  text-transform:uppercase;opacity:.9}
body.en-demo.cinta-chica #cinta-demo{min-height:0;height:18px;gap:0;padding:0;
  flex-wrap:nowrap;cursor:pointer}
body.en-demo.cinta-chica #cinta-demo>:not(.mini){display:none}
body.en-demo.cinta-chica #cinta-demo .mini{display:block}
@media(max-width:400px){
  #cinta-demo{font-size:10.5px;gap:9px}
  #cinta-demo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
/* ── tarjetas para cortar y repartir ──
   Lo único del producto que el cliente necesita en la mano y no existía:
   antes le sacaba una captura al QR de la pantalla. Mismas medidas que
   las del muro, en milímetros, porque lo que importa es que entren en la
   hoja de verdad y no cómo se ven en el monitor. */
.hoja-tarjetas{background:#fff;padding:10px;margin:26px auto;max-width:520px;
  display:grid;gap:0;border:1px solid var(--gris)}
.hoja-tarjetas.de2{grid-template-columns:1fr}
.hoja-tarjetas.de4,.hoja-tarjetas.de8{grid-template-columns:1fr 1fr}
.tarjeta-qr{background:#0b0908;color:#F6F2EA;text-align:center;padding:16px 12px;
  border:1px dashed rgba(217,174,114,.35);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;break-inside:avoid;page-break-inside:avoid}
.tarjeta-qr .marca-t{width:88px;opacity:.9}
.tarjeta-qr .nom-t{font-family:'Bodoni Moda',serif;font-style:italic;font-size:24px;line-height:1.1}
.tarjeta-qr .fec-t{font-size:8.5px;letter-spacing:.3em;color:#A79E92;text-transform:uppercase}
.tarjeta-qr .ped-t{font-family:'Bodoni Moda',serif;font-size:15px;line-height:1.4;margin:6px 0}
.tarjeta-qr .qr-t{background:#fff;padding:6px;line-height:0}
.tarjeta-qr .qr-t canvas,.tarjeta-qr .qr-t img{width:128px;height:128px;display:block}
.tarjeta-qr .ins-t{font-size:8px;letter-spacing:.14em;color:#A79E92;text-transform:uppercase;line-height:1.7}
.tarjeta-qr .cod-t{font-size:9.5px;letter-spacing:.24em;color:var(--oro)}
.hoja-tarjetas.de8 .tarjeta-qr{padding:9px 8px;gap:4px}
.hoja-tarjetas.de8 .tarjeta-qr .marca-t{width:54px}
.hoja-tarjetas.de8 .tarjeta-qr .nom-t{font-size:16px}
.hoja-tarjetas.de8 .tarjeta-qr .ped-t{font-size:11px;margin:2px 0}
.hoja-tarjetas.de8 .tarjeta-qr .ins-t{font-size:6.5px}
.hoja-tarjetas.de8 .tarjeta-qr .qr-t canvas,.hoja-tarjetas.de8 .tarjeta-qr .qr-t img{width:84px;height:84px}
.hoja-tarjetas.de2 .tarjeta-qr .qr-t canvas,.hoja-tarjetas.de2 .tarjeta-qr .qr-t img{width:180px;height:180px}
.hoja-tarjetas.de2 .tarjeta-qr .nom-t{font-size:34px}
.hoja-tarjetas.de2 .tarjeta-qr .ped-t{font-size:19px}
.cuantas{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.cuantas button{border:1px solid var(--gris);border-radius:999px;padding:8px 16px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cuantas button[aria-pressed=true]{border-color:var(--oro);color:var(--oro)}
@media print{
  #brillo,#grano,.cab-p,.no-imprime,#aviso-toast,#cinta-demo{display:none!important}
  body{background:#fff;padding:0}
  /* La hoja tiene que arrancar en 0,0. El padding del body y del .wrap la
     corrían más de un centímetro y la cuarta tarjeta se salía del papel. */
  body,#app,.wrap,.wrap.paso-cuerpo{margin:0!important;padding:0!important;max-width:none!important}
  .hoja-tarjetas{margin:0;padding:0;border:0;max-width:none;width:210mm;height:297mm}
  .hoja-tarjetas.de2 .tarjeta-qr,.hoja-tarjetas.de4 .tarjeta-qr{height:148.5mm}
  .hoja-tarjetas.de8 .tarjeta-qr{height:74.25mm}
  .tarjeta-qr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* el resumen del alta: lo que se le manda al cliente antes de cobrarle */
.resumen{border:1px solid var(--hilo);margin-top:26px}
.fila-res{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:14px 18px;border-bottom:1px solid var(--gris)}
.fila-res:last-child{border-bottom:0}
.fila-res span{font-size:12.5px;letter-spacing:.06em;color:var(--mute);flex:none}
.fila-res b{font-weight:400;font-size:14.5px;color:#F6F2EA;text-align:right}
/* ══════════ interfaz ══════════
   Lo mismo que en muro.html, y por los mismos motivos medidos: todo lo
   que se toca llega a 44x44 (el "atrás" de este archivo medía 23x26, que
   en un teléfono es errarle), el :hover no se queda pegado en una
   pantalla táctil, y lo que se toca se hunde para que se note. */
:root{ --toque:44px; --rapido:.16s; }
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
.cab-p .atras,.paso-cab .atras{min-width:var(--toque);min-height:var(--toque);
  display:inline-flex;align-items:center;justify-content:flex-start}
.acepto{display:flex;gap:12px;align-items:flex-start;margin-top:20px;padding:14px 16px;
  text-align:left;border:1px solid var(--gris);border-radius:2px;
  background:rgba(217,174,114,.04);cursor:pointer;transition:border-color .3s var(--e)}
.acepto.falta{border-color:#FF7B94}
.acepto input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--oro);cursor:pointer}
.acepto span{font-size:13px;line-height:1.7;color:var(--mute)}
.acepto a{color:var(--oro);text-decoration:underline;text-underline-offset:3px;
  display:inline-block;padding:12px 2px}
/* La casilla es una puerta legal: en un teléfono tiene que llegar a 44x44
   como todo lo que se toca. Con 22 la agarró pruebas/dispositivos.js. En
   un escritorio queda del tamaño normal, que ahí se apunta con el mouse. */
@media (max-width:820px),(pointer:coarse){
  .acepto input{width:var(--toque);height:var(--toque)}
}
/* ── el aviso de datos del invitado (artículo 6, Ley 25.326) ──
   Plegado ocupa un renglón para no empujar el botón fuera de la pantalla;
   abierto dice todo. Plegado no es esconderlo: el renglón dice de qué se
   trata y está en la misma pantalla donde se pide el dato. */
.aviso-datos{margin:18px auto 0;max-width:420px;text-align:left;
  border:1px solid var(--gris);background:rgba(217,174,114,.04);border-radius:2px}
.aviso-datos summary{list-style:none;cursor:pointer;padding:13px 16px;
  font-size:12px;letter-spacing:.08em;color:var(--oro);
  display:flex;align-items:center;gap:10px;min-height:var(--toque)}
.aviso-datos summary::-webkit-details-marker{display:none}
.aviso-datos summary:before{content:'';width:5px;height:5px;border-radius:50%;
  background:var(--oro);flex:none}
.aviso-datos summary:after{content:'Ver';margin-left:auto;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.aviso-datos[open] summary:after{content:'Cerrar'}
.aviso-datos .cuerpo{padding:2px 16px 16px}
.aviso-datos p{font-size:13px;line-height:1.75;color:var(--mute);margin-top:10px}
.aviso-datos b{color:#EDE6DA;font-weight:500}
.aviso-datos a{color:var(--oro);text-decoration:underline;text-underline-offset:3px;
  /* enlace suelto adentro de un párrafo: crece a lo alto sin romper el
     renglón, que es como se llega a 44px sin desarmar el texto */
  display:inline-block;padding:13px 2px}
.chips button,.link-abajo,.filtro-op{min-height:var(--toque)}
.chips button{display:inline-flex;align-items:center;justify-content:center}
/* Estos se habían quedado afuera. El "Salir" de la cinta medía 26x11 —la
   única puerta de vuelta al sitio— y las solapas del álbum, 33. Va en la
   consulta del dedo para no engordar la vitrina del escritorio. */
@media (max-width:820px),(pointer:coarse){
  #cinta-demo button,#cinta-demo a,.tabs button,.hilo-btn{
    min-height:var(--toque);display:inline-flex;align-items:center;justify-content:center}
  #cinta-demo .plegar{min-width:var(--toque)}
  /* "Salir" es una palabra corta: llegaba a 44 de alto y se quedaba en 26
     de ancho. El área se agranda a lo ancho también. */
  #cinta-demo a,#cinta-demo .plegar{min-width:var(--toque);padding-inline:10px}
}
@media(prefers-reduced-motion:no-preference){
  .oro-btn,.hilo-btn,.link-abajo,.chips button,.stepper button,
  .dos-cartas button,.fila-ev{transition:transform var(--rapido) var(--e)}
  .oro-btn:not(:disabled):active,.hilo-btn:not(:disabled):active,
  .link-abajo:active,.chips button:active,.stepper button:active,
  .dos-cartas button:active,.fila-ev:active{transform:scale(.975)}
}
@media(hover:none){
  .hilo-btn:hover,.link-abajo:hover,.fila-ev:hover{
    border-color:inherit;color:inherit;background:inherit;transform:none}
}
/* Faltaba: este archivo respetaba "menos movimiento" solo desde el JS. */
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.cab{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 22px 8px}
.cab img{width:82px;opacity:.7;margin-bottom:16px}
.cab h1{font-family:'Bodoni Moda',serif;font-size:clamp(24px,7vw,30px)}
.centro{min-height:80svh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 24px}
.centro p.info{color:#B5AC9E;line-height:1.8;font-size:14.5px;max-width:32ch;margin:14px auto 0}
.oro-btn{width:100%;background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 55%,var(--champan));
  color:#0A0806;border-radius:2px;padding:16px;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;
  transition:transform .25s var(--e),filter .3s}
.oro-btn:disabled{opacity:.55}
.oro-btn:not(:disabled):active{transform:scale(.99)}
.hilo-btn{width:100%;border:1px solid var(--hilo2);color:var(--oro);border-radius:2px;padding:14px;
  font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:12px}
.campo{margin:22px 0;text-align:left}
.campo label{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--mute);margin-bottom:10px;text-transform:uppercase}
input[type=text]{width:100%;background:transparent;border:0;border-bottom:1px solid var(--gris);
  padding:12px 2px;font-size:17px;font-weight:300;color:var(--texto)}
input[type=text]:focus{outline:none;border-color:var(--oro)}

/* ── el organizador ── */
.cab-p{display:flex;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 22px 18px;
  border-bottom:1px solid var(--gris);position:sticky;top:0;z-index:20;
  background:rgba(0,0,0,.9);backdrop-filter:blur(14px)}
.cab-p .atras{color:var(--oro);font-size:20px;line-height:1;padding:0 10px 0 0}
.cab-p .tit{flex:1;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab-p img{width:70px;opacity:.5}

/* la puerta */
.portada-r{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:56px 26px calc(40px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;text-align:center}
.portada-r .marca-gr{width:150px;margin:0 auto 26px;opacity:.85}
.portada-r h1{font-family:'Bodoni Moda',serif;font-size:clamp(30px,9vw,40px);line-height:1.1;margin:10px 0 0}
.portada-r h1 em{display:block;font-style:italic;color:var(--oro)}
.bajada{color:#B5AC9E;line-height:1.8;font-size:14.5px;max-width:34ch;margin:16px auto 26px;text-align:center}
.link-abajo{display:block;width:100%;text-align:center;color:var(--mute);font-size:12.5px;
  padding:16px 0;letter-spacing:.04em}
.link-abajo:hover{color:var(--oro)}

/* los pasos */
.paso-cab{display:flex;align-items:center;gap:16px;padding:calc(18px + env(safe-area-inset-top)) 22px 0}
.paso-cab .atras{color:var(--oro);font-size:20px;line-height:1;padding:0 10px 0 0}
.paso-cab .barra{flex:1;height:2px;background:var(--gris);border-radius:2px;overflow:hidden}
.paso-cab .barra i{display:block;height:100%;background:var(--oro);transition:width .45s var(--e)}
.paso-cuerpo{padding-top:44px;padding-bottom:150px;max-width:460px}
.paso-cuerpo h2{font-family:'Bodoni Moda',serif;font-size:clamp(25px,7.4vw,32px);line-height:1.15;font-weight:400}
.paso-cuerpo .sub{color:#B5AC9E;line-height:1.75;font-size:14px;margin:14px 0 30px;max-width:32ch}
input.grande{font-size:21px;padding:14px 2px}
.pie-fijo{position:fixed;left:0;right:0;bottom:0;padding:16px 26px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,#000 62%,transparent);max-width:512px;margin:0 auto}

/* la pantalla del rollo */
.instruccion{font-family:'Bodoni Moda',serif;font-size:clamp(22px,6.4vw,27px);line-height:1.25;
  text-align:center;margin:24px 0 0}
.qr-caja{display:flex;justify-content:center;margin:30px 0 26px}
.qr{background:#fff;padding:14px;line-height:0;border-radius:4px}
.comova{text-align:center;font-size:13px;color:var(--mute);margin-top:20px;letter-spacing:.03em}
.centrado{text-align:center;padding-top:40px}
.estado{display:inline-block;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  padding:7px 16px;border-radius:20px;border:1px solid var(--hilo2);color:var(--oro);margin-top:22px}
.estado.vivo{color:#6FCF8B;border-color:rgba(111,207,139,.42)}
.estado.gris{color:var(--mute);border-color:var(--gris)}
/* el aviso de que el álbum se borra pronto (mismo trato que en el muro) */
.aviso-vence{border:1px solid var(--oro);padding:20px 22px;margin:26px auto 0;max-width:34ch;
  background:linear-gradient(160deg,rgba(217,174,114,.11),rgba(217,174,114,.02))}
.aviso-vence.tarde{border-color:rgba(255,123,148,.5);
  background:linear-gradient(160deg,rgba(255,123,148,.12),rgba(255,123,148,.02))}
.aviso-vence b.tit{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--oro);font-weight:400;margin-bottom:12px}
.aviso-vence.tarde b.tit{color:#FF7B94}
.aviso-vence p{color:#B5AC9E;line-height:1.75;font-size:14px;text-align:left;margin:0}

/* piezas sueltas */
.rotulito{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin:30px 0 12px}
.ayudita{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:10px}
.fila-ev{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:17px 2px;
  border-bottom:1px solid var(--gris)}
.fila-ev .txt{flex:1;min-width:0}
.fila-ev b{display:block;font-weight:400;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-ev small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.fila-ev .fl{color:var(--oro);font-size:17px;flex:none}
.punto{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mute)}
.punto.vivo{background:#6FCF8B;box-shadow:0 0 0 4px rgba(111,207,139,.14)}
.punto.oro{background:var(--oro);box-shadow:0 0 0 4px rgba(217,174,114,.14)}
.punto.gris{background:#5b5550}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips button{padding:12px 18px;border:1px solid var(--gris);border-radius:22px;font-size:13.5px;color:var(--mute)}
.chips button[aria-pressed=true]{border-color:var(--oro);color:var(--oro);background:rgba(217,174,114,.06)}
.dos-cartas{display:grid;gap:12px}
.dos-cartas button{border:1px solid var(--gris);border-radius:8px;padding:20px 18px;text-align:left;position:relative}
.dos-cartas button[aria-pressed=true]{border-color:var(--oro);background:rgba(217,174,114,.06)}
.dos-cartas b{display:block;font-weight:400;font-size:16px;margin-bottom:6px}
.dos-cartas span{font-size:13px;color:var(--mute);line-height:1.5}
.dos-cartas .reco{position:absolute;top:16px;right:16px;font-style:normal;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.stepper{display:flex;align-items:center;gap:22px}
.stepper button{width:48px;height:48px;border:1px solid var(--gris);border-radius:50%;font-size:22px;color:var(--oro)}
.stepper b{font-family:'Bodoni Moda',serif;font-size:36px;min-width:60px;text-align:center}
.clave-gr{font-size:25px;letter-spacing:.24em;color:var(--oro)}
/* Los colores de la fiesta. Mismas medidas que en el muro; el aro del
   elegido va en --texto y no en --oro como allá, porque acá --oro ES el
   color que se está eligiendo: con el dorado puesto, un aro dorado
   alrededor de una pastilla dorada no se ve. Los 44px son de toque. */
.tonos{display:flex;gap:14px;padding-top:4px;flex-wrap:wrap}
.tono{width:44px;height:44px;border-radius:50%;position:relative;flex:none;
  transition:transform .3s var(--e)}
.tono:after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1px solid transparent;transition:border-color .3s}
.tono[aria-pressed=true]:after{border-color:var(--texto)}
.tono[aria-pressed=true]{transform:scale(1.06)}
.llave-fila{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:28px 0 10px}
.llave-fila p{font-size:15px}
.llave-fila small{display:block;color:var(--mute);font-size:12.5px;margin-top:5px;line-height:1.6}
.palanca{width:52px;height:30px;border-radius:16px;background:var(--gris);position:relative;flex:none;transition:background .3s}
.palanca:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:var(--texto);transition:transform .3s var(--e)}
.palanca[aria-pressed=true]{background:var(--oro-hondo)}
.palanca[aria-pressed=true]:after{transform:translateX(22px)}
input[type=date],input[type=datetime-local]{width:100%;background:transparent;border:0;
  border-bottom:1px solid var(--gris);padding:12px 2px;font-size:16.5px;font-weight:300;color:var(--texto)}
input[type=date]:focus,input[type=datetime-local]:focus{outline:none;border-color:var(--oro)}

/* ── entrada: la portada del evento a pantalla completa ── */
.tapa{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end}
.tapa .foto{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.tapa .foto:after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,.88) 72%,#000 100%)}
.tapa .foto.vacia{background:radial-gradient(120% 80% at 50% 0%,rgba(217,174,114,.16),transparent 60%),#0A0908}
.tapa .arriba{position:relative;z-index:2;padding:34px 26px 0;text-align:center}
.tapa .arriba img{width:88px;margin:0 auto;opacity:.75}
.tapa .medio{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 26px 6px;text-align:center}
.tapa h1{font-family:'Bodoni Moda',serif;font-size:clamp(32px,10vw,46px);line-height:1.05;margin-top:10px}
.tapa .fechita{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--oro);margin-top:14px}
.tapa .abajo{position:relative;z-index:2;padding:22px 26px calc(30px + env(safe-area-inset-bottom))}
.promesa{border:1px solid var(--hilo);border-radius:6px;padding:18px 20px;margin-bottom:22px;
  background:rgba(12,10,8,.5);backdrop-filter:blur(10px);text-align:center}
.promesa b{display:block;font-size:15.5px;font-weight:400;line-height:1.5;margin-bottom:6px}
.promesa b em{font-family:'Bodoni Moda',serif;font-style:italic;color:var(--oro);font-size:17px}
.promesa span{font-size:13px;color:#B5AC9E;line-height:1.6}
.tapa .campo{margin:0 0 14px;text-align:left}
.sin-app{text-align:center;font-size:11.5px;color:var(--mute);margin-top:14px;letter-spacing:.04em}

/* ── la cámara: pantalla completa, como una cámara y no como una web ── */
.camara{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:5}
.camara .lente{position:absolute;inset:0;overflow:hidden}
.camara video{width:100%;height:100%;object-fit:cover;display:block}
.camara .grano-visor{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  transition:opacity .25s}
.camara .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.camara .flash.on{animation:flashea .32s ease-out}
@keyframes flashea{0%{opacity:.9}100%{opacity:0}}
/* dos sombras suaves para que se lea lo de arriba y lo de abajo */
/* Tiene que llegar hasta ABAJO del contador del rollo: apuntando a algo
   claro —una pared blanca, el cielo, una pantalla— los cuadraditos y el
   número quedaban ilegibles sobre la propia imagen. */
.camara .velo-arr{position:absolute;top:0;left:0;right:0;height:250px;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.78) 30%,rgba(0,0,0,.45) 65%,transparent)}
.camara .velo-aba{position:absolute;bottom:0;left:0;right:0;height:330px;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.88) 30%,transparent)}

.cam-arriba{position:relative;z-index:3;display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.cam-arriba .nombre-ev{flex:1;text-align:center;font-size:11px;letter-spacing:.26em;
  text-transform:uppercase;color:rgba(246,242,234,.82)}
.girar{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;flex:none}
.girar svg{width:19px;height:19px;stroke:var(--texto);fill:none;stroke-width:1.6;stroke-linecap:round}
/* La salida de la cámara. Es del tamaño del pulgar a propósito: probado en
   un iPhone, el invitado entraba y no podía salir hasta gastar las 24. */
.salir-cam{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.42);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;flex:none}
.salir-cam svg{width:17px;height:17px;stroke:var(--texto);fill:none;stroke-width:1.8;stroke-linecap:round}

.cam-abajo{position:relative;z-index:3;margin-top:auto;
  padding:0 0 calc(20px + env(safe-area-inset-bottom))}
/* la tira de filtros: cada uno muestra lo que estás apuntando ahora mismo */
.tira-filtros{display:flex;gap:8px;overflow-x:auto;padding:0 14px 14px;scrollbar-width:none;
  scroll-snap-type:x proximity;justify-content:center}
.tira-filtros::-webkit-scrollbar{display:none}
/* 62px no le entran a "Blanco y negro": envolvía a dos líneas y esa sola
   columna empujaba la tira entera más abajo que las otras. */
.filtro-op{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:7px;
  scroll-snap-align:center}
.filtro-op canvas{width:56px;height:56px;border-radius:10px;display:block;background:#141210;
  border:2px solid transparent;transition:border-color .25s,transform .25s var(--e)}
.filtro-op[aria-pressed=true] canvas{border-color:var(--oro);transform:scale(1.06)}
.filtro-op span{font-size:9.5px;letter-spacing:.04em;color:rgba(246,242,234,.6);text-align:center;
  line-height:1.25;white-space:nowrap}
.filtro-op[aria-pressed=true] span{color:var(--oro)}

.fila-disparo{display:flex;align-items:center;justify-content:center;padding:0 30px}

/* ── el rollo, arriba ──
   Los cuadraditos son la película: se apagan de a uno. Con un cupo grande
   no entran, así que arriba de TOPE_CUADROS se dibuja solo el número: una
   tira de sesenta rayitas de dos píxeles no dice nada. */
.rollo-tira{position:relative;z-index:3;padding:12px 18px 0;text-align:center}
.cuadros{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:320px;margin:0 auto}
.cuadros i{display:block;width:8px;height:12px;border-radius:2px;background:var(--oro);
  box-shadow:0 0 6px rgba(217,174,114,.45);transition:background .4s,box-shadow .4s}
.cuadros i.gastado{background:rgba(246,242,234,.14);box-shadow:none}
.rollo-cuenta{margin-top:6px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(246,242,234,.5);display:flex;align-items:baseline;justify-content:center;gap:7px}
.rollo-cuenta b{font-family:'Bodoni Moda',serif;font-size:30px;line-height:1;letter-spacing:0;
  color:var(--texto);text-transform:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
/* cuando quedan pocas, el número lo dice sin que haya que leer */
.rollo-tira.poquitas .rollo-cuenta b{color:var(--oro)}
.rollo-tira.ultima .rollo-cuenta b{color:var(--oro);animation:latecuenta 1.8s ease-in-out infinite}
@keyframes latecuenta{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.rollo-tira.ultima .rollo-cuenta b{animation:none}}

/* la ficha del filtro, cuando la tira está plegada */
.filtro-chip{display:flex;align-items:center;gap:9px;margin:0 auto 14px;padding:9px 16px;
  border-radius:999px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  border:1px solid rgba(246,242,234,.16);min-height:var(--toque)}
.filtro-chip .pto{width:12px;height:12px;border-radius:3px;background:var(--oro);flex:none}
.filtro-chip span{font-size:12.5px;color:var(--texto)}
.filtro-chip em{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(246,242,234,.5);font-style:normal}
.disparar{width:76px;height:76px;border-radius:50%;border:3px solid rgba(246,242,234,.9);
  position:relative;flex:none;transition:transform .12s}
.disparar:before{content:'';position:absolute;inset:5px;border-radius:50%;
  background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 55%,var(--champan));transition:inset .12s}
.disparar:disabled{opacity:.45}
.disparar:not(:disabled):active{transform:scale(.94)}
.disparar:not(:disabled):active:before{inset:9px}
.hueco{width:62px;flex:none}
.pie-camara{position:relative;z-index:3;text-align:center;font-size:11.5px;
  color:rgba(246,242,234,.45);padding:16px 30px 0;line-height:1.5}
.native-alt{position:relative;z-index:3;display:block;text-align:center;margin:0 22px;padding:13px;
  border:1px dashed var(--hilo2);border-radius:6px;color:var(--oro);font-size:12.5px;cursor:pointer;
  background:rgba(0,0,0,.5)}

/* ── espera / revelado ── */
.rollo-icono{width:100%;max-width:150px;margin:0 auto}
.cuenta-rev{font-family:'Bodoni Moda',serif;font-size:clamp(30px,9vw,42px);margin:18px 0 4px;color:var(--oro)}

/* ── el cuarto de revelado ──
   Luz roja, las copias caen en la bandeja y la imagen sube desde el papel.
   Al final se prenden las luces: recién ahí aparecen los colores. */
.cuarto{position:fixed;inset:0;z-index:80;background:#0b0201;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:entraCuarto .8s var(--e)}
@keyframes entraCuarto{from{opacity:0}to{opacity:1}}
.cuarto.saliendo{opacity:0;transition:opacity .9s var(--e)}
/* la lámpara de seguridad, que titila apenas como una de verdad */
.cuarto .luz{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 58% at 50% 28%,rgba(214,38,26,.5),rgba(74,7,5,.92) 52%,#0b0201 100%);
  animation:lampara 7s ease-in-out infinite}
@keyframes lampara{0%,100%{opacity:.93}40%{opacity:1}72%{opacity:.87}}
.cuarto .polvillo{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
/* el tinte rojo tapa TODO, copias incluidas: es la luz del cuarto */
.cuarto .tinte{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:rgba(196,34,24,.34);mix-blend-mode:multiply;transition:opacity 1.4s var(--e)}
.cuarto.luces .tinte{opacity:0}
.cuarto .rotulo{position:relative;z-index:7;text-align:center;margin-bottom:26px;height:44px}
.cuarto .rotulo p{font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;
  color:rgba(255,214,206,.75)}
.cuarto .rotulo b{display:block;font-family:'Bodoni Moda',serif;font-style:italic;font-weight:400;
  font-size:23px;color:#FFEDE8;margin-top:8px}
/* la bandeja donde se apilan las copias */
.bandeja{position:relative;z-index:5;width:min(70vw,286px);aspect-ratio:3/4}
.copia{position:absolute;inset:0;border-radius:2px;overflow:hidden;background:#EDE6DA;
  padding:7px 7px 26px;box-shadow:0 22px 55px rgba(0,0,0,.65);
  opacity:0;transform:translateY(-22px) scale(.96) rotate(var(--giro,0deg));
  transition:opacity .55s var(--e),transform .85s var(--e)}
.copia.puesta{opacity:1;transform:translateY(0) scale(1) rotate(var(--giro,0deg))}
/* la imagen sube desde el papel: primero sombras lavadas, después los negros */
.copia img{width:100%;height:100%;object-fit:cover;display:block;
  opacity:.05;filter:brightness(2.3) contrast(.16) saturate(.2);
  transition:opacity 2.4s ease-out,filter 2.6s ease-out}
.copia.revelada img{opacity:1;filter:none}
.cuarto .saltear{position:absolute;z-index:7;bottom:calc(26px + env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,214,206,.55);opacity:0;transition:opacity .6s}
.cuarto .saltear.visible{opacity:1}
/* al apagarse, el cartel y el "saltear" se van primero: si no, quedan
   encima del título del álbum que ya está apareciendo detrás */
.cuarto.saliendo .rotulo,.cuarto.saliendo .saltear{opacity:0;transition:opacity .3s}

/* ── galería ── */
.tabs{display:flex;gap:10px;justify-content:center;margin:22px 0 6px}
.tabs button{padding:9px 18px;border:1px solid var(--hilo2);border-radius:20px;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tabs button[aria-pressed=true]{color:#0A0806;background:var(--oro);border-color:var(--oro)}
.grilla{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 4px 30px}
.grilla figure{margin:0;position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#111;
  opacity:0;filter:blur(14px);transform:scale(.96);transition:opacity .9s var(--e),filter .9s var(--e),transform .9s var(--e)}
.grilla figure.rev{opacity:1;filter:blur(0);transform:none}
/* ── la foto que todavía no llegó ──
   Antes el hueco quedaba negro y la foto aparecía de golpe: con el wifi
   de un salón, un álbum de cien fotos era una pared de agujeros. Ahora
   late suave hasta que carga, y la imagen entra con un fundido. Es CSS
   solo: no hay un estado más que mantener en el JavaScript.
   El brillo se apaga con "menos movimiento" y bajo el fundido, no queda
   latiendo para siempre en la pantalla de alguien. */
@keyframes lateFoto{0%,100%{opacity:.35}50%{opacity:.75}}
.grilla figure::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(217,174,114,.10) 50%,transparent 70%),#111;
  animation:lateFoto 1.6s ease-in-out infinite}
.grilla figure:has(img[data-lista])::before{animation:none;opacity:0}
@supports not selector(:has(*)){
  .grilla figure::before{display:none}
  .grilla img{opacity:1}
}
.grilla img{width:100%;height:100%;object-fit:cover;position:relative;
  transition:opacity .45s var(--e)}
.grilla img:not([data-lista]){opacity:0}
@media(prefers-reduced-motion:reduce){
  .grilla figure::before{animation:none}
  .grilla img:not([data-lista]){opacity:1}
}
.grilla figure.mia{outline:2px solid var(--oro);outline-offset:-2px}
.grilla figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:10px;
  background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);color:#EFE7DA}
.grilla figure{cursor:zoom-in}

/* ── visor a pantalla completa ── */
.visorf{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;
  animation:aparece .25s var(--e)}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.visorf .barra{display:flex;align-items:center;gap:10px;padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top))}
.visorf .barra .sep{flex:1}
.visorf .redondo{width:40px;height:40px;border-radius:50%;border:1px solid var(--gris);
  display:flex;align-items:center;justify-content:center;color:var(--texto);background:rgba(255,255,255,.04)}
.visorf .redondo svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.visorf .marco{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:0 8px}
.visorf .marco img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.visorf .flecha{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
  border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:var(--texto);
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.visorf .flecha.izq{left:10px} .visorf .flecha.der{right:10px}
.visorf .pie{text-align:center;padding:14px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom));
  font-size:12.5px;color:var(--mute);letter-spacing:.12em}
.visorf .pie b{display:block;color:var(--texto);font-family:'Bodoni Moda',serif;font-style:italic;
  font-size:16px;letter-spacing:0;margin-bottom:4px}
</style>
</head>
<body>
<div id="brillo"></div><div id="grano"></div>
<div id="app"><div class="centro"><p class="espaciado">Cargando…</p></div></div>
<script>
/* ═══════════════════════════════════════════════════════════
   CÁMARA DESCARTABLE · comparte el mismo Supabase que app.html.
   Nadie ve ninguna foto —ni siquiera quien la sacó— hasta que se
   revela el rollo del evento. Ver sql/rollo.sql.
   ═══════════════════════════════════════════════════════════ */
const NUBE = {
  url:  'https://kuqlqgrwsospwjexodqa.supabase.co',
  clave:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cWxxZ3J3c29zcHdqZXhvZHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjMyMjAsImV4cCI6MjEwNDEzOTIyMH0.DyV3K6fcHcsD9wbNzkYn2vIwWSN9e2LWt_HyuSaUE9g'
};
/* ══════════ modo demostración ══════════
   Con ?demo=1 la app no toca Supabase ni el almacenamiento del navegador:

const ESTRELLA='<span class="estrella"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.7 7.6L22 12l-7.3 3.4L12 23l-2.7-7.6L2 12l7.3-3.4z"/></svg></span>';

/* Los mismos cuatro que el muro: si cambia la paleta, cambia en los dos.
   Es una lista corta a propósito y no un selector libre de color — con uno
   libre el organizador puede elegir un tono que deje el texto ilegible
   sobre el negro, y eso no lo agarra ninguna prueba porque el color no
   está en el código, está en la base. */
/* "h" es el mismo color más hondo, el otro extremo del degradé del
   disparador. El del oro es el que estaba escrito a mano desde siempre y
   se deja igual: es el aspecto actual de todo y ya pasó por la prueba de
   contraste. Los otros tres salen de masHondo(). */
const TONOS=[{n:'Oro',          c:'#D9AE72', h:'#A87B43'},
             {n:'Perla',        c:'#E8E4DC', h:'#B6A990'},
             {n:'Rosa antiguo', c:'#D8A0A6', h:'#B95560'},
             {n:'Salvia',       c:'#9FB39B', h:'#6D8968'}];
/* El mismo color, más hondo. Se baja la LUMINOSIDAD y se dejan el tinte y
   la saturación: multiplicar los tres canales por un número apaga el color
   además de oscurecerlo, y el dorado quedaba barroso. */
const masHondo=(hex,cuanto)=>{
  const n=parseInt(String(hex||'').replace('#',''),16);
  if(!Number.isFinite(n)) return hex;
  const r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  let h=0, sa=0;
  if(d){
    sa=d/(1-Math.abs(2*l-1));
    h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4);
    h*=60;
  }
  const L=Math.max(0,Math.min(1,l*cuanto));
  const c=(1-Math.abs(2*L-1))*sa, x=c*(1-Math.abs((h/60)%2-1)), mm=L-c/2;
  const [rr,gg,bb]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]
                   :h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  const q=v=>Math.round((v+mm)*255).toString(16).padStart(2,'0');
  return '#'+q(rr)+q(gg)+q(bb);
};
/* El color de la fiesta. Cambia el acento Y su versión honda: el
   disparador es un degradé de las dos, y con solo el acento cambiado el
   botón quedaba de dorado a verde en el mismo círculo. */
const tono=t=>{
  const c=t||'#D9AE72';
  const r=document.documentElement.style;
  const enPaleta=TONOS.find(x=>x.c.toLowerCase()===String(c).toLowerCase());
  r.setProperty('--oro', c);
  /* De la paleta si está —son valores mirados uno por uno— y calculado si
     viene cualquier otra cosa de la base, que no debería pero puede. */
  r.setProperty('--oro-hondo', (enPaleta&&enPaleta.h) || masHondo(c,.72));
};
/* Solo dejamos pasar lo que parezca un archivo real: si alguien mete texto

const cssUrl=u=>urlSegura(u).replace(/["'()\\\s]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));
/* Los 90 días viven en los dos archivos (ver DIAS_QUE_VIVE en muro.html).

const bonito=f=>{
  if(!f) return '';

               'septiembre','octubre','noviembre','diciembre'];
  const mes=meses[Number(p[1])-1];

};

/* ══════════ claves ══════════

/* ── la clave maestra ──
   La base ya la acepta para cualquier evento: ce_permitido la chequea
   ANTES que la del evento. El que no la mandaba era este archivo, así que
   un rollo solo se podía manejar desde el teléfono donde se creó.
   Vive en sessionStorage y se va al cerrar la pestaña, igual que en el
   muro. NUNCA en localStorage: guardarla ahí, mezclada entre las claves
   de los eventos, es dejar la llave del negocio entero escrita en el
   disco de cualquier teléfono donde se haya entrado una vez. */
let claveMaestra = guarda.leerSesion('ce:maestra') || '';
const claveDe=c=>claveMaestra||clavesGuardadas()[c]||'';
/* clave corta, sin letras que se confundan al dictarla por teléfono */
const nuevaClave=()=>{
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const n=new Uint32Array(6);
  /* Sin crypto, n.fill(Date.now()) ponía el MISMO número seis veces: la
     clave salía "KKKKKK". Cada letra se sortea por su cuenta. */
  try{ crypto.getRandomValues(n); }
  catch(e){ for(let i=0;i<n.length;i++) n[i]=Math.floor(Math.random()*4294967296); }
  return [...n].map(x=>abc[x%abc.length]).join('');
};
const TIPOS={'XV':'QUI','Casamiento':'BOD','Cumpleaños':'CUM','Evento':'COR'};

/* ══════════ la hora ══════════
   El input de fecha y hora devuelve la hora del reloj de la pared, sin
   zona: "2026-09-14T02:00". Si eso viaja tal cual a una columna
   timestamptz, Postgres la interpreta en UTC, y acá (UTC-3) se adelanta
   tres horas. Un revelado puesto para las 2 de la mañana se disparaba a
   las 11 de la noche; y uno puesto para hoy a la tarde YA HABÍA PASADO,
   así que el rollo nacía revelado: el invitado entraba y en vez de la
   cámara le aparecía el álbum vacío. */
const aUTC=v=>{ if(!v) return null; const d=new Date(v); return isNaN(d)?null:d.toISOString(); };
/* Lo que escribió en el datetime-local, dicho en palabras y en la hora de
   acá. Nada de toISOString: eso devuelve UTC y después de las nueve de la
   noche en Rosario ya es el día siguiente. */
const aLindo=v=>{
  if(!v) return '';
  const d=new Date(v); if(isNaN(d)) return '';
  const dd=x=>String(x).padStart(2,'0');
  return `${bonito(`${d.getFullYear()}-${dd(d.getMonth()+1)}-${dd(d.getDate())}`)}`
       + ` a las ${dd(d.getHours())}:${dd(d.getMinutes())}`;
};
const aLocal=iso=>{
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  const c=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${c(d.getMonth()+1)}-${c(d.getDate())}T${c(d.getHours())}:${c(d.getMinutes())}`;
};
const yaPaso=v=>{ const d=new Date(v); return !isNaN(d) && d.getTime()<=Date.now(); };
/* Ojo: toISOString() da la fecha EN UTC. Acá (UTC-3) después de las 9 de
   la noche eso ya es mañana, y el formulario proponía el día equivocado. */
const hoy=()=>{ const d=new Date(), c=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${c(d.getMonth()+1)}-${c(d.getDate())}`; };
/* cupo de fotos: si la columna quedó vacía, vale lo de una descartable */
const cupoDe=e=>{ const k=Number(e&&e.cupo); return Number.isFinite(k)&&k>0?k:24; };
/* ── el código, como lo escribe una persona ──
   Minúscula, sin el guión, o solo los seis del final: todo tiene que
   entrar igual. El invitado lo lee del cartel de la mesa con el teléfono
   en una mano. Mismo criterio que en muro.html; si cambia, cambia en los
   dos. Los prefijos van de más largo a más corto: si no, "DEMO-FIESTA" se
   partiría como "DEM-OFIESTA". */
const PREFIJOS=['DEMO','QUI','BOD','CUM','COR','EVE'].sort((a,b)=>b.length-a.length);
const normalizarCodigo=v=>{
  /* El guión que la persona SÍ escribió no se toca nunca: sacarlo rompe
     cualquier código cuyo prefijo no esté en la lista —"TEST-1" quedaba
     "TEST1"— y eso es destruir un dato bueno. Solo lo AGREGAMOS cuando
     falta y reconocemos el prefijo. */
  const s=String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9-]/g,'')
    .replace(/^-+|-+$/g,'');
  if(s.includes('-')) return s;
  for(const p of PREFIJOS) if(s.length>p.length && s.startsWith(p)) return p+'-'+s.slice(p.length);
  return s;
};
/* Si vino solo la parte del final, se prueban los prefijos. */
async function resolverCodigo(v){
  const s=normalizarCodigo(v);
  if(!s) return null;
  if(s.includes('-')) return (await eventoPorCodigo(s,'codigo').catch(()=>null)) ? s : null;
  for(const p of PREFIJOS){
    const c=p+'-'+s;
    try{ if(await eventoPorCodigo(c,'codigo')) return c; }catch(e){}
  }
  return null;
}

/* un identificador al azar que no depende de que exista crypto */
const nuevoId=()=>{
  try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
};
/* En demostración el link tiene que quedarse acá: si mandara al dominio de
   verdad, "Ver el álbum" te sacaba de la demostración a un evento que en la
   base no existe. */
const enlaceDelRollo=(c,rev)=>HAY_DEMO
  ? `${location.origin}${location.pathname}?e=${encodeURIComponent(c)}&demo=1${rev?'&rev=1':''}`
  : `https://clicketerno.com.ar/rollo?e=${c}`;

/* ── cliente mínimo de Supabase (sin librerías) ── */
/* ══════════ reintentar una subida que se cortó ══════════
   Tres piezas chicas que usan el muro y el rollo igual. Si cambian, cambian
   en los dos. */
/* El mensaje solo no alcanza para decidir: hay que saber con qué contestó
   el servidor. 0 = ni contestó (se cortó la red o se agotó el tiempo). */
const conEstado=(e,estado)=>{ e.estado=estado; return e; };
/* Se vuelve a intentar lo que puede andar la próxima: un corte, un tiempo
   agotado, un 5xx (el servidor se cayó) o un 429 (pedí demasiado rápido).
   Un 4xx es una negativa y no cambia por insistir. */
/* "Ya estaba" es un ÉXITO, no un error: quiere decir que el intento
   anterior SÍ entró y lo que se perdió fue la respuesta. Misma definición
   que en muro.html (ahí lo usa anotarItem con el 23505 de ce_items): si
   cambia, cambia en los dos. */
const yaEstaba=e=>/duplicate key|23505|already exists|duplicate/i.test((e&&e.message)||'')
  || (e&&e.estado===409);
const seVuelveAIntentar=e=>{
  const n=e&&typeof e.estado==='number'?e.estado:null;
  if(n===null) return false;              // no vino de una subida: no tocar
  return n===0 || n===408 || n===429 || n>=500;
};
/* Espera, y si el teléfono está sin señal espera a que vuelva en vez de
   gastar el intento al vidrio. El tope existe para no quedarse colgado
   para siempre: al invitado hay que contestarle algo. */
const esperarRed=(ms,tope=20000)=>new Promise(listo=>{
  const dormir=()=>setTimeout(listo,ms);
  if(typeof navigator==='undefined'||navigator.onLine!==false) return dormir();
  let hecho=false;
  const seguir=()=>{ if(hecho) return; hecho=true;
    window.removeEventListener('online',seguir); clearTimeout(t); dormir(); };
  const t=setTimeout(seguir,tope);
  window.addEventListener('online',seguir);
});

const SB = {
  cab(extra, clave){
    const c=Object.assign({apikey:NUBE.clave, Authorization:'Bearer '+NUBE.clave,'Content-Type':'application/json'}, extra||{});
    if(clave) c['x-clave']=clave;      // la valida la base, el navegador solo la lleva
    return c;
  },
  async pedir(ruta,opciones){
    /* El estado viaja pegado al error (ver conEstado): ver el comentario
       igual en muro.html. */
    let r;
    try{ r = await fetch(NUBE.url+ruta, opciones); }
    catch(e){ throw conEstado(new Error(e&&e.message||'Failed to fetch'), 0); }
    const txt = await r.text();
    if(!r.ok){ let m=txt; try{ m=JSON.parse(txt).message||txt; }catch(e){}
      throw conEstado(new Error(m||('HTTP '+r.status)), r.status); }
    if(!txt) return null;
    try{ return JSON.parse(txt); }catch(e){ return null; }
  },
  /* La clave también en las lecturas: desde que ce_eventos dejó de ser de
     lectura libre, el organizador la necesita para ver su propio rollo. */
  ver(tabla,consulta,clave){ return this.pedir(`/rest/v1/${tabla}?${consulta}`, {headers:this.cab({},clave)}); },
  rpc(fn,args,clave){ return this.pedir(`/rest/v1/rpc/${fn}`, {method:'POST', headers:this.cab({},clave), body:JSON.stringify(args||{})}); },
  /* ALTA. Un insert pelado, sin "merge-duplicates": Postgres evalúa el
     WITH CHECK de la política de UPDATE en TODO "insert ... on conflict do
     update", haya conflicto o no. Esa política dice ce_permitido(codigo) y
     en el alta la clave todavía no existe para ella (el disparador la acaba
     de escribir, pero ce_permitido es STABLE y mira la foto del principio
     de la sentencia): el rollo nuevo rebotaba con "new row violates row
     level security policy". Medido contra Postgres 16 con el esquema de
     producción entero. Ver el mismo comentario en muro.html. */
  crear(tabla,obj,clave){
    return this.pedir(`/rest/v1/${tabla}`, {method:'POST',
      headers:this.cab({Prefer:'return=minimal'},clave), body:JSON.stringify(obj)});
  },
  editar(tabla,consulta,obj,clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {method:'PATCH',
      headers:this.cab({Prefer:'return=minimal'},clave), body:JSON.stringify(obj)});
  },
  /* Tres intentos. Acá importa más que en el muro: la foto YA le descontó
     una del cupo (ce_tomar_foto reserva antes de subir), así que perderla
     por un corte de dos segundos del wifi del salón es perderle una foto
     de verdad al invitado. Reintentar la MISMA ruta reservada no gasta
     otra: el cupo ya está tomado.
     Qué se reintenta y qué no: ver seVuelveAIntentar(). */
  async subir(ruta,blob){
    const ESPERAS=[1200,3500], ARRANQUE=Date.now(), TOPE_TOTAL=240000;
    let ultimo=null;
    for(let i=0;i<=ESPERAS.length;i++){
      /* Un tope de tiempo además del de intentos: cada intento ya puede
         tardar lo suyo y tres seguidos son una espera que al invitado le
         parece que se colgó. Pasados cuatro minutos se le contesta. */
      if(i && Date.now()-ARRANQUE > TOPE_TOTAL) break;
      if(i) await esperarRed(ESPERAS[i-1]);
      try{ return await this.unaSubida(ruta,blob); }
      catch(e){
        /* El wifi del salón se cortó DESPUÉS de que el archivo entró: se
           perdió la respuesta, no la foto. El reintento va a la misma ruta
           y el depósito contesta 409 "ya existe" — o sea que está arriba.
           Sale por el camino bueno: el cupo ya lo anotó ce_tomar_foto y
           pedir que la devuelvan sería borrarle una foto que tiene.
           Solo cuando YA intentamos (i>0): un 409 en el primer intento no
           es nuestro, es un choque de nombre, y ahí sí es un error. */
        if(i && yaEstaba(e)) return true;
        ultimo=e; if(!seVuelveAIntentar(e)) throw e; }
    }
    throw ultimo;
  },
  unaSubida(ruta,blob){
    return new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      x.open('POST', `${NUBE.url}/storage/v1/object/ce-rollos/${ruta}`);
      x.setRequestHeader('apikey',NUBE.clave);
      x.setRequestHeader('Authorization','Bearer '+NUBE.clave);
      x.setRequestHeader('Content-Type', blob.type||'image/jpeg');
      x.timeout=60000;
      x.onload=()=> (x.status>=200&&x.status<300) ? res(true)
        : rej(conEstado(new Error(x.responseText||('HTTP '+x.status)), x.status));
      x.onerror=()=>rej(conEstado(new Error('Failed to fetch'), 0));
      x.ontimeout=()=>rej(conEstado(new Error('La subida tardó demasiado'), 0));
      x.send(blob);
    });
  },
  /* De a 100. Un álbum de casamiento puede tener cientos de fotos y mandar
     todas las rutas en un solo pedido se cae (o lo corta el servidor). */
  async firmar(rutas){
    if(!rutas||!rutas.length) return {};
    const mapa={};
    for(let i=0;i<rutas.length;i+=100){
      const tanda=rutas.slice(i,i+100);
      const r = await this.pedir('/storage/v1/object/sign/ce-rollos', {
        method:'POST', headers:this.cab(), body:JSON.stringify({expiresIn:3600, paths:tanda})
      });
      (r||[]).forEach(x=>{ if(x&&x.signedURL&&x.path) mapa[x.path]=NUBE.url+'/storage/v1'+x.signedURL; });
    }
    /* Si una ruta no vuelve firmada (el archivo no se subió, o la regla del
       depósito no deja), queda FUERA del mapa. Quien llame tiene que mirar
       si está: antes se colaba un <img src=""> roto, y en el zip un archivo
       de texto disfrazado de .jpg. */
    return mapa;
  }
};

/* ── leer un evento sin tener su clave ──
   El invitado llega por el QR y no tiene clave: tiene que poder leer SU
   evento. Antes eso andaba porque la tabla era de lectura libre para todo
   el mundo, que es lo mismo que decir que cualquiera se bajaba la lista de
   las fiestas de todos los clientes con un solo pedido. Ahora la base la
   abre de a un código por vez, por función. Si la función todavía no está
   (blindaje.sql sin correr), se lee como antes: así la página anda igual
   antes y después, sin tener que sincronizar la subida con el SQL. */
let hayFuncionesNuevas = null;
async function eventoPorCodigo(cod, campos){
  if(hayFuncionesNuevas!==false){
    try{
      const v=await SB.rpc('ce_evento_publico',{p_codigo:cod});
      /* null = la función existe y ese código no. Un objeto con codigo = el
         evento. Cualquier otra cosa quiere decir que del otro lado no está
         la función que creemos. */
      if(v===null||(v&&typeof v==='object'&&!Array.isArray(v)&&v.codigo)){
        hayFuncionesNuevas=true; return v;
      }
      hayFuncionesNuevas=false;
    }catch(e){
      /* Pase lo que pase, se lee como se leía antes. Si la base ya está
         cerrada, ese camino devuelve vacío y el que decide es ella, no
         nosotros: lo que no puede pasar es que la pantalla muera acá. */
      if(/PGRST202|does not exist|not found|404/i.test(e&&e.message||'')) hayFuncionesNuevas=false;
    }
  }
  const r=await SB.ver('ce_eventos',
    `codigo=eq.${encodeURIComponent(cod)}&select=${campos||'*'}`);
  return (r&&r[0])||null;
}
/* Con la clave en la mano se lee derecho de la tabla, que es lo que la base
   deja hacer al organizador. */
async function eventoConClave(cod){
  const r=await SB.ver('ce_eventos',
    `codigo=eq.${encodeURIComponent(cod)}&select=*`, claveDe(cod));
  if(r&&r[0]) return r[0];
  return await eventoPorCodigo(cod);
}

/* ══════════ la fiesta que no existe ══════════
   Todo lo que sigue reemplaza a Supabase cuando entra ?demo=1. Ni un dato
   real, ni un pedido a la red: el que toca "ver una demostración" en la web
   recorre la app entera sin poder llegar a un evento de nadie.

   El rollo arranca ABIERTO y con fotos ya sacadas, para que se vean las dos
   mitades del producto: el organizador revela y ahí mismo aparece el álbum. */
if(HAY_DEMO){
  const NOMBRES=['Delfina','Tomás','Mica','Abuela Nélida','Francisco','Lucía',
                 'Nacho','Sofía','Tío Beto','Caro','Juampi','Las primas'];
  const ev={
    codigo:DEMO_COD, nombre:'Los 15 de Delfina', tipo:'XV', tono:'#D9AE72',
    fecha:hoy(), camara:true, cerrado:false,
    /* Nace REVELADO: lo que hay que mostrar es el álbum, que es el momento
       del producto. Con ?camara=1 nace sin revelar y se ve el otro lado,
       cómo el invitado gasta sus fotos sin ver ninguna. */
    revelado: !/(?:^|[?&])camara=1(?:&|$)/.test(location.search), revela_en:null,
    portada:null, cupo_fotos:24, creado:new Date().toISOString()
  };
  /* Las fotos de los invitados de mentira: ruta, quién la sacó y con qué
     filtro. La imagen recién se dibuja cuando alguien la pide. */
  const fotos=[];
  for(let i=0;i<14;i++)
    fotos.push({ruta:`${DEMO_COD}/demo${i%6}/${i}.jpg`, nombre:NOMBRES[i%6],
                filtro:['clasico','bn','flash','dorado','natural'][i%5], mia:false});
  /* Tres son "del que mira", para que la solapa "Tus fotos" del álbum tenga
     algo adentro y se entienda de qué se trata. Le quedan 21 en la cámara. */
  const MIAS=3;
  for(let i=0;i<MIAS;i++){ fotos[i].mia=true; fotos[i].nombre='Vos'; }
  let misDisparos=MIAS;
  /* El que entra a probar ya "estuvo en la fiesta": tiene su rollo con esas
     tres fotos. Así cae en el álbum sin que le preguntemos el nombre. */
  const TOKEN_DEMO='demo-invitado-01';

  const urls={};                       // ruta -> blob: de este navegador
  const dormir=ms=>new Promise(r=>setTimeout(r,ms));   // que se note que viaja

  /* Una foto de fiesta dibujada a mano: luces desenfocadas sobre un fondo
     oscuro. Es lo mismo que hace el muro para su ejemplo. */
  function fotoInventada(semilla){
    let x=semilla*9301+49297;
    const rnd=()=>((x=(x*9301+49297)%233280)/233280);
    const vert=rnd()>.45;
    const c=document.createElement('canvas');
    c.width=vert?720:960; c.height=vert?960:720;
    const g=c.getContext('2d');
    const pares=[['#120E0A','#3B2A18'],['#0C0D14','#26313F'],['#160D10','#452028'],
                 ['#0E1210','#22332B'],['#141014','#3A2438']];
    const t=pares[semilla%pares.length];
    const f=g.createLinearGradient(0,0,c.width,c.height);
    f.addColorStop(0,t[0]); f.addColorStop(1,t[1]);
    g.fillStyle=f; g.fillRect(0,0,c.width,c.height);
    const luces=['#F3D9A6','#FFE9C4','#E8C79A','#FFF4DF','#D9AE72'];
    for(let i=0;i<30;i++){
      g.globalAlpha=.07+rnd()*.44;
      g.fillStyle=luces[Math.floor(rnd()*luces.length)];
      g.beginPath(); g.arc(rnd()*c.width,rnd()*c.height,6+rnd()*70,0,7); g.fill();
    }
    g.globalAlpha=1;
    const v=g.createRadialGradient(c.width/2,c.height/2,c.height*.2,
                                   c.width/2,c.height/2,c.height*.82);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.74)');
    g.fillStyle=v; g.fillRect(0,0,c.width,c.height);
    return c;
  }
  /* El álbum pide URLs firmadas y las mete en un <img> y en un fetch(): un
     blob: de este mismo navegador sirve para las dos cosas. */
  function urlDe(ruta,i){
    if(urls[ruta]) return urls[ruta];
    const c=fotoInventada(i+3);
    /* toDataURL es síncrono y no necesita esperar al toBlob: acá no importa
       el peso, son cinco imágenes en pantalla. */
    urls[ruta]=c.toDataURL('image/jpeg',.72);
    return urls[ruta];
  }
  const revelado=()=>!!ev.revelado || (ev.revela_en && new Date(ev.revela_en)<=new Date());
  const listado=()=>fotos.map(f=>({ruta:f.ruta,nombre:f.nombre,filtro:f.filtro}));

  Object.assign(SB,{
    /* La puerta a la red queda tapiada: si algo se olvidó de pasar por los
       métodos de acá abajo, revienta acá y se ve en las pruebas, en vez de
       irse callado a la base de verdad. */
    async pedir(){ throw new Error('demostración: no se sale a la red'); },
    async ver(tabla,consulta){
      await dormir(180);
      if(tabla!=='ce_eventos') return [];
      const q=String(consulta||'');
      /* Cualquier otro código no existe en la demostración: es justamente lo
         que no queremos que se pueda mirar desde acá. */
      if(/codigo=(eq|in)\./.test(q) && q.indexOf(DEMO_COD)<0) return [];
      return [Object.assign({},ev)];
    },
    async rpc(fn,args){
      await dormir(200);
      const a=args||{};
      /* la lectura del evento pasa por acá desde que la tabla se cerró */
      if(fn==='ce_evento_publico')
        return a.p_codigo===DEMO_COD ? Object.assign({},ev) : null;
      if(fn==='ce_mi_rollo')
        return {nombre:a.p_nombre||'Invitado', revelado:revelado(), cerrado:!!ev.cerrado,
                cupo:ev.cupo_fotos, disparos:misDisparos, revela_en:ev.revela_en};
      if(fn==='ce_tomar_foto'){
        if(misDisparos>=ev.cupo_fotos) throw new Error('Ya usaste todas tus fotos');
        misDisparos++;
        fotos.push({ruta:a.p_ruta,nombre:'Vos',filtro:a.p_filtro,mia:true});
        /* Y se devuelve sola, exactamente como si hubiera fallado la
           subida: el mismo camino que ya existe, no uno nuevo. */
        const suRuta=a.p_ruta;
        setTimeout(function(){
          const i=fotos.findIndex(f=>f.ruta===suRuta);
          if(i>=0){ fotos.splice(i,1); misDisparos=Math.max(0,misDisparos-1); }
        }, VIDA_DEMO);
        return {restantes:ev.cupo_fotos-misDisparos};
      }
      if(fn==='ce_devolver_foto'){
        const i=fotos.findIndex(f=>f.ruta===a.p_ruta);
        if(i>=0){ fotos.splice(i,1); misDisparos=Math.max(0,misDisparos-1); }
        return {restantes:ev.cupo_fotos-misDisparos};
      }
      if(fn==='ce_camara_stats')
        return {fotos:fotos.length, invitados:new Set(fotos.map(f=>f.nombre)).size};
      if(fn==='ce_album_de'){
        if(!revelado()) return {revelado:false};
        return {revelado:true, mias:listado().filter((f,i)=>fotos[i].mia),
                todas:listado(), total_fotos:fotos.length,
                total_invitados:new Set(fotos.map(f=>f.nombre)).size};
      }
      if(fn==='ce_album_pagina')
        return listado().slice(Number(a.p_desde)||0, (Number(a.p_desde)||0)+(Number(a.p_cuanto)||500));
      if(fn==='ce_revelar'||fn==='ce_revelar_rollo'){ ev.revelado=true; ev.revela_en=null; return {revelado:true}; }
      return null;
    },
    async crear(){ await dormir(150); return null; },
    async editar(tabla,consulta,obj){
      await dormir(180);
      if(tabla==='ce_eventos') Object.assign(ev,obj||{});
      return null;
    },
    async subir(ruta,blob){
      await dormir(260);
      urls[ruta]=URL.createObjectURL(blob);
      return true;
    },
    async firmar(rutas){
      await dormir(160);
      const mapa={};
      (rutas||[]).forEach(r=>{
        const i=fotos.findIndex(f=>f.ruta===r);
        if(i>=0) mapa[r]=urlDe(r,i);
      });
      return mapa;
    }
  });
  /* El que entra a mirar es "el organizador" de esta fiesta inventada: le
     damos la clave en memoria para que el panel se abra sin pedirla. */
  guardarClaveDe(DEMO_COD,'DEMO');
  /* Y su rollo, para caer derecho en el álbum. Se escribe a mano y no con
     guardarRollo(): esa función se declara más abajo en el archivo y este
     bloque corre antes, así que llamarla acá tira "Cannot access before
     initialization" y la app no arranca. */
  guarda.escribir('ce:rollo:'+DEMO_COD, JSON.stringify({token:TOKEN_DEMO,nombre:'Vos'}));
}

/* "grano" es cuánta textura de película lleva cada uno. Sin esto un filtro
   es apenas un cambio de color; el grano es lo que hace que parezca film. */
/* "corto" es el nombre que va debajo de la muestra en la tira: con el
   nombre entero, "Blanco y negro" envolvía a dos líneas y esa columna
   empujaba la tira más abajo que las otras cuatro, y los cinco no entraban
   en 390px sin scrollear. El nombre entero sigue estando en la ficha. */
const FILTROS=[
  {id:'natural', nombre:'Natural',        corto:'Natural', css:'none', grano:0,  muestra:'linear-gradient(135deg,#3a3a3a,#8a8a8a)'},
  {id:'clasico', nombre:'Clásico',        corto:'Clásico', css:'contrast(1.08) saturate(1.25) sepia(.22) brightness(1.03)', grano:14, muestra:'linear-gradient(135deg,#7a5a34,#d9ae72)'},
  {id:'bn',      nombre:'Blanco y negro', corto:'B y N',   css:'grayscale(1) contrast(1.15) brightness(1.05)', grano:20, muestra:'linear-gradient(135deg,#111,#ccc)'},
  {id:'flash',   nombre:'Flash',          corto:'Flash',   css:'contrast(1.28) brightness(1.15) saturate(.85)', grano:8,  muestra:'linear-gradient(135deg,#20242c,#eef2f8)'},
  {id:'dorado',  nombre:'Dorado',         corto:'Dorado',  css:'sepia(.35) saturate(1.4) hue-rotate(-8deg) contrast(1.05) brightness(1.02)', grano:16, muestra:'linear-gradient(135deg,#a87b43,#efdcbc)'}
];

/* ══════════ el filtro de la foto guardada ══════════
   La vista previa usa filtros CSS sobre el video, que andan en todos lados.
   Pero para la foto que QUEDA no se puede usar ctx.filter: Safari no lo
   tiene (bug abierto de WebKit desde 2019). En iPhone la foto se guardaba
   sin filtro y nadie se enteraba hasta el revelado.

   Así que la cuenta la hacemos nosotros, igual en todos los teléfonos: cada
   filtro CSS se convierte en una sola matriz de color y se aplica de una
   pasada. Son las mismas fórmulas que usa el navegador (Filter Effects
   Level 1), así que la foto sale igual a la vista previa. */
const LUM=[0.2126,0.7152,0.0722];
const mSaturacion=s=>[
  LUM[0]+(1-LUM[0])*s, LUM[1]*(1-s),        LUM[2]*(1-s),        0,
  LUM[0]*(1-s),        LUM[1]+(1-LUM[1])*s, LUM[2]*(1-s),        0,
  LUM[0]*(1-s),        LUM[1]*(1-s),        LUM[2]+(1-LUM[2])*s, 0];
const mGris=a=>mSaturacion(1-a);
const mSepia=a=>{ const s=1-a; return [
  0.393+0.607*s, 0.769-0.769*s, 0.189-0.189*s, 0,
  0.349-0.349*s, 0.686+0.314*s, 0.168-0.168*s, 0,
  0.272-0.272*s, 0.534-0.534*s, 0.131+0.869*s, 0]; };
const mTono=deg=>{ const r=deg*Math.PI/180, c=Math.cos(r), n=Math.sin(r); return [
  0.213+c*0.787-n*0.213, 0.715-c*0.715-n*0.715, 0.072-c*0.072+n*0.928, 0,
  0.213-c*0.213+n*0.143, 0.715+c*0.285+n*0.140, 0.072-c*0.072-n*0.283, 0,
  0.213-c*0.213-n*0.787, 0.715-c*0.715+n*0.715, 0.072+c*0.928+n*0.072, 0]; };
const mBrillo=k=>[k,0,0,0, 0,k,0,0, 0,0,k,0];
const mContraste=k=>{ const o=127.5*(1-k); return [k,0,0,o, 0,k,0,o, 0,0,k,o]; };

/* Lee el mismo texto CSS de la vista previa: una sola fuente de verdad.
   Devuelve una matriz POR filtro, no una sola combinada: el navegador
   recorta el color (0-255) entre filtro y filtro, y si combinamos todo en
   una cuenta sola las zonas quemadas o muy oscuras salen distintas. */
function matricesDe(css){
  const lista=[];
  if(!css||css==='none') return lista;
  const re=/([a-z-]+)\(([^)]+)\)/g; let x;
  while((x=re.exec(css))){
    const v=parseFloat(x[2]);
    if(isNaN(v)) continue;
    if(x[1]==='grayscale')       lista.push(mGris(v));
    else if(x[1]==='sepia')      lista.push(mSepia(v));
    else if(x[1]==='saturate')   lista.push(mSaturacion(v));
    else if(x[1]==='hue-rotate') lista.push(mTono(v));
    else if(x[1]==='brightness') lista.push(mBrillo(v));
    else if(x[1]==='contrast')   lista.push(mContraste(v));
  }
  return lista;
}
const lim=v=>v<0?0:v>255?255:v;
function aplicarFiltro(ctx,w,h,css,grano){
  const ms=matricesDe(css);
  const gr=grano||0;
  if(!ms.length && !gr) return;                 // "natural": no tocar nada
  const d=ctx.getImageData(0,0,w,h), p=d.data;
  for(let i=0;i<p.length;i+=4){
    let r=p[i], g=p[i+1], b=p[i+2];
    for(let k=0;k<ms.length;k++){
      const m=ms[k];
      const nr=lim(m[0]*r+m[1]*g+m[2]*b+m[3]);
      const ng=lim(m[4]*r+m[5]*g+m[6]*b+m[7]);
      const nb=lim(m[8]*r+m[9]*g+m[10]*b+m[11]);
      r=nr; g=ng; b=nb;
    }
    if(gr){
      /* Un solo valor para los tres canales: así es el grano de película
         (una partícula, no tres puntitos de color como el ruido digital). */
      const n=(Math.random()-.5)*gr;
      r=lim(r+n); g=lim(g+n); b=lim(b+n);
    }
    p[i]=r; p[i+1]=g; p[i+2]=b;
  }
  ctx.putImageData(d,0,0);
}

/* También el que llega por la dirección: alguien puede escribirla a mano, o
   copiarla mal, o pasarla por WhatsApp en minúscula. Se normaliza igual.
   normalizarCodigo está declarada arriba a propósito: este bloque corre en

  const campo=app.querySelector('#nombreG');
