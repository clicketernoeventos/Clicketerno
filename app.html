<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Click Eterno · Muro en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
:root{
  --negro:#000; --carbon:#0B0A08; --humo:#141210;
  --oro:#D9AE72; --oro-hondo:#A87B43; --champan:#EFDCBC;
  --texto:#F6F2EA; --mute:#8A8177;
  --hilo:rgba(217,174,114,.22); --hilo2:rgba(217,174,114,.45); --gris:rgba(255,255,255,.08);
  --acc:#D9AE72;
  --e:cubic-bezier(.22,.7,.24,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--negro);color:var(--texto)}
body{font-family:Jost,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
button,input,textarea,select{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.serif{font-family:'Bodoni Moda',serif}
.ital{font-family:'Bodoni Moda',serif;font-style:italic}
.wrap{max-width:620px;margin:0 auto;padding:0 26px 130px}

/* ── firma tipográfica de la marca ── */
.espaciado{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);font-weight:300}
.dorado{color:var(--oro)}

/* ── estrella de la marca ── */
.estrella{display:inline-block;vertical-align:middle}
.estrella svg{display:block;width:100%;height:100%}
.filete{display:flex;align-items:center;gap:14px;margin:28px 0;color:var(--oro)}
.filete:before,.filete:after{content:'';height:1px;background:linear-gradient(90deg,transparent,var(--hilo2),transparent);flex:1}
.filete .estrella{width:13px;height:13px;opacity:.9}

/* ── atmósfera ── */
#brillo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%,rgba(217,174,114,.09),transparent 60%),
             radial-gradient(80% 60% at 50% 110%,rgba(217,174,114,.05),transparent 60%)}
#polvo{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#polvo i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--oro);
  opacity:0;animation:titilar 7s var(--e) infinite}
@keyframes titilar{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:.55;transform:scale(1)}}
#grano{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.045;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:3}

/* ── portada ── */
.portada{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:60px 26px;max-width:620px;margin:0 auto;text-align:center}
.logo-full{width:min(78%,320px);margin:0 auto 6px;display:block}
.portada .lema{font-size:15px;line-height:1.8;color:#B5AC9E;max-width:34ch;margin:0 auto}
.sube{opacity:0;transform:translateY(16px);animation:sube 1s var(--e) forwards}
@keyframes sube{to{opacity:1;transform:none}}

.puertas{display:grid;gap:0;margin-top:14px;text-align:left;border-top:1px solid var(--gris)}
.puerta{display:flex;align-items:center;gap:18px;width:100%;padding:22px 4px;border-bottom:1px solid var(--gris);transition:padding-left .35s var(--e),color .35s}
.puerta:hover,.puerta:focus-visible{padding-left:12px}
.puerta .rom{font-family:'Bodoni Moda',serif;font-style:italic;font-size:22px;color:var(--oro);width:28px;flex:none}
.puerta b{display:block;font-weight:400;font-size:17px;letter-spacing:.02em}
.puerta span{display:block;font-size:13.5px;color:var(--mute);margin-top:4px;line-height:1.5}
.puerta .fl{color:var(--oro);opacity:0;transition:opacity .35s;font-size:15px}
.puerta:hover .fl{opacity:1}

/* ── barra superior ── */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:18px 26px;
  background:rgba(0,0,0,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--gris)}
.top .vuelve{color:var(--oro);font-size:19px;line-height:1;padding:2px 4px 4px 0}
.top h2{font-size:15px;font-weight:400;flex:1;letter-spacing:.03em}
.top .sub{display:block;font-size:10px;letter-spacing:.3em;color:var(--mute);margin-top:3px;text-transform:uppercase}
.top .marca{width:74px;opacity:.55}

/* ── formularios ── */
.campo{margin-bottom:22px}
.campo label{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--mute);margin-bottom:10px;text-transform:uppercase}
input[type=text],input[type=date],textarea,select{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--gris);
  border-radius:0;padding:12px 2px;font-size:16.5px;font-weight:300;transition:border-color .3s}
textarea{min-height:88px;resize:vertical;line-height:1.6;border:1px solid var(--gris);border-radius:2px;padding:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--oro)}
select{appearance:none;background:transparent}
option{background:#0B0A08}
.tonos{display:flex;gap:14px;padding-top:4px}
.tono{width:34px;height:34px;border-radius:50%;position:relative;transition:transform .3s var(--e)}
.tono:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid transparent;transition:border-color .3s}
.tono[aria-pressed=true]:after{border-color:var(--oro)}
.tono[aria-pressed=true]{transform:scale(1.05)}

.oro-btn{width:100%;background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 55%,var(--champan));
  color:#0A0806;border-radius:2px;padding:17px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;
  transition:transform .25s var(--e),filter .3s}
.oro-btn:hover{filter:brightness(1.08)}
.oro-btn:active{transform:scale(.99)}
.oro-btn:disabled{filter:grayscale(.7);opacity:.5}
.hilo-btn{width:100%;border:1px solid var(--hilo);border-radius:2px;padding:15px;font-size:12px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--champan);margin-top:12px;transition:border-color .3s,color .3s}
.hilo-btn:hover{border-color:var(--oro);color:var(--oro)}
.pie-nota{font-size:12.5px;color:var(--mute);line-height:1.7;text-align:center;margin-top:22px}

/* ── segmentado ── */
.seg{display:flex;border-bottom:1px solid var(--gris);margin-bottom:26px}
.seg button{flex:1;padding:14px 4px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
  border-bottom:1px solid transparent;margin-bottom:-1px;transition:.3s}
.seg button[aria-pressed=true]{color:var(--oro);border-bottom-color:var(--oro)}

/* ── invitado ── */
.consigna{border:1px solid var(--hilo);border-radius:2px;padding:20px;margin-bottom:26px;text-align:center;background:rgba(217,174,114,.035)}
.consigna .et{font-size:9.5px;letter-spacing:.34em;color:var(--oro);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px}
.consigna .et .estrella{width:9px;height:9px}
.consigna p{font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.45;font-style:italic}

.lente{display:block;border:1px solid var(--gris);border-radius:2px;padding:52px 22px;text-align:center;
  margin-bottom:24px;transition:border-color .4s,background .4s}
.lente:hover{border-color:var(--hilo2);background:rgba(217,174,114,.03)}
.lente .aro{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--hilo);display:grid;place-items:center;color:var(--oro)}
.lente .aro .estrella{width:17px;height:17px}
.lente b{display:block;font-family:'Bodoni Moda',serif;font-size:21px;font-weight:400;margin-bottom:8px}
.lente span{font-size:13.5px;color:var(--mute)}
.previa{position:relative;overflow:hidden;margin-bottom:24px;border:1px solid var(--gris)}
.previa img,.previa video{width:100%;display:block;max-height:56vh;object-fit:contain;background:#000}
.previa .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1px solid var(--hilo);color:var(--champan);backdrop-filter:blur(6px)}
.onda{display:inline-flex;gap:3px;align-items:flex-end;height:15px;vertical-align:middle;margin-right:10px}
.onda i{width:2px;background:var(--oro);border-radius:2px;animation:onda .9s ease-in-out infinite}
@keyframes onda{0%,100%{height:4px}50%{height:15px}}

/* ── momento click ── */
.momento{min-height:100svh;display:grid;place-items:center;text-align:center;padding:34px}
.chispas{position:relative;width:130px;height:130px;margin:0 auto 34px}
.chispas .estrella{position:absolute;color:var(--oro);opacity:0}
.chispas .c1{width:42px;height:42px;left:44px;top:44px;animation:chispa 1.1s var(--e) .05s forwards}
.chispas .c2{width:17px;height:17px;left:8px;top:24px;animation:chispa 1s var(--e) .28s forwards}
.chispas .c3{width:12px;height:12px;right:14px;top:16px;animation:chispa 1s var(--e) .42s forwards}
.chispas .c4{width:15px;height:15px;right:26px;bottom:14px;animation:chispa 1s var(--e) .56s forwards}
.chispas .c5{width:9px;height:9px;left:22px;bottom:24px;animation:chispa 1s var(--e) .68s forwards}
@keyframes chispa{0%{opacity:0;transform:scale(.2) rotate(-40deg)}60%{opacity:1;transform:scale(1.15) rotate(6deg)}100%{opacity:.95;transform:scale(1) rotate(0)}}

/* ── proyección ── */
.sala{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.tela{flex:1;position:relative;overflow:hidden}
.toma{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.4s var(--e)}
.toma.on{opacity:1}
.toma img,.toma video{width:100%;height:100%;object-fit:cover}
.toma.encaja img,.toma.encaja video{object-fit:contain}
.kb img{animation:kb 26s var(--e) forwards}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.17) translate(-1.2%,-1.2%)}}
.revelar img,.revelar video{animation:revelar 2.6s var(--e) forwards}
@keyframes revelar{
  0%{filter:blur(28px) saturate(0) brightness(1.75) contrast(.75);transform:scale(1.13)}
  55%{filter:blur(6px) saturate(.55) brightness(1.1)}
  100%{filter:none;transform:scale(1.03)}}
.destello{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.destello.va{animation:destello .6s ease-out}
@keyframes destello{0%{opacity:.8}100%{opacity:0}}
.vineta{position:absolute;inset:0;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 220px 60px rgba(0,0,0,.72)}
.epigrafe{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:130px 46px 40px;
  background:linear-gradient(transparent,rgba(0,0,0,.92) 66%)}
.epigrafe .recien{display:inline-flex;align-items:center;gap:11px;font-size:10px;letter-spacing:.4em;
  color:var(--oro);text-transform:uppercase;margin-bottom:18px}
.epigrafe .recien .estrella{width:11px;height:11px;animation:gira 3.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.epigrafe .quien{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(30px,5.6vw,52px);color:var(--champan);line-height:1}
.epigrafe .dice{font-size:clamp(15px,2.4vw,21px);margin-top:12px;color:#D9D2C6;line-height:1.5;max-width:38ch;font-weight:200}
.placa{padding:9vh 9vw;text-align:center;max-width:1200px}
.placa .cita{font-family:'Bodoni Moda',serif;font-size:clamp(28px,4.4vw,54px);line-height:1.3}
.placa .quien{margin-top:30px;font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(19px,2.4vw,28px);color:var(--oro)}
.mosaico{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.mosaico img{width:100%;height:100%;object-fit:cover;opacity:0;animation:asoma .9s var(--e) forwards}
@keyframes asoma{to{opacity:1}}
.consola{display:flex;align-items:center;gap:22px;padding:18px 30px;border-top:1px solid var(--gris);background:#000}
.consola .nom{font-family:'Bodoni Moda',serif;font-style:italic;font-size:23px;flex:1}
.envivo{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.34em;color:var(--oro);text-transform:uppercase}
.pulso{width:6px;height:6px;border-radius:50%;background:var(--oro);box-shadow:0 0 10px var(--oro);animation:late 2s infinite}
@keyframes late{50%{opacity:.25}}
.cuenta{font-family:'Bodoni Moda',serif;font-size:25px}
.cuenta small{font-family:Jost;font-size:9.5px;letter-spacing:.28em;color:var(--mute);margin-left:10px;text-transform:uppercase}
.qr-sala{background:#fff;padding:6px;line-height:0}
.qr-sala img,.qr-sala canvas{width:56px;height:56px;display:block}
.dejar{position:fixed;top:18px;right:18px;z-index:60;border:1px solid var(--hilo);border-radius:2px;
  padding:9px 18px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--champan);background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.aguarda{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:34px}
.aguarda .ital{font-size:clamp(26px,5.4vw,46px);line-height:1.25;margin-top:22px}

/* ── panel ── */
.ficha{border:1px solid var(--gris);padding:26px}
.fila{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:20px 2px;border-bottom:1px solid var(--gris);transition:padding-left .35s var(--e)}
.fila:hover{padding-left:10px}
.fila .sello{width:44px;height:44px;flex:none;border:1px solid var(--hilo);display:grid;place-items:center;
  font-family:'Bodoni Moda',serif;font-style:italic;color:var(--oro);font-size:19px;overflow:hidden}
.fila b{font-weight:400;font-size:16px}
.fila span{display:block;font-size:11px;letter-spacing:.2em;color:var(--mute);margin-top:4px;text-transform:uppercase}
.clave{font-size:11.5px;letter-spacing:.18em;color:var(--oro)}
.qr-caja{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.qr-caja .qr{background:#fff;padding:11px;line-height:0}
.qr-caja .qr img,.qr-caja .qr canvas{width:106px;height:106px;display:block}
.llave{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:1px solid var(--gris)}
.llave p{font-size:15px}
.llave small{display:block;color:var(--mute);font-size:12.5px;margin-top:5px;line-height:1.6}
.palanca{width:46px;height:24px;border-radius:0;background:transparent;border:1px solid var(--gris);position:relative;flex:none;transition:border-color .3s}
.palanca:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--mute);transition:.35s var(--e)}
.palanca[aria-pressed=true]{border-color:var(--oro)}
.palanca[aria-pressed=true]:after{transform:translateX(22px);background:var(--oro)}
.cola{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.espera{border:1px solid var(--gris)}
.espera img,.espera video{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.espera .tx{padding:16px;font-size:14px;line-height:1.6;min-height:100px;font-family:'Bodoni Moda',serif;font-style:italic}
.espera .par{display:flex;border-top:1px solid var(--gris)}
.espera .par button{flex:1;padding:12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.espera .par button+button{border-left:1px solid var(--gris)}
.si{color:var(--oro)}.no{color:#8A8177}
.cifras4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--gris);border-bottom:1px solid var(--gris);margin:30px 0}
.cifras4 div{padding:20px 6px;text-align:center;border-right:1px solid var(--gris)}
.cifras4 div:last-child{border-right:0}
.cifras4 b{display:block;font-family:'Bodoni Moda',serif;font-size:28px;font-weight:400}
.cifras4 span{font-size:9px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:6px;display:block}

/* ── álbum ── */
.tapa{height:210px;position:relative;overflow:hidden;margin-bottom:76px}
.tapa .fondo{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.75) brightness(.75);transform:scale(1.08);animation:kbtapa 24s var(--e) forwards}
@keyframes kbtapa{to{transform:scale(1.18)}}
.tapa:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 20%,#000 92%)}
.tapa .medallon{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);width:132px;height:132px;
  border-radius:50%;overflow:hidden;border:1px solid var(--hilo2);z-index:3;background:var(--carbon)}
.tapa .medallon img{width:100%;height:100%;object-fit:cover}
.album h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(40px,11vw,52px);text-align:center;line-height:1}
.album .fecha{text-align:center;font-size:10.5px;letter-spacing:.42em;color:var(--mute);margin-top:16px}
.cifras{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--gris);margin:34px 0}
.cifra{padding:30px 10px;text-align:center;border-bottom:1px solid var(--gris)}
.cifra:nth-child(odd){border-right:1px solid var(--gris)}
.cifra span{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--mute);margin-bottom:14px;text-transform:uppercase}
.cifra b{font-family:'Bodoni Moda',serif;font-size:46px;font-weight:400;line-height:1}
.cifra.cero b,.cifra.cero span{color:#3A362F}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.rejilla a{aspect-ratio:1;overflow:hidden;background:var(--humo);display:block;position:relative}
.rejilla img,.rejilla video{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--e),filter .5s}
.rejilla a:hover img{transform:scale(1.06);filter:brightness(1.08)}
.dedicatoria{padding:8px 0 8px 22px;border-left:1px solid var(--hilo);margin:26px 0}
.dedicatoria p{font-family:'Bodoni Moda',serif;font-size:20px;line-height:1.55;font-style:italic}
.dedicatoria b{display:block;font-family:'Bodoni Moda',serif;font-weight:400;color:var(--oro);font-size:16px;margin-top:12px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:38px 0 18px}
.acciones button{border:1px solid var(--hilo);padding:17px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--champan);transition:.3s}
.acciones button:hover{border-color:var(--oro);color:var(--oro)}
.pie-marca{text-align:center;padding:50px 0 20px;opacity:.4}
.pie-marca img{width:120px}

.final{min-height:100svh;display:grid;place-items:center;text-align:center;padding:34px}
.vacio{text-align:center;color:var(--mute);padding:70px 24px;line-height:1.8;font-size:14.5px}
.recado{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);z-index:90;background:#0B0A08;
  border:1px solid var(--hilo);padding:14px 24px;font-size:13px;letter-spacing:.06em;opacity:0;
  transition:.35s var(--e);pointer-events:none;max-width:92vw;text-align:center}
.recado.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.cartel-hoja{max-width:420px;margin:34px auto;border:1px solid var(--hilo);padding:44px 34px;text-align:center;background:#000}
.cartel-hoja .marca-c{width:150px;opacity:.95;margin-bottom:26px}
.cartel-hoja .nombre-c{font-family:'Bodoni Moda',serif;font-style:italic;font-size:34px;line-height:1}
.cartel-hoja .fecha-c{font-size:10px;letter-spacing:.4em;color:var(--mute);margin-top:12px;text-transform:uppercase}
.cartel-hoja .pedido{font-family:'Bodoni Moda',serif;font-size:22px;line-height:1.45;margin:30px 0}
.cartel-hoja .qr-c{background:#fff;padding:14px;display:inline-block;line-height:0}
.cartel-hoja .qr-c img,.cartel-hoja .qr-c canvas{width:186px;height:186px;display:block}
.cartel-hoja .instr{font-size:12px;letter-spacing:.16em;color:var(--mute);margin-top:22px;line-height:1.9;text-transform:uppercase}
.cartel-hoja .cod{font-size:11px;letter-spacing:.3em;color:var(--oro);margin-top:16px}
.porta-fila{display:flex;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--gris)}
.porta-fila .mini{width:62px;height:62px;flex:none;border:1px solid var(--hilo);object-fit:cover;background:var(--humo)}
.porta-fila .mini.vacia{display:grid;place-items:center;color:var(--oro);opacity:.5}
.porta-fila .mini.vacia .estrella{width:16px;height:16px}
@media print{
  @page{size:105mm 148mm;margin:0}
  #brillo,#polvo,#grano,.top,.acciones,.no-imprime{display:none!important}
  body{background:#fff;color:#111}
  .cartel-hoja{border:0;margin:0;width:105mm;height:148mm;padding:12mm 9mm;background:#000;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column;justify-content:center}
}
@media(min-width:820px){.rejilla{grid-template-columns:repeat(4,1fr)}}
</style>

const store={
  async get(k){
    if(window.storage) return JSON.parse((await window.storage.get(k,true)).value);
    if(!(k in memoria)) throw new Error('vacío');
    return JSON.parse(memoria[k]);
  },
  async set(k,v){ const s=JSON.stringify(v); memoria[k]=s; if(window.storage) await window.storage.set(k,s,true); }
};
const leer=async(k,def)=>{try{return await store.get(k);}catch(e){return def;}};
const kMeta=c=>`ce:${c}:meta`, kIndex=c=>`ce:${c}:index`, kItem=(c,i)=>`ce:${c}:i:${i}`;
const eventos=()=>leer(LISTA,[]);
const meta=c=>leer(kMeta(c),null);
const guardarMeta=m=>store.set(kMeta(m.codigo),m);
const indice=async c=>(await leer(kIndex(c),[])).sort((a,b)=>a.ts-b.ts);
async function item(c,id){
  const k=c+id; if(cacheItem[k]) return cacheItem[k];
  const v=await leer(kItem(c,id),null); if(v) cacheItem[k]=v; return v;
}
async function sumar(c,it){
  await store.set(kItem(c,it.id),it);
  const idx=await leer(kIndex(c),[]);
  idx.push({id:it.id,kind:it.kind,autor:it.autor,ts:it.ts,estado:it.estado});
  await store.set(kIndex(c),idx); cacheItem[c+it.id]=it;
}
async function cambiarEstado(c,id,estado){
  const idx=await leer(kIndex(c),[]); const f=idx.find(i=>i.id===id); if(f) f.estado=estado;
  await store.set(kIndex(c),idx);
  const it=await item(c,id); if(it){it.estado=estado; await store.set(kItem(c,id),it); cacheItem[c+id]=it;}
}

const leerArchivo=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
async function comprimir(file,max=1200,q=.62){
  const url=await leerArchivo(file);
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const e=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*e); c.height=Math.round(im.height*e);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>res(url); im.src=url;
  });
}
function fotoDemo(seed){
  let s=seed*9301+49297; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const vert=rnd()>.5;
  const c=document.createElement('canvas'); c.width=vert?760:1000; c.height=vert?1000:760;
  const x=c.getContext('2d');
  const pares=[['#120E0A','#3B2A18'],['#0C0D14','#26313F'],['#160D10','#452028'],['#0E1210','#22332B'],['#141014','#3A2438']];
  const t=pares[seed%pares.length];
  const g=x.createLinearGradient(0,0,c.width,c.height); g.addColorStop(0,t[0]); g.addColorStop(1,t[1]);
  x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
  const luces=['#F3D9A6','#FFE9C4','#E8C79A','#FFF4DF','#D9AE72'];
  for(let i=0;i<28;i++){
    x.globalAlpha=.08+rnd()*.42; x.fillStyle=luces[Math.floor(rnd()*luces.length)];
    x.beginPath(); x.arc(rnd()*c.width,rnd()*c.height,7+rnd()*72,0,7); x.fill();
  }
  x.globalAlpha=1;
  const v=x.createRadialGradient(c.width/2,c.height/2,c.height*.22,c.width/2,c.height/2,c.height*.8);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.72)');
  x.fillStyle=v; x.fillRect(0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.72);
}

async function vSubir(codigo){
  parar();
  const m=await meta(codigo); if(!m) return ir('invitado');
  tono(m.tono);
  if(m.cerrado) return vFinal(m);
  const lista=(m.consignas&&m.consignas.length)?m.consignas:CONSIGNAS;
  const consigna=lista[Math.floor(Date.now()/60000)%lista.length];
  let modo='captura', medio=null;

  app.innerHTML=`
  ${barra(esc(m.nombre),'Subí al muro')}
  <div class="wrap" style="padding-top:28px">
    <div class="consigna"><div class="et">${ESTRELLA} Consigna de la noche ${ESTRELLA}</div><p>${esc(consigna)}</p></div>
    <div class="seg">
      <button data-m="captura" aria-pressed="true">Foto</button>
      <button data-m="texto" aria-pressed="false">Dedicatoria</button>
      <button data-m="voz" aria-pressed="false">Voz</button>
    </div>
    <div id="zona"></div>
    <div class="campo"><label for="autor">Tu nombre</label>
      <input id="autor" type="text" placeholder="Como querés que salga en la pantalla" maxlength="26"></div>
    <button class="oro-btn" id="enviar">Enviar a la pantalla</button>
    <p class="pie-nota">${m.moderar?'Lo revisa el organizador antes de proyectarlo.':'Aparece en la pantalla del salón en segundos.'}</p>
  </div>`;
  app.querySelector('.vuelve').onclick=()=>ir('invitado');
  const zona=app.querySelector('#zona');

  function pintarZona(){
    if(modo==='captura'){
      zona.innerHTML = medio?`
        <div class="previa">${medio.kind==='video'?`<video src="${medio.data}" controls playsinline></video>`:`<img src="${medio.data}" alt="">`}
          <button class="x" aria-label="Quitar">✕</button></div>
        <div class="campo"><label for="pie">Epígrafe</label><input id="pie" type="text" placeholder="Opcional" maxlength="90"></div>`
      :`<label class="lente" for="file"><span class="aro">${ESTRELLA}</span>
          <b>Elegí una foto o un video</b><span>Se proyecta apenas la mandes</span>
          <input id="file" type="file" accept="image/*,video/*" hidden></label>`;
      const f=zona.querySelector('#file');
      if(f) f.onchange=async e=>{
        const a=e.target.files[0]; if(!a) return;
        recado('Preparando…');
        medio=a.type.startsWith('video')?{kind:'video',data:await leerArchivo(a)}:{kind:'foto',data:await comprimir(a)};
        pintarZona();
      };
      const x=zona.querySelector('.x'); if(x) x.onclick=()=>{medio=null;pintarZona();};
    }
    if(modo==='texto'){
      medio=null;
      zona.innerHTML=`<div class="campo"><label for="msg">Tu dedicatoria</label>
        <textarea id="msg" placeholder="Se proyecta en grande, así que decí algo lindo." maxlength="180"></textarea></div>`;
    }
    if(modo==='voz'){
      zona.innerHTML=`<div class="lente" style="padding:38px 22px">
        <span class="aro">${ESTRELLA}</span><b>Saludo de voz</b><span>Hasta 15 segundos</span>
        <button class="hilo-btn" id="rec" style="max-width:280px;margin:22px auto 0">Empezar a grabar</button>
        <div id="repro" style="margin-top:16px"></div></div>`;
      zona.querySelector('#rec').onclick=grabar;
    }
  }
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    modo=b.dataset.m;
    app.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    pintarZona();
  });
  pintarZona();

  let mr=null,trozos=[],tt=null;
  async function grabar(){
    const btn=this;
    if(mr&&mr.state==='recording'){mr.stop();return;}
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(s); trozos=[];
      mr.ondataavailable=e=>trozos.push(e.data);
      mr.onstop=async()=>{
        clearTimeout(tt); s.getTracks().forEach(t=>t.stop());
        medio={kind:'audio',data:await leerArchivo(new Blob(trozos))};
        btn.textContent='Grabar de nuevo';
        zona.querySelector('#repro').innerHTML=`<audio src="${medio.data}" controls style="width:100%"></audio>`;
      };
      mr.start();
      btn.innerHTML=`<span class="onda"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i></span>Grabando · tocá para parar`;
      tt=setTimeout(()=>mr.state==='recording'&&mr.stop(),15000);
    }catch(e){recado('No pude usar el micrófono');}
  }

  app.querySelector('#enviar').onclick=async()=>{
    const autor=app.querySelector('#autor').value.trim()||'Invitado';
    const pie=zona.querySelector('#pie'), msg=zona.querySelector('#msg');
    const texto=(msg?msg.value:pie?pie.value:'').trim();
    if(!medio&&!texto) return recado('Subí algo o escribí una dedicatoria');
    const btn=app.querySelector('#enviar');
    btn.disabled=true; btn.textContent='Revelando…';
    try{
      await sumar(codigo,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        kind:medio?medio.kind:'mensaje', data:medio?medio.data:'', autor, texto, ts:Date.now(),
        estado:m.moderar?'pendiente':'aprobado'});
      vMomento(m,autor);
    }catch(e){
      btn.disabled=false; btn.textContent='Enviar a la pantalla';
      recado('No entró. Probá con un archivo más liviano.');
    }
  };
}

async function vPantalla(codigo){
  parar();
  const m=await meta(codigo); if(!m) return ir('proyector');
  tono(m.tono);
  app.innerHTML=`
  <button class="dejar">Salir</button>
  <button class="dejar" id="completa" style="right:96px">Pantalla completa</button>
  <div class="sala">
    <div class="tela" id="tela">
      <div class="vineta"></div><div class="destello" id="destello"></div>
      <div class="aguarda"><div>
        <img src="${LOGO_MARK}" style="width:180px;opacity:.5" alt="Click Eterno">
        <p class="ital">Esperando la primera foto de la noche</p>
        <p class="espaciado" style="margin-top:22px">${esc(m.codigo)}</p>
      </div></div>
    </div>
    <div class="consola">
      <span class="nom">${esc(m.nombre)}</span>
      <span class="envivo"><span class="pulso"></span>En vivo</span>
      <span class="cuenta" id="cuenta">0<small>En el muro</small></span>
      <span class="qr-sala" id="qrs"></span>
    </div>
  </div>`;
  app.querySelector('.dejar').onclick=()=>ir('evento/'+codigo);
  app.querySelector('#completa').onclick=()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>recado('Tocá F11 para pantalla completa'));
  };
  const teclas=e=>{
    if(e.key==='f'||e.key==='F') app.querySelector('#completa')?.click();
    if(e.key==='ArrowRight') pasar();
    if(e.key==='Escape'&&!document.fullscreenElement) ir('evento/'+codigo);
  };
  addEventListener('keydown',teclas);
  const limpiar=()=>removeEventListener('keydown',teclas);
  window._limpiarSala=limpiar;
  pintarQR(app.querySelector('#qrs'),enlaceDe(codigo),56);

  const tela=app.querySelector('#tela'), destello=app.querySelector('#destello');
  let ids=[], cursor=-1, vueltas=0, arrancado=false;

  function marco(html,clases){
    const d=document.createElement('div');
    d.className='toma '+(clases||'');
    d.innerHTML=html;
    tela.querySelectorAll('.toma').forEach(v=>{v.classList.remove('on');setTimeout(()=>v.remove(),1500);});
    tela.insertBefore(d,tela.firstChild);
    requestAnimationFrame(()=>d.classList.add('on'));
    return d;
  }
  const epigrafe=(it,nuevo)=>`<div class="epigrafe">
    ${nuevo?`<div class="recien">${ESTRELLA} Recién llegada</div>`:''}
    <div class="quien">${esc(it.autor)}</div>
    ${it.texto?`<div class="dice">${esc(it.texto)}</div>`:''}</div>`;

  async function mostrar(id,nuevo){
    const it=await item(codigo,id); if(!it) return;
    const a=tela.querySelector('.aguarda'); if(a) a.remove();
    if(nuevo){destello.classList.remove('va');void destello.offsetWidth;destello.classList.add('va');}
    if(it.kind==='foto') marco(`<img src="${it.data}" alt="">${epigrafe(it,nuevo)}`, nuevo?'revelar':'kb');
    else if(it.kind==='video') marco(`<video src="${it.data}" autoplay muted loop playsinline></video>${epigrafe(it,nuevo)}`, nuevo?'revelar':'');
    else if(it.kind==='audio') marco(`<div class="placa"><div class="cita">Un saludo de voz</div>
      <div class="quien">${esc(it.autor)}</div><audio src="${it.data}" autoplay controls style="margin-top:30px"></audio></div>`,'encaja');
    else marco(`<div class="placa"><div class="cita">“${esc(it.texto)}”</div>
      <div class="quien">${esc(it.autor)}</div></div>`,'encaja');
  }
  async function mosaico(){
    const fotos=[];
    for(const id of ids.slice(-9)){const it=await item(codigo,id); if(it&&it.kind==='foto') fotos.push(it);}
    if(fotos.length<4) return false;
    marco(`<div class="mosaico">${fotos.map((f,i)=>`<img src="${f.data}" style="animation-delay:${i*.1}s">`).join('')}</div>`,'encaja');
    return true;
  }
  async function revisar(){
    const idx=(await indice(codigo)).filter(i=>i.estado==='aprobado');
    const nuevos=idx.filter(i=>!ids.includes(i.id));
    ids=idx.map(i=>i.id);
    app.querySelector('#cuenta').innerHTML=ids.length+'<small>En el muro</small>';
    if(nuevos.length){
      const ultimo=nuevos[nuevos.length-1].id;
      cursor=ids.indexOf(ultimo);
      await mostrar(ultimo,arrancado); arrancado=true; return true;
    }
    if(!arrancado&&ids.length){cursor=ids.length-1; await mostrar(ids[cursor],false); arrancado=true;}
    return false;
  }
  async function pasar(){
    if(!ids.length) return;
    vueltas++;
    if(vueltas%6===0 && await mosaico()) return;
    cursor=(cursor+1)%ids.length;
    await mostrar(ids[cursor],false);
  }
  await revisar();
  timerSala=setInterval(async()=>{ const hubo=await revisar(); if(!hubo) await pasar(); },7000);
}

    <div class="filete" style="max-width:260px;margin:26px auto">${ESTRELLA}</div>

    <h1 class="ital sube" style="font-size:clamp(44px,13vw,62px);margin:16px 0 12px;animation-delay:.12s">${esc(m.nombre)}</h1>
    <p class="sube" style="animation-delay:.22s;color:#B5AC9E;line-height:1.8">${bonito(m.fecha)}<br>El álbum ya está listo.</p>
    <div class="sube" style="animation-delay:.34s;max-width:330px;margin:38px auto 0">
      <button class="oro-btn" id="ver">Ver el álbum digital</button></div>
  </div></div>`;
  app.querySelector('#ver').onclick=()=>ir('album/'+m.codigo);
}

async function vAlbum(codigo){
  parar();
  const m=await meta(codigo); if(!m) return ir('portada');
  tono(m.tono);
  app.innerHTML=`${barra('Álbum','Cargando')}<div class="vacio">Revelando el álbum…</div>`;
  const idx=(await indice(codigo)).filter(i=>i.estado==='aprobado').reverse();
  const items=[];
  for(const i of idx){const it=await item(codigo,i.id); if(it) items.push(it);}
  const n=k=>items.filter(i=>i.kind===k).length;
  const visuales=items.filter(i=>i.kind==='foto'||i.kind==='video');
  const portada=m.portada||(visuales.find(i=>i.kind==='foto')||{}).data||'';
  const cifra=(t,v)=>`<div class="cifra ${v?'':'cero'}"><span>${t}</span><b>${v}</b></div>`;

  app.innerHTML=`
  ${barra('Álbum digital',esc(m.codigo))}
  <div class="album">
    <div class="tapa"><div class="fondo" style="background-image:url('${portada}')"></div>
      <div class="medallon">${portada?`<img src="${portada}" alt="">`:''}</div></div>
    <div class="wrap">
      <h1 class="sube">${esc(m.nombre)}</h1>
      <div class="fecha sube" style="animation-delay:.1s">${bonito(m.fecha)}</div>
      ${m.vence?`<div class="sube" style="animation-delay:.16s;text-align:center;font-size:11.5px;
        color:var(--mute);margin-top:14px;letter-spacing:.08em">Disponible para descargar hasta el ${bonito(m.vence)}</div>`:''}
      <div class="filete" style="max-width:240px;margin:26px auto">${ESTRELLA}</div>
      <div class="cifras">${cifra('Fotos',n('foto'))}${cifra('Videos',n('video'))}${cifra('Mensajes',n('mensaje'))}${cifra('Audios',n('audio'))}</div>
      ${visuales.length?`<div class="rejilla">${visuales.map(i=>
        `<a href="${i.data}" download="${esc(m.nombre)}-${i.id}.${i.kind==='foto'?'jpg':'mp4'}">
          ${i.kind==='foto'?`<img src="${i.data}" alt="Foto de ${esc(i.autor)}" loading="lazy">`:`<video src="${i.data}" muted></video>`}</a>`).join('')}</div>`:''}
      ${items.filter(i=>i.kind==='mensaje').map(i=>
        `<div class="dedicatoria"><p>“${esc(i.texto)}”</p><b>${esc(i.autor)}</b></div>`).join('')}
      ${items.filter(i=>i.kind==='audio').map(i=>
        `<div class="dedicatoria"><b>${esc(i.autor)}</b><audio src="${i.data}" controls style="width:100%;margin-top:12px"></audio></div>`).join('')}
      ${items.length?`<div class="acciones"><button id="dl">Descargar todo</button><button id="pdf">Guardar en PDF</button></div>
        <p class="pie-nota">${items.length} recuerdos de ${new Set(items.map(i=>i.autor)).size} personas.</p>`
      :`<div class="vacio">El álbum está vacío por ahora.<br>Todo lo que suban los invitados aparece acá.</div>`}
      <div class="pie-marca"><img src="${LOGO_MARK}" alt="Click Eterno"></div>
    </div>
  </div>`;
  app.querySelector('.vuelve').onclick=()=>ir('evento/'+codigo);
  const dl=app.querySelector('#dl');
  if(dl){
    dl.onclick=async()=>{
      if(!window.JSZip){
        visuales.forEach((i,k)=>setTimeout(()=>{
          const a=document.createElement('a'); a.href=i.data;
          a.download=`${m.nombre}-${k+1}.${i.kind==='foto'?'jpg':'mp4'}`; a.click();
        },k*400));
        return recado('Descargando de a una');
      }
      dl.disabled=true; dl.textContent='Armando el archivo…';
      try{
        const zip=new JSZip();
        visuales.forEach((i,k)=>zip.file(
          `${m.nombre}-${String(k+1).padStart(3,'0')}.${i.kind==='foto'?'jpg':'mp4'}`,
          i.data.split(',')[1], {base64:true}));
        const dedis=items.filter(i=>i.kind==='mensaje');
        if(dedis.length) zip.file('dedicatorias.txt',
          `${m.nombre} · ${bonito(m.fecha)}\n\n`+
          dedis.map(i=>`"${i.texto}"\n   — ${i.autor}\n`).join('\n'));
        const blob=await zip.generateAsync({type:'blob'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`${m.nombre} - Click Eterno.zip`; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),4000);
        recado('Listo · '+visuales.length+' archivos en un ZIP');
      }catch(e){ recado('No pude armar el ZIP'); }
      dl.disabled=false; dl.textContent='Descargar todo';
    };
    app.querySelector('#pdf').onclick=()=>window.print();
  }
}

/* ══════════ router ══════════ */
function ir(ruta){ location.hash='#'+ruta; pintar(ruta); }
function pintar(ruta){
  const [v,arg]=ruta.split('/');
  window.scrollTo(0,0);
  if(v==='panel') return vAcceso();
  if(v==='evento') return vEvento(arg);
  if(v==='invitado') return vElegir('subir','Invitado');
  if(v==='proyector') return vElegir('pantalla','Pantalla');
  if(v==='subir') return vSubir(arg);
  if(v==='pantalla') return vPantalla(arg);
  if(v==='album') return vAlbum(arg);
  if(v==='cartel') return vCartel(arg);
  return vPortada();
}
addEventListener('hashchange',()=>pintar(location.hash.slice(1)||'portada'));

(async function(){
  const original=store.set.bind(store);
  store.set=async(k,v)=>{
    await original(k,v);
    if(k.endsWith(':meta')){
      const evs=await eventos();
      const fila={codigo:v.codigo,nombre:v.nombre,fecha:v.fecha,portada:v.portada};
      const i=evs.findIndex(e=>e.codigo===v.codigo);
      if(i>=0) evs[i]=fila; else evs.unshift(fila);
      await original(LISTA,evs);
    }
  };
  pintar(location.hash.slice(1)||'portada');
})();
