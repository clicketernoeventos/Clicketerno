<div class="recado" id="recado"></div>

<script>
const LOGO_FULL = "logo.webp";
const LOGO_MARK = "marca.webp";
const ESTRELLA = `<span class="estrella"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.9 8.2 2.9 11.1 12 12-9.1.9-11.1 3.8-12 12-.9-8.2-2.9-11.1-12-12C9.1 11.1 11.1 8.2 12 0z"/></svg></span>`;

/* ══════════ almacenamiento (prototipo) ══════════ */
/* ═══════════════════════════════════════════════════════════
   CONFIGURACIÓN · pegá acá los dos datos de Supabase
   Mientras estén vacíos, la app corre en MODO DEMOSTRACIÓN:
   cada celular ve solo sus propias fotos.
   ═══════════════════════════════════════════════════════════ */
const NUBE = {
  url:  'https://kuqlqgrwsospwjexodqa.supabase.co',
  clave:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cWxxZ3J3c29zcHdqZXhvZHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjMyMjAsImV4cCI6MjEwNDEzOTIyMH0.DyV3K6fcHcsD9wbNzkYn2vIwWSN9e2LWt_HyuSaUE9g'
};
/* ══════════ modo demostración ══════════
   Con ?demo=1 la app NO habla con la base: corre entera en la memoria de
   este navegador, con una fiesta inventada. Es lo que abre el botón de
   "probar" de la web pública. Antes ese botón llevaba a la app de verdad,
   donde se veían los eventos de los clientes y el botón de "cargar una
   fiesta de ejemplo" escribía en la base de producción. */
const HAY_DEMO = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);
/* ?marco=1: la demostración va adentro de un marco en la página pública,
   como una vidriera. Sin cinta y sin botones: es una muestra de cómo se ve
   proyectado, no algo para tocar. Se toca en la demostración de verdad. */
const EN_MARCO = /(?:^|[?&])marco=1(?:&|$)/.test(location.search);
/* Adentro de un marco (el visor de la página de inicio), "Salir" llevaría el
   sitio adentro de sí mismo: el visor ya tiene su propio CERRAR. */
const ENMARCADO = (()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
const HAY_NUBE = !HAY_DEMO && !!(NUBE.url && NUBE.clave);

const LISTA='ce:eventos', cacheItem={}, memoria={};
let timerSala=null;
const esc=s=>String(s==null?'':s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
/* Solo dejamos pasar direcciones que parezcan una imagen/archivo real.
   Cualquier otra cosa (texto inyectado en la base) se descarta. */
const urlSegura=u=>{const t=String(u==null?'':u).trim();
  return /^(https?:\/\/|data:(image|video|audio)\/|blob:)/i.test(t)||/^[\w./-]+\.(webp|jpg|jpeg|png|gif|mp4|webm)$/i.test(t)?t:'';};
const src=u=>esc(urlSegura(u));
/* Para meter una dirección dentro de url(...) de CSS solo hay que escapar
   lo que rompe el paréntesis o las comillas. encodeURI() no sirve: vuelve a
   codificar lo ya codificado (%20 pasa a %2520) y rompe la imagen. */
const cssUrl=u=>urlSegura(u).replace(/["'()\\\s]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));
/* nombre de archivo que no rompa en Windows/Mac */
const nombreSeguro=s=>(String(s==null?'':s).replace(/[\\/:*?"<>|\n\r]+/g,'-').trim().slice(0,40)||'album');
/* La fecha de HOY, la del calendario de la pared. toISOString() da la de
   UTC: pasadas las nueve de la noche en Rosario ya devolvía mañana, y el
   evento nacía fechado un día después. */
const hoy=()=>{ const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
/* Una fecha de acá a n días, también en hora local. */
const enDias=n=>{ const d=new Date(); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
/* Nunca devuelve el dato crudo: si no es una fecha válida, texto fijo.
   (Devolverlo tal cual permitía inyectar HTML desde la base.) */
const bonito=f=>{
  if(!f) return 'Fecha a confirmar';
  const p=String(f).slice(0,10).split('-');
  if(p.length!==3||!/^\d{4}$/.test(p[0])||!/^\d{1,2}$/.test(p[1])||!/^\d{1,2}$/.test(p[2]))
    return 'Fecha a confirmar';
  return `${p[2]} · ${p[1]} · ${p[0]}`;
};

/* ── almacenamiento local (solo si no hay nube) ───────────── */
const local = {
  async get(k){
    if(window.storage) return JSON.parse((await window.storage.get(k,true)).value);
    if(!(k in memoria)) throw new Error('vacío');
    return JSON.parse(memoria[k]);
  },
  async set(k,v){ const s=JSON.stringify(v); memoria[k]=s; if(window.storage) await window.storage.set(k,s,true); }
};
const kMeta=c=>`ce:${c}:meta`, kIndex=c=>`ce:${c}:index`, kItem=(c,i)=>`ce:${c}:i:${i}`;
const leerLocal=async(k,def)=>{try{return await local.get(k);}catch(e){return def;}};

/* ── cliente de Supabase (sin librerías, solo fetch) ──────── */
/* En navegación privada (o con cookies bloqueadas) tocar localStorage tira
   excepción y mataba la app entera al cargar. Ahora nunca propaga. */
const guarda = HAY_DEMO ? (()=>{
  /* La demostración no deja rastro en el navegador. Sin esto, la clave de
     la fiesta inventada quedaba guardada en el mismo aparato que usa el
     organizador de verdad y DEMO-FIESTA le aparecía entre sus eventos. */
  const m={}, s={};
  return {
    leer:k=>(k in m)?m[k]:null,
    escribir(k,v){ m[k]=String(v); return true; },
    borrar(k){ delete m[k]; },
    leerSesion:k=>(k in s)?s[k]:null,
    escribirSesion(k,v){ s[k]=String(v); }
  };
})() : {
  leer(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  escribir(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  borrar(k){try{localStorage.removeItem(k);}catch(e){}},
  leerSesion(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},
  escribirSesion(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
};

/* ══════════ claves de evento ══════════
   Cada evento tiene su clave. Viaja en la cabecera x-clave y la valida la
   base: el navegador solo la lleva, no decide nada. Las guardamos en este
   aparato para no tener que escribirlas cada vez. */
const CLAVES_KEY='ce:claves';
const clavesGuardadas=()=>{ try{ return JSON.parse(guarda.leer(CLAVES_KEY)||'{}'); }catch(e){ return {}; } };
const guardarClaveDe=(codigo,clave)=>{
  const t=clavesGuardadas(); t[codigo]=clave; guarda.escribir(CLAVES_KEY,JSON.stringify(t));
};
const olvidarClaveDe=codigo=>{
  const t=clavesGuardadas(); delete t[codigo]; guarda.escribir(CLAVES_KEY,JSON.stringify(t));
};
let claveMaestra=guarda.leerSesion('ce:maestra')||'';
/* la que corresponde usar para este evento */
const claveDe=codigo=>claveMaestra||clavesGuardadas()[codigo]||'';
const puedoEditar=codigo=>!!claveDe(codigo);
/* clave nueva, corta y sin letras que se confundan al dictarla */
/* Dos invitados sacando la foto en el mismo instante podían generar el
   mismo id, y como el guardado pisa duplicados, la foto de uno borraba la
   del otro sin avisar. Con 10 caracteres al azar eso deja de pasar. */
const idNuevo=()=>{
  const abc='abcdefghijklmnopqrstuvwxyz0123456789';
  let cola='';
  try{
    const n=new Uint32Array(10); crypto.getRandomValues(n);
    cola=[...n].map(x=>abc[x%abc.length]).join('');
  }catch(e){
    for(let i=0;i<10;i++) cola+=abc[Math.floor(Math.random()*abc.length)];
  }
  return Date.now().toString(36)+cola;
};
const nuevaClave=()=>{
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  try{
    const n=new Uint32Array(6); crypto.getRandomValues(n);
    return [...n].map(x=>abc[x%abc.length]).join('');
  }catch(e){
    /* sin crypto (navegador viejo): igual tiene que salir una clave
       distinta cada vez, no seis letras iguales */
    let t=''; for(let i=0;i<6;i++) t+=abc[Math.floor(Math.random()*abc.length)];
    return t;
  }
};

/* ══════════ reintentar una subida que se cortó ══════════
   Tres piezas chicas que usan el muro y el rollo igual. Si cambian, cambian
   en los dos. */
/* El mensaje solo no alcanza para decidir: hay que saber con qué contestó
   el servidor. 0 = ni contestó (se cortó la red o se agotó el tiempo). */
const conEstado=(e,estado)=>{ e.estado=estado; return e; };
/* Se vuelve a intentar lo que puede andar la próxima: un corte, un tiempo
   agotado, un 5xx (el servidor se cayó) o un 429 (pedí demasiado rápido).
   Un 4xx es una negativa y no cambia por insistir. */
const seVuelveAIntentar=e=>{
  const n=e&&typeof e.estado==='number'?e.estado:null;
  if(n===null) return false;              // no vino de una subida: no tocar
  return n===0 || n===408 || n===429 || n>=500;
};
/* Espera, y si el teléfono está sin señal espera a que vuelva en vez de
   gastar el intento al vidrio. El tope existe para no quedarse colgado
   para siempre: al invitado hay que contestarle algo. */
const esperarRed=(ms,tope=20000)=>new Promise(listo=>{
  const dormir=()=>setTimeout(listo,ms);
  if(typeof navigator==='undefined'||navigator.onLine!==false) return dormir();
  let hecho=false;
  const seguir=()=>{ if(hecho) return; hecho=true;
    window.removeEventListener('online',seguir); clearTimeout(t); dormir(); };
  const t=setTimeout(seguir,tope);
  window.addEventListener('online',seguir);
});

const SB = {
  cab(extra, clave, activacion){
    const c=Object.assign({
      apikey: NUBE.clave,
      Authorization: 'Bearer '+NUBE.clave,
      'Content-Type': 'application/json'
    }, extra||{});
    if(clave) c['x-clave']=clave;
    /* El código de activación: lo consume el disparador del alta y se gasta
       una sola vez. Solo viaja al CREAR un evento; con la clave maestra no
       hace falta ninguno. */
    if(activacion) c['x-activacion']=activacion;
    return c;
  },
  async pedir(ruta, opciones){
    /* El estado viaja pegado al error (ver conEstado): sin él, decidir si
       vale la pena reintentar hay que hacerlo leyendo el texto del
       mensaje, que cambia según de dónde venga. Un corte de red no llega
       acá como respuesta: lo tira el propio fetch, y por eso se marca
       aparte con 0. */
    let r;
    try{ r = await fetch(NUBE.url+ruta, opciones); }
    catch(e){ throw conEstado(new Error(e&&e.message||'Failed to fetch'), 0); }
    const txt = await r.text();                 // siempre texto, nunca falla
    if(!r.ok) throw conEstado(new Error(txt || ('HTTP '+r.status)), r.status);
    if(!txt) return null;                        // guardado correcto, sin contenido
    try{ return JSON.parse(txt); }catch(e){ return null; }
  },
  /* La clave también en las lecturas: desde que la tabla dejó de ser de
     lectura libre, el organizador necesita mandarla para ver su evento. */
  ver(tabla, consulta, clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {headers:this.cab({}, clave)});
  },
  /* ALTA. Un insert pelado, sin "merge-duplicates", y no es un detalle:
     Postgres evalúa el WITH CHECK de la política de UPDATE en TODO
     "insert ... on conflict do update", haya conflicto o no. Esa política
     dice ce_permitido(codigo), y en el alta la clave del evento todavía no
     existe para ella —el disparador la acaba de escribir, pero ce_permitido
     es STABLE y mira la foto del principio de la sentencia—, así que el alta
     rebotaba con "new row violates row-level security policy". Lo mismo el
     invitado que sube una foto: él nunca tiene clave. Medido contra Postgres
     16 con el esquema de producción entero. De paso queda más sano: dos
     códigos iguales ahora dan error en vez de pisarse. */
  crear(tabla, obj, clave, activacion){
    return this.pedir(`/rest/v1/${tabla}`, {
      method:'POST',
      headers:this.cab({Prefer:'return=minimal'}, clave, activacion),
      body:JSON.stringify(obj)
    });
  },
  /* FUSIÓN. Solo para quien YA tiene la clave del evento guardada: ahí sí
     ce_permitido dice que sí y el on-conflict pasa. Nunca para un alta. */
  guardar(tabla, obj, clave){
    return this.pedir(`/rest/v1/${tabla}`, {
      method:'POST',
      headers:this.cab({Prefer:'resolution=merge-duplicates,return=minimal'}, clave),
      body:JSON.stringify(obj)
    });
  },
  editar(tabla, consulta, obj, clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {
      method:'PATCH', headers:this.cab({Prefer:'return=minimal'}, clave), body:JSON.stringify(obj)
    });
  },
  borrar(tabla, consulta, clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {
      method:'DELETE', headers:this.cab({Prefer:'return=minimal'}, clave)
    });
  },
  /* pregunta a la base qué permite esta clave (sirve de diagnóstico) */
  quienSoy(codigo, clave){
    return this.pedir('/rest/v1/rpc/ce_quien_soy', {
      method:'POST', headers:this.cab({}, clave),
      body:JSON.stringify({p_codigo:codigo||null})
    });
  },
  cambiarClave(codigo, claveActual, claveNueva){
    return this.pedir('/rest/v1/rpc/ce_cambiar_clave', {
      method:'POST', headers:this.cab({}, claveActual),
      body:JSON.stringify({p_codigo:codigo, p_nueva:claveNueva})
    });
  },
  /* función genérica (usada por la cámara descartable) */
  rpc(fn, args, clave){
    return this.pedir(`/rest/v1/rpc/${fn}`, {method:'POST', headers:this.cab({}, clave), body:JSON.stringify(args||{})});
  },
  /* lista los archivos guardados bajo una carpeta del depósito */
  /* El depósito devuelve como mucho 1000 por pedido: con una fiesta grande
     quedaban archivos sin listar, y por lo tanto sin borrar nunca. */
  async listarArchivos(prefijo, bucket){
    let desde=0, todo=[];
    for(;;){
      const tanda=await this.pedir(`/storage/v1/object/list/${bucket||'ce-medios'}`, {
        method:'POST', headers:this.cab(),
        body:JSON.stringify({prefix:prefijo,limit:1000,offset:desde})
      });
      if(!tanda||!tanda.length) break;
      todo=todo.concat(tanda);
      if(tanda.length<1000) break;
      desde+=1000;
      if(desde>20000) break;
    }
    return todo;
  },
  /* Y mandarlos todos juntos en un solo pedido lo hacía rebotar entero. */
  async borrarArchivos(rutas, clave, bucket){
    if(!rutas.length) return null;
    for(let i=0;i<rutas.length;i+=200){
      await this.pedir(`/storage/v1/object/${bucket||'ce-medios'}`, {
        method:'DELETE', headers:this.cab({}, clave),
        body:JSON.stringify({prefixes:rutas.slice(i,i+200)})
      });
    }
    return null;
  },
  /* En el wifi de un salón lleno, un corte de dos segundos es lo normal, y
     hasta acá el primer tropiezo le devolvía "no se pudo" al invitado y la
     foto se perdía. Ahora se intenta tres veces.
     Solo se repite lo que PUEDE salir bien en el segundo intento: un corte
     de red, un tiempo agotado, o un 5xx/429 del servidor. Un 4xx es una
     negativa —el camino ya existe, el archivo es muy grande, el muro está
     cerrado— y repetirla es hacerlo esperar para darle el mismo error.
     Y si el teléfono está sin señal, no se gasta un intento al vidrio:
     espera a que vuelva. */
  async archivo(ruta, blob, alAvanzar){
    const ESPERAS=[1200,3500], ARRANQUE=Date.now(), TOPE_TOTAL=240000;
    let ultimo=null;
    for(let i=0;i<=ESPERAS.length;i++){
      /* Un tope de tiempo además del de intentos: cada intento ya puede
         tardar lo suyo y tres seguidos son una espera que al invitado le
         parece que se colgó. Pasados cuatro minutos se le contesta. */
      if(i && Date.now()-ARRANQUE > TOPE_TOTAL) break;
      if(i){
        if(alAvanzar) alAvanzar(0);       // que la barra vuelva a empezar
        await esperarRed(ESPERAS[i-1]);
      }
      try{ return await this.unArchivo(ruta, blob, alAvanzar); }
      catch(e){ ultimo=e; if(!seVuelveAIntentar(e)) throw e; }
    }
    throw ultimo;
  },
  /* XHR en vez de fetch para poder mostrar el avance y cortar si se cuelga:
     en un salón con mala señal, "Revelando…" quedaba girando sin fin. */
  unArchivo(ruta, blob, alAvanzar){
    return new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      x.open('POST',`${NUBE.url}/storage/v1/object/ce-medios/${ruta}`);
      x.setRequestHeader('apikey',NUBE.clave);
      x.setRequestHeader('Authorization','Bearer '+NUBE.clave);
      x.setRequestHeader('Content-Type',blob.type||'application/octet-stream');
      /* Sin x-upsert. Con el depósito abierto para que suban los invitados
         —que es lo que tiene que pasar—, "upsert" quiere decir que
         cualquiera puede PISAR un archivo que ya está: mandando a
         .../ce-medios/QUI-XXXXXX/portada.jpg se cambia la portada de una
         fiesta ajena, que es la que se proyecta en el salón. Los caminos
         llevan un id al azar, así que nunca necesitamos pisar nada: si el
         camino ya existe, que falle. */
      x.timeout=180000;
      if(x.upload&&alAvanzar) x.upload.onprogress=e=>{
        if(e.lengthComputable) alAvanzar(e.loaded/e.total);
      };
      x.onload=()=>{
        if(x.status>=200&&x.status<300) res(`${NUBE.url}/storage/v1/object/public/ce-medios/${ruta}`);
        else rej(conEstado(new Error(x.responseText||('HTTP '+x.status)), x.status));
      };
      x.onerror=()=>rej(conEstado(new Error('Failed to fetch'), 0));
      x.ontimeout=()=>rej(conEstado(new Error('La subida tardó demasiado'), 0));
      x.send(blob);
    });
  }
};

const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif',
           'image/heic':'heic','image/heif':'heif',
           'video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm',

           'audio/aac':'aac','audio/ogg':'ogg','audio/wav':'wav','audio/x-m4a':'m4a'};
const MAX_MB=60;
async function subirArchivo(blob, base, alAvanzar){

}

/* ══════════ lo que manda el visitante en la demostración se borra solo ══════════
   La demostración ya vive entera en memoria: se recarga y no queda nada,
   ni en la base ni en el navegador. Pero MIENTRAS la pestaña está abierta
   lo que mandó uno se queda, y la demostración se muestra en el teléfono
   del negocio, de cliente en cliente: el segundo se encontraba la foto que
   dejó el primero proyectada entre las de ejemplo.
   Dos minutos alcanzan para verla pasar por la pantalla del salón —la
   proyección cambia cada siete segundos— y son poco para que quede
   colgada. Solo se le pone plazo a lo que manda el visitante: las nueve
   fotos y los saludos del ejemplo son la fiesta y no se tocan. */
const VIDA_DEMO = 2*60*1000;
async function borrarDeLaDemo(codigo, id){
  try{
    const idx = await leerLocal(kIndex(codigo), []);
    const quedan = idx.filter(i=>i.id!==id);
    if(quedan.length===idx.length) return;      // ya no estaba
    await local.set(kIndex(codigo), quedan);
    delete memoria[kItem(codigo,id)];
    delete cacheItem[codigo+id];
  }catch(e){ console.warn('no pude limpiar la demostración',e); }
}
/* El reloj arranca cuando se manda, no cuando se mira: si el visitante se
   queda en la pantalla del salón, igual desaparece a los dos minutos. */
function borrarseSolo(codigo, id){
  if(!HAY_DEMO) return;
  setTimeout(()=>borrarDeLaDemo(codigo,id), VIDA_DEMO);
}

/* ── funciones que usa toda la app (misma firma, con o sin nube) ── */
/* SOLO los eventos de este aparato.
   Antes se pedían todos, sin filtro: el panel decía "Tus eventos" y le
   listaba a cualquiera que entrara las fiestas de todos los clientes, con
   nombre y fecha. Desde la web pública había un botón que llevaba derecho
   ahí. Cuáles son "los míos" lo dicen las claves guardadas en este
   navegador, que es lo mismo que ya hacía el rollo. */
/* El desempate por codigo no es decoración: sin él, dos eventos creados
   en el mismo milisegundo (o los dos sin 'creado') pueden salir en
   distinto orden en cada tanda, y con offset eso es una fila repetida y
   otra que no aparece nunca. */
const CAMPOS_LISTA='codigo,nombre,fecha,portada,vence,creado,camara,cerrado,revelado&order=creado.desc.nullslast,codigo.asc';
async function eventos(){
  if(!HAY_NUBE) return leerLocal(LISTA,[]);
  try{
    if(esAdmin){
      /* De a tandas. PostgREST corta en 1000 filas y no avisa: con la
         tabla entera pedida de un saque, el evento 1001 no existe para el
         administrador —ni en la lista ni en la limpieza—, así que sus
         fotos se quedarían en el depósito para siempre. */
      const POR_TANDA=500; let todo=[], desde=0;
      for(let v=0; v<60; v++){
        const tanda=await SB.ver('ce_eventos',
          `select=${CAMPOS_LISTA}&offset=${desde}&limit=${POR_TANDA}`, claveMaestra);
        if(!tanda||!tanda.length) break;
        todo=todo.concat(tanda);
        if(tanda.length<POR_TANDA) break;
        desde+=POR_TANDA;
      }
      return todo;
    }
    const mios=Object.keys(clavesGuardadas());
    if(!mios.length) return [];
    /* Uno por uno, cada cual con SU clave. En un pedido solo va una clave
       en la cabecera, y la base mira fila por fila: pidiéndolos todos
       juntos volvía uno solo. Son los eventos de UN organizador, así que
       son unos pocos y van en paralelo. */
    const filas=await Promise.all(mios.map(async c=>{
      try{
        const r=await SB.ver('ce_eventos',
          `codigo=eq.${encodeURIComponent(c)}&select=${CAMPOS_LISTA}`, claveDe(c));
        return (r&&r[0])||null;
      }catch(e){ return null; }
    }));
    return filas.filter(Boolean)
      .sort((a,b)=>(b.creado||0)-(a.creado||0));
  }catch(e){ console.error('eventos',e); recado('No se pudo leer: '+motivo(e)); return []; }
}
/* ── leer un evento sin tener su clave ──
   El invitado que llega por el QR, la pantalla del salón y el álbum que se
   comparte no tienen clave, y tienen que poder leer SU evento. Antes eso
   funcionaba porque la tabla era de lectura libre para todo el mundo, que
   es lo mismo que decir que cualquiera se bajaba la lista completa de las
   fiestas de todos los clientes con un solo pedido.
   Ahora la base solo la abre por función y de a un código por vez. Si la
   función todavía no está instalada (blindaje.sql no corrido), se lee como
   antes: así la página anda igual el día de antes y el día después, sin
   que haya que sincronizar la subida con el SQL. */
let hayFuncionesNuevas = null;      // null = todavía no sabemos
async function eventoPorCodigo(c){
  if(hayFuncionesNuevas!==false){
    try{
      const v=await SB.rpc('ce_evento_publico',{p_codigo:c});
      /* null = la función existe y ese código no. Un objeto con codigo = el
         evento. Cualquier otra cosa quiere decir que del otro lado no está
         la función que creemos. */
      if(v===null||(v&&typeof v==='object'&&!Array.isArray(v)&&v.codigo)){
        hayFuncionesNuevas=true; return v;
      }
      hayFuncionesNuevas=false;
    }catch(e){
      /* Pase lo que pase, se lee como se leía antes. Si la base ya está
         cerrada, ese camino devuelve vacío y el que decide es ella, no
         nosotros: lo que no puede pasar es que la pantalla muera acá. */
      if(/PGRST202|does not exist|not found|404/i.test(e&&e.message||'')) hayFuncionesNuevas=false;
    }
  }
  return (await SB.ver('ce_eventos',`codigo=eq.${encodeURIComponent(c)}&select=*`))[0]||null;
}
async function meta(c){
  if(!HAY_NUBE) return leerLocal(kMeta(c),null);
  try{
    /* Con la clave guardada leemos derecho de la tabla: es el organizador,
       la base lo deja, y así ve también lo que está esperando aprobación. */
    if(puedoEditar(c)){
      const r=await SB.ver('ce_eventos',`codigo=eq.${encodeURIComponent(c)}&select=*`, claveDe(c));
      if(r&&r[0]) return r[0];
    }
    return await eventoPorCodigo(c);
  }
  catch(e){ console.error(e); return null; }
}
/* Columnas que se fueron agregando con el tiempo. Si la base todavía no
   las tiene, no se rompe nada: se vuelve a guardar sin ese dato y se anota
   cuál falta, para avisarlo una sola vez. Así el panel sigue andando
   aunque no se haya corrido el SQL nuevo.
   Antes había un mecanismo por tanda de columnas; ahora es uno solo. */
const COLS_CAMARA=['camara','cupo_fotos','revela_en','revelado'];
/* "acepto" va acá por la regla de siempre: primero la web, después el SQL.
   Si todavía no se corrió blindaje2.sql, la columna no existe y PostgREST
   rechaza el alta ENTERA. Con la columna en esta lista, guardarMeta la saca
   y reintenta, y el evento se crea igual. */
const COLUMNAS_NUEVAS=['lanza','hashtag','lugar','acepto',...COLS_CAMARA];
const faltaColumna={};
const sinColumna=c=>!!faltaColumna[c];
async function guardarMeta(m){
  if(!HAY_NUBE) return local.set(kMeta(m.codigo),m);
  const copia={...m};
  if(copia.portadaBlob){
    /* Camino nuevo cada vez. Antes era siempre ".../CODIGO/portada", y
       como hacía falta poder cambiarla se subía con "upsert", que es lo
       mismo que dejar que cualquiera pise la portada de cualquier fiesta.
       Con un nombre al azar nunca hay nada que pisar; la anterior queda en
       el depósito y se borra junto con el evento, que lista por prefijo. */
    const basePortada=`${copia.codigo}/portada-${idNuevo()}`;
    copia.portada = await subirArchivo(copia.portadaBlob, basePortada);
    try{
      const chica=await miniaturaBlob(copia.portadaBlob);
      if(chica) await SB.archivo(`${basePortada}-min.jpg`, chica);
    }catch(e){ console.warn('portada sin miniatura',e); }
    delete copia.portadaBlob;
  }
  for(const c of COLUMNAS_NUEVAS) if(faltaColumna[c]) delete copia[c];
  delete copia.claveNueva;      // la clave va en la cabecera, nunca en la fila
  const activacion=m.activacion||'';
  delete copia.activacion;      // el código de activación, también
  /* Alta o cambio: no es lo mismo para la base (ver SB.crear). Y si el
     alta rebota por código repetido, es que el pedido anterior SÍ llegó y
     se perdió la respuesta: la clave ya quedó guardada por el disparador,
     así que ahora el upsert pasa y termina de guardar lo mismo. Si el
     código fuera de otro, ese upsert rebota por RLS, que es lo correcto. */
  const mandar=async()=>{
    if(!m.claveNueva) return SB.guardar('ce_eventos',copia, claveDe(m.codigo));
    try{ return await SB.crear('ce_eventos',copia, m.claveNueva, activacion); }
    catch(e){
      if(!/duplicate key|already exists|23505/i.test(String((e&&e.message)||e))) throw e;
      return SB.guardar('ce_eventos',copia, m.claveNueva);
    }
  };
  try{
    await mandar();
  }catch(e){
    /* ¿la base se quejó justo de una de las columnas nuevas? */
    const texto=String((e&&e.message)||'');
    const culpable=COLUMNAS_NUEVAS.find(c=>!faltaColumna[c] && c in copia
      && new RegExp(`'${c}'|"${c}"|\\b${c}\\b`,'i').test(texto));
    if(culpable){
      /* si falta una de la cámara, faltan las cuatro: se corren juntas */
      for(const c of (COLS_CAMARA.includes(culpable)?COLS_CAMARA:[culpable])){
        faltaColumna[c]=true; delete copia[c];
      }
      try{
        await mandar();
        m.portada=copia.portada;
        return;   // quien llamó mira sinColumna() y avisa lo que corresponda
      }catch(e2){ e=e2; }
    }
    console.error('guardarMeta',e);
    recado('No se pudo guardar: '+motivo(e));
    throw e;
  }
  m.portada = copia.portada;
}

/* traduce el error técnico a algo que se entienda */
function motivo(e){
  const t=(e&&e.message)||'';
  if(/Failed to fetch|NetworkError/i.test(t)) return 'sin conexión con la base';
  if(/relation .* does not exist|PGRST205|42P01/i.test(t)) return 'faltan las tablas (correr el SQL)';
  /* Los del código de activación van ANTES del 28000 genérico: la base
     los manda con ese mismo código y ahí abajo se convertirían en "falta
     la clave del evento", que es mentira y manda al cliente a buscar otra
     cosa. El texto lo escribe la base, así que se reusa tal cual. */
  if(/c[óo]digo de activaci[óo]n/i.test(t)) return t.replace(/^.*?:\s*/,'').slice(0,110);
  if(/Falta la clave del evento|28000/i.test(t)) return 'falta la clave del evento';
  if(/row-level security|42501|PGRST301/i.test(t)) return 'la clave de este evento no es la correcta';
  if(/duplicate key|23505/i.test(t)) return 'ese código ya existe';
  if(/'lanza' column|column .*lanza|PGRST204/i.test(t))
    return 'falta la columna "lanza" en la base (correr el SQL de programación)';
  if(/JWT|apikey|401|Invalid/i.test(t)) return 'clave de la base inválida';
  return t.slice(0,110) || 'error desconocido';
}
/* La base devuelve como mucho 1000 filas por pedido. Una fiesta larga pasa
   ese número y las que faltaban no aparecían nunca: ni en el álbum, ni en
   la pantalla, y sin un solo error. Ahora se pide de a tandas. */
const POR_TANDA=1000;
/* Igual que con los eventos: sin clave se pide por función, y esa función
   NO devuelve lo que está esperando aprobación. Antes cualquiera leía la
   tabla entera, incluidas las fotos pendientes: "nada llega a la pantalla
   sin que alguien lo mire primero" se cumplía solo del lado del dibujo, y
   un invitado con la consola abierta las veía igual. */
async function itemsDe(c, campos, desde, cuanto){
  /* el desempate por id NO es decorativo: dos recuerdos con el mismo ts
     pueden salir en distinto orden en cada tanda, y con offset de por medio
     eso es una fila repetida y otra que no aparece nunca. La función de la
     base ya ordena por (ts, id); acá faltaba. */
  if(puedoEditar(c))
    return await SB.ver('ce_items',
      `codigo=eq.${encodeURIComponent(c)}&select=${campos}&order=ts.asc,id.asc`
      +`&offset=${desde}&limit=${cuanto}`, claveDe(c));
  if(hayFuncionesNuevas!==false){
    try{
      const v=await SB.rpc('ce_items_de',{p_codigo:c, p_desde:desde, p_cuanto:cuanto});
      if(Array.isArray(v)){ hayFuncionesNuevas=true; return v; }
      hayFuncionesNuevas=false;
    }catch(e){
      if(/PGRST202|does not exist|not found|404/i.test(e&&e.message||'')) hayFuncionesNuevas=false;
    }
  }
  return await SB.ver('ce_items',
    `codigo=eq.${encodeURIComponent(c)}&select=${campos}&order=ts.asc,id.asc`
    +`&offset=${desde}&limit=${cuanto}`);
}
async function porTandas(c, campos){
  let desde=0, todo=[];
  for(;;){
    const tanda=await itemsDe(c, campos, desde, POR_TANDA);
    if(!tanda||!tanda.length) break;
    todo=todo.concat(tanda);
    if(tanda.length<POR_TANDA) break;
    desde+=POR_TANDA;
    if(desde>20000) break;          // tope de seguridad: nadie sube tanto
  }
  return todo;
}
async function indice(c){
  if(!HAY_NUBE) return (await leerLocal(kIndex(c),[])).sort((a,b)=>a.ts-b.ts);
  try{ return await porTandas(c,'id,kind,autor,ts,estado'); }
  catch(e){ console.error('indice',e); recado('No se pudo leer el muro: '+motivo(e)); return []; }
}
/* Traer los recuerdos de a uno era una llamada por foto: un álbum de 200
   eran 200 idas y vueltas, una atrás de la otra. Con una sola alcanza. */
async function cargarTodo(c){
  if(!HAY_NUBE) return null;
  try{
    const filas=await porTandas(c,'*');
    for(const v of filas){
      const k=c+v.id, antes=cacheItem[k];
      v.data=v.url||'';
      /* Si la fila que llega no trae un archivo utilizable pero acá ya
         teníamos uno bueno (recién subido), nos quedamos con el bueno. */
      if(!urlSegura(v.data) && antes && urlSegura(antes.data)) v.data=antes.data;
      cacheItem[k]=v;
    }
    return filas;
  }catch(e){ console.error('cargarTodo',e); return null; }
}
async function item(c,id){
  const k=c+id; if(cacheItem[k]) return cacheItem[k];
  let v;
  if(!HAY_NUBE) v = await leerLocal(kItem(c,id),null);
  else{
    try{
      if(puedoEditar(c))
        v = (await SB.ver('ce_items',`id=eq.${encodeURIComponent(id)}&select=*`, claveDe(c)))[0]||null;
      else{
        try{ v = await SB.rpc('ce_item',{p_codigo:c, p_id:id}); }
        catch(err){ v = (await SB.ver('ce_items',`id=eq.${encodeURIComponent(id)}&select=*`))[0]||null; }
      }
      if(v) v.data = v.url || '';
    }catch(e){ console.error(e); return null; }
  }
  if(v) cacheItem[k]=v;
  return v;
}
/* La foto ya está subida —eso es lo caro y lo lento— y lo que queda es un
   pedido de un kilobyte. Si JUSTO ese se cae por un parpadeo del wifi, al
   invitado le decíamos "no se pudo" y el archivo quedaba huérfano en el
   depósito: pagado, invisible, y sin ninguna fila que lo nombre.
   Reintentarlo es seguro porque el id lo pone el teléfono y es la CLAVE
   PRIMARIA de ce_items: si el primer intento sí había entrado, el segundo
   choca con la clave repetida. Por eso acá un "duplicate key" es un éxito
   —quiere decir "ya estaba"— y no un error.
   Esto vale para ce_items y NO para ce_eventos: ahí un código repetido
   puede ser el evento de OTRO, y darlo por bueno sería meter al
   organizador adentro de una fiesta ajena. */
const yaEstaba=e=>/duplicate key|23505|already exists/i.test((e&&e.message)||'')
  || (e&&e.estado===409);
/* El freno de ráfaga de la base (ce_items_puerta) corta en N por minuto
   POR FIESTA. Medido contra una copia del esquema de producción: con el
   tope en 120, en una fiesta de 200 la número 121 del brindis rebota.
   Acá eso duele el doble, porque el archivo YA está subido: perder la
   fila es dejarlo huérfano y hacerle sacar la foto de nuevo.
   Se lo reconoce por las dos puntas —el estado 429 y el texto de nuestro
   propio mensaje— porque no depende de nosotros con qué estado lo
   traduce PostgREST, y el mensaje sí: lo escribimos nosotros. */
const esRafaga=e=>!!e && (e.estado===429
  || /muchas juntas|demasiado r[áa]pido|rate limit/i.test((e&&e.message)||''));
async function anotarItem(fila, clave){
  /* La ventana del freno es de un minuto, así que ahí no sirve esperar
     dos segundos: se espera de verdad. Al invitado se le avisa (ver
     quien llama) en vez de dejarlo mirando una barra quieta. */
  const CORTAS=[700,2000], LARGAS=[9000,26000];
  let ultimo=null;
  for(let i=0;i<=CORTAS.length;i++){
    if(i) await esperarRed((esRafaga(ultimo)?LARGAS:CORTAS)[i-1]);
    try{ return await SB.crear('ce_items', fila, clave); }
    catch(e){
      if(yaEstaba(e)) return null;
      ultimo=e;
      if(!seVuelveAIntentar(e) && !esRafaga(e)) throw e;
    }
  }
  throw ultimo;
}
async function sumar(c,it,alAvanzar){
  if(!HAY_NUBE){
    /* Sin nube se guarda en el propio navegador, y ahí un Blob no sobrevive
       a JSON.stringify (quedaba {} y la foto se perdía). Lo pasamos a texto. */
    const g={...it};
    if(g.blob){
      g.data=await leerArchivo(g.blob);
      if(alAvanzar) alAvanzar(1);
    }
    delete g.blob;
    await local.set(kItem(c,g.id),g);
    const idx=await leerLocal(kIndex(c),[]);
    idx.push({id:g.id,kind:g.kind,autor:g.autor,ts:g.ts,estado:g.estado});
    await local.set(kIndex(c),idx); cacheItem[c+g.id]=g;
    return;
  }
  let url='';
  if(it.blob){
    try{
      url = await subirArchivo(it.blob, `${c}/${it.id}`, alAvanzar);
    }catch(e){ e.paso='subir el archivo'; throw e; }
    /* La miniatura va aparte y NO es crítica: si falla, el álbum baja la
       foto entera como toda la vida. Lo que no puede pasar es que un
       error acá tire abajo una foto que YA está subida y que el invitado
       se quede con "no se pudo" habiendo funcionado. */
    if(it.kind==='foto'){
      try{
        const chica=await miniaturaBlob(it.blob);
        if(chica) await SB.archivo(`${c}/${it.id}-min.jpg`, chica);
      }catch(e){ console.warn('la foto subió pero sin miniatura',e); }
    }
  }
  try{
    await anotarItem({id:it.id, codigo:c, kind:it.kind, url,
      autor:it.autor, texto:it.texto||null, estado:it.estado, ts:it.ts}, claveDe(c));
  }catch(e){ e.paso='guardar en la base'; throw e; }
  cacheItem[c+it.id] = {...it, url, data:url||''};
}
/* Borra un evento completo. Primero anota la lista de archivos, después
   borra las filas y recién ahí el depósito: la base solo deja borrar
   archivos de eventos que ya no existen. */
async function borrarEvento(codigo,avisar){
  const paso=t=>{ if(avisar) avisar(t); };
  if(!HAY_NUBE){
    paso('Borrando…');
    const idx=await leerLocal(kIndex(codigo),[]);
    for(const i of idx){ delete memoria[kItem(codigo,i.id)]; delete cacheItem[codigo+i.id]; }
    delete memoria[kIndex(codigo)]; delete memoria[kMeta(codigo)];
    const lista=await leerLocal(LISTA,[]);
    await local.set(LISTA,lista.filter(e=>e.codigo!==codigo));
    return {archivos:idx.length,items:idx.length};
  }
  const clave=claveDe(codigo);
  paso('Buscando los archivos…');
  let rutas=[];
  try{
    const guardados=await SB.listarArchivos(codigo+'/');
    rutas=(guardados||[]).filter(a=>a&&a.name).map(a=>`${codigo}/${a.name}`);
  }catch(e){
    console.warn('no pude listar el depósito, uso las direcciones guardadas',e);
    const idx=await indice(codigo);
    for(const i of idx){
      const it=await item(codigo,i.id);
      const u=it&&urlSegura(it.data);
      if(u&&u.includes('/ce-medios/')) rutas.push(u.split('/ce-medios/')[1].split('?')[0]);
    }
  }
  /* ce-rollos tiene dos niveles (codigo/token/archivo.jpg): listar por
     prefijo solo trae las carpetas, así que pedimos las rutas reales a la
     base ANTES de borrar el evento (al borrarlo, cae en cascada). */
  let rutasRollo=[];
  try{ rutasRollo=await SB.rpc('ce_rutas_rollo',{p_codigo:codigo},clave)||[]; }
  catch(e){ console.warn('no pude listar las fotos del rollo',e); }
  /* Las filas primero: la base solo deja borrar archivos de eventos que ya
     no existen, así nadie puede vaciarle el depósito a una fiesta en curso. */
  paso('Borrando los recuerdos…');
  await SB.borrar('ce_items',`codigo=eq.${encodeURIComponent(codigo)}`,clave);
  paso('Borrando el evento…');
  await SB.borrar('ce_eventos',`codigo=eq.${encodeURIComponent(codigo)}`,clave);
  if(rutas.length){
    paso(`Borrando ${rutas.length} archivo${rutas.length>1?'s':''}…`);
    try{ await SB.borrarArchivos(rutas,clave); }
    catch(e){ console.warn('quedaron archivos sin borrar',e); }
  }
  if(rutasRollo.length){
    try{ await SB.borrarArchivos(rutasRollo,clave,'ce-rollos'); }
    catch(e){ console.warn('quedaron fotos del rollo sin borrar',e); }
  }
  olvidarClaveDe(codigo);
  for(const k of Object.keys(cacheItem)) if(k.startsWith(codigo)) delete cacheItem[k];
  return {archivos:rutas.length};
}

async function cambiarEstado(c,id,estado){
  if(!HAY_NUBE){
    const idx=await leerLocal(kIndex(c),[]); const f=idx.find(i=>i.id===id); if(f) f.estado=estado;
    await local.set(kIndex(c),idx);
    const it=await item(c,id); if(it){it.estado=estado; await local.set(kItem(c,id),it); cacheItem[c+id]=it;}
    return;
  }
  await SB.editar('ce_items',`id=eq.${encodeURIComponent(id)}`,{estado},claveDe(c));
  const k=c+id; if(cacheItem[k]) cacheItem[k].estado=estado;
}
const leer=leerLocal;

function recado(t,accion){
  const el=document.getElementById('recado');
  el.textContent=t;
  el.classList.toggle('con-accion',!!accion);
  if(accion){
    const b=document.createElement('button');
    b.className='recado-accion'; b.textContent=accion.texto;
    b.onclick=()=>{ el.classList.remove('on','con-accion'); clearTimeout(el._t); accion.hacer(); };
    el.appendChild(b);
  }
  el.classList.add('on');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on','con-accion'),accion?7000:2800);
}
/* El tamaño 10x15 se aplicaba a TODA la app: al "Guardar en PDF" del álbum
   también le salía hoja postal. Ahora se activa solo en la vista del cartel. */
/* La hoja de tarjetas va en A4; el cartel de mesa en 10x15. Cada vista
   pone la suya y parar() las saca: si queda puesta, el "Guardar en PDF"
   del álbum sale en el tamaño equivocado. Ya pasó una vez. */
function hojaA4(activar){
  let e=document.getElementById('hojaA4');
  if(activar){
    if(!e){ e=document.createElement('style'); e.id='hojaA4';
      e.textContent='@page{size:A4;margin:0}'; document.head.appendChild(e); }
  }else if(e) e.remove();
}
function hojaPostal(activar){
  let e=document.getElementById('hojaPostal');
  if(activar){
    if(!e){
      e=document.createElement('style'); e.id='hojaPostal';
      e.textContent='@page{size:105mm 148mm;margin:0}';
      document.head.appendChild(e);
    }
  }else if(e) e.remove();
}
let relojes=[];
/* cualquier intervalo de una vista se registra acá para que se apague al salir */
const reloj=(fn,ms)=>{ const id=setInterval(fn,ms); relojes.push(id); return id; };
const parar=()=>{
  relojes.forEach(clearInterval); relojes=[];
  if(timerSala){clearInterval(timerSala);timerSala=null;}
  if(window._limpiarSala){window._limpiarSala();window._limpiarSala=null;}
  if(window._soltarMicro){window._soltarMicro();window._soltarMicro=null;}
  hojaPostal(false);
  hojaA4(false);
};

/* solapas con barra inferior: las usan el panel y el álbum */
function activarSolapas(inicial, saltarArriba){
  const botones=[...app.querySelectorAll('[data-sol]')];
  if(!botones.length) return;
  const paneles=botones.map(b=>document.getElementById(b.dataset.sol)).filter(Boolean);
  let primera=true;
  const mostrar=id=>{
    botones.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.sol===id)));
    paneles.forEach(s=>{
      const activo=s.id===id;
      s.hidden=!activo;
      if(activo){ s.style.animation='none'; void s.offsetWidth; s.style.animation=''; }
    });
    /* Al cambiar de solapa sí se sube; al REDIBUJAR la misma (después de
       guardar), no: el organizador estaba a mitad de una pantalla larga. */
    if(!(primera && saltarArriba===false)) window.scrollTo({top:0,behavior:'smooth'});
    primera=false;
  };
  botones.forEach(b=>b.onclick=()=>mostrar(b.dataset.sol));
  mostrar(inicial&&paneles.some(s=>s.id===inicial)?inicial:botones[0].dataset.sol);
}
const solapa=(id,icono,texto,globo)=>
  `<button role="tab" data-sol="${id}" aria-selected="false">${icono}<em>${texto}</em>${globo||''}</button>`;

/* los números suben en vez de aparecer de golpe */
function contarHasta(el,fin,ms){
  if(!el) return;
  const n=Number(fin)||0;
  if(!n||matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent=n; return; }
  const t0=performance.now(), d=ms||900;
  (function paso(t){

const DIAS_QUE_VIVE=90;

/* Días de CALENDARIO que faltan. 0 = se borra hoy, negativo = ya venció.
   En días de acá, no en horas ni en UTC: restando milisegundos, "vence
   hoy" daba "queda un día" y "faltan nueve" daba diez. Y con toISOString
   de por medio, después de las nueve de la noche ya era mañana. */
const diasParaVencer=vence=>{
  const p=String(vence||'').slice(0,10).split('-');
  if(p.length!==3) return null;
  const v=new Date(+p[0], +p[1]-1, +p[2]);
  if(isNaN(v)) return null;
  const h=new Date(), hoy0=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  return Math.round((v-hoy0)/86400000);
};
/* El código del evento ES la llave: con él se sube al muro y se abre el
   álbum. Estaba saliendo de Math.random().toString(16).slice(2,8), que
   tiene tres problemas: no es azar de verdad (se puede predecir viendo
   unos pocos), a veces devuelve MENOS de seis dígitos (0.5 da "0.8", y
   ahí el código quedaba de una sola letra), y como guardar un evento es un
   "upsert" dos códigos iguales no dan error: uno pisa al otro y se lleva
   puesta la fiesta de otro cliente. El rollo ya lo tenía así; el muro no. */
const nuevoCodigo=tipo=>{
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const n=new Uint32Array(6);
  try{ crypto.getRandomValues(n); }
  catch(e){ for(let i=0;i<n.length;i++) n[i]=Math.floor(Math.random()*4294967296); }
  return (TIPOS[tipo]||'EVE')+'-'+[...n].map(x=>abc[x%abc.length]).join('');
};
/* ── el código, como lo escribe una persona ──
   El invitado lo lee del cartel de la mesa, con el teléfono en una mano y
   un vaso en la otra. Escribe en minúscula, se come el guión, o directamente
   no escribe el "QUI-" porque son cuatro toques más en un teclado chico.
   Todo eso tiene que entrar igual: normalizamos nosotros en vez de pedirle
   precisión a alguien que está en una fiesta.
   Los prefijos van de más largo a más corto: si no, "DEMO-FIESTA" se
   partiría como "DEM-OFIESTA". */
const PREFIJOS=[...new Set([...Object.values(TIPOS),'EVE','DEMO'])]
  .sort((a,b)=>b.length-a.length);
const normalizarCodigo=v=>{
  /* El guión que la persona SÍ escribió no se toca nunca: sacarlo rompe
     cualquier código cuyo prefijo no esté en la lista —"TEST-1" quedaba
     "TEST1"— y eso es destruir un dato bueno. Solo lo AGREGAMOS cuando
     falta y reconocemos el prefijo. */
  const s=String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9-]/g,'')
    .replace(/^-+|-+$/g,'');
  if(s.includes('-')) return s;
  for(const p of PREFIJOS) if(s.length>p.length && s.startsWith(p)) return p+'-'+s.slice(p.length);
  return s;
};
/* Y si vino solo la parte del final, probamos los prefijos hasta dar con
   la fiesta. Son cinco consultas en el peor caso, y solo cuando hace falta:
   la alternativa es hacerle escribir cuatro caracteres que ya sabemos. */
async function resolverCodigo(v){
  const s=normalizarCodigo(v);
  if(!s) return null;
  if(s.includes('-')) return (await meta(s)) ? s : null;
  for(const p of PREFIJOS){
    const c=p+'-'+s;
    if(await meta(c)) return c;
  }
  return null;
}

/* Achica la foto y devuelve un archivo listo para subir.
   No convierte a texto en ningún momento: eso era lo que rompía en iPhone. */
async function comprimirBlob(file,max=1400,q=.7){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;
    });
    const e=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');
    c.width=Math.round(im.width*e); c.height=Math.round(im.height*e);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',q));
    return b||file;
  }catch(e){
    console.warn('no pude comprimir, subo el original',e);
    return file;
  }finally{ URL.revokeObjectURL(url); }
}
/* ── miniaturas ──
   El álbum baja las fotos ENTERAS para mostrarlas del tamaño de una uña:
   con 1500 recuerdos son cientos de megas cada vez que alguien lo abre, y
   el tráfico es lo único que puede hacer pasar el límite de Supabase.
   Se genera al subir, en el mismo lugar donde ya se comprime, y ocupa un
   5% más de depósito.
   Va a un camino por convención —FOTO.jpg → FOTO-min.jpg— y no a una
   columna nueva: así no hace falta tocar la base, y las fotos de antes,
   que no la tienen, caen solas a la foto entera. */
const MINI_LADO=420;
async function miniaturaBlob(blob){
  const m=await comprimirBlob(blob, MINI_LADO, .62);
  /* comprimirBlob devuelve el ORIGINAL cuando no pudo. Subir el original
     como "miniatura" sería pagar el doble sin ahorrar nada. */
  return (m && m!==blob && m.size < blob.size*0.6) ? m : null;
}

/* ── traer una librería recién cuando hace falta ──
   Las dos (el dibujante de QR y el armador de zip) eran <script src>
   sincrónicos arriba de todo: nada empezaba hasta que bajaban. Y el
   invitado, que es el que está colgado del wifi del salón, no usa
   ninguna. Se memoriza la promesa, así dos llamadas seguidas piden el
   archivo una sola vez; y si falló se olvida, para que el siguiente que
   la necesite pueda volver a intentar. */
const LIBS={};
function cargarLib(src){
  if(LIBS[src]) return LIBS[src];
  return LIBS[src]=new Promise((listo,no)=>{
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>listo(true);
    s.onerror=()=>{ delete LIBS[src]; no(new Error('no se pudo cargar '+src)); };
    document.head.appendChild(s);
  });
}

   librería cargó pero no dejó nada. */
function pintarQR(nodo,texto,tam){
  nodo.innerHTML='';
  if(window.QRCode){ try{ new QRCode(nodo,{text:texto,width:tam,height:tam,correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){} }
  nodo.innerHTML=`<div style="width:${tam}px;height:${tam}px;display:grid;place-items:center;color:#111;font:500 10px Jost;text-align:center;padding:6px">${esc(texto.split('/').pop())}</div>`;
  cargarLib('lib/qrcode.min.js')
    .then(()=>{ if(nodo.isConnected && window.QRCode) pintarQR(nodo,texto,tam); })
    .catch(()=>{});   // sin librería queda el reemplazo, que ya está dibujado
}

  'Quince años y ya nos hacés llorar a todos.',
  'La mejor noche del año, sin discusión.',
  'Gracias por dejarnos ser parte de esto.',
  'Que no se termine más.'];
const DEMO_PIES=['Qué noche','La entrada','El brindis','Todos juntos','No puedo más'];

async function sembrar(){
  const b=document.getElementById('demo');
  if(b){ if(b.disabled) return; b.disabled=true; b.textContent='Preparando…'; }
  recado('Preparando la fiesta de ejemplo…');
  try{
    /* En demostración el código lleva la palabra adelante: si alguna vez
       esto llegara a la base de verdad, se ve de lejos que es de mentira. */
    const codigo = 'DEMO-FIESTA';
    const tapa=fotoDemo(3);
    /* La base exige clave para dar de alta un evento. Si ya la tenemos
       guardada de otra vez la reusamos; si no, una nueva. */
    const claveEv=claveDe(codigo)||nuevaClave();
    /* Sin moderación: en la demostración lo que manda el visitante tiene que
       aparecer EN LA PANTALLA, que es todo el punto. Con moderar en true le
       decía "Enviado, el organizador lo aprueba" y no se veía nunca. */
    const datos={codigo,nombre:'Los 15 de Delfina',fecha:enDias(12),tipo:'XV',tono:'#D9AE72',
      hashtag:'#Delfina15',lugar:'Salón Las Acacias · Rosario',
      moderar:false,cerrado:false,portada:tapa,creado:Date.now(),claveNueva:claveEv};
    /* En la nube las fotos van al depósito de archivos: antes se guardaban
       los items sin archivo y el muro quedaba con fotos vacías. */
    if(HAY_NUBE) datos.portadaBlob=await dataABlob(tapa);
    await guardarMeta(datos);
    guardarClaveDe(codigo,claveEv);
    if(!HAY_NUBE) await local.set(kIndex(codigo),[]);
    const gente=DEMO_GENTE, frases=DEMO_FRASES;
    for(let i=0;i<9;i++){
      const d=fotoDemo(i+1);
      await sumar(codigo,{id:'d'+i,kind:'foto',data:d,blob:HAY_NUBE?await dataABlob(d):null,
        autor:gente[i],texto:i%3===0?DEMO_PIES[i%DEMO_PIES.length]:'',
        ts:Date.now()-(9-i)*60000,estado:'aprobado'});
    }
    for(let i=0;i<frases.length;i++)
      await sumar(codigo,{id:'m'+i,kind:'mensaje',data:'',autor:gente[i+3],texto:frases[i],
        ts:Date.now()-(frases.length-i)*30000,estado:'aprobado'});
    recado(HAY_DEMO?'Ejemplo listo':'Listo · fiesta cargada');
    /* En demostración se entra por donde entra un invitado, no por el panel
       del organizador: lo que se quiere mostrar es cómo se deja una foto o
       un saludo y aparece en la pantalla del salón. */
    ir(HAY_DEMO?'pantalla/'+codigo:'evento/'+codigo);
  }catch(e){
    console.error('sembrar',e);
    recado('No pude cargar la fiesta de ejemplo: '+motivo(e));
    if(b){ b.disabled=false; b.textContent='Cargar una fiesta de ejemplo'; }
  }
}

/* una sola tarjeta de evento para el panel y para los selectores */
const tarjetaEvento=(e,extra)=>{
  const abre=cuandoAbre(e);
  return `
  <button class="ev-card" data-cod="${esc(e.codigo)}" data-nom="${esc(e.nombre)}"${extra||''}>
    <span class="tapa-ev">${urlSegura(e.portada)?imgMini(e.portada,'alt=""'):ESTRELLA}</span>
    <span class="datos-ev"><b>${esc(e.nombre)}</b><span>${bonito(e.fecha)}</span>
      ${abre&&estaPorAbrir(e)?`<span class="pastilla-prog">Abre ${esc(horaLinda(abre))}</span>`:''}</span>
    <span class="codigo-ev">${esc(e.codigo)}</span></button>`;
};

const barra=(titulo,sub)=>`<div class="top"><button class="vuelve">←</button>
  <h2>${titulo}<span class="sub">${sub}</span></h2>

async function vAcceso(){
  parar(); tono();
  if(pinOK) return vPanel();
  const guardado=guarda.leer(PIN_KEY);
  const nuevo=!guardado;
  app.innerHTML=`
  <header class="cab-inv">
    <p class="arriba">Panel del organizador</p>
    <h1>${nuevo?'Creá tu clave':'Tu clave'}</h1>
    <button class="volver">Salir</button>
  </header>
  <div class="wrap-inv" style="max-width:430px;padding-bottom:40px">
    <div class="tarjeta principal" style="margin-top:10px;text-align:center">
      <div style="width:56px;height:56px;border:1px solid var(--hilo);border-radius:50%;
        display:grid;place-items:center;margin:0 auto 22px;color:var(--oro)">${ESTRELLA}</div>
      <p style="font-size:14px;color:#B5AC9E;line-height:1.7;margin-bottom:26px">
        ${nuevo?'Elegí una clave de 4 a 8 números. La vas a necesitar cada vez que entres al panel.'
               :'Solo vos entrás acá. Los invitados no necesitan clave.'}</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"
        style="text-align:center;font-size:26px;letter-spacing:.5em;padding:16px 0">
      <button class="oro-btn" id="entrar" style="margin-top:22px">${nuevo?'Crear y entrar':'Entrar'}</button>
      ${nuevo?'':'<p class="pie-nota">Si la olvidaste, escribinos y la reiniciamos.</p>'}
      <!-- La clave del panel es un número corto: sirve de traba en este
           aparato y nada más. La de administrador abre todos los eventos de
           todos los clientes, así que tiene que poder ser larga, y para eso
           necesita su propio campo. -->
      ${HAY_DEMO?'':`<button id="modoAdmin" style="margin-top:18px;font-size:11.5px;letter-spacing:.16em;
        text-transform:uppercase;color:var(--mute)">Entrar como administrador</button>`}
    </div>
  </div>`;
  app.querySelector('.cab-inv .volver').onclick=()=>HAY_DEMO?ir('pantalla/DEMO-FIESTA'):ir('portada');
  const campo=app.querySelector('#pin');
  campo.focus();
  const probar=async()=>{
    const v=campo.value.trim();
    if(v.length<4) return recado('Mínimo 4 números');
    /* la clave maestra entra siempre, haya o no clave en este teléfono */
    if(await esMaestra(v)){
      esAdmin=true; guarda.escribirSesion('ce:admin','1');
      claveMaestra=v; guarda.escribirSesion('ce:maestra',v);
      pinOK=true; guarda.escribirSesion('ce:pinOK','1');
      recado('Entraste como administrador');
      return vPanel();
    }
    if(nuevo){
      /* Clave nueva: se guarda y se entra. No hay con qué compararla.
         Antes esta rama caía igual en la comparación de abajo y, como no
         existía clave guardada, nadie podía crear la suya. */
      if(!guarda.escribir(PIN_KEY,v))
        return recado('Tu navegador no deja guardar la clave. Probá sin modo privado.');
    }else if(v!==guardado){
      campo.value=''; return recado('Clave incorrecta');
    }
    esAdmin=false; guarda.escribirSesion('ce:admin','0');
    claveMaestra=''; guarda.escribirSesion('ce:maestra','');
    pinOK=true; guarda.escribirSesion('ce:pinOK','1');
    vPanel();
  };
  app.querySelector('#entrar').onclick=probar;
  campo.onkeydown=e=>{ if(e.key==='Enter') probar(); };
  const bAdmin=app.querySelector('#modoAdmin');
  if(bAdmin) bAdmin.onclick=()=>{
    campo.value='';
    campo.maxLength=64;
    campo.removeAttribute('inputmode');
    campo.placeholder='Clave de administrador';
    campo.style.fontSize='17px';
    campo.style.letterSpacing='.1em';
    campo.dataset.admin='1';
    bAdmin.remove();
    campo.focus();
    recado('Entrá con la clave que abre todos los eventos');
  };
}

      <button data-ir="codigo" style="font-size:11px;letter-spacing:.18em;
        text-transform:uppercase;color:var(--oro)">Entrar con un código</button></div>
    <div class="tarjeta">
      <!-- ── el código de activación ──
           Va PRIMERO porque es la puerta: sin él la base no crea el
           evento, y descubrirlo después de llenar todo el formulario es
           peor. Con la clave maestra no aparece: ahí lo arma el dueño. -->
      ${esAdmin?'':`<div class="campo"><label for="act">Código de activación</label>
        <input id="act" type="text" autocapitalize="characters" autocomplete="off"
          placeholder="CE-XXXXXXXX" style="letter-spacing:.14em">
        <p class="pie-nota" style="margin-top:8px">Te lo damos cuando contratás.
          ¿Todavía no? <a href="/#contacto" style="color:var(--oro)">Escribinos</a>.</p></div>`}
      <div class="campo"><label for="n">Nombre</label><input id="n" type="text" placeholder="Sana · Flor y Juan · Los 40 de papá" maxlength="34"></div>
      <div class="campo"><label for="f">Fecha</label><input id="f" type="date" value="${hoy()}"></div>
      <div class="campo"><label for="t">Tipo de evento</label><select id="t">${Object.keys(TIPOS).map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="campo"><label>Tono del evento</label>
        <div class="tonos">${TONOS.map((t,i)=>`<button class="tono" data-c="${t.c}" aria-pressed="${i===0}" title="${t.n}" style="background:${t.c}"></button>`).join('')}</div></div>
      <!-- ── la puerta ──

           tratamos por su cuenta y orden (art. 25, Ley 25.326). Lo que él
           declara acá es lo único que no podemos cumplir por él: avisarles a
           sus invitados y tener el consentimiento de imagen, sobre todo el de
           los menores. Sin esto marcado no se crea el evento, y el momento
           queda guardado en la fila (columna "acepto"). -->
      <label class="acepto"><input type="checkbox" id="aceptoT">
        <span>Me hago cargo de avisarles a mis invitados que va a haber muro y
        cámara, y de tener el permiso de las personas que aparezcan —incluidos
        los menores, de sus padres o tutores—.
        <a href="/terminos#responsable" target="_blank" rel="noopener">Leer los Términos</a>.</span></label>
      <button class="oro-btn" id="crear" style="margin-top:12px">Crear evento</button>
    </div>
  </div>`;
  app.querySelector('.cab-inv .volver').onclick=()=>HAY_DEMO?ir('pantalla/DEMO-FIESTA'):ir('portada');
  contador('#n');
  app.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>ir(b.dataset.ir));
  app.querySelectorAll('[data-cod]').forEach(b=>{
    b.onclick=()=>ir('evento/'+b.dataset.cod);
    let t=null;
    const arranca=()=>{ t=setTimeout(async()=>{
      if(!confirm('¿Ocultar "'+b.dataset.nom+'" de la lista?')) return;
      try{
        await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(b.dataset.cod)}`,{nombre:'[oculto] '+b.dataset.nom});
        recado('Evento oculto'); vPanel();
      }catch(e){ recado('No se pudo: '+motivo(e)); }
    }, 700); };
    const corta=()=>clearTimeout(t);
    b.addEventListener('touchstart',arranca,{passive:true});
    b.addEventListener('touchend',corta);
    b.addEventListener('touchmove',corta);
  });
  let color=TONOS[0].c;
  app.querySelectorAll('.tono').forEach(b=>b.onclick=()=>{
    app.querySelectorAll('.tono').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); color=b.dataset.c; tono(color);
  });
  app.querySelector('#crear').onclick=async()=>{
    const nombre=app.querySelector('#n').value.trim();
    if(!nombre) return recado('Falta el nombre del evento');
    const casilla=app.querySelector('#aceptoT');
    if(casilla && !casilla.checked){
      casilla.closest('.acepto').classList.add('falta');
      casilla.focus();
      return recado('Falta aceptar: sos vos quien tiene el permiso de tus invitados');
    }
    const tipo=app.querySelector('#t').value;
    const fEv=app.querySelector('#f').value||hoy();
    const btn=app.querySelector('#crear');
    if(btn.disabled) return;               // evita crear dos veces con doble toque
    btn.disabled=true; btn.textContent='Creando…';
    const claveEv=nuevaClave();
    const campoAct=app.querySelector('#act');
    const activacion=campoAct?campoAct.value.trim().toUpperCase():'';
    if(campoAct && !activacion){
      btn.disabled=false; btn.textContent='Crear evento';
      campoAct.focus();
      return recado('Falta el código de activación');
    }
    try{
      let codigo=nuevoCodigo(tipo);
      for(let i=0;i<5&&!(await codigoLibre(codigo));i++) codigo=nuevoCodigo(tipo);
      await guardarMeta({codigo,nombre,fecha:fEv,tipo,tono:color,vence:venceDe(fEv),
        moderar:false,cerrado:false,portada:null,creado:Date.now(),
        acepto:Date.now(),claveNueva:claveEv,activacion});
      if(!HAY_NUBE) await local.set(kIndex(codigo),[]);
      guardarClaveDe(codigo,claveEv);
      btn.textContent='✓ Evento creado';
      window.scrollTo({top:0,behavior:'smooth'});
      vClaveNueva({codigo,nombre},claveEv);
    }catch(e){
      console.error('crear evento',e);
      btn.disabled=false; btn.textContent='Crear evento';
      recado('No se pudo crear el evento: '+motivo(e));
    }
  };
}

/* ══════════ limpieza: los 90 días, ejecutados ══════════
   El aviso que ve el organizador en Compartir le dice que el álbum se
   borra, pero un aviso no borra nada: alguien tiene que pasar el trapo. Sin
   esta pantalla, la promesa de los 90 días era una frase en la interfaz y
   el depósito seguía creciendo para siempre, que es justo lo que se paga.
   Es del administrador porque mira TODOS los eventos, no los de un
   teléfono. No hay tarea automática en el servidor: esto es el barrido, y
   se hace a mano una vez por mes mirando la lista. */
const estadoVence=e=>{
  const vence=e.vence||venceDe(e.fecha)||'';
  return {...e, vence, d:diasParaVencer(vence)};
};
function pastillaVence(d){
  if(d===null) return `<span class="pastilla-d">sin fecha</span>`;
  if(d<0)  return `<span class="pastilla-d ya">venció hace ${-d} día${d===-1?'':'s'}</span>`;
  if(d===0) return `<span class="pastilla-d ya">vence hoy</span>`;
  if(d<=AVISAR_DESDE) return `<span class="pastilla-d pronto">${d} día${d===1?'':'s'}</span>`;
  return `<span class="pastilla-d">${d} días</span>`;
}
/* Qué servicio tiene cada evento. La tabla es una sola y `camara` es lo
   único que distingue: un evento nacido en el rollo la tiene en true. Al
   muro se entra siempre, porque cualquier código sirve de muro. */
const tieneRollo=e=>!!e.camara;
const filaVence=(e,borrable)=>`
  <div class="fila-vence" data-fila="${esc(e.codigo)}">
    <span class="quien"><b>${esc(e.nombre)}</b>
      <span>${esc(e.codigo)} · ${e.vence?'hasta '+bonito(e.vence):'sin vencimiento'}
        ${e.cerrado?' · cerrado':''}${tieneRollo(e)&&e.revelado?' · revelado':''}</span></span>
    ${pastillaVence(e.d)}
    <span class="entrar-ev">
      <!-- La puerta para GUARDAR, y va primero. Esta pantalla borraba las
           fotos de un cliente para siempre y no ofrecía en ningún lado
           bajarlas antes: había que entrar al evento y buscar el botón.
           Hoy las fotos viven en un solo lugar, así que este enlace es el
           único respaldo que existe. -->
      <a class="btn-fila ir guardar" href="#album/${esc(e.codigo)}"
         title="Abrir el álbum para bajarlo antes de borrarlo">Bajar</a>
      <a class="btn-fila ir" href="#evento/${esc(e.codigo)}">Muro</a>
      ${tieneRollo(e)?`<a class="btn-fila ir" href="rollo#ev/${esc(e.codigo)}">Rollo</a>`:''}
    </span>
    ${borrable?`<button class="btn-fila" data-borra="${esc(e.codigo)}"
      data-nom="${esc(e.nombre)}">Borrar</button>`:''}
  </div>`;

async function vLimpieza(){
  parar(); tono();
  /* Sin la clave maestra esta pantalla no tiene nada que mostrar: eventos()
     devolvería solo los de este teléfono y "borrá los vencidos de todos"
     sería mentira. */
  if(!esAdmin) return ir('panel');
  const evs=(await eventos()).map(estadoVence)
    .sort((a,b)=>(a.d===null?1e9:a.d)-(b.d===null?1e9:b.d));
  const vencidos=evs.filter(e=>e.d!==null&&e.d<0);
  const cerca   =evs.filter(e=>e.d!==null&&e.d>=0&&e.d<=AVISAR_DESDE);
  const resto   =evs.filter(e=>e.d===null||e.d>AVISAR_DESDE);
  app.innerHTML=`
  <header class="cab-inv">
    <p class="arriba">Administrador</p>
    <h1>Central</h1>
    <button class="volver">Salir</button>
  </header>
  <div class="wrap-inv" style="padding-bottom:40px">
    <p style="font-size:13.5px;line-height:1.8;color:#B5AC9E;margin:0 0 8px">
      Todos los eventos del negocio, ordenados por lo que les queda. Desde acá
      se entra a cualquiera —al muro o al rollo— sin depender del teléfono donde
      se creó. Cada álbum vive <b style="color:var(--oro);font-weight:400">${DIAS_QUE_VIVE} días</b>
      desde la fecha del evento y el organizador recibe el aviso ${AVISAR_DESDE} días antes.
      Borrar elimina el evento y todos sus archivos, y no se puede deshacer.</p>

    <!-- ── los códigos de activación ──
         Es lo primero porque es lo que se hace después de vender: el
         cliente paga por WhatsApp, vos generás un código y se lo pasás.
         Sin un código la base NO crea el evento (sql/activacion.sql), así
         que esta pantalla es la caja registradora del negocio. -->
    <div class="seccion-a" style="margin-top:26px"><h2>Códigos de activación</h2>
      <span id="cuentaCod"></span></div>
    <div class="tarjeta">
      <p style="font-size:13px;line-height:1.75;color:#B5AC9E;margin:0 0 16px">
        Uno por evento vendido, y se gasta al usarlo. Sin código, nadie puede
        crear un evento — salvo vos con esta clave.</p>
      <div class="campo" style="margin-bottom:14px">
        <label for="notaCod">¿Para quién es? (opcional)</label>
        <input id="notaCod" type="text" maxlength="60" placeholder="Delfina · 15 · pagó 20/10"></div>
      <button class="oro-btn" id="nuevoCod">Generar un código</button>
      <div id="codRecien" hidden style="margin-top:18px;text-align:center">
        <p class="rotulito" style="margin:0 0 8px">Pasale esto al cliente</p>
        <p class="clave-gr" id="codTexto" style="margin:0"></p>
        <button class="hilo-btn" id="copiarCod" style="margin-top:12px">Copiar</button></div>
      <div id="listaCod" style="margin-top:18px"></div>
    </div>

    <div class="seccion-a"><h2>Ya vencidos</h2><span>${vencidos.length}</span></div>
    ${vencidos.length?`<div class="tarjeta peligro">
        ${vencidos.map(e=>filaVence(e,true)).join('')}
        <div id="zonaTodos" style="margin-top:20px">
          <button class="btn-peligro" id="pedirTodos">${vencidos.length===1
            ?'Borrar el vencido':'Borrar los '+vencidos.length+' vencidos'}</button>
        </div>
      </div>`
      :`<div class="vacio" style="padding:34px 24px">No hay ninguno vencido.</div>`}

    <div class="seccion-a"><h2>Vencen pronto</h2><span>${cerca.length}</span></div>
    ${cerca.length?`<div class="tarjeta">${cerca.map(e=>filaVence(e,false)).join('')}</div>`
      :`<div class="vacio" style="padding:34px 24px">Ninguno en los próximos ${AVISAR_DESDE} días.</div>`}

    <div class="seccion-a"><h2>El resto</h2><span>${resto.length}</span></div>
    ${resto.length?`<div class="tarjeta">${resto.map(e=>filaVence(e,false)).join('')}</div>`
      :`<div class="vacio" style="padding:34px 24px">No hay más eventos.</div>`}
  </div>`;
  app.querySelector('.cab-inv .volver').onclick=()=>ir('panel');

  /* Un toque no borra: el botón se vuelve "Confirmar" y vuelve atrás solo a
     los cinco segundos. Es la misma idea que el campo donde hay que
     escribir el código en Ajustes, pero para una lista. */
  /* Los enlaces de la fila van con el enrutador de la app, no con una
     recarga: "Muro" es un hash de esta misma página. El del rollo sí es
     otra página y se deja pasar. */
  app.querySelectorAll('.entrar-ev a[href^="#"]').forEach(a=>a.onclick=e=>{
    e.preventDefault(); ir(a.getAttribute('href').slice(1));
  });
  app.querySelectorAll('[data-borra]').forEach(b=>{
    let armado=null;
    b.onclick=async()=>{
      if(!armado){
        armado=setTimeout(()=>{ armado=null; b.textContent='Borrar'; b.classList.remove('firme'); },5000);
        b.textContent='Confirmar'; b.classList.add('firme');
        return;
      }
      clearTimeout(armado); armado=null;
      b.disabled=true;
      try{
        await borrarEvento(b.dataset.borra, t=>{ b.textContent=t; });
        recado(`"${b.dataset.nom}" eliminado`);
        vLimpieza();
      }catch(err){
        console.error('borrar vencido',err);
        b.disabled=false; b.textContent='Borrar'; b.classList.remove('firme');
        recado('No se pudo eliminar: '+motivo(err));
      }
    };
  });

  /* ── los códigos de activación ──
     Todo esto aguanta que la base todavía no tenga sql/activacion.sql:
     primero la web, después el SQL. Mientras no esté, PostgREST contesta
     PGRST202 y se lo decimos sin asustar. */
  const sinCandado=t=>/PGRST202|does not exist|Could not find the function/i.test(String(t||''));
  const pintarCodigos=async()=>{
    const caja=app.querySelector('#listaCod'), cuenta=app.querySelector('#cuentaCod');
    if(!caja) return;
    let lista=[];
    try{ lista=await SB.rpc('ce_codigos_lista',{},claveMaestra)||[]; }
    catch(e){
      caja.innerHTML=`<p class="pie-nota">${sinCandado(e&&e.message)
        ? 'El candado del alta todavía no está puesto en la base.'
        : 'No pude traer los códigos: '+esc(motivo(e))}</p>`;
      return;
    }
    const libres=lista.filter(c=>!c.usado_en);
    if(cuenta) cuenta.textContent=`${libres.length} sin usar`;
    caja.innerHTML=lista.length?`
      <p class="rotulito" style="margin:0 0 10px">Los últimos</p>
      ${lista.slice(0,12).map(c=>`<div class="fila-res">
        <span style="letter-spacing:.1em${c.usado_en?';opacity:.45;text-decoration:line-through':''}">${esc(c.codigo)}</span>
        <b style="font-size:11.5px;color:${c.usado_en?'var(--mute)':'var(--oro)'}">${
          c.usado_en?('usado · '+esc(c.usado_por||'')):(esc(c.nota||'sin nota'))}</b></div>`).join('')}`
      :`<p class="pie-nota">Todavía no generaste ninguno.</p>`;
  };
  const bCod=app.querySelector('#nuevoCod');
  if(bCod) bCod.onclick=async()=>{
    if(bCod.disabled) return;
    bCod.disabled=true; bCod.textContent='Generando…';
    try{
      const nota=(app.querySelector('#notaCod').value||'').trim();
      const r=await SB.rpc('ce_crear_codigo',{p_nota:nota},claveMaestra);
      const cod=r&&r.codigo;
      if(!cod) throw new Error('la base no devolvió el código');
      app.querySelector('#codTexto').textContent=cod;
      app.querySelector('#codRecien').hidden=false;
      app.querySelector('#notaCod').value='';
      app.querySelector('#copiarCod').onclick=()=>copiarTexto(cod,'Código copiado');
      await pintarCodigos();
    }catch(e){
      recado(sinCandado(e&&e.message)
        ? 'Falta correr sql/activacion.sql en la base'
        : 'No se pudo generar: '+motivo(e));
    }
    bCod.disabled=false; bCod.textContent='Generar un código';
  };
  pintarCodigos();

  const pedir=app.querySelector('#pedirTodos');
  if(pedir) pedir.onclick=()=>{
    const zona=app.querySelector('#zonaTodos');
    zona.innerHTML=`
      <!-- Lo que hay que decir ANTES, no después: hoy las fotos viven en un
           solo lugar. Lo que se borra acá no está en ninguna otra parte, y
           el que aprieta el botón es el único que puede saber si esos
           álbumes ya se bajaron. -->
      <p class="aviso-copia">Las fotos de estos eventos <b>no están guardadas en
        ningún otro lado</b>. Si querés quedarte con alguna, bajá el álbum
        primero con el botón <b style="color:var(--oro)">Bajar</b> de cada fila.</p>
      <div class="campo" style="margin-bottom:14px">
        <label for="confBorrar">Escribí <b style="color:#E08A82">BORRAR</b> para confirmar</label>
        <input id="confBorrar" type="text" autocomplete="off" autocapitalize="characters" placeholder="BORRAR"></div>
      <button class="btn-peligro firme" id="todosYa" disabled>${vencidos.length===1
        ?'Borrar el vencido':'Borrar los '+vencidos.length+' vencidos'}</button>
      <button class="hilo-btn" id="dejarTodos">Mejor no</button>`;
    const campo=zona.querySelector('#confBorrar');
    const ok=zona.querySelector('#todosYa');
    campo.focus();
    campo.oninput=()=>{ ok.disabled = campo.value.trim().toUpperCase()!=='BORRAR'; };
    zona.querySelector('#dejarTodos').onclick=()=>vLimpieza();
    ok.onclick=async()=>{
      if(ok.disabled) return;
      ok.disabled=true; campo.disabled=true;
      /* De a uno y sin cortar la tanda: si uno falla, los demás se borran
         igual y al final se dice cuántos quedaron. Prometer "listo" cuando
         algo no se borró es exactamente lo que no se hace acá. */
      let hechos=0; const fallados=[];
      for(let i=0;i<vencidos.length;i++){
        ok.textContent=`Borrando ${i+1} de ${vencidos.length}…`;
        try{ await borrarEvento(vencidos[i].codigo); hechos++; }
        catch(err){ console.error('borrar vencido',vencidos[i].codigo,err); fallados.push(vencidos[i].codigo); }
      }
      recado(fallados.length
        ? `Se borraron ${hechos} de ${vencidos.length}. Quedaron sin borrar: ${fallados.join(', ')}`
        : `Listo: ${hechos} evento${hechos===1?'':'s'} eliminado${hechos===1?'':'s'}`);
      vLimpieza();
    };
  };
}

/* Copiar sin mentir: si el navegador no deja, se muestra el texto. */
async function copiarTexto(texto,aviso){
  try{
    if(!navigator.clipboard) throw new Error('sin portapapeles');
    await navigator.clipboard.writeText(texto);
    return recado(aviso||'Copiado');
  }catch(e){
    const t=document.createElement('textarea');
    t.value=texto; t.setAttribute('readonly','');
    t.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0,99999);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    t.remove();
    recado(ok?(aviso||'Copiado'):'Copialo a mano: '+texto);
  }
}

/* ¿La base ya tiene las claves instaladas? Mientras no se corra el SQL, la
   función no existe: en ese rato no le pedimos clave a nadie, porque nadie
   la tendría y quedarían todos afuera de sus propios eventos. */
let baseConClaves=guarda.leerSesion('ce:conClaves');
async function laBaseSabeDeClaves(){
  if(baseConClaves==='si') return true;
  if(baseConClaves==='no') return false;
  try{
    await SB.quienSoy(null,'');
    baseConClaves='si';
  }catch(e){
    const t=String((e&&e.message)||'');
    /* solo damos por vieja a la base si la función no existe; si el problema
       es la red, no abrimos la puerta por las dudas */
    baseConClaves=/PGRST202|does not exist|not find the function|404/i.test(t)?'no':'si';
  }
  guarda.escribirSesion('ce:conClaves',baseConClaves);
  return baseConClaves==='si';
}

/* Sin la clave de este evento no se entra al panel. La valida la base. */
function vPedirClave(codigo,m){
  parar(); tono(m&&m.tono);
  app.innerHTML=`
  <header class="cab-inv">
    <p class="arriba">Panel del evento</p>
    <h1>${esc((m&&m.nombre)||codigo)}</h1>
    <button class="volver">Salir</button>
  </header>
  <div class="wrap-inv" style="max-width:430px;padding-bottom:40px">
    <div class="tarjeta principal" style="text-align:center">
      <div style="width:56px;height:56px;border:1px solid var(--hilo);border-radius:50%;
        display:grid;place-items:center;margin:0 auto 22px;color:var(--oro)">${ESTRELLA}</div>
      <p style="font-size:14px;color:#B5AC9E;line-height:1.7;margin-bottom:24px">
        Para moderar o cambiar algo de este evento hace falta su clave.
        Es la que se mostró al crearlo.</p>
      <input id="claveEv" type="text" autocomplete="off" autocapitalize="characters"
        placeholder="CLAVE" style="text-align:center;font-size:24px;letter-spacing:.3em;padding:15px 0">
      <button class="oro-btn" id="entrarEv" style="margin-top:22px">Entrar</button>
      <p class="pie-nota">También sirve la clave de administrador.</p>
    </div>
  </div>`;
  app.querySelector('.cab-inv .volver').onclick=()=>ir('panel');
  const campo=app.querySelector('#claveEv');
  campo.focus();
  const probar=async()=>{
    const v=campo.value.trim();
    if(v.length<4) return recado('Clave muy corta');
    const b=app.querySelector('#entrarEv');
    b.disabled=true; b.textContent='Comprobando…';
    try{
      const r=await SB.quienSoy(codigo,v);
      if(r&&r.puede_editar){
        /* Si es la maestra NO va al disco. Antes iba a ce:claves como si
           fuera la clave de este evento: la llave que abre TODOS los
           eventos de todos los clientes quedaba escrita en el localStorage
           de ese teléfono, para siempre. La base ya nos dice cuál es
           (es_maestra) y lo estábamos ignorando. */
        if(r.es_maestra){
          esAdmin=true; guarda.escribirSesion('ce:admin','1');
          claveMaestra=v; guarda.escribirSesion('ce:maestra',v);
          recado('Entraste con la clave de administrador');
        }else{
          guardarClaveDe(codigo,v);
          recado('Listo');
        }
        return redibujar(codigo);
      }
      if(r&&!r.llego_la_clave){
        recado('La clave no llega a la base. Avisale a Click Eterno.');
      }else{
        campo.value=''; recado('Clave incorrecta');
      }
    }catch(e){
      console.error('comprobar clave',e);
      recado('No pude comprobar la clave: '+motivo(e));
    }
    b.disabled=false; b.textContent='Entrar';
  };
  app.querySelector('#entrarEv').onclick=probar;
  campo.onkeydown=e=>{ if(e.key==='Enter') probar(); };
}

async function vEvento(codigo, abrirEn){

  if(!m){recado('No encontré ese evento'); return ir(pinOK?'panel':'codigo');}
  /* sin nube no hay base que valide: el panel queda abierto como antes */
  if(HAY_NUBE && !puedoEditar(codigo) && await laBaseSabeDeClaves())
    return vPedirClave(codigo,m);

  const gente=new Set(apro.map(i=>i.autor).filter(Boolean)).size;

           Aparece solo cuando falta poco o cuando ya venció. */
        /* Los eventos anteriores a esta cuenta no tienen 'vence' guardado.
           Si acá quedara en null el organizador no vería aviso nunca, y la
           limpieza —que sí lo calcula desde la fecha— igual los borraría a
           los 90 días. El respaldo tiene que ser el MISMO de los dos lados. */
        const vence=m.vence||venceDe(m.fecha)||'';

        <button data-ir="album/${codigo}/guardar"><span class="aro-a">${IC.guardar}</span><em>Descargar<br>todo</em></button>
