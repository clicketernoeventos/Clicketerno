<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Click Eterno · Muro en vivo</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="marca.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@200;300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@200;300;400;500&display=swap"></noscript>
<!-- Las dos librerías viven en el repo, no en un CDN. Traerlas de afuera
     era darle a un tercero permiso para correr código en la página que
     tiene a mano la clave del evento (y la maestra): si cdnjs sirviera
     otra cosa, un día cualquiera, nos enteraríamos tarde. Y de paso el
     QR y el zip andan aunque el wifi del salón no deje salir. -->
<script src="lib/qrcode.min.js"></script>
<script src="lib/jszip.min.js"></script>

<style>
:root{
  --negro:#000; --carbon:#0B0A08; --humo:#141210;
  --oro:#D9AE72; --oro-hondo:#A87B43; --champan:#EFDCBC;
  --texto:#F6F2EA; --mute:#9B9287;
  --hilo:rgba(217,174,114,.22); --hilo2:rgba(217,174,114,.45); --gris:rgba(255,255,255,.08);
  --acc:#D9AE72;
  --e:cubic-bezier(.22,.7,.24,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* foco visible con los colores de la marca (antes quedaba el del navegador) */
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
/* nombres puestos por el usuario: que corten antes de empujar la pantalla */
.cab-inv h1,.tapa-g h1,.cartel-hoja .nombre-c,.consigna p,.dedicatoria p,
.epigrafe .quien,.epigrafe .dice,.placa .cita,.placa .quien,.momento h1,.final h1{
  overflow-wrap:anywhere;word-break:break-word}
.puerta:focus-visible,.fila:focus-visible,.seg button:focus-visible{outline-offset:-2px}
.cuenta-chars{display:block;text-align:right;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);margin-top:7px;min-height:13px}
.cuenta-chars.poco{color:var(--oro)}
.aviso-peso{font-size:12.5px;line-height:1.7;color:var(--oro);border:1px solid var(--hilo);
  padding:12px 14px;margin-bottom:18px;border-radius:2px}
html,body{margin:0;background:var(--negro);color:var(--texto)}
body{font-family:Jost,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
button,input,textarea,select{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.serif{font-family:'Bodoni Moda',serif}
.ital{font-family:'Bodoni Moda',serif;font-style:italic}
.wrap{max-width:620px;margin:0 auto;padding:0 26px 130px}

/* ── firma tipográfica de la marca ── */
.espaciado{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);font-weight:300}
.dorado{color:var(--oro)}

/* ── estrella de la marca ── */
.estrella{display:inline-block;vertical-align:middle}
.estrella svg{display:block;width:100%;height:100%}
.filete{display:flex;align-items:center;gap:14px;margin:28px 0;color:var(--oro)}
.filete:before,.filete:after{content:'';height:1px;background:linear-gradient(90deg,transparent,var(--hilo2),transparent);flex:1}
.filete .estrella{width:13px;height:13px;opacity:.9}

/* ── atmósfera ── */
#brillo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%,rgba(217,174,114,.09),transparent 60%),
             radial-gradient(80% 60% at 50% 110%,rgba(217,174,114,.05),transparent 60%)}
#polvo{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#polvo i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--oro);
  opacity:0;animation:titilar 7s var(--e) infinite}
@keyframes titilar{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:.55;transform:scale(1)}}
#grano{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.045;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:3}

/* ── portada ── */
.portada{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:60px 26px;max-width:620px;margin:0 auto;text-align:center}
.logo-full{width:min(78%,320px);margin:0 auto 6px;display:block}
.portada .lema{font-size:15px;line-height:1.8;color:#B5AC9E;max-width:34ch;margin:0 auto}
.sube{opacity:0;transform:translateY(16px);animation:sube 1s var(--e) forwards}
@keyframes sube{to{opacity:1;transform:none}}

.puertas{display:grid;gap:0;margin-top:14px;text-align:left;border-top:1px solid var(--gris)}
.puerta{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:22px 4px;border-bottom:1px solid var(--gris);transition:padding-left .35s var(--e),color .35s}
.puerta:hover,.puerta:focus-visible{padding-left:12px}
.puerta .rom{font-family:'Bodoni Moda',serif;font-style:italic;font-size:22px;color:var(--oro);width:28px;flex:none}
.puerta b{display:block;font-weight:400;font-size:17px;letter-spacing:.02em}
.puerta span{display:block;font-size:13.5px;color:var(--mute);margin-top:4px;line-height:1.5}
.puerta .fl{color:var(--oro);opacity:0;transition:opacity .35s;font-size:15px}
.puerta:hover .fl{opacity:1}

/* ── barra superior ── */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:18px 26px;
  background:rgba(0,0,0,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--gris)}
.top .vuelve{color:var(--oro);font-size:19px;line-height:1;padding:2px 4px 4px 0}
.top h2{font-size:15px;font-weight:400;flex:1;letter-spacing:.03em}
.top .sub{display:block;font-size:10px;letter-spacing:.3em;color:var(--mute);margin-top:3px;text-transform:uppercase}
.top .marca{width:74px;opacity:.55}

/* ── formularios ── */
.campo{margin-bottom:22px}
.campo label{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--mute);margin-bottom:10px;text-transform:uppercase}
input[type=text],input[type=date],input[type=password],input[type=number],
input[type=tel],input[type=email],input[type=time],textarea,select{
  width:100%;max-width:100%;background:transparent;border:0;border-bottom:1px solid var(--gris);
  border-radius:0;padding:12px 2px;font-size:16.5px;font-weight:300;color:var(--texto);
  transition:border-color .3s;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.75}
textarea{min-height:88px;resize:vertical;line-height:1.6;border:1px solid var(--gris);border-radius:2px;padding:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--oro)}
select{appearance:none;background:transparent}
option{background:#0B0A08}
.tonos{display:flex;gap:14px;padding-top:4px}
.tono{width:34px;height:34px;border-radius:50%;position:relative;transition:transform .3s var(--e)}
.tono:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid transparent;transition:border-color .3s}
.tono[aria-pressed=true]:after{border-color:var(--oro)}
.tono[aria-pressed=true]{transform:scale(1.05)}

.oro-btn{width:100%;background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 55%,var(--champan));
  color:#0A0806;border-radius:2px;padding:17px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;
  transition:transform .25s var(--e),filter .3s}
.oro-btn:hover{filter:brightness(1.08)}
.oro-btn:active{transform:scale(.99)}
.oro-btn:disabled{filter:grayscale(.7);opacity:.5}
.hilo-btn{width:100%;border:1px solid var(--hilo);border-radius:2px;padding:15px;font-size:12px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--champan);margin-top:12px;transition:border-color .3s,color .3s}
.hilo-btn:hover{border-color:var(--oro);color:var(--oro)}
.pie-nota{font-size:12.5px;color:var(--mute);line-height:1.7;text-align:center;margin-top:22px}

/* ── segmentado ── */
.seg{display:flex;border-bottom:1px solid var(--gris);margin-bottom:26px}
.seg button{flex:1;padding:14px 4px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
  border-bottom:1px solid transparent;margin-bottom:-1px;transition:.3s}
.seg button[aria-pressed=true]{color:var(--oro);border-bottom-color:var(--oro)}

/* ── invitado ── */
.consigna{border:1px solid var(--hilo);border-radius:2px;padding:20px;margin-bottom:26px;text-align:center;background:rgba(217,174,114,.035)}
.consigna .et{font-size:9.5px;letter-spacing:.34em;color:var(--oro);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px}
.consigna .et .estrella{width:9px;height:9px}
.consigna p{font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.45;font-style:italic}

.lente{display:block;border:1px solid var(--gris);border-radius:2px;padding:52px 22px;text-align:center;
  margin-bottom:24px;transition:border-color .4s,background .4s}
.lente:hover{border-color:var(--hilo2);background:rgba(217,174,114,.03)}
.lente .aro{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--hilo);display:grid;place-items:center;color:var(--oro)}
.lente .aro .estrella{width:17px;height:17px}
.lente b{display:block;font-family:'Bodoni Moda',serif;font-size:21px;font-weight:400;margin-bottom:8px}
.lente span{font-size:13.5px;color:var(--mute)}
.previa{position:relative;overflow:hidden;margin-bottom:24px;border:1px solid var(--gris)}
.previa img,.previa video{width:100%;display:block;max-height:56vh;object-fit:contain;background:#000}
.previa .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1px solid var(--hilo);color:var(--champan);backdrop-filter:blur(6px)}
.onda{display:inline-flex;gap:3px;align-items:flex-end;height:15px;vertical-align:middle;margin-right:10px}
.onda i{width:2px;background:var(--oro);border-radius:2px;animation:onda .9s ease-in-out infinite}
@keyframes onda{0%,100%{height:4px}50%{height:15px}}

/* ── momento click ── */
.momento{min-height:100svh;display:grid;place-items:center;text-align:center;padding:34px}
/* el instante en que la foto llega a la pantalla: es el momento que se
   lleva el invitado, así que se le da un golpe de luz */
.chispas{position:relative;width:130px;height:130px;margin:0 auto 34px}
.chispas:before,.chispas:after{content:'';position:absolute;left:50%;top:50%;
  width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  border:1px solid var(--hilo2);opacity:0;animation:halo 1.8s var(--e) forwards}
.chispas:after{animation-delay:.34s}
@keyframes halo{0%{opacity:0;transform:scale(.25)}20%{opacity:.7}100%{opacity:0;transform:scale(3.6)}}
@keyframes brillo-c{0%,100%{filter:drop-shadow(0 0 9px rgba(217,174,114,.3))}
  50%{filter:drop-shadow(0 0 20px rgba(217,174,114,.6))}}
.chispas .estrella{position:absolute;color:var(--oro);opacity:0}
.chispas .c1{width:42px;height:42px;left:44px;top:44px;
  animation:chispa 1.1s var(--e) .05s forwards,brillo-c 3.4s var(--e) 1.3s infinite}
.chispas .c2{width:17px;height:17px;left:8px;top:24px;animation:chispa 1s var(--e) .28s forwards}
.chispas .c3{width:12px;height:12px;right:14px;top:16px;animation:chispa 1s var(--e) .42s forwards}
.chispas .c4{width:15px;height:15px;right:26px;bottom:14px;animation:chispa 1s var(--e) .56s forwards}
.chispas .c5{width:9px;height:9px;left:22px;bottom:24px;animation:chispa 1s var(--e) .68s forwards}
@keyframes chispa{0%{opacity:0;transform:scale(.2) rotate(-40deg)}60%{opacity:1;transform:scale(1.15) rotate(6deg)}100%{opacity:.95;transform:scale(1) rotate(0)}}

/* ── proyección ── */
.sala{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.tela{flex:1;position:relative;overflow:hidden}
.toma{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.4s var(--e)}
.toma.on{opacity:1}
.toma img,.toma video{width:100%;height:100%;object-fit:cover}
.toma.encaja img,.toma.encaja video{object-fit:contain}
.kb img{animation:kb 26s var(--e) forwards}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.17) translate(-1.2%,-1.2%)}}
.revelar img,.revelar video{animation:revelar 2.6s var(--e) forwards}
@keyframes revelar{
  0%{filter:blur(28px) saturate(0) brightness(1.75) contrast(.75);transform:scale(1.13)}
  55%{filter:blur(6px) saturate(.55) brightness(1.1)}
  100%{filter:none;transform:scale(1.03)}}
.destello{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.destello.va{animation:destello .6s ease-out}
@keyframes destello{0%{opacity:.8}100%{opacity:0}}
.vineta{position:absolute;inset:0;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 220px 60px rgba(0,0,0,.72)}
.epigrafe{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:130px 46px 40px;
  background:linear-gradient(transparent,rgba(0,0,0,.92) 66%)}
.epigrafe .recien{display:inline-flex;align-items:center;gap:11px;font-size:10px;letter-spacing:.4em;
  color:var(--oro);text-transform:uppercase;margin-bottom:18px}
.epigrafe .recien .estrella{width:11px;height:11px;animation:gira 3.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.epigrafe .quien{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(30px,5.6vw,52px);color:var(--champan);line-height:1}
.epigrafe .dice{font-size:clamp(15px,2.4vw,21px);margin-top:12px;color:#D9D2C6;line-height:1.5;max-width:38ch;font-weight:200}
.placa{padding:9vh 9vw;text-align:center;max-width:1200px}
.placa .cita{font-family:'Bodoni Moda',serif;font-size:clamp(28px,4.4vw,54px);line-height:1.3}
.placa .quien{margin-top:30px;font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(19px,2.4vw,28px);color:var(--oro)}
.mosaico{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.mosaico img{width:100%;height:100%;object-fit:cover;opacity:0;animation:asoma .9s var(--e) forwards}
@keyframes asoma{to{opacity:1}}
.consola{display:flex;align-items:center;gap:22px;padding:18px 30px;border-top:1px solid var(--gris);background:#000}
.consola .nom{font-family:'Bodoni Moda',serif;font-style:italic;font-size:23px;flex:1}
.envivo{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.34em;color:var(--oro);text-transform:uppercase}
.pulso{width:6px;height:6px;border-radius:50%;background:var(--oro);box-shadow:0 0 10px var(--oro);animation:late 2s infinite}
@keyframes late{50%{opacity:.25}}
.cuenta{font-family:'Bodoni Moda',serif;font-size:25px}
.cuenta small{font-family:Jost;font-size:9.5px;letter-spacing:.28em;color:var(--mute);margin-left:10px;text-transform:uppercase}
.qr-sala{background:#fff;padding:6px;line-height:0}
.qr-sala img,.qr-sala canvas{width:56px;height:56px;display:block}
.dejar{position:fixed;top:18px;right:18px;z-index:60;border:1px solid var(--hilo);border-radius:2px;
  padding:9px 18px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--champan);background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.aguarda{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:34px}
.aguarda .ital{font-size:clamp(26px,5.4vw,46px);line-height:1.25;margin-top:22px}

/* ── panel ── */
.ficha{border:1px solid var(--gris);padding:26px}
.fila{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:20px 2px;border-bottom:1px solid var(--gris);transition:padding-left .35s var(--e)}
.fila:hover{padding-left:10px}
.fila .sello{width:44px;height:44px;flex:none;border:1px solid var(--hilo);display:grid;place-items:center;
  font-family:'Bodoni Moda',serif;font-style:italic;color:var(--oro);font-size:19px;overflow:hidden}
.fila b{font-weight:400;font-size:16px}
.fila span{display:block;font-size:11px;letter-spacing:.2em;color:var(--mute);margin-top:4px;text-transform:uppercase}
.clave{font-size:11.5px;letter-spacing:.18em;color:var(--oro)}
.qr-caja{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.qr-caja .qr{background:#fff;padding:11px;line-height:0}
.qr-caja .qr img,.qr-caja .qr canvas{width:106px;height:106px;display:block}
.llave{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:1px solid var(--gris)}
.llave p{font-size:15px}
.llave small{display:block;color:var(--mute);font-size:12.5px;margin-top:5px;line-height:1.6}
.palanca{width:46px;height:24px;border-radius:0;background:transparent;border:1px solid var(--gris);position:relative;flex:none;transition:border-color .3s}
.palanca:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--mute);transition:.35s var(--e)}
.palanca[aria-pressed=true]{border-color:var(--oro)}
.palanca[aria-pressed=true]:after{transform:translateX(22px);background:var(--oro)}
.cola{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
@media(min-width:470px){.cola{grid-template-columns:1fr 1fr}}
.espera{border:1px solid var(--gris)}
.espera img,.espera video{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.espera .tx{padding:16px;font-size:14px;line-height:1.6;min-height:100px;font-family:'Bodoni Moda',serif;font-style:italic}
.espera .par{display:flex;border-top:1px solid var(--gris)}
.espera .par button{flex:1;min-width:0;padding:13px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.espera .par button+button{border-left:1px solid var(--gris)}
.si{color:var(--oro)}.no{color:#8A8177}
.cierre{text-align:center;padding-top:30px}
.cierre .filete{max-width:190px;margin:0 auto 20px}
.cierre-tit{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:400;
  font-size:clamp(30px,8.5vw,40px);margin:12px 0 8px;line-height:1.15}
.cierre-sub{font-size:13.5px;color:#B5AC9E;line-height:1.7}
.cierre-res{margin-top:20px;padding-top:18px;border-top:1px solid var(--gris);
  font-size:14px;color:#B5AC9E;line-height:1.8}
.cierre-res b{color:var(--champan);font-weight:400;font-family:'Bodoni Moda',serif;font-size:19px}
.publicados{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.publi{position:relative;border:1px solid var(--gris);overflow:hidden;aspect-ratio:1;
  min-height:0;background:#141210;cursor:pointer}
/* la imagen va fuera del flujo: si no, su alto real estira la miniatura y
   las filas quedan de distinto tamaño */
.publi img,.publi video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.publi .tx{padding:10px;font-size:11.5px;line-height:1.5;height:100%;overflow:hidden;
  display:flex;align-items:center;font-family:'Bodoni Moda',serif;font-style:italic;color:#CFC7BA}
.publi .quien{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 5px;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#E8E2D8;pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ojo: .tapa ya existe en la app y tiene un :after que se come los clics */
.publi .velo{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr;
  background:rgba(10,9,8,.93);animation:aparece .18s}
.publi .velo button{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:0 3px;width:100%}
.publi .velo .sacar{color:#FF7B94}
.publi .velo .dejar-ahi{color:#8A8177;border-top:1px solid var(--gris)}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.tag-g{margin-top:14px;font-size:clamp(13px,1.5vw,17px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--oro);opacity:.85}
.tag-a{margin-top:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.tag-c{margin-top:7px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8A7A5E}
.cifras4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--gris);border-bottom:1px solid var(--gris);margin:30px 0}
.cifras4 div{padding:20px 6px;text-align:center;border-right:1px solid var(--gris)}
.cifras4 div:last-child{border-right:0}
.cifras4 b{display:block;font-family:'Bodoni Moda',serif;font-size:28px;font-weight:400}
.cifras4 span{font-size:9px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:6px;display:block}

/* ── álbum ── */
.tapa{height:210px;position:relative;overflow:hidden;margin-bottom:76px}
.tapa .fondo{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.75) brightness(.75);transform:scale(1.08);animation:kbtapa 24s var(--e) forwards}
@keyframes kbtapa{to{transform:scale(1.18)}}
.tapa:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 20%,#000 92%)}
.tapa .medallon{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);width:132px;height:132px;
  border-radius:50%;overflow:hidden;border:1px solid var(--hilo2);z-index:3;background:var(--carbon)}
.tapa .medallon img{width:100%;height:100%;object-fit:cover}
.album h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(40px,11vw,52px);text-align:center;line-height:1}
.album .fecha{text-align:center;font-size:10.5px;letter-spacing:.42em;color:var(--mute);margin-top:16px}
.cifras{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--gris);margin:34px 0}
.cifra{padding:30px 10px;text-align:center;border-bottom:1px solid var(--gris)}
.cifra:nth-child(odd){border-right:1px solid var(--gris)}
.cifra span{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--mute);margin-bottom:14px;text-transform:uppercase}
.cifra b{font-family:'Bodoni Moda',serif;font-size:46px;font-weight:400;line-height:1}
.cifra.cero b,.cifra.cero span{color:#3A362F}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.rejilla a{aspect-ratio:1;overflow:hidden;background:var(--humo);display:block;position:relative}
.rejilla img,.rejilla video{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--e),filter .5s}
.rejilla a:hover img{transform:scale(1.06);filter:brightness(1.08)}
.dedicatoria{padding:8px 0 8px 22px;border-left:1px solid var(--hilo);margin:26px 0}
.dedicatoria p{font-family:'Bodoni Moda',serif;font-size:20px;line-height:1.55;font-style:italic}
.dedicatoria b{display:block;font-family:'Bodoni Moda',serif;font-weight:400;color:var(--oro);font-size:16px;margin-top:12px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:38px 0 18px}
.acciones button{border:1px solid var(--hilo);padding:17px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--champan);transition:.3s}
.acciones button:hover{border-color:var(--oro);color:var(--oro)}
.sumate{border-top:1px solid var(--gris);margin-top:44px;padding:34px 0 10px;text-align:center}
.sumate p{font-family:'Bodoni Moda',serif;font-style:italic;font-size:20px;line-height:1.45;margin-bottom:20px}
.sumate a{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--hilo);
  padding:14px 24px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--champan);
  transition:border-color .3s,color .3s;text-decoration:none}
.sumate a:hover{border-color:var(--oro);color:var(--oro)}
.sumate a svg{width:17px;height:17px;fill:#2AA84A}
.sumate small{display:block;margin-top:16px;font-size:10px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--mute)}
.pie-marca{text-align:center;padding:40px 0 20px;opacity:.4}
.pie-marca img{width:120px}

.final{min-height:100svh;display:grid;place-items:center;text-align:center;padding:34px}
.vacio{text-align:center;color:var(--mute);padding:70px 24px;line-height:1.8;font-size:14.5px}
.recado{position:fixed;left:50%;top:86px;transform:translate(-50%,-14px);z-index:95;
  background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 60%,var(--champan));color:#0A0806;
  border:0;padding:15px 26px;font-size:14px;font-weight:500;letter-spacing:.04em;opacity:0;
  transition:.35s var(--e);pointer-events:none;max-width:92vw;text-align:center;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.9)}
.recado.on{opacity:1;transform:translate(-50%,0)}
.recado.con-accion{pointer-events:auto}
.recado-accion{margin-left:16px;font:inherit;font-weight:600;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:inherit;border-bottom:1px solid currentColor;padding:0 0 2px}
/* bloque plegable de configuración */
.plegable{border:1px solid var(--gris);margin-top:16px}
.plegable>summary{cursor:pointer;list-style:none;padding:20px 22px;display:flex;align-items:center;
  justify-content:space-between;gap:14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
.plegable>summary::-webkit-details-marker{display:none}
.plegable>summary:after{content:'+';font-size:17px;color:var(--oro);line-height:1}
.plegable[open]>summary:after{content:'−'}
.plegable[open]>summary{color:var(--oro);border-bottom:1px solid var(--gris)}
.plegable .cuerpo-p{padding:24px 22px}
.pendientes{border:1px solid var(--hilo2);background:rgba(217,174,114,.05);padding:20px 22px;margin-top:26px}
.pendientes .titu{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--oro);margin-bottom:6px}
.pendientes .globo{background:var(--oro);color:#0A0806;border-radius:999px;min-width:22px;height:22px;
  display:grid;place-items:center;font-size:11.5px;font-weight:600;letter-spacing:0;padding:0 7px}
.pendientes p{font-size:13.5px;color:#B5AC9E;line-height:1.6}

/* ═══════════ estructura de app ═══════════
   Cabecera fija, el pulso del evento siempre a la vista, el contenido en
   pestañas y la navegación abajo, al alcance del pulgar. */
.cabecera{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--gris)}
.cabecera .cab-fila{display:flex;align-items:center;gap:14px;padding:16px 26px 14px;max-width:620px;margin:0 auto}
.cabecera .atras{color:var(--oro);font-size:20px;line-height:1;padding:2px 8px 4px 0;flex:none}
.cabecera .quien-ev{flex:1;min-width:0}
.cabecera .quien-ev b{display:block;font-family:'Bodoni Moda',serif;font-style:italic;font-size:21px;
  font-weight:400;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cabecera .quien-ev span{display:block;font-size:9.5px;letter-spacing:.3em;color:var(--mute);
  text-transform:uppercase;margin-top:5px}
.cabecera .marca{width:62px;opacity:.45;flex:none}
.pulso-ev{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--gris);
  max-width:620px;margin:0 auto}
.pulso-ev div{padding:12px 4px 13px;text-align:center;border-right:1px solid var(--gris)}
.pulso-ev div:last-child{border-right:0}
.pulso-ev b{display:block;font-family:'Bodoni Moda',serif;font-size:21px;font-weight:400;line-height:1}
.pulso-ev span{font-size:8px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:6px;display:block}

/* ── cinta de la demostración ── */
#cinta-demo{position:fixed;top:0;left:0;right:0;z-index:70;height:38px;display:flex;
  align-items:center;justify-content:center;gap:14px;padding:0 14px;
  background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 58%,var(--champan));
  color:#2A1B08;font-size:11.5px;letter-spacing:.1em;text-align:center}
#cinta-demo b{font-weight:500}
#cinta-demo a{color:#2A1B08;text-decoration:underline;white-space:nowrap;flex:none;opacity:.85}
#cinta-demo button{font:500 11px/1 inherit;letter-spacing:.08em;text-transform:uppercase;
  color:#2A1B08;background:rgba(42,27,8,.12);border:1px solid rgba(42,27,8,.3);
  border-radius:20px;padding:5px 12px;cursor:pointer;white-space:nowrap;flex:none}
#cinta-demo button:hover{background:rgba(42,27,8,.2)}
body.en-demo{padding-top:38px}
body.en-demo .cabecera{top:38px}
/* La pantalla del salón y el álbum a pantalla completa se dibujan con
   position:fixed, así que el padding del body no los corre: la cinta les
   tapaba los botones de modo y el de salir, y no se podía llegar al muro. */
body.en-demo .sala,
body.en-demo .visor,
body.en-demo .capa{top:38px}
body.en-demo .modos-sala{top:54px}
body.en-demo .dejar{top:56px}
@media (max-width:420px){
  #cinta-demo{font-size:10.5px;gap:9px}
  #cinta-demo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

.barra-abajo{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(15px + env(safe-area-inset-bottom));z-index:45;
  width:min(348px,calc(100% - 36px));display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:rgba(13,11,9,.9);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid var(--hilo);border-radius:999px;padding:6px;
  box-shadow:0 22px 46px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05)}
.barra-abajo button{position:relative;border-radius:999px;padding:11px 6px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);
  transition:color .35s var(--e),background .35s var(--e)}
.barra-abajo button[aria-selected=true]{color:#0A0806;
  background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 58%,var(--champan))}
.barra-abajo svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.barra-abajo em{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.barra-abajo .globo-n{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;
  background:var(--oro);color:#0A0806;border-radius:999px;display:grid;place-items:center;
  font-size:10px;font-weight:600;letter-spacing:0;border:1.5px solid #0D0B09}
.barra-abajo button[aria-selected=true] .globo-n{background:#0A0806;color:var(--oro);border-color:transparent}

/* accesos rápidos: circulitos en fila */
.accesos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 8px}
/* con el muro cerrado quedan dos: que ocupen el ancho en vez de irse a un costado */
.accesos.dos{grid-template-columns:repeat(2,1fr);max-width:300px;margin-inline:auto}
.accesos button{display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--mute);
  transition:color .3s}
.accesos .aro-a{width:54px;height:54px;border-radius:50%;border:1px solid var(--gris);
  display:grid;place-items:center;color:var(--champan);background:rgba(255,255,255,.02);
  transition:border-color .35s var(--e),transform .3s var(--e),background .35s}
.accesos button:active .aro-a{transform:scale(.94)}
.accesos button:hover .aro-a{border-color:var(--hilo2);background:rgba(217,174,114,.06)}
.accesos .destacado .aro-a{background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 58%,var(--champan));
  border-color:transparent;color:#0A0806}
.accesos em{font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  text-align:center;line-height:1.4}
.accesos svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}

/* ═══ álbum: portada a sangre y mosaico ═══ */
.tapa-g{position:relative;height:min(52vh,430px);overflow:hidden;display:flex;
  align-items:flex-end;isolation:isolate}
.tapa-g .foto{position:absolute;inset:0;background-size:cover;background-position:center;
  transform:scale(1.06);animation:kbtapa 26s var(--e) forwards}
.tapa-g:after{content:'';position:absolute;inset:0;
  background:linear-gradient(transparent 18%,rgba(0,0,0,.5) 58%,#000 96%)}
.tapa-g .texto{position:relative;z-index:2;padding:0 26px 30px;width:100%;max-width:620px;margin:0 auto}
.tapa-g .arriba{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--oro);margin-bottom:14px}
.tapa-g h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(38px,12vw,54px);line-height:1}
.tapa-g .cuando{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#B5AC9E;margin-top:14px}
.pastillas{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pastilla{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hilo);
  border-radius:999px;padding:7px 14px;font-size:11px;letter-spacing:.12em;color:var(--champan);
  background:rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.pastilla b{font-weight:600;font-size:12.5px;letter-spacing:0}
.seccion-a{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  margin:34px 0 14px;padding-top:6px}
.seccion-a h2{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);font-weight:400}
.seccion-a span{font-size:10.5px;letter-spacing:.2em;color:var(--oro)}
.mosaico-a{columns:2;column-gap:7px}
@media(min-width:560px){.mosaico-a{columns:3}}
.mosaico-a a{display:block;break-inside:avoid;margin-bottom:7px;border-radius:12px;overflow:hidden;
  position:relative;background:var(--humo);line-height:0}
.mosaico-a img,.mosaico-a video{width:100%;height:auto;display:block;
  transition:transform .7s var(--e),filter .5s}
.mosaico-a a:hover img{transform:scale(1.04);filter:brightness(1.06)}
.mosaico-a .quien-f{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;
  font-size:10.5px;letter-spacing:.12em;color:#F3EDE0;line-height:1.3;
  background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transition:opacity .4s var(--e)}
.mosaico-a a:hover .quien-f{opacity:1}
.mosaico-a .marca-video{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center;color:#F3EDE0;
  font-size:9px;border:1px solid rgba(255,255,255,.16)}
.wrap-a{max-width:620px;margin:0 auto;padding:0 26px 130px}
/* chips de modo, como las filas de filtros de las apps */
.chips{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;margin:0 -26px 24px;
  padding-inline:26px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--gris);
  border-radius:999px;padding:11px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);transition:.32s var(--e);white-space:nowrap}
.chips button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.chips button[aria-pressed=true]{color:#0A0806;border-color:transparent;
  background:linear-gradient(100deg,var(--oro-hondo),var(--oro) 58%,var(--champan))}
.chips button:active{transform:scale(.97)}

/* barra de acción fija: el botón principal siempre al alcance del pulgar */
.accion-abajo{position:fixed;left:0;right:0;bottom:0;z-index:44;
  padding:14px 26px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.82) 24%,#000 62%)}
.accion-abajo .dentro{max-width:620px;margin:0 auto}
.accion-abajo .pie-nota{margin-top:11px}

/* cabecera del invitado */
.cab-inv{position:relative;padding:26px 26px 22px;border-bottom:1px solid var(--gris);
  max-width:620px;margin:0 auto}
.cab-inv .arriba{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--oro);margin-bottom:10px}
.cab-inv h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(28px,8.5vw,38px);line-height:1}
.cab-inv .volver{position:absolute;right:22px;top:24px;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute);padding:8px}
.wrap-inv{max-width:620px;margin:0 auto;padding:26px 26px 150px}

/* tarjeta de evento en la lista */
.ev-card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px;
  border:1px solid var(--gris);margin-bottom:11px;transition:border-color .35s,transform .3s var(--e);
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent)}
.ev-card:hover{border-color:var(--hilo)}
.ev-card:active{transform:scale(.99)}
.ev-card .tapa-ev{width:62px;height:62px;flex:none;border-radius:10px;overflow:hidden;
  background:var(--humo);display:grid;place-items:center;color:var(--oro)}
.ev-card .tapa-ev img{width:100%;height:100%;object-fit:cover}
.ev-card .tapa-ev .estrella{width:19px;height:19px;opacity:.5}
.ev-card .datos-ev{flex:1;min-width:0}
.ev-card .datos-ev b{display:block;font-family:'Bodoni Moda',serif;font-style:italic;font-size:20px;
  font-weight:400;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-card .datos-ev span{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--mute);
  text-transform:uppercase;margin-top:6px}
.ev-card .codigo-ev{font-size:10px;letter-spacing:.18em;color:var(--oro);flex:none;
  border:1px solid var(--hilo);border-radius:999px;padding:6px 11px}

/* puertas de la portada, con icono */
.puerta .ico-p{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--gris);
  display:grid;place-items:center;color:var(--oro);transition:border-color .35s,background .35s}
.puerta:hover .ico-p{border-color:var(--hilo2);background:rgba(217,174,114,.06)}
.puerta .ico-p svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}

.volver-flota{position:fixed;top:calc(15px + env(safe-area-inset-top));left:16px;z-index:30;
  width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);color:var(--champan);display:grid;place-items:center;
  font-size:18px;line-height:1;transition:background .3s}
.volver-flota:active{background:rgba(0,0,0,.7)}
.wrap-ev{max-width:620px;margin:0 auto;padding:24px 26px 124px}
.panel-ev{animation:entraBloque .42s var(--e) both}
.tarjeta{border:1px solid var(--gris);padding:26px 24px;margin-bottom:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent)}
.tarjeta.principal{border-color:var(--hilo)}
.titu-s{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
.vacio-mod{text-align:center;padding:54px 22px;color:var(--mute);line-height:1.9;font-size:14px}
.vacio-mod .estrella{width:22px;height:22px;color:var(--oro);opacity:.45;margin-bottom:18px}

/* ═══════════ cartel de bienvenida en la pantalla del salón ═══════════
   Se lee desde el otro lado del salón: todo grande y de un vistazo. */
.sala-cartel{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(8px,1.6vh,22px);padding:2.5vh 5vw;text-align:center;position:relative}
.sala-cartel .marca-c2{width:clamp(96px,9vw,150px);opacity:.7}
.sala-cartel h1{font-family:'Bodoni Moda',serif;font-style:italic;
  font-size:clamp(38px,6.4vh,92px);line-height:1;color:var(--champan)}
.sala-cartel .invita{font-size:clamp(15px,2.1vh,28px);color:#D9D2C6;font-weight:200;
  line-height:1.35;max-width:30ch}
/* con el cartel en pantalla la consola sobra: repite el QR y el contador */
.sala.en-cartel .consola{display:none}

.tab-qr{flex:none;display:flex;gap:clamp(9px,1.2vw,15px);align-items:center;
  border:1px solid var(--hilo);border-radius:10px;padding:clamp(9px,1.2vh,15px);

.tab-tira{flex:none;border-top:1px solid var(--gris);padding-top:clamp(8px,1.2vh,15px);
  overflow:hidden;display:flex;
  -webkit-mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
  mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.tab-tira .pista-t{flex:0 0 auto;min-width:100%;display:flex;align-items:center;
  gap:clamp(22px,3vw,54px);padding-right:clamp(22px,3vw,54px);
  animation:correrT 44s linear infinite;will-change:transform}
@keyframes correrT{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.tab-tira .dicho{white-space:nowrap;font-size:clamp(12px,1.7vh,21px);color:#D9D2C6;font-weight:200}

/* selector de modo de la pantalla */

  color:var(--mute);margin-top:7px;display:block}
.cuando-abre{font-size:clamp(12px,1.2vw,18px);letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}

/* puerta cerrada para el invitado */
.espera-lanza{min-height:100svh;display:grid;place-items:center;text-align:center;padding:34px 26px}
.espera-lanza h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(34px,10vw,48px);
  line-height:1.05;margin:16px 0 10px}
.espera-lanza .cuenta-lanza{margin:30px 0 22px}

/* la clave del evento, para mostrarla y para dictarla */
.clave-grande{font-family:'Bodoni Moda',serif;font-size:clamp(38px,13vw,58px);letter-spacing:.22em;
  color:var(--champan);line-height:1;margin:6px 0 4px;word-break:break-all}
.clave-caja{border:1px solid var(--hilo2);background:rgba(217,174,114,.06);border-radius:4px;
  padding:26px 22px;text-align:center;margin:22px 0}
.clave-caja .aviso{font-size:13.5px;color:#B5AC9E;line-height:1.7;margin-top:16px}
.clave-fila{display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid var(--gris);border-radius:3px;padding:14px 16px;margin-top:12px}
/* el código no se puede partir al medio: es lo que la gente copia */
.clave-fila b{white-space:nowrap}
.clave-fila span{flex:1 1 auto;min-width:0}
.clave-fila b{font-family:'Bodoni Moda',serif;font-size:21px;letter-spacing:.2em;color:var(--champan);font-weight:400}
.clave-fila span{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:5px}

/* zona de peligro: rojo apagado, separado del oro de la marca */
.peligro{border-color:rgba(196,86,78,.4)}
.peligro .titu-s{color:#C4564E}
.peligro p{font-size:13.5px;color:#B5AC9E;line-height:1.7}
.peligro ul{list-style:none;margin:14px 0 18px;font-size:13.5px;color:#B5AC9E;line-height:1.9}
.peligro ul b{color:var(--champan);font-weight:400}
.btn-peligro{width:100%;border:1px solid rgba(196,86,78,.55);border-radius:2px;padding:15px;
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#E08A82;margin-top:10px;
  transition:background .3s,border-color .3s,color .3s}
.btn-peligro:hover{background:rgba(196,86,78,.12);border-color:#C4564E;color:#F3A9A2}
.btn-peligro:disabled{opacity:.4;cursor:not-allowed}
.btn-peligro.firme{background:#C4564E;border-color:#C4564E;color:#fff;font-weight:600}
.btn-peligro.firme:disabled{background:rgba(196,86,78,.25);color:rgba(255,255,255,.5)}

/* marcas */
.sello-admin{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hilo2);
  border-radius:999px;padding:6px 13px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--oro);background:rgba(217,174,114,.08)}
.pastilla-prog{display:inline-block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--oro);border:1px solid var(--hilo);border-radius:999px;padding:4px 9px;margin-top:7px}

/* ═══════════ movimiento ═══════════
   Un solo sistema: cada vista entra igual, y dentro de la vista los
   bloques suben escalonados. Como cada vista se redibuja entera, las
   animaciones arrancan solas al insertarse: no hace falta JS. */
@keyframes entraBloque{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes entraBarra{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes escala{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

#app>.top{animation:entraBarra .45s var(--e) both}
#app>.portada,#app>.momento,#app>.final,#app>.album,#app>.sala,#app>.dejar{
  animation:aparece .5s var(--e) both}
#app>.wrap>*{animation:entraBloque .5s var(--e) both}
#app>.wrap>*:nth-child(1){animation-delay:.05s}
#app>.wrap>*:nth-child(2){animation-delay:.10s}
#app>.wrap>*:nth-child(3){animation-delay:.15s}
#app>.wrap>*:nth-child(4){animation-delay:.20s}
#app>.wrap>*:nth-child(5){animation-delay:.25s}
#app>.wrap>*:nth-child(6){animation-delay:.29s}
#app>.wrap>*:nth-child(7){animation-delay:.33s}
#app>.wrap>*:nth-child(8){animation-delay:.36s}
#app>.wrap>*:nth-child(n+9){animation-delay:.39s}

/* el QR y la previa no aparecen de golpe */
.qr canvas,.qr img,.qr-c canvas,.qr-c img,.qr-sala canvas,.qr-sala img{animation:escala .55s var(--e) both}
.previa{animation:escala .45s var(--e) both}
.consigna{animation:entraBloque .6s var(--e) both}

/* respuesta al toque: sin esto en el celular se siente muerto */
.puerta,.fila,.oro-btn,.hilo-btn,.lente,.seg button,.espera .par button,.plegable>summary{
  -webkit-tap-highlight-color:transparent}
.oro-btn,.hilo-btn,.lente{transition:transform .18s var(--e),filter .3s,border-color .3s,color .3s}
.oro-btn:active,.hilo-btn:active{transform:scale(.975)}
.lente:active{transform:scale(.99)}
.puerta:active,.fila:active{background:rgba(217,174,114,.05)}
.espera .par button:active{background:rgba(217,174,114,.09)}

/* barrido dorado, igual que en el sitio */
.oro-btn{position:relative;overflow:hidden}
.oro-btn:after{content:'';position:absolute;top:0;left:-130%;width:58%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transition:left .75s var(--e)}
.oro-btn:hover:after{left:140%}
/* durante la subida el propio botón se llena */
.oro-btn.subiendo{background:linear-gradient(90deg,
  var(--oro) 0 var(--avance,0%),rgba(217,174,114,.25) var(--avance,0%) 100%);
  color:var(--champan);transition:background .25s linear}
.oro-btn.subiendo:after{display:none}

/* esqueleto con brillo mientras carga */
@keyframes brilla{to{background-position:-220% 0}}
.hueso{border-radius:2px;background:linear-gradient(100deg,
  rgba(255,255,255,.035) 30%,rgba(217,174,114,.11) 50%,rgba(255,255,255,.035) 70%);
  background-size:220% 100%;animation:brilla 1.5s linear infinite}
.rejilla-hueso{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:26px}
.rejilla-hueso i{aspect-ratio:1;display:block}
.tapa-hueso{height:210px;margin-bottom:76px}

/* moderación: la ficha se va sola, sin redibujar toda la pantalla */
@keyframes vuela{to{opacity:0;transform:translateY(-30px) scale(.96)}}
@keyframes seVa{to{opacity:0;transform:scale(.94)}}
.espera.vuela{animation:vuela .45s var(--e) forwards;pointer-events:none}
.espera.se-va{animation:seVa .35s var(--e) forwards;pointer-events:none}
.pendientes.se-va{animation:seVa .4s var(--e) forwards}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.cartel-hoja{max-width:420px;margin:34px auto;border:1px solid var(--hilo);padding:44px 34px;text-align:center;background:#000}
.cartel-hoja .marca-c{width:150px;opacity:.95;margin-bottom:26px}
.cartel-hoja .nombre-c{font-family:'Bodoni Moda',serif;font-style:italic;font-size:34px;line-height:1}
.cartel-hoja .fecha-c{font-size:10px;letter-spacing:.4em;color:var(--mute);margin-top:12px;text-transform:uppercase}
.cartel-hoja .pedido{font-family:'Bodoni Moda',serif;font-size:22px;line-height:1.45;margin:30px 0}
.cartel-hoja .qr-c{background:#fff;padding:14px;display:inline-block;line-height:0}
.cartel-hoja .qr-c img,.cartel-hoja .qr-c canvas{width:186px;height:186px;display:block}
.cartel-hoja .instr{font-size:12px;letter-spacing:.16em;color:var(--mute);margin-top:22px;line-height:1.9;text-transform:uppercase}
.cartel-hoja .cod{font-size:11px;letter-spacing:.3em;color:var(--oro);margin-top:16px}
.porta-fila{display:flex;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--gris)}
.porta-fila .mini{width:62px;height:62px;flex:none;border:1px solid var(--hilo);object-fit:cover;background:var(--humo)}
.porta-fila .mini.vacia{display:grid;place-items:center;color:var(--oro);opacity:.5}
.porta-fila .mini.vacia .estrella{width:16px;height:16px}
@media print{
  #brillo,#polvo,#grano,.top,.acciones,.no-imprime,.recado,.sumate{display:none!important}
  body{background:#fff;color:#111}
  .cartel-hoja{border:0;margin:0;width:105mm;height:148mm;padding:12mm 9mm;background:#000;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column;justify-content:center}
  /* el álbum se imprime en hoja normal y sin cortar fotos al medio */
  body.imp-album .album .rejilla a,body.imp-album .dedicatoria,body.imp-album .cifra{
    break-inside:avoid;page-break-inside:avoid}
  body.imp-album .tapa{height:150px}
  body.imp-album .pie-marca{opacity:1}
}
@media(min-width:820px){.rejilla{grid-template-columns:repeat(4,1fr)}}

<body>

<div id="brillo"></div>
<div id="polvo"></div>
<div id="app"></div>
<div id="grano"></div>
<div class="recado" id="recado"></div>

<script>
const LOGO_FULL = "logo.webp";
const LOGO_MARK = "marca.webp";
const ESTRELLA = `<span class="estrella"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.9 8.2 2.9 11.1 12 12-9.1.9-11.1 3.8-12 12-.9-8.2-2.9-11.1-12-12C9.1 11.1 11.1 8.2 12 0z"/></svg></span>`;

/* ══════════ almacenamiento (prototipo) ══════════ */
/* ═══════════════════════════════════════════════════════════
   CONFIGURACIÓN · pegá acá los dos datos de Supabase
   Mientras estén vacíos, la app corre en MODO DEMOSTRACIÓN:
   cada celular ve solo sus propias fotos.
   ═══════════════════════════════════════════════════════════ */
const NUBE = {
  url:  'https://kuqlqgrwsospwjexodqa.supabase.co',
  clave:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cWxxZ3J3c29zcHdqZXhvZHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjMyMjAsImV4cCI6MjEwNDEzOTIyMH0.DyV3K6fcHcsD9wbNzkYn2vIwWSN9e2LWt_HyuSaUE9g'
};
/* ══════════ modo demostración ══════════
   Con ?demo=1 la app NO habla con la base: corre entera en la memoria de
   este navegador, con una fiesta inventada. Es lo que abre el botón de
   "probar" de la web pública. Antes ese botón llevaba a la app de verdad,
   donde se veían los eventos de los clientes y el botón de "cargar una
   fiesta de ejemplo" escribía en la base de producción. */
const HAY_DEMO = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);
const HAY_NUBE = !HAY_DEMO && !!(NUBE.url && NUBE.clave);

const LISTA='ce:eventos', cacheItem={}, memoria={};
let timerSala=null;
const esc=s=>String(s==null?'':s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
/* Solo dejamos pasar direcciones que parezcan una imagen/archivo real.
   Cualquier otra cosa (texto inyectado en la base) se descarta. */
const urlSegura=u=>{const t=String(u==null?'':u).trim();
  return /^(https?:\/\/|data:(image|video|audio)\/|blob:)/i.test(t)||/^[\w./-]+\.(webp|jpg|jpeg|png|gif|mp4|webm)$/i.test(t)?t:'';};
const src=u=>esc(urlSegura(u));
/* Para meter una dirección dentro de url(...) de CSS solo hay que escapar
   lo que rompe el paréntesis o las comillas. encodeURI() no sirve: vuelve a
   codificar lo ya codificado (%20 pasa a %2520) y rompe la imagen. */
const cssUrl=u=>urlSegura(u).replace(/["'()\\\s]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));
/* nombre de archivo que no rompa en Windows/Mac */
const nombreSeguro=s=>(String(s==null?'':s).replace(/[\\/:*?"<>|\n\r]+/g,'-').trim().slice(0,40)||'album');
/* La fecha de HOY, la del calendario de la pared. toISOString() da la de
   UTC: pasadas las nueve de la noche en Rosario ya devolvía mañana, y el
   evento nacía fechado un día después. */
const hoy=()=>{ const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
/* Una fecha de acá a n días, también en hora local. */
const enDias=n=>{ const d=new Date(); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
/* Nunca devuelve el dato crudo: si no es una fecha válida, texto fijo.
   (Devolverlo tal cual permitía inyectar HTML desde la base.) */
const bonito=f=>{
  if(!f) return 'Fecha a confirmar';
  const p=String(f).slice(0,10).split('-');
  if(p.length!==3||!/^\d{4}$/.test(p[0])||!/^\d{1,2}$/.test(p[1])||!/^\d{1,2}$/.test(p[2]))
    return 'Fecha a confirmar';
  return `${p[2]} · ${p[1]} · ${p[0]}`;
};

/* ── almacenamiento local (solo si no hay nube) ───────────── */
const local = {
  async get(k){
    if(window.storage) return JSON.parse((await window.storage.get(k,true)).value);
    if(!(k in memoria)) throw new Error('vacío');
    return JSON.parse(memoria[k]);
  },
  async set(k,v){ const s=JSON.stringify(v); memoria[k]=s; if(window.storage) await window.storage.set(k,s,true); }
};
const kMeta=c=>`ce:${c}:meta`, kIndex=c=>`ce:${c}:index`, kItem=(c,i)=>`ce:${c}:i:${i}`;
const leerLocal=async(k,def)=>{try{return await local.get(k);}catch(e){return def;}};

/* ── cliente de Supabase (sin librerías, solo fetch) ──────── */
/* En navegación privada (o con cookies bloqueadas) tocar localStorage tira
   excepción y mataba la app entera al cargar. Ahora nunca propaga. */
const guarda = HAY_DEMO ? (()=>{
  /* La demostración no deja rastro en el navegador. Sin esto, la clave de
     la fiesta inventada quedaba guardada en el mismo aparato que usa el
     organizador de verdad y DEMO-FIESTA le aparecía entre sus eventos. */
  const m={}, s={};
  return {
    leer:k=>(k in m)?m[k]:null,
    escribir(k,v){ m[k]=String(v); return true; },
    borrar(k){ delete m[k]; },
    leerSesion:k=>(k in s)?s[k]:null,
    escribirSesion(k,v){ s[k]=String(v); }
  };
})() : {
  leer(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  escribir(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  borrar(k){try{localStorage.removeItem(k);}catch(e){}},
  leerSesion(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},
  escribirSesion(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
};

/* ══════════ claves de evento ══════════
   Cada evento tiene su clave. Viaja en la cabecera x-clave y la valida la
   base: el navegador solo la lleva, no decide nada. Las guardamos en este
   aparato para no tener que escribirlas cada vez. */
const CLAVES_KEY='ce:claves';
const clavesGuardadas=()=>{ try{ return JSON.parse(guarda.leer(CLAVES_KEY)||'{}'); }catch(e){ return {}; } };
const guardarClaveDe=(codigo,clave)=>{
  const t=clavesGuardadas(); t[codigo]=clave; guarda.escribir(CLAVES_KEY,JSON.stringify(t));
};
const olvidarClaveDe=codigo=>{
  const t=clavesGuardadas(); delete t[codigo]; guarda.escribir(CLAVES_KEY,JSON.stringify(t));
};
let claveMaestra=guarda.leerSesion('ce:maestra')||'';
/* la que corresponde usar para este evento */
const claveDe=codigo=>claveMaestra||clavesGuardadas()[codigo]||'';
const puedoEditar=codigo=>!!claveDe(codigo);
/* clave nueva, corta y sin letras que se confundan al dictarla */
/* Dos invitados sacando la foto en el mismo instante podían generar el
   mismo id, y como el guardado pisa duplicados, la foto de uno borraba la
   del otro sin avisar. Con 10 caracteres al azar eso deja de pasar. */
const idNuevo=()=>{
  const abc='abcdefghijklmnopqrstuvwxyz0123456789';
  let cola='';
  try{
    const n=new Uint32Array(10); crypto.getRandomValues(n);
    cola=[...n].map(x=>abc[x%abc.length]).join('');
  }catch(e){
    for(let i=0;i<10;i++) cola+=abc[Math.floor(Math.random()*abc.length)];
  }
  return Date.now().toString(36)+cola;
};
const nuevaClave=()=>{
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  try{
    const n=new Uint32Array(6); crypto.getRandomValues(n);
    return [...n].map(x=>abc[x%abc.length]).join('');
  }catch(e){
    /* sin crypto (navegador viejo): igual tiene que salir una clave
       distinta cada vez, no seis letras iguales */
    let t=''; for(let i=0;i<6;i++) t+=abc[Math.floor(Math.random()*abc.length)];
    return t;
  }
};

const SB = {
  cab(extra, clave){
    const c=Object.assign({
      apikey: NUBE.clave,
      Authorization: 'Bearer '+NUBE.clave,
      'Content-Type': 'application/json'
    }, extra||{});
    if(clave) c['x-clave']=clave;
    return c;
  },
  async pedir(ruta, opciones){
    const r = await fetch(NUBE.url+ruta, opciones);
    const txt = await r.text();                 // siempre texto, nunca falla
    if(!r.ok) throw new Error(txt || ('HTTP '+r.status));
    if(!txt) return null;                        // guardado correcto, sin contenido
    try{ return JSON.parse(txt); }catch(e){ return null; }
  },
  /* La clave también en las lecturas: desde que la tabla dejó de ser de
     lectura libre, el organizador necesita mandarla para ver su evento. */
  ver(tabla, consulta, clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {headers:this.cab({}, clave)});
  },
  guardar(tabla, obj, clave){
    return this.pedir(`/rest/v1/${tabla}`, {
      method:'POST',
      headers:this.cab({Prefer:'resolution=merge-duplicates,return=minimal'}, clave),
      body:JSON.stringify(obj)
    });
  },
  editar(tabla, consulta, obj, clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {
      method:'PATCH', headers:this.cab({Prefer:'return=minimal'}, clave), body:JSON.stringify(obj)
    });
  },
  borrar(tabla, consulta, clave){
    return this.pedir(`/rest/v1/${tabla}?${consulta}`, {
      method:'DELETE', headers:this.cab({Prefer:'return=minimal'}, clave)
    });
  },
  /* pregunta a la base qué permite esta clave (sirve de diagnóstico) */
  quienSoy(codigo, clave){
    return this.pedir('/rest/v1/rpc/ce_quien_soy', {
      method:'POST', headers:this.cab({}, clave),
      body:JSON.stringify({p_codigo:codigo||null})
    });
  },
  cambiarClave(codigo, claveActual, claveNueva){
    return this.pedir('/rest/v1/rpc/ce_cambiar_clave', {
      method:'POST', headers:this.cab({}, claveActual),
      body:JSON.stringify({p_codigo:codigo, p_nueva:claveNueva})
    });
  },
  /* función genérica (usada por la cámara descartable) */
  rpc(fn, args, clave){
    return this.pedir(`/rest/v1/rpc/${fn}`, {method:'POST', headers:this.cab({}, clave), body:JSON.stringify(args||{})});
  },
  /* lista los archivos guardados bajo una carpeta del depósito */
  /* El depósito devuelve como mucho 1000 por pedido: con una fiesta grande
     quedaban archivos sin listar, y por lo tanto sin borrar nunca. */
  async listarArchivos(prefijo, bucket){
    let desde=0, todo=[];
    for(;;){
      const tanda=await this.pedir(`/storage/v1/object/list/${bucket||'ce-medios'}`, {
        method:'POST', headers:this.cab(),
        body:JSON.stringify({prefix:prefijo,limit:1000,offset:desde})
      });
      if(!tanda||!tanda.length) break;
      todo=todo.concat(tanda);
      if(tanda.length<1000) break;
      desde+=1000;
      if(desde>20000) break;
    }
    return todo;
  },
  /* Y mandarlos todos juntos en un solo pedido lo hacía rebotar entero. */
  async borrarArchivos(rutas, clave, bucket){
    if(!rutas.length) return null;
    for(let i=0;i<rutas.length;i+=200){
      await this.pedir(`/storage/v1/object/${bucket||'ce-medios'}`, {
        method:'DELETE', headers:this.cab({}, clave),
        body:JSON.stringify({prefixes:rutas.slice(i,i+200)})
      });
    }
    return null;
  },
  /* XHR en vez de fetch para poder mostrar el avance y cortar si se cuelga:
     en un salón con mala señal, "Revelando…" quedaba girando sin fin. */
  archivo(ruta, blob, alAvanzar){
    return new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      x.open('POST',`${NUBE.url}/storage/v1/object/ce-medios/${ruta}`);
      x.setRequestHeader('apikey',NUBE.clave);
      x.setRequestHeader('Authorization','Bearer '+NUBE.clave);
      x.setRequestHeader('Content-Type',blob.type||'application/octet-stream');
      /* Sin x-upsert. Con el depósito abierto para que suban los invitados
         —que es lo que tiene que pasar—, "upsert" quiere decir que
         cualquiera puede PISAR un archivo que ya está: mandando a
         .../ce-medios/QUI-XXXXXX/portada.jpg se cambia la portada de una
         fiesta ajena, que es la que se proyecta en el salón. Los caminos
         llevan un id al azar, así que nunca necesitamos pisar nada: si el
         camino ya existe, que falle. */
      x.timeout=180000;
      if(x.upload&&alAvanzar) x.upload.onprogress=e=>{
        if(e.lengthComputable) alAvanzar(e.loaded/e.total);
      };
      x.onload=()=>{
        if(x.status>=200&&x.status<300) res(`${NUBE.url}/storage/v1/object/public/ce-medios/${ruta}`);
        else rej(new Error(x.responseText||('HTTP '+x.status)));
      };
      x.onerror=()=>rej(new Error('Failed to fetch'));
      x.ontimeout=()=>rej(new Error('La subida tardó demasiado'));
      x.send(blob);
    });
  }
};

const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif',
           'image/heic':'heic','image/heif':'heif',
           'video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm',
           'audio/webm':'webm','audio/mp4':'m4a','audio/mpeg':'mp3',
           'audio/aac':'aac','audio/ogg':'ogg','audio/wav':'wav','audio/x-m4a':'m4a'};
const MAX_MB=60;
async function subirArchivo(blob, base, alAvanzar){
  return SB.archivo(`${base}.${EXT[blob.type]||'jpg'}`, blob, alAvanzar);
}

/* ── funciones que usa toda la app (misma firma, con o sin nube) ── */
/* SOLO los eventos de este aparato.
   Antes se pedían todos, sin filtro: el panel decía "Tus eventos" y le
   listaba a cualquiera que entrara las fiestas de todos los clientes, con
   nombre y fecha. Desde la web pública había un botón que llevaba derecho
   ahí. Cuáles son "los míos" lo dicen las claves guardadas en este
   navegador, que es lo mismo que ya hacía el rollo. */
const CAMPOS_LISTA='codigo,nombre,fecha,portada,creado&order=creado.desc.nullslast';
async function eventos(){
  if(!HAY_NUBE) return leerLocal(LISTA,[]);
  try{
    if(esAdmin) return await SB.ver('ce_eventos','select='+CAMPOS_LISTA, claveMaestra);
    const mios=Object.keys(clavesGuardadas());
    if(!mios.length) return [];
    /* Uno por uno, cada cual con SU clave. En un pedido solo va una clave
       en la cabecera, y la base mira fila por fila: pidiéndolos todos
       juntos volvía uno solo. Son los eventos de UN organizador, así que
       son unos pocos y van en paralelo. */
    const filas=await Promise.all(mios.map(async c=>{
      try{
        const r=await SB.ver('ce_eventos',
          `codigo=eq.${encodeURIComponent(c)}&select=${CAMPOS_LISTA}`, claveDe(c));
        return (r&&r[0])||null;
      }catch(e){ return null; }
    }));
    return filas.filter(Boolean)
      .sort((a,b)=>(b.creado||0)-(a.creado||0));
  }catch(e){ console.error('eventos',e); recado('No se pudo leer: '+motivo(e)); return []; }
}
/* ── leer un evento sin tener su clave ──
   El invitado que llega por el QR, la pantalla del salón y el álbum que se
   comparte no tienen clave, y tienen que poder leer SU evento. Antes eso
   funcionaba porque la tabla era de lectura libre para todo el mundo, que
   es lo mismo que decir que cualquiera se bajaba la lista completa de las
   fiestas de todos los clientes con un solo pedido.
   Ahora la base solo la abre por función y de a un código por vez. Si la
   función todavía no está instalada (blindaje.sql no corrido), se lee como
   antes: así la página anda igual el día de antes y el día después, sin
   que haya que sincronizar la subida con el SQL. */
let hayFuncionesNuevas = null;      // null = todavía no sabemos
async function eventoPorCodigo(c){
  if(hayFuncionesNuevas!==false){
    try{
      const v=await SB.rpc('ce_evento_publico',{p_codigo:c});
      /* null = la función existe y ese código no. Un objeto con codigo = el
         evento. Cualquier otra cosa quiere decir que del otro lado no está
         la función que creemos. */
      if(v===null||(v&&typeof v==='object'&&!Array.isArray(v)&&v.codigo)){
        hayFuncionesNuevas=true; return v;
      }
      hayFuncionesNuevas=false;
    }catch(e){
      /* Pase lo que pase, se lee como se leía antes. Si la base ya está
         cerrada, ese camino devuelve vacío y el que decide es ella, no
         nosotros: lo que no puede pasar es que la pantalla muera acá. */
      if(/PGRST202|does not exist|not found|404/i.test(e&&e.message||'')) hayFuncionesNuevas=false;
    }
  }
  return (await SB.ver('ce_eventos',`codigo=eq.${encodeURIComponent(c)}&select=*`))[0]||null;
}
async function meta(c){
  if(!HAY_NUBE) return leerLocal(kMeta(c),null);
  try{
    /* Con la clave guardada leemos derecho de la tabla: es el organizador,
       la base lo deja, y así ve también lo que está esperando aprobación. */
    if(puedoEditar(c)){
      const r=await SB.ver('ce_eventos',`codigo=eq.${encodeURIComponent(c)}&select=*`, claveDe(c));
      if(r&&r[0]) return r[0];
    }
    return await eventoPorCodigo(c);
  }
  catch(e){ console.error(e); return null; }
}
/* Columnas que se fueron agregando con el tiempo. Si la base todavía no
   las tiene, no se rompe nada: se vuelve a guardar sin ese dato y se anota
   cuál falta, para avisarlo una sola vez. Así el panel sigue andando
   aunque no se haya corrido el SQL nuevo.
   Antes había un mecanismo por tanda de columnas; ahora es uno solo. */
const COLS_CAMARA=['camara','cupo_fotos','revela_en','revelado'];
const COLUMNAS_NUEVAS=['lanza','hashtag','lugar',...COLS_CAMARA];
const faltaColumna={};
const sinColumna=c=>!!faltaColumna[c];
async function guardarMeta(m){
  if(!HAY_NUBE) return local.set(kMeta(m.codigo),m);
  const copia={...m};
  if(copia.portadaBlob){
    /* Camino nuevo cada vez. Antes era siempre ".../CODIGO/portada", y
       como hacía falta poder cambiarla se subía con "upsert", que es lo
       mismo que dejar que cualquiera pise la portada de cualquier fiesta.
       Con un nombre al azar nunca hay nada que pisar; la anterior queda en
       el depósito y se borra junto con el evento, que lista por prefijo. */
    copia.portada = await subirArchivo(copia.portadaBlob, `${copia.codigo}/portada-${idNuevo()}`);
    delete copia.portadaBlob;
  }
  for(const c of COLUMNAS_NUEVAS) if(faltaColumna[c]) delete copia[c];
  delete copia.claveNueva;      // la clave va en la cabecera, nunca en la fila
  const mandar=()=>SB.guardar('ce_eventos',copia, m.claveNueva||claveDe(m.codigo));
  try{
    await mandar();
  }catch(e){
    /* ¿la base se quejó justo de una de las columnas nuevas? */
    const texto=String((e&&e.message)||'');
    const culpable=COLUMNAS_NUEVAS.find(c=>!faltaColumna[c] && c in copia
      && new RegExp(`'${c}'|"${c}"|\\b${c}\\b`,'i').test(texto));
    if(culpable){
      /* si falta una de la cámara, faltan las cuatro: se corren juntas */
      for(const c of (COLS_CAMARA.includes(culpable)?COLS_CAMARA:[culpable])){
        faltaColumna[c]=true; delete copia[c];
      }
      try{
        await mandar();
        m.portada=copia.portada;
        return;   // quien llamó mira sinColumna() y avisa lo que corresponda
      }catch(e2){ e=e2; }
    }
    console.error('guardarMeta',e);
    recado('No se pudo guardar: '+motivo(e));
    throw e;
  }
  m.portada = copia.portada;
}

/* traduce el error técnico a algo que se entienda */
function motivo(e){
  const t=(e&&e.message)||'';
  if(/Failed to fetch|NetworkError/i.test(t)) return 'sin conexión con la base';
  if(/relation .* does not exist|PGRST205|42P01/i.test(t)) return 'faltan las tablas (correr el SQL)';
  if(/Falta la clave del evento|28000/i.test(t)) return 'falta la clave del evento';
  if(/row-level security|42501|PGRST301/i.test(t)) return 'la clave de este evento no es la correcta';
  if(/duplicate key|23505/i.test(t)) return 'ese código ya existe';
  if(/'lanza' column|column .*lanza|PGRST204/i.test(t))
    return 'falta la columna "lanza" en la base (correr el SQL de programación)';
  if(/JWT|apikey|401|Invalid/i.test(t)) return 'clave de la base inválida';
  return t.slice(0,110) || 'error desconocido';
}
/* La base devuelve como mucho 1000 filas por pedido. Una fiesta larga pasa
   ese número y las que faltaban no aparecían nunca: ni en el álbum, ni en
   la pantalla, y sin un solo error. Ahora se pide de a tandas. */
const POR_TANDA=1000;
/* Igual que con los eventos: sin clave se pide por función, y esa función
   NO devuelve lo que está esperando aprobación. Antes cualquiera leía la
   tabla entera, incluidas las fotos pendientes: "nada llega a la pantalla
   sin que alguien lo mire primero" se cumplía solo del lado del dibujo, y
   un invitado con la consola abierta las veía igual. */
async function itemsDe(c, campos, desde, cuanto){
  if(puedoEditar(c))
    return await SB.ver('ce_items',
      `codigo=eq.${encodeURIComponent(c)}&select=${campos}&order=ts.asc`
      +`&offset=${desde}&limit=${cuanto}`, claveDe(c));
  if(hayFuncionesNuevas!==false){
    try{
      const v=await SB.rpc('ce_items_de',{p_codigo:c, p_desde:desde, p_cuanto:cuanto});
      if(Array.isArray(v)){ hayFuncionesNuevas=true; return v; }
      hayFuncionesNuevas=false;
    }catch(e){
      if(/PGRST202|does not exist|not found|404/i.test(e&&e.message||'')) hayFuncionesNuevas=false;
    }
  }
  return await SB.ver('ce_items',
    `codigo=eq.${encodeURIComponent(c)}&select=${campos}&order=ts.asc`
    +`&offset=${desde}&limit=${cuanto}`);
}
async function porTandas(c, campos){
  let desde=0, todo=[];
  for(;;){
    const tanda=await itemsDe(c, campos, desde, POR_TANDA);
    if(!tanda||!tanda.length) break;
    todo=todo.concat(tanda);
    if(tanda.length<POR_TANDA) break;
    desde+=POR_TANDA;
    if(desde>20000) break;          // tope de seguridad: nadie sube tanto
  }
  return todo;
}
async function indice(c){
  if(!HAY_NUBE) return (await leerLocal(kIndex(c),[])).sort((a,b)=>a.ts-b.ts);
  try{ return await porTandas(c,'id,kind,autor,ts,estado'); }
  catch(e){ console.error('indice',e); recado('No se pudo leer el muro: '+motivo(e)); return []; }
}
/* Traer los recuerdos de a uno era una llamada por foto: un álbum de 200
   eran 200 idas y vueltas, una atrás de la otra. Con una sola alcanza. */
async function cargarTodo(c){
  if(!HAY_NUBE) return null;
  try{
    const filas=await porTandas(c,'*');
    for(const v of filas){
      const k=c+v.id, antes=cacheItem[k];
      v.data=v.url||'';
      /* Si la fila que llega no trae un archivo utilizable pero acá ya
         teníamos uno bueno (recién subido), nos quedamos con el bueno. */
      if(!urlSegura(v.data) && antes && urlSegura(antes.data)) v.data=antes.data;
      cacheItem[k]=v;
    }
    return filas;
  }catch(e){ console.error('cargarTodo',e); return null; }
}
async function item(c,id){
  const k=c+id; if(cacheItem[k]) return cacheItem[k];
  let v;
  if(!HAY_NUBE) v = await leerLocal(kItem(c,id),null);
  else{
    try{
      if(puedoEditar(c))
        v = (await SB.ver('ce_items',`id=eq.${encodeURIComponent(id)}&select=*`, claveDe(c)))[0]||null;
      else{
        try{ v = await SB.rpc('ce_item',{p_codigo:c, p_id:id}); }
        catch(err){ v = (await SB.ver('ce_items',`id=eq.${encodeURIComponent(id)}&select=*`))[0]||null; }
      }
      if(v) v.data = v.url || '';
    }catch(e){ console.error(e); return null; }
  }
  if(v) cacheItem[k]=v;
  return v;
}
async function sumar(c,it,alAvanzar){
  if(!HAY_NUBE){
    /* Sin nube se guarda en el propio navegador, y ahí un Blob no sobrevive
       a JSON.stringify (quedaba {} y la foto se perdía). Lo pasamos a texto. */
    const g={...it};
    if(g.blob){
      g.data=await leerArchivo(g.blob);
      if(alAvanzar) alAvanzar(1);
    }
    delete g.blob;
    await local.set(kItem(c,g.id),g);
    const idx=await leerLocal(kIndex(c),[]);
    idx.push({id:g.id,kind:g.kind,autor:g.autor,ts:g.ts,estado:g.estado});
    await local.set(kIndex(c),idx); cacheItem[c+g.id]=g;
    return;
  }
  let url='';
  if(it.blob){
    try{
      url = await subirArchivo(it.blob, `${c}/${it.id}`, alAvanzar);
    }catch(e){ e.paso='subir el archivo'; throw e; }
  }
  try{
    await SB.guardar('ce_items',{id:it.id, codigo:c, kind:it.kind, url,
      autor:it.autor, texto:it.texto||null, estado:it.estado, ts:it.ts}, claveDe(c));
  }catch(e){ e.paso='guardar en la base'; throw e; }
  cacheItem[c+it.id] = {...it, url, data:url||''};
}
/* Borra un evento completo. Primero anota la lista de archivos, después
   borra las filas y recién ahí el depósito: la base solo deja borrar
   archivos de eventos que ya no existen. */
async function borrarEvento(codigo,avisar){
  const paso=t=>{ if(avisar) avisar(t); };
  if(!HAY_NUBE){
    paso('Borrando…');
    const idx=await leerLocal(kIndex(codigo),[]);
    for(const i of idx){ delete memoria[kItem(codigo,i.id)]; delete cacheItem[codigo+i.id]; }
    delete memoria[kIndex(codigo)]; delete memoria[kMeta(codigo)];
    const lista=await leerLocal(LISTA,[]);
    await local.set(LISTA,lista.filter(e=>e.codigo!==codigo));
    return {archivos:idx.length,items:idx.length};
  }
  const clave=claveDe(codigo);
  paso('Buscando los archivos…');
  let rutas=[];
  try{
    const guardados=await SB.listarArchivos(codigo+'/');
    rutas=(guardados||[]).filter(a=>a&&a.name).map(a=>`${codigo}/${a.name}`);
  }catch(e){
    console.warn('no pude listar el depósito, uso las direcciones guardadas',e);
    const idx=await indice(codigo);
    for(const i of idx){
      const it=await item(codigo,i.id);
      const u=it&&urlSegura(it.data);
      if(u&&u.includes('/ce-medios/')) rutas.push(u.split('/ce-medios/')[1].split('?')[0]);
    }
  }
  /* ce-rollos tiene dos niveles (codigo/token/archivo.jpg): listar por
     prefijo solo trae las carpetas, así que pedimos las rutas reales a la
     base ANTES de borrar el evento (al borrarlo, cae en cascada). */
  let rutasRollo=[];
  try{ rutasRollo=await SB.rpc('ce_rutas_rollo',{p_codigo:codigo},clave)||[]; }
  catch(e){ console.warn('no pude listar las fotos del rollo',e); }
  /* Las filas primero: la base solo deja borrar archivos de eventos que ya
     no existen, así nadie puede vaciarle el depósito a una fiesta en curso. */
  paso('Borrando los recuerdos…');
  await SB.borrar('ce_items',`codigo=eq.${encodeURIComponent(codigo)}`,clave);
  paso('Borrando el evento…');
  await SB.borrar('ce_eventos',`codigo=eq.${encodeURIComponent(codigo)}`,clave);
  if(rutas.length){
    paso(`Borrando ${rutas.length} archivo${rutas.length>1?'s':''}…`);
    try{ await SB.borrarArchivos(rutas,clave); }
    catch(e){ console.warn('quedaron archivos sin borrar',e); }
  }
  if(rutasRollo.length){
    try{ await SB.borrarArchivos(rutasRollo,clave,'ce-rollos'); }
    catch(e){ console.warn('quedaron fotos del rollo sin borrar',e); }
  }
  olvidarClaveDe(codigo);
  for(const k of Object.keys(cacheItem)) if(k.startsWith(codigo)) delete cacheItem[k];
  return {archivos:rutas.length};
}

   sacaba probando el millón de combinaciones en un segundo. Ahora la página
   no sabe cuál es: le pregunta a la base, que la guarda cifrada con bcrypt.
   Así además la clave puede ser todo lo larga que haga falta. */
async function esMaestra(texto){
  if(!texto) return false;
  if(!HAY_NUBE){
    /* En modo demostración no hay base a la que preguntarle. No hay datos
       reales que proteger, pero tampoco regalamos el modo administrador. */
    return false;
  }

    const r=await SB.quienSoy(null,texto);
    return !!(r&&r.es_maestra);
  }catch(e){
    /* la base caída no es un error de la app: el organizador tipeó algo y
       no hay con qué comprobarlo. Se avisa bajito y se sigue. */
    console.warn('no pude comprobar la clave maestra',e);
    return false;
  }
}

/* El código del evento ES la llave: con él se sube al muro y se abre el
   álbum. Estaba saliendo de Math.random().toString(16).slice(2,8), que
   tiene tres problemas: no es azar de verdad (se puede predecir viendo
   unos pocos), a veces devuelve MENOS de seis dígitos (0.5 da "0.8", y
   ahí el código quedaba de una sola letra), y como guardar un evento es un
   "upsert" dos códigos iguales no dan error: uno pisa al otro y se lleva
   puesta la fiesta de otro cliente. El rollo ya lo tenía así; el muro no. */
const nuevoCodigo=tipo=>{
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const n=new Uint32Array(6);
  try{ crypto.getRandomValues(n); }
  catch(e){ for(let i=0;i<n.length;i++) n[i]=Math.floor(Math.random()*4294967296); }
  return (TIPOS[tipo]||'EVE')+'-'+[...n].map(x=>abc[x%abc.length]).join('');
};

/* Achica la foto y devuelve un archivo listo para subir.
   No convierte a texto en ningún momento: eso era lo que rompía en iPhone. */
async function comprimirBlob(file,max=1400,q=.7){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;
    });
    const e=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');
    c.width=Math.round(im.width*e); c.height=Math.round(im.height*e);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',q));
    return b||file;
  }catch(e){
    console.warn('no pude comprimir, subo el original',e);
    return file;
  }finally{ URL.revokeObjectURL(url); }
}
function fotoDemo(seed){
  let s=seed*9301+49297; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const vert=rnd()>.5;
  const c=document.createElement('canvas'); c.width=vert?760:1000; c.height=vert?1000:760;
  const x=c.getContext('2d');
  const pares=[['#120E0A','#3B2A18'],['#0C0D14','#26313F'],['#160D10','#452028'],['#0E1210','#22332B'],['#141014','#3A2438']];
  const t=pares[seed%pares.length];
  const g=x.createLinearGradient(0,0,c.width,c.height); g.addColorStop(0,t[0]); g.addColorStop(1,t[1]);
  x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
  const luces=['#F3D9A6','#FFE9C4','#E8C79A','#FFF4DF','#D9AE72'];
  for(let i=0;i<28;i++){
    x.globalAlpha=.08+rnd()*.42; x.fillStyle=luces[Math.floor(rnd()*luces.length)];
    x.beginPath(); x.arc(rnd()*c.width,rnd()*c.height,7+rnd()*72,0,7); x.fill();
  }
  x.globalAlpha=1;
  const v=x.createRadialGradient(c.width/2,c.height/2,c.height*.22,c.width/2,c.height/2,c.height*.8);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.72)');
  x.fillStyle=v; x.fillRect(0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.72);
}
