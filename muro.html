const dataABlob=async d=>{ try{ return await (await fetch(d)).blob(); }catch(e){ return null; } };

/* Gente y frases de una fiesta que no existe. Ni un dato real acá. */
const DEMO_GENTE=['Delfina','Tomás','Mica y Juli','Abuela Nélida','Francisco',
                  'Lucía','Nacho','Las primas','Sofía','Tío Beto','Caro','Juampi'];
const DEMO_FRASES=[
  'Bailá como si nadie te viera, que igual te estamos filmando.',
  'Quince años y ya nos hacés llorar a todos.',
  'La mejor noche del año, sin discusión.',
  'Gracias por dejarnos ser parte de esto.',
  'Que no se termine más.'];
const DEMO_PIES=['Qué noche','La entrada','El brindis','Todos juntos','No puedo más'];

async function sembrar(){
  const b=document.getElementById('demo');
  if(b){ if(b.disabled) return; b.disabled=true; b.textContent='Preparando…'; }
  recado('Preparando la fiesta de ejemplo…');
  try{
    /* En demostración el código lleva la palabra adelante: si alguna vez
       esto llegara a la base de verdad, se ve de lejos que es de mentira. */
    const codigo = 'DEMO-FIESTA';
    const tapa=fotoDemo(3);
    /* La base exige clave para dar de alta un evento. Si ya la tenemos
       guardada de otra vez la reusamos; si no, una nueva. */
    const claveEv=claveDe(codigo)||nuevaClave();
    /* Sin moderación: en la demostración lo que manda el visitante tiene que
       aparecer EN LA PANTALLA, que es todo el punto. Con moderar en true le
       decía "Enviado, el organizador lo aprueba" y no se veía nunca. */
    const datos={codigo,nombre:'Los 15 de Delfina',fecha:enDias(12),tipo:'XV',tono:'#D9AE72',
      hashtag:'#Delfina15',lugar:'Salón Las Acacias · Rosario',
      moderar:false,cerrado:false,portada:tapa,creado:Date.now(),claveNueva:claveEv};
    /* En la nube las fotos van al depósito de archivos: antes se guardaban
       los items sin archivo y el muro quedaba con fotos vacías. */
    if(HAY_NUBE) datos.portadaBlob=await dataABlob(tapa);
    await guardarMeta(datos);
    guardarClaveDe(codigo,claveEv);
    if(!HAY_NUBE) await local.set(kIndex(codigo),[]);
    const gente=DEMO_GENTE, frases=DEMO_FRASES;
    for(let i=0;i<9;i++){
      const d=fotoDemo(i+1);
      await sumar(codigo,{id:'d'+i,kind:'foto',data:d,blob:HAY_NUBE?await dataABlob(d):null,
        autor:gente[i],texto:i%3===0?DEMO_PIES[i%DEMO_PIES.length]:'',
        ts:Date.now()-(9-i)*60000,estado:'aprobado'});
    }
    for(let i=0;i<frases.length;i++)
      await sumar(codigo,{id:'m'+i,kind:'mensaje',data:'',autor:gente[i+3],texto:frases[i],
        ts:Date.now()-(frases.length-i)*30000,estado:'aprobado'});
    recado(HAY_DEMO?'Ejemplo listo':'Listo · fiesta cargada');
    /* En demostración se entra por donde entra un invitado, no por el panel
       del organizador: lo que se quiere mostrar es cómo se deja una foto o
       un saludo y aparece en la pantalla del salón. */
    ir(HAY_DEMO?'subir/'+codigo:'evento/'+codigo);
  }catch(e){
    console.error('sembrar',e);
    recado('No pude cargar la fiesta de ejemplo: '+motivo(e));
    if(b){ b.disabled=false; b.textContent='Cargar una fiesta de ejemplo'; }
  }
}

/* Copiar sin mentir: si el navegador no deja, se muestra el texto. */
async function copiarTexto(texto,aviso){
  try{
    if(!navigator.clipboard) throw new Error('sin portapapeles');
    await navigator.clipboard.writeText(texto);
    return recado(aviso||'Copiado');
  }catch(e){
    const t=document.createElement('textarea');
    t.value=texto; t.setAttribute('readonly','');
    t.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0,99999);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    t.remove();
    recado(ok?(aviso||'Copiado'):'Copialo a mano: '+texto);
  }
}

/* ¿La base ya tiene las claves instaladas? Mientras no se corra el SQL, la
   función no existe: en ese rato no le pedimos clave a nadie, porque nadie
   la tendría y quedarían todos afuera de sus propios eventos. */
let baseConClaves=guarda.leerSesion('ce:conClaves');
async function laBaseSabeDeClaves(){
  if(baseConClaves==='si') return true;
  if(baseConClaves==='no') return false;
  try{
    await SB.quienSoy(null,'');
    baseConClaves='si';
  }catch(e){
    const t=String((e&&e.message)||'');
    /* solo damos por vieja a la base si la función no existe; si el problema
       es la red, no abrimos la puerta por las dudas */
    baseConClaves=/PGRST202|does not exist|not find the function|404/i.test(t)?'no':'si';
  }
  guarda.escribirSesion('ce:conClaves',baseConClaves);
  return baseConClaves==='si';
}

     si alguien subía cualquier cosa, quedaba en la pantalla toda la noche. */
  const publi=app.querySelector('#publi');
  if(publi){
    const nuevos=apro.slice().reverse();          // lo último arriba
    let mostrados=0;
    const dibujar=async cuantos=>{
      const tanda=nuevos.slice(mostrados,mostrados+cuantos);
      mostrados+=tanda.length;
      for(const p of tanda){
        const it=await item(codigo,p.id); if(!it) continue;
        const d=document.createElement('div'); d.className='publi';
        const cara=it.kind==='foto'&&urlSegura(it.data)?`<img src="${src(it.data)}" alt="" loading="lazy">`
          :it.kind==='video'&&urlSegura(it.data)?`<video src="${src(it.data)}" muted playsinline></video>`
          :`<div class="tx">${esc(it.texto||(it.kind==='audio'?'Saludo de voz':'Sin texto'))}</div>`;
        d.innerHTML=`${cara}<span class="quien">${esc(it.autor||'Alguien')}</span>`;
        d.onclick=()=>{
          if(d.querySelector('.velo')) return;
          const velo=document.createElement('div'); velo.className='velo';
          velo.innerHTML=`<button class="sacar">Bajar</button><button class="dejar-ahi">Dejarlo</button>`;
          velo.querySelector('.dejar-ahi').onclick=e=>{ e.stopPropagation(); velo.remove(); };
          velo.querySelector('.sacar').onclick=async e=>{
            e.stopPropagation();
            const b=e.currentTarget; b.disabled=true; b.textContent='…';
            try{
              await cambiarEstado(codigo,p.id,'rechazado');
            }catch(err){
              b.disabled=false; b.textContent='Bajar';
              return recado('No se pudo bajar: '+motivo(err));
            }
            recado('Bajado de la pantalla',{
              texto:'Deshacer',
              hacer:async()=>{
                try{ await cambiarEstado(codigo,p.id,'aprobado'); recado('Vuelve a la pantalla'); vEvento(codigo); }
                catch(err){ recado('No se pudo recuperar: '+motivo(err)); }
              }
            });
            d.classList.add('se-va');
            d.addEventListener('animationend',()=>{
              d.remove();
              const cif=app.querySelector(`[data-kind="${p.kind}"]`);
              if(cif){
                const n=Math.max(0,(Number(cif.dataset.cifra)||0)-1);
                contarHasta(cif,n,320); cif.dataset.cifra=n;
              }
            },{once:true});
          };
          d.appendChild(velo);
        };
        publi.appendChild(d);
      }
    };
    await dibujar(TOPE_PUBLI);
    const verTodos=app.querySelector('#verTodosPubli');
    if(verTodos) verTodos.onclick=async()=>{
      verTodos.disabled=true; verTodos.textContent='Cargando…';
      await dibujar(nuevos.length);
      verTodos.remove();
    };
  }
}

async function vSubir(codigo){
  parar();
  const m=await meta(codigo); if(!m) return ir('invitado');
  tono(m.tono);
  if(m.cerrado) return vFinal(m);
  if(estaPorAbrir(m)) return vTodavia(m);
  const lista=(m.consignas&&m.consignas.length)?m.consignas:CONSIGNAS;
  const consigna=lista[Math.floor(Date.now()/60000)%lista.length];
  let modo='captura', medio=null;

  app.innerHTML=`
  <header class="cab-inv">
    <p class="arriba">Subí al muro</p>
    <h1>${esc(m.nombre)}</h1>
    <button class="volver">Salir</button>
  </header>
  <div class="wrap-inv">
    <div class="consigna"><div class="et">${ESTRELLA} Consigna de la noche ${ESTRELLA}</div><p>${esc(consigna)}</p></div>
    <div class="chips" role="group" aria-label="Qué querés mandar">
      <button data-m="captura" aria-pressed="true">${IC.foto}Foto o video</button>
      <button data-m="texto" aria-pressed="false">${IC.texto}Dedicatoria</button>
      <button data-m="voz" aria-pressed="false">${IC.voz}Voz</button>
    </div>
    <div id="zona"></div>
    <div class="campo"><label for="autor">Tu nombre</label>
      <input id="autor" type="text" placeholder="Como querés que salga en la pantalla" maxlength="26"></div>
  </div>
  <div class="accion-abajo"><div class="dentro">
    <button class="oro-btn" id="enviar">Enviar a la pantalla</button>
    <p class="pie-nota">${m.moderar?'Lo revisa el organizador antes de proyectarlo.':'Aparece en la pantalla del salón en segundos.'}</p>
  </div></div>`;
  app.querySelector('.cab-inv .volver').onclick=()=>ir('invitado');
  const zona=app.querySelector('#zona');

  function pintarZona(){
    if(modo==='captura'){
      zona.innerHTML = medio?`
        <div class="previa">${medio.kind==='video'?`<video src="${medio.previa}" controls playsinline></video>`:`<img src="${medio.previa}" alt="">`}
          <button class="x" aria-label="Quitar">✕</button></div>
        ${medio.pesado?`<p class="aviso-peso">Pesa ${Math.round(medio.blob.size/1048576)} MB. Con poca señal puede tardar un rato: no cierres la pantalla.</p>`:''}
        <div class="campo"><label for="pie">Epígrafe</label><input id="pie" type="text" placeholder="Opcional" maxlength="90"></div>`
      :`<label class="lente" for="file"><span class="aro">${ESTRELLA}</span>
          <b>Elegí una foto o un video</b><span>Se proyecta apenas la mandes</span>
          <input id="file" type="file" accept="image/*,video/*" hidden></label>`;
      const f=zona.querySelector('#file');
      if(f) f.onchange=async e=>{
        const a=e.target.files[0]; if(!a) return;
        recado('Preparando…');
        const esVideo=a.type.startsWith('video');
        const blob=esVideo? a : await comprimirBlob(a);
        if(blob.size>MAX_MB*1024*1024){
          e.target.value='';
          return recado(`Pesa ${Math.round(blob.size/1048576)} MB y el límite es ${MAX_MB}. Probá con algo más corto.`);
        }
        if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
        medio={kind:esVideo?'video':'foto', blob, previa:URL.createObjectURL(blob), pesado:blob.size>8*1024*1024};
        pintarZona();
      };
      const x=zona.querySelector('.x'); if(x) x.onclick=()=>{
        if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
        medio=null;pintarZona();
      };
      contador('#pie');
    }
    if(modo==='texto'){
      medio=null;
      zona.innerHTML=`<div class="campo"><label for="msg">Tu dedicatoria</label>
        <textarea id="msg" placeholder="Se proyecta en grande, así que decí algo lindo." maxlength="180"></textarea></div>`;
      contador('#msg');
    }
    if(modo==='voz'){
      zona.innerHTML=`<div class="lente" style="padding:38px 22px">
        <span class="aro">${ESTRELLA}</span><b>Saludo de voz</b><span>Hasta 15 segundos</span>
        <button class="hilo-btn" id="rec" style="max-width:280px;margin:22px auto 0">Empezar a grabar</button>
        <div id="repro" style="margin-top:16px"></div></div>`;
      zona.querySelector('#rec').onclick=grabar;
    }
  }
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    if(modo===b.dataset.m) return;
    if(mr&&mr.state==='recording'){ try{ mr.stop(); }catch(_){} }
    modo=b.dataset.m;
    /* soltar la foto sin liberar su memoria dejaba el video entero colgado
       del navegador: en un celular, probando de a una, se nota */
    if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
    medio=null;            // lo elegido en la otra solapa no se manda por error
    app.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    pintarZona();
  });
  pintarZona();
  contador('#autor');

  let mr=null,trozos=[],tt=null;
  async function grabar(){
    const btn=this;
    if(mr&&mr.state==='recording'){mr.stop();return;}
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      /* si el invitado se va de la pantalla mientras graba, el micrófono
         quedaba abierto (con el punto rojo del teléfono prendido) hasta
         que saltaba el corte de los 15 segundos */
      window._soltarMicro=()=>{
        try{ if(mr&&mr.state==='recording') mr.stop(); }catch(_){}
        s.getTracks().forEach(t=>t.stop());
        clearTimeout(tt);
      };
      /* el formato lo elige el navegador: en iPhone no es webm, y guardarlo
         con esa etiqueta dejaba el saludo con la extensión equivocada */
      mr=new MediaRecorder(s); trozos=[];
      mr.ondataavailable=e=>trozos.push(e.data);
      mr.onstop=async()=>{
        clearTimeout(tt); s.getTracks().forEach(t=>t.stop());
        window._soltarMicro=null;
        const tipo=(mr&&mr.mimeType)||(trozos[0]&&trozos[0].type)||'audio/webm';
        const blob=new Blob(trozos,{type:tipo.split(';')[0]});
        medio={kind:'audio', blob, previa:URL.createObjectURL(blob)};
        btn.textContent='Grabar de nuevo';
        zona.querySelector('#repro').innerHTML=`<audio src="${medio.previa}" controls style="width:100%"></audio>`;
      };
      mr.start();
      btn.innerHTML=`<span class="onda"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i></span>Grabando · tocá para parar`;
      tt=setTimeout(()=>mr.state==='recording'&&mr.stop(),15000);
    }catch(e){recado('No pude usar el micrófono');}
  }

  app.querySelector('#enviar').onclick=async()=>{
    const autor=app.querySelector('#autor').value.trim()||'Invitado';
    const pie=zona.querySelector('#pie'), msg=zona.querySelector('#msg');
    const texto=(msg?msg.value:pie?pie.value:'').trim();
    if(!medio&&!texto) return recado('Subí algo o escribí una dedicatoria');
    if(medio && !medio.blob) return recado('La foto no quedó lista, elegila de nuevo');
    const btn=app.querySelector('#enviar');
    btn.disabled=true; btn.textContent=medio?'Subiendo…':'Revelando…';
    if(medio) btn.classList.add('subiendo');
    const avance=f=>{
      btn.style.setProperty('--avance',Math.round(f*100)+'%');
      btn.textContent=f>=1?'Revelando…':`Subiendo ${Math.round(f*100)}%`;
    };
    try{
      await sumar(codigo,{id:idNuevo(),
        kind:medio?medio.kind:'mensaje', blob:medio?medio.blob:null, data:'', autor, texto, ts:Date.now(),
        estado:m.moderar?'pendiente':'aprobado'},
        avance);
      if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
      vMomento(m,autor);
    }catch(e){
      console.error('subir',e);
      btn.disabled=false; btn.classList.remove('subiendo');
      btn.style.removeProperty('--avance');
      btn.textContent='Enviar a la pantalla';
      recado('Falló al '+(e.paso||'preparar')+' · '+(e.name||'')+' · '+motivo(e));
    }
  };
}

  /* Dos modos en la misma pantalla:

      ${abre&&estaPorAbrir(m)?`<div class="cuenta-lanza" id="cuentaCartel"></div>
        <p class="cuando-abre">Se abre el ${esc(horaLinda(abre))}</p>`:''}
      <div class="qr-g" id="qrGrande"></div>
      <p class="como">Escaneá con la cámara · No hace falta instalar nada</p>
      <p class="cod-g">${esc(m.codigo)}</p>
      ${(m.hashtag||m.lugar)?`<p class="tag-g">${[m.hashtag,m.lugar].filter(Boolean).map(esc).join('  ·  ')}</p>`:''}
      <p class="ya" id="yaHay"></p>
    </section>
    <section class="tablero" id="salaTablero" hidden>
      <div class="tab-cabeza">
        <h2>${esc(m.nombre)}</h2>
        <span class="cod">${esc(m.codigo)}</span>
        <span class="derecha">
          <span class="envivo"><span class="pulso"></span>En vivo</span>
          <span class="total" id="totalTab">0<small>recuerdos</small></span>
        </span>
      </div>
      <div class="tab-cuerpo">
        <div class="tab-foto" id="telaT"></div>
        <aside class="tab-lado">
          <p class="titu-l">Entrando ahora</p>
          <div class="tab-cola" id="colaTab"></div>
          <div class="tab-qr">
            <span class="caja-q" id="qrTab"></span>
            <span><b>Escaneá y sumá tu foto</b>
              <span>Sin instalar nada. Aparece acá en segundos.</span></span>
          </div>
        </aside>
      </div>
      <div class="tab-tira"><div class="pista-t" id="tiraTab"></div></div>
    </section>
    <div class="tela" id="tela" hidden>
      <div class="vineta"></div><div class="destello" id="destello"></div>
      <div class="aguarda"><div>
        <img src="${LOGO_MARK}" style="width:180px;opacity:.5" alt="Click Eterno">
        <p class="ital">Esperando la primera foto de la noche</p>
        <p class="espaciado" style="margin-top:22px">${esc(m.codigo)}</p>
      </div></div>
    </div>
    <div class="consola">
      <span class="nom">${esc(m.nombre)}</span>
      <span class="envivo"><span class="pulso"></span>En vivo</span>
      <span class="cuenta" id="cuenta">0<small>En el muro</small></span>
      <span class="qr-sala" id="qrs"></span>
    </div>
  </div>`;
  app.querySelector('.dejar').onclick=()=>ir('evento/'+codigo);
  app.querySelector('#completa').onclick=()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>recado('Tocá F11 para pantalla completa'));
  };

  const cartel=app.querySelector('#salaCartel');
  const tablero=app.querySelector('#salaTablero');
  const MODOS=['cartel','tablero','muro'];
  let modo='cartel';
  const verModo=cual=>{
    modo=MODOS.includes(cual)?cual:'cartel';
    cartel.hidden=modo!=='cartel';
    tablero.hidden=modo!=='tablero';
    app.querySelector('#tela').hidden=modo!=='muro';
    app.querySelector('.sala').classList.toggle('en-cartel',modo!=='muro');
    app.querySelectorAll('[data-modo]').forEach(b=>
      b.setAttribute('aria-pressed',String(b.dataset.modo===modo)));
    if(modo!=='cartel'){
      arrancado=false;              // que vuelva a dibujar en el recuadro nuevo
      revisar().catch(e=>console.error('sala',e));
    }
  };
  app.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>verModo(b.dataset.modo));

  const teclas=e=>{
    if(e.key==='f'||e.key==='F') app.querySelector('#completa')?.click();
    if(e.key===' '){ e.preventDefault(); verModo(MODOS[(MODOS.indexOf(modo)+1)%MODOS.length]); }
    if(e.key==='ArrowRight'&&modo!=='cartel') pasar();
    if(e.key==='Escape'&&!document.fullscreenElement) ir('evento/'+codigo);
  };
  addEventListener('keydown',teclas);
  const limpiar=()=>removeEventListener('keydown',teclas);
  window._limpiarSala=limpiar;
  pintarQR(app.querySelector('#qrs'),enlaceDe(codigo),56);
  pintarQR(app.querySelector('#qrGrande'),enlaceDe(codigo),290);
  pintarQR(app.querySelector('#qrTab'),enlaceDe(codigo),92);
  if(abre&&estaPorAbrir(m))
    contarHacia(app.querySelector('#cuentaCartel'),m,()=>vPantalla(codigo));

  const tela=app.querySelector('#tela'), destello=app.querySelector('#destello');
  let ids=[], cursor=-1, vueltas=0, arrancado=false;

  const telaT=app.querySelector('#telaT');
  /* el tablero y el muro comparten el mismo mecanismo; cambia el recuadro */
  const lienzo=()=> modo==='tablero' ? telaT : tela;
  function marco(html,clases){
    const cont=lienzo();
    const d=document.createElement('div');
    d.className='toma '+(clases||'');
    d.innerHTML=html;
    cont.querySelectorAll('.toma').forEach(v=>{v.classList.remove('on');setTimeout(()=>v.remove(),1500);});
    cont.insertBefore(d,cont.firstChild);
    requestAnimationFrame(()=>d.classList.add('on'));
    return d;
  }
  const inicial=t=>esc(String(t||'?').trim().charAt(0).toUpperCase()||'?');
  const epigrafe=(it,nuevo)=>{
    if(modo==='tablero') return `<div class="epigrafe">
      ${nuevo?`<div class="recien">${ESTRELLA} Recién llegada</div>`:''}
      ${it.texto?`<div class="dice" style="margin:0 0 4px">“${esc(it.texto)}”</div>`:''}
      <div class="autoria"><span class="avatar">${inicial(it.autor)}</span>
        <span class="quien" style="font-size:inherit">${esc(it.autor)}</span>
        <span class="cuando-f">${esc(haceCuanto(it.ts))}</span></div></div>`;
    return `<div class="epigrafe">
      ${nuevo?`<div class="recien">${ESTRELLA} Recién llegada</div>`:''}
      <div class="quien">${esc(it.autor)}</div>
      ${it.texto?`<div class="dice">${esc(it.texto)}</div>`:''}</div>`;
  };

  async function mostrar(id,nuevo){
    const it=await item(codigo,id);
    if(!it||!tela.isConnected) return;        // salimos de la sala mientras cargaba
    const a=tela.querySelector('.aguarda'); if(a) a.remove();
    if(nuevo){destello.classList.remove('va');void destello.offsetWidth;destello.classList.add('va');}
    if((it.kind==='foto'||it.kind==='video')&&!urlSegura(it.data)) return;  // sin archivo
    if(it.kind==='foto') marco(`<img src="${src(it.data)}" alt="">${epigrafe(it,nuevo)}`, nuevo?'revelar':'kb');
    else if(it.kind==='video') marco(`<video src="${src(it.data)}" autoplay muted loop playsinline></video>${epigrafe(it,nuevo)}`, nuevo?'revelar':'');
    else if(it.kind==='audio') marco(`<div class="placa"><div class="cita">Un saludo de voz</div>
      <div class="quien">${esc(it.autor)}</div><audio src="${src(it.data)}" autoplay controls style="margin-top:30px"></audio></div>`,'encaja');
    else marco(`<div class="placa"><div class="cita">“${esc(it.texto)}”</div>
      <div class="quien">${esc(it.autor)}</div></div>`,'encaja');
  }
  /* costado con lo que viene entrando y tira con las dedicatorias */
  async function pintarTablero(){
    const total=app.querySelector('#totalTab');
    if(total&&total.dataset.n!==String(ids.length)){
      total.innerHTML='<b style="font:inherit">0</b><small>recuerdos</small>';
      contarHasta(total.querySelector('b'),ids.length,700);
      total.dataset.n=String(ids.length);
    }
    const cola=app.querySelector('#colaTab');
    if(cola){
      const enPantalla=ids[cursor];
      const proximos=[];
      for(const id of [...ids].reverse()){
        if(id===enPantalla) continue;
        const it=await item(codigo,id);
        if(it) proximos.push(it);
        if(proximos.length>=3) break;
      }
      const marca=proximos.map(i=>i.id).join('|');
      if(cola.dataset.marca!==marca){
        cola.dataset.marca=marca;
        cola.innerHTML=proximos.length?proximos.map(i=>{
          const u=urlSegura(i.data);
          if(i.kind==='foto'&&u) return `<div class="prox"><img src="${src(i.data)}" alt="">
            <span class="nom-p">${esc(i.autor)}</span></div>`;
          if(i.kind==='video'&&u) return `<div class="prox"><video src="${src(i.data)}" muted preload="metadata"></video>
            <span class="nom-p">${esc(i.autor)}</span></div>`;
          return `<div class="prox solo-texto"><span>${esc(i.texto||'Saludo de voz')}</span>
            <span class="nom-p">${esc(i.autor)}</span></div>`;
        }).join(''):`<div class="prox solo-texto"><span>Todavía no llegó nada</span></div>`;
      }
    }
    const tira=app.querySelector('#tiraTab');
    if(tira){
      const dichos=[];
      for(const id of [...ids].reverse()){
        const it=await item(codigo,id);
        if(it&&it.texto&&String(it.texto).trim()) dichos.push(it);
        if(dichos.length>=10) break;
      }
      const marca=dichos.map(i=>i.id).join('|');
      if(tira.dataset.marca!==marca){
        tira.dataset.marca=marca;
        tira.innerHTML=dichos.length
          ? dichos.map(i=>`<span class="dicho">“${esc(i.texto)}”<b>${esc(i.autor)}</b></span>`).join('')
          : `<span class="vacia">Las dedicatorias van a aparecer acá</span>`;
      }
    }
  }

  async function mosaico(){
    const fotos=[];
    for(const id of ids.slice(-9)){const it=await item(codigo,id); if(it&&it.kind==='foto'&&urlSegura(it.data)) fotos.push(it);}
    if(fotos.length<4) return false;
    marco(`<div class="mosaico">${fotos.map((f,i)=>`<img src="${src(f.data)}" style="animation-delay:${i*.1}s">`).join('')}</div>`,'encaja');
    return true;
  }
  async function revisar(){
    const idx=(await indice(codigo)).filter(i=>i.estado==='aprobado');
    const cuenta=app.querySelector('#cuenta');
    if(!cuenta||!tela.isConnected) return false;   // la vista ya no está
    const nuevos=idx.filter(i=>!ids.includes(i.id));
    ids=idx.map(i=>i.id);
    if(cuenta.dataset.n!==String(ids.length)){
      cuenta.innerHTML='<b style="font:inherit">0</b><small>En el muro</small>';
      contarHasta(cuenta.querySelector('b'),ids.length,700);
      cuenta.dataset.n=String(ids.length);
    }
    if(modo==='tablero') await pintarTablero();
    const ya=app.querySelector('#yaHay');
    if(ya) ya.innerHTML=ids.length
      ? `Ya mandaron <b>${ids.length}</b> ${ids.length===1?'recuerdo':'recuerdos'}`
      : '';
    if(nuevos.length){
      const ultimo=nuevos[nuevos.length-1].id;
      cursor=ids.indexOf(ultimo);
      await mostrar(ultimo,arrancado); arrancado=true; return true;
    }
    if(!arrancado&&ids.length){cursor=ids.length-1; await mostrar(ids[cursor],false); arrancado=true;}
    return false;
  }
  async function pasar(){
    if(!ids.length||!tela.isConnected) return;
    vueltas++;
    if(modo==='muro' && vueltas%6===0 && await mosaico()) return;
    cursor=(cursor+1)%ids.length;
    await mostrar(ids[cursor],false);
  }
  await revisar().catch(e=>console.error('sala',e));
  verModo('cartel');
  timerSala=setInterval(async()=>{
    try{
      const hubo=await revisar();
      if(!hubo && modo!=='cartel') await pasar();  // en el cartel no se pasan fotos
    }catch(e){ console.error('sala',e); }         // una noche entera sin cortarse
  },7000);
}

        <div class="hueso" style="height:34px;width:60%;margin:0 auto"></div>
        <div class="hueso" style="height:12px;width:38%;margin:18px auto 0"></div>
        <div class="rejilla-hueso">${'<i class="hueso"></i>'.repeat(9)}</div>
      </div>
    </div>`;

  /* si un item quedó sin archivo (subida cortada) no lo mostramos roto */
  const visuales=items.filter(i=>(i.kind==='foto'||i.kind==='video')&&urlSegura(i.data));
  const portada=m.portada||(visuales.find(i=>i.kind==='foto')||{}).data||'';
  const cifra=(t,v)=>`<div class="cifra ${v?'':'cero'}"><span>${t}</span><b data-cifra="${v}">0</b></div>`;

  const dedis=items.filter(i=>i.kind==='mensaje'), audios=items.filter(i=>i.kind==='audio');
  const gente=new Set(items.map(i=>i.autor)).size;

  app.innerHTML=`
  <button class="volver-flota" aria-label="Volver">←</button>
  <div class="album">
    <header class="tapa-g">
      ${urlSegura(portada)?`<div class="foto" style="background-image:url('${cssUrl(portada)}')"></div>`:''}
      <div class="texto">
        <p class="arriba">Álbum digital</p>
        <h1>${esc(m.nombre)}</h1>
        <p class="cuando">${bonito(m.fecha)}${m.lugar?' · '+esc(m.lugar):''}</p>
        ${m.hashtag?`<p class="tag-a">${esc(m.hashtag)}</p>`:''}
        <div class="pastillas">
          ${past(n('foto'),'fotos')}${past(n('video'),'videos')}
          ${past(dedis.length,'dedicatorias')}${past(audios.length,'audios')}
          ${past(gente,gente===1?'persona':'personas')}
        </div>
      </div>
    </header>

    <div class="wrap-a">
      <section id="aFotos" hidden>
        ${visuales.length?`
          <div class="seccion-a"><h2>Lo que sacaron</h2><span>${visuales.length}</span></div>
          <div class="mosaico-a">${visuales.map(i=>
            /* href solo con direcciones http(s): urlSegura deja pasar
               data:image/... , que sirve para un <img> pero en un enlace es
               abrir un archivo con contenido ajeno desde nuestro sitio. */
            `<a href="${esc(/^https?:\/\//i.test(urlSegura(i.data))?urlSegura(i.data):'')}" target="_blank" rel="noopener noreferrer" title="Abrir en grande">
              ${i.kind==='foto'
                ? `<img src="${src(i.data)}" alt="Foto de ${esc(i.autor)}" loading="lazy">`
                : `<video src="${src(i.data)}" muted preload="metadata"></video><span class="marca-video">▶</span>`}
              <span class="quien-f">${esc(i.autor)}</span></a>`).join('')}</div>`
        :`<div class="vacio">Todavía no hay fotos.<br>Las que suban tus invitados aparecen acá.</div>`}
      </section>

      <section id="aRecuerdos" hidden>
        ${dedis.length?`<div class="seccion-a"><h2>Dedicatorias</h2><span>${dedis.length}</span></div>
          ${dedis.map(i=>`<div class="dedicatoria"><p>“${esc(i.texto)}”</p><b>${esc(i.autor)}</b></div>`).join('')}`:''}
        ${audios.length?`<div class="seccion-a"><h2>Saludos de voz</h2><span>${audios.length}</span></div>
          ${audios.map(i=>`<div class="dedicatoria"><b>${esc(i.autor)}</b>
            <audio src="${src(i.data)}" controls style="width:100%;margin-top:12px"></audio></div>`).join('')}`:''}
        ${dedis.length||audios.length?'':`<div class="vacio">Todavía nadie dejó un mensaje.</div>`}
      </section>

      <section id="aGuardar" hidden>
        <div class="seccion-a"><h2>Llevate el álbum</h2></div>
        ${items.length?`
          <p style="color:#B5AC9E;font-size:14.5px;line-height:1.8;margin-bottom:24px">
            ${items.length} recuerdos de ${gente} ${gente===1?'persona':'personas'}.
            Se descargan en calidad original.</p>
          <div class="acciones" style="margin-top:0"><button id="dl">Descargar todo</button><button id="pdf">Guardar en PDF</button></div>
          ${m.vence?`<p class="pie-nota">Disponible para descargar hasta el ${bonito(m.vence)}.</p>`:''}`
        :`<div class="vacio">El álbum está vacío por ahora.</div>`}
        ${sumate('Las fotos de tu fiesta,<br>en la pantalla y para siempre.','Hola! Vi un álbum de Click Eterno y quiero info para mi evento ✨')}
        <div class="pie-marca"><img src="${LOGO_MARK}" alt="Click Eterno"></div>
      </section>
    </div>
  </div>
  <nav class="barra-abajo" role="tablist">
    ${solapa('aFotos',IC.fotos,'Fotos')}
    ${solapa('aRecuerdos',IC.recuerdos,'Recuerdos')}
    ${solapa('aGuardar',IC.guardar,'Guardar')}
  </nav>`;
  app.querySelector('.volver-flota').onclick=()=>ir('evento/'+codigo);
  /* se puede entrar directo a una solapa: #album/CODIGO/guardar */
  const pedida=abrirEn?'a'+abrirEn[0].toUpperCase()+abrirEn.slice(1):'';
  activarSolapas(pedida && app.querySelector(`[data-sol="${pedida}"]`) ? pedida : 'aFotos');
  const dl=app.querySelector('#dl');
  if(dl){
    const base=nombreSeguro(m.nombre);
    dl.onclick=async()=>{
      if(dl.disabled) return;
      dl.disabled=true;
      const total=visuales.length;
      /* El archivo se arma entero en la memoria del aparato. En una compu
         no molesta; en un celular, con cientos de fotos, la pestaña se
         cierra sola a mitad de camino. Mejor avisar antes que perderlo. */
      const pesaMucho=total>150;
      if(pesaMucho && !/compu|escritorio/i.test('') &&
         !confirm(`Son ${total} archivos. Armarlos en un solo ZIP puede ser demasiado `+
                  `para un celular: si podés, hacelo desde una computadora.\n\n¿Seguimos igual?`)){
        dl.disabled=false;
        return;
      }
      let hechos=0, fallados=0;
      const paso=()=>{ dl.textContent=`Bajando ${hechos}/${total}…`; };
      paso();
      try{
        /* Hay que traerse el contenido real: antes se guardaba la dirección
           del archivo como si fuera el archivo, y el ZIP salía vacío. */
        const archivos=[];
        for(const [k,i] of visuales.entries()){
          try{
            const b=await aBlob(i.data);
            if(b&&b.size) archivos.push({
              nombre:`${base}-${String(k+1).padStart(3,'0')}.${EXT[b.type]||(i.kind==='foto'?'jpg':'mp4')}`,
              blob:b});
            else fallados++;
          }catch(err){ fallados++; console.warn('no pude bajar',i.id,err); }
          hechos++; paso();
        }
        if(!archivos.length) throw new Error('no se pudo bajar ningún archivo');

        const dedis=items.filter(i=>i.kind==='mensaje');
        const texto=dedis.length?`${m.nombre} · ${bonito(m.fecha)}\n\n`+
          dedis.map(i=>`"${i.texto}"\n   — ${i.autor}\n`).join('\n'):'';

        if(window.JSZip){
          dl.textContent='Armando el archivo…';
          const zip=new JSZip();
          archivos.forEach(a=>zip.file(a.nombre,a.blob));
          if(texto) zip.file('dedicatorias.txt',texto);
          bajarBlob(await zip.generateAsync({type:'blob'}),`${base} - Click Eterno.zip`);
          recado(`Listo · ${archivos.length} archivos`+(fallados?` (${fallados} no se pudieron bajar)`:''));
        }else{
          /* Sin la librería (CDN caído): de a uno, pero como blob propio,
             así el navegador descarga en vez de irse de la página. */
          archivos.forEach((a,k)=>setTimeout(()=>bajarBlob(a.blob,a.nombre),k*500));
          if(texto) setTimeout(()=>bajarBlob(new Blob([texto],{type:'text/plain'}),'dedicatorias.txt'),archivos.length*500);
          recado('Descargando de a una');
        }
      }catch(e){
        console.error('descargar album',e);
        recado('No pude preparar la descarga: '+motivo(e));
      }
      dl.disabled=false; dl.textContent='Descargar todo';
    };
    app.querySelector('#pdf').onclick=()=>{
      document.body.classList.add('imp-album');
      const limpiar=()=>document.body.classList.remove('imp-album');
      addEventListener('afterprint',limpiar,{once:true});
      setTimeout(limpiar,4000);
      window.print();
    };
  }
}

async function vDiagnostico(){
  parar(); tono();
  app.innerHTML=`${barra('Diagnóstico','Versión v12')}
  <div class="wrap" style="padding-top:24px">
    <div id="res" style="font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.9;
      white-space:pre-wrap;word-break:break-word;color:#B5AC9E"></div>
    <div id="zonaPrueba" style="margin-top:30px"></div>
  </div>`;
  app.querySelector('.vuelve').onclick=()=>ir('portada');
  const out=app.querySelector('#res');
  const linea=(t,ok)=>{ out.innerHTML += `<div style="color:${ok===true?'#7BE0A5':ok===false?'#FF7B94':'#B5AC9E'}">${esc(t)}</div>`; };
  const titulo=t=>{ out.innerHTML += `<div style="color:var(--oro);margin:18px 0 6px;letter-spacing:.16em;text-transform:uppercase;font-size:10.5px">${esc(t)}</div>`; };
  /* deja anotado si algo salió mal, para el resumen del final */
  const problemas=[];
  const revisar=(t,ok,nota)=>{ linea((ok?'✓ ':'✗ ')+t, ok); if(!ok) problemas.push(nota||t); return ok; };

  titulo('Configuración');
  linea('Versión de la app: v12');
  revisar('La nube está configurada', HAY_NUBE, 'faltan la URL y la clave de Supabase');
  linea('URL: '+NUBE.url);
  linea('Navegador en línea: '+(navigator.onLine?'sí':'no'));

  /* La clave pública trae adentro qué permisos tiene. Si alguna vez se pega
     por error la clave de servicio, cualquiera que abra la página tiene
     permiso total sobre la base: hay que verlo de inmediato. */
  let rol='';
  try{
    const cuerpo=JSON.parse(atob(NUBE.clave.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    rol=cuerpo.role||'';
    if(rol==='service_role'){
      revisar('La clave de la página es la PÚBLICA', false,
        'PELIGRO: está pegada la clave de servicio. Cambiala ya por la anon.');
      linea('  Cualquiera que abra la página tiene permiso TOTAL sobre la base.', false);
    }else revisar('La clave de la página es la pública ('+rol+')', rol==='anon',
      'la clave no parece la anon: revisá cuál pegaste');
    if(cuerpo.exp){
      const vence=new Date(cuerpo.exp*1000);
      const dias=Math.round((vence-Date.now())/86400000);
      revisar('La clave no está vencida (vence en '+dias+' días)', dias>0,
        'la clave de la base está vencida: hay que generar una nueva');
    }
  }catch(e){ linea('No pude leer la clave para revisarla'); }

  titulo('Conexión');
  let hayTablas=false;
  try{
    const r=await fetch(NUBE.url+'/rest/v1/ce_eventos?select=codigo&limit=1',
      {cache:'no-store',headers:{apikey:NUBE.clave,Authorization:'Bearer '+NUBE.clave}});
    const txt=await r.text();
    hayTablas=r.ok;
    revisar('La base contesta ('+r.status+')', r.ok, 'la base no contesta: '+txt.slice(0,80));
    if(!r.ok) linea('  '+txt.slice(0,200), false);
  }catch(e){
    revisar('La base contesta', false, 'no hay conexión con la base: '+e.message);
  }

  titulo('Qué tiene instalado');
  if(hayTablas){
    /* pedir una columna que no existe da error: así sabemos si falta */
    const tieneColumna=async col=>{
      try{ await SB.ver('ce_eventos',`select=${col}&limit=1`); return true; }catch(e){ return false; }
    };
    for(const [col,para] of [['lanza','programar la apertura'],
                             ['hashtag','el hashtag del evento'],
                             ['lugar','el lugar del evento'],
                             ['camara','la cámara descartable']]){
      const hay=await tieneColumna(col);
      revisar(`Columna "${col}" (${para})`, hay, `falta la columna "${col}": correr el SQL que la agrega`);
    }
    const tieneFuncion=async fn=>{
      try{ await SB.rpc(fn,{p_codigo:null}); return true; }
      catch(e){ return !/PGRST202|does not exist|not find the function|404/i.test(String(e.message||'')); }
    };
    const hayClaves=await tieneFuncion('ce_quien_soy');
    revisar('El sistema de claves está instalado', hayClaves,
      'falta correr sql/claves.sql: sin eso cualquiera puede modificar cualquier evento');

    titulo('La clave llega hasta la base');
    try{
      const r=await SB.quienSoy(null,'PRUEBA-DE-CABECERA');
      revisar('La clave viaja entera hasta la base', !!(r&&r.llego_la_clave),
        'la clave no llega: nadie va a poder moderar ni cambiar nada');
      if(claveMaestra){
        const q=await SB.quienSoy(null,claveMaestra);
        revisar('La clave de administrador está reconocida', !!(q&&q.es_maestra),
          'la clave de administrador no la reconoce la base');
      }else linea('  (entrá con la clave de administrador para probarla también)');
    }catch(e){ revisar('La clave viaja hasta la base', false, 'no pude comprobarlo: '+motivo(e)); }
  }else{
    linea('  Sin conexión no se puede revisar el resto.');
  }

  titulo('Resumen');
  if(problemas.length){
    linea(problemas.length+' cosa'+(problemas.length>1?'s':'')+' para arreglar:', false);
    problemas.forEach(p=>linea('  · '+p, false));
  }else linea('Todo en orden.', true);

  /* ── la prueba de fondo: escribe de verdad y después se limpia sola ── */
  const zona=app.querySelector('#zonaPrueba');
  zona.innerHTML=`
    <p style="font-size:13px;color:#B5AC9E;line-height:1.7;margin-bottom:16px">
      La prueba de fondo crea un evento de mentira, comprueba que los permisos
      funcionen de verdad y después lo borra. No toca ninguna fiesta tuya.</p>
    <button class="hilo-btn" id="probarTodo">Probar los permisos de verdad</button>
    <div id="salidaPrueba" style="font-family:ui-monospace,monospace;font-size:12.5px;
      line-height:1.9;white-space:pre-wrap;word-break:break-word;margin-top:18px"></div>`;
  zona.querySelector('#probarTodo').onclick=e=>pruebaDeFondo(e.currentTarget, zona.querySelector('#salidaPrueba'));
}

/* Prueba de fondo contra la base de verdad. Crea un evento propio con un
   código que no se puede confundir con uno real, lo maltrata, y lo borra
   pase lo que pase. Es la única forma de saber que los permisos funcionan
   en tu Supabase y no solo en las pruebas. */
async function pruebaDeFondo(boton, salida){
  if(boton.dataset.ocupado) return;
  boton.dataset.ocupado='1'; boton.disabled=true; boton.textContent='Probando…';
  salida.innerHTML='';
  const fallas=[];
  const di=(t,ok)=>{ salida.innerHTML += `<div style="color:${ok===true?'#7BE0A5':ok===false?'#FF7B94':'#B5AC9E'}">${esc(t)}</div>`; };
  const probar=(t,ok)=>{ di((ok?'✓ ':'✗ ')+t, ok); if(!ok) fallas.push(t); };
  /* el código lleva PRUEBA adelante: si algo queda colgado, se ve enseguida */
  const cod='PRUEBA-'+nuevaClave();
  const clave=nuevaClave(), otraClave=nuevaClave();
  di('Evento de prueba: '+cod);
  try{
    // 1. crear: la base tiene que exigir clave
    try{
      await SB.guardar('ce_eventos',{codigo:cod,nombre:'Prueba de Click Eterno',
        fecha:hoy(),tipo:'XV',tono:'#D9AE72',moderar:true,cerrado:false,creado:Date.now()});
      probar('Sin clave NO se puede crear un evento', false);
    }catch(e){ probar('Sin clave NO se puede crear un evento', true); }

    await SB.guardar('ce_eventos',{codigo:cod,nombre:'Prueba de Click Eterno',
      fecha:hoy(),tipo:'XV',tono:'#D9AE72',moderar:true,cerrado:false,creado:Date.now()}, clave);
    probar('Con clave sí se crea', !!(await meta(cod)));

    // 2. un invitado sube: la base decide el estado, no el celular
    await SB.guardar('ce_items',{id:'p-'+idNuevo(),codigo:cod,kind:'mensaje',url:'',
      autor:'Invitado de prueba',texto:'hola',estado:'aprobado',ts:Date.now()});
    const subidos=await SB.ver('ce_items',`codigo=eq.${encodeURIComponent(cod)}&select=estado`);
    probar('Un invitado no puede autoaprobarse (moderación encendida)',
      subidos.length===1 && subidos[0].estado==='pendiente');

    // 3. sin la clave no se toca nada
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'HACKEADO'}).catch(()=>{});
    probar('Sin clave NO se puede renombrar el evento', (await meta(cod)).nombre!=='HACKEADO');
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{cerrado:true}).catch(()=>{});
    probar('Sin clave NO se puede cerrar el muro', !(await meta(cod)).cerrado);
    await SB.borrar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`).catch(()=>{});
    probar('Sin clave NO se puede borrar el evento', !!(await meta(cod)));

    // 4. con la clave sí
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'Renombrada'},clave);
    probar('Con la clave sí se renombra', (await meta(cod)).nombre==='Renombrada');

    // 5. cambiar la clave deja la vieja sin efecto
    await SB.cambiarClave(cod,clave,otraClave);
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'Con la vieja'},clave).catch(()=>{});
    probar('La clave vieja deja de servir', (await meta(cod)).nombre!=='Con la vieja');
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'Con la nueva'},otraClave);
    probar('La clave nueva sirve', (await meta(cod)).nombre==='Con la nueva');

    // 6. la clave de otro evento no abre este
    if(claveMaestra){
      await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{tono:'#111111'},claveMaestra);
      probar('La clave de administrador abre cualquier evento', (await meta(cod)).tono==='#111111');
    }else di('  (entrá como administrador para probar también la clave maestra)');
  }catch(e){
    di('La prueba se cortó: '+motivo(e), false);
    fallas.push('se cortó a la mitad');
  }finally{
    /* pase lo que pase, el evento de prueba no queda dando vueltas */
    di('Limpiando…');
    let limpio=false;
    for(const c of [otraClave, clave, claveMaestra].filter(Boolean)){
      try{
        await SB.borrar('ce_items',`codigo=eq.${encodeURIComponent(cod)}`,c);
        await SB.borrar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,c);
        if(!(await meta(cod))){ limpio=true; break; }
      }catch(e){}
    }
    probar('El evento de prueba quedó borrado', limpio);
    if(!limpio) di('  Borralo a mano: '+cod, false);
    di('———');
    if(fallas.length) di(fallas.length+' prueba'+(fallas.length>1?'s':'')+' fallaron. Mandale esta pantalla a Click Eterno.', false);
    else di('Los permisos funcionan como corresponde.', true);
    boton.disabled=false; boton.textContent='Probar de nuevo'; delete boton.dataset.ocupado;
  }
}

/* ══════════ router ══════════ */
/* Antes ir() cambiaba el hash Y pintaba: el evento hashchange volvía a
   pintar, así que cada navegación cargaba todo dos veces. */
/* Empezar de nuevo es recargar: todo lo de la demostración vive en memoria,
   así que la recarga lo limpia entero y vuelve a sembrar la misma fiesta.
   Sin hash, para caer donde cae el que entra por primera vez. */
function reiniciarDemo(){ location.replace(location.pathname+'?demo=1'); }

function ir(ruta){
  const destino='#'+ruta;
  if(location.hash===destino) pintar(ruta);   // mismo hash: no hay evento
  else location.hash=destino;                 // hashchange pinta
}

/* Última red: si una vista falla, el usuario ve una salida, no una pantalla muerta. */
function pantallaError(e){
  console.error('vista',e);
  try{ parar(); }catch(_){}
  app.innerHTML=`
  <div class="final"><div>
    <img src="${LOGO_MARK}" style="width:150px;opacity:.6" alt="Click Eterno">
    <div class="filete" style="max-width:240px;margin:24px auto">${ESTRELLA}</div>
    <p class="espaciado">Algo se cortó</p>
    <h1 class="ital" style="font-size:clamp(30px,8vw,42px);margin:14px 0 14px">Probá de nuevo</h1>
    <p style="color:#B5AC9E;line-height:1.8;max-width:32ch;margin:0 auto;font-size:14.5px">${esc(motivo(e))}</p>
    <div style="max-width:320px;margin:32px auto 0">
      <button class="oro-btn" id="recargar">Recargar</button>
      <button class="hilo-btn" id="alInicio">Volver al inicio</button>
    </div>
  </div></div>`;
  app.querySelector('#recargar').onclick=()=>location.reload();
  app.querySelector('#alInicio').onclick=()=>ir('portada');
}

const PIDE_CODIGO=['evento','subir','pantalla','album','cartel'];
function pintar(ruta){
  const [v,arg,extra]=String(ruta||'').split('/');
  window.scrollTo(0,0);
  if(PIDE_CODIGO.includes(v)&&!arg){        // enlace cortado o mal pegado
    recado('Ese enlace está incompleto');
    return vPortada().catch(pantallaError);
  }
  let p;
  try{
    /* En demostración solo existe lo que ve un invitado: subir algo, la
       pantalla del salón y el álbum. El panel del organizador, el cartel y
       el diagnóstico son herramientas de quien vende el servicio, no parte
       de la muestra. Todo lo demás cae en la pantalla de subir. */
    if(HAY_DEMO && ['panel','evento','cartel','diagnostico','invitado','portada',''].includes(v))
      return ir(v==='proyector'?'pantalla/DEMO-FIESTA':'subir/DEMO-FIESTA');
    if(HAY_DEMO && v==='proyector') return ir('pantalla/DEMO-FIESTA');
    if(v==='panel') p=vAcceso();
    else if(v==='diagnostico') p=vDiagnostico();
    else if(v==='evento') p=vEvento(arg);
    else if(v==='invitado') p=vElegir('subir','Invitado');
    else if(v==='proyector') p=vElegir('pantalla','Pantalla');
    else if(v==='subir') p=vSubir(arg);
    else if(v==='pantalla') p=vPantalla(arg);
    else if(v==='album') p=vAlbum(arg,extra);
    else if(v==='cartel') p=vCartel(arg);
    else p=vPortada();
  }catch(e){ return pantallaError(e); }
  if(p&&typeof p.catch==='function') p.catch(pantallaError);
  return p;
}
addEventListener('hashchange',()=>pintar(location.hash.slice(1)||'portada'));

/* Nada de fallos mudos: si una promesa queda sin capturar, se avisa. */
addEventListener('unhandledrejection',e=>{
  console.error('promesa sin capturar',e.reason);
  recado('Algo falló: '+motivo(e.reason));
  e.preventDefault();
});
/* Y lo mismo con lo que revienta sin promesa de por medio: un toque que
   fallaba dentro de su propio manejador no mostraba nada en pantalla. */
addEventListener('error',e=>{
  if(e&&e.target&&e.target!==window) return;   // una imagen rota no es esto
  console.error('error suelto',e.error||e.message);
  try{ recado('Algo falló: '+motivo(e.error||{message:e.message})); }catch(_){}
});

(async function(){
  if(HAY_DEMO){
    /* Que el visitante caiga adentro de una fiesta andando, no en una
       pantalla de bienvenida. Si ya la sembró en esta pestaña, se entra
       directo. */
    document.body.classList.add('en-demo');
    document.body.insertAdjacentHTML('afterbegin', `
      <div id="cinta-demo">
        <span><b>Demostración</b> · la fiesta y las fotos son inventadas</span>
        <button id="deNuevo">Empezar de nuevo</button>
        <a href="/">Salir</a>
      </div>`);
    document.getElementById('deNuevo').onclick=reiniciarDemo;
    /* Se siembra SIEMPRE, sin preguntar si ya estaba: es un modo prueba, y
       cada vez que alguien entra tiene que encontrarlo igual que el primero.
       Lo que dejó el anterior no es parte de la muestra. */
    app.innerHTML = `<div class="final"><div>
      <img src="${LOGO_MARK}" style="width:120px;opacity:.6" alt="">
      <p class="espaciado" style="margin-top:24px">Preparando la fiesta de ejemplo…</p>
    </div></div>`;
    try{ await sembrar(); }catch(e){ console.error('demo',e); }
    return;   // sembrar() deja al visitante en la pantalla de subir
  }
  pintar(location.hash.slice(1)||'portada');
})();
</script>
