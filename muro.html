        ? `<p class="titu-s" style="margin-top:26px">Esperando tu aprobación</p><div class="cola" id="cola"></div>`
        : apro.length ? ''   /* la grilla de abajo ya cuenta cómo viene la mano */
          : `<div class="vacio-mod">${ESTRELLA}<br>
             ${m.moderar?'No hay nada esperando.<br>Lo que suban tus invitados aparece acá.'
                        :'La moderación está apagada:<br>lo que suben va directo a la pantalla.'}</div>`}
      ${apro.length?`
        <p class="titu-s" style="margin-top:34px">Ya está en la pantalla${apro.length>TOPE_PUBLI?` · últimos ${TOPE_PUBLI} de ${apro.length}`:` · ${apro.length}`}</p>
        <p class="pie-nota" style="text-align:left;margin:0 0 2px">
          Tocá cualquiera para bajarlo de la pantalla y del álbum. No se borra: se puede volver a subir.</p>
        <div class="publicados" id="publi"></div>
        ${apro.length>TOPE_PUBLI?`<button class="hilo-btn" id="verTodosPubli" style="margin-top:12px">Ver los ${apro.length}</button>`:''}`:''}
    </section>

    <section class="panel-ev" id="pAjustes" hidden>
      <div class="tarjeta">
        <p class="titu-s">Datos del evento</p>
        <div class="campo"><label for="edNombre">Nombre</label>
          <input id="edNombre" type="text" maxlength="60" value="${esc(m.nombre||'')}"></div>
        <div class="campo"><label for="edFecha">Fecha</label>
          <input id="edFecha" type="date" value="${esc(m.fecha||'')}"></div>
        <div class="campo"><label>Tono</label>
          <div class="tonos">${TONOS.map(t=>`<button class="tono" data-c="${t.c}" title="${esc(t.n)}"
            aria-pressed="${(m.tono||TONOS[0].c)===t.c}" style="background:${t.c}"></button>`).join('')}</div></div>
        <button class="hilo-btn" id="guardarDatos">Guardar los datos</button>
      </div>
      <div class="tarjeta">
        <p class="titu-s">Hashtag y lugar</p>
        <div class="campo"><label for="edTag">Hashtag</label>
          <input id="edTag" type="text" maxlength="40" autocapitalize="none"
            placeholder="#Delfina15" value="${esc(m.hashtag||'')}"></div>
        <div class="campo"><label for="edLugar">Dónde es</label>
          <input id="edLugar" type="text" maxlength="60"
            placeholder="Salón Las Acacias · Rosario" value="${esc(m.lugar||'')}"></div>
        <p style="font-size:13px;color:#B5AC9E;line-height:1.7;margin-bottom:18px">
          Aparecen en el cartel de mesa, en la pantalla del salón y en el álbum.
          Sirve para que lo que suban a Instagram quede todo junto.</p>
        <button class="hilo-btn" id="guardarTag">Guardar</button>
      </div>
      <div class="tarjeta">
        <p class="titu-s">Portada del álbum</p>
        <div class="porta-fila" id="porta"></div>
      </div>
      <div class="tarjeta">
        <p class="titu-s">Clave de este evento</p>
        ${clavesGuardadas()[codigo]
          ? `<div class="clave-fila"><span style="margin:0">Clave guardada</span>
               <b>${esc(clavesGuardadas()[codigo])}</b></div>
             <button class="hilo-btn" id="copiarClaveEv">Copiar la clave</button>`
          : `<p style="font-size:13.5px;color:#B5AC9E;line-height:1.7">
               En este aparato no está guardada${esAdmin?' (entraste con la clave de administrador)':''}.</p>`}
        <button class="hilo-btn" id="cambiarClaveEv">${clavesGuardadas()[codigo]?'Cambiar la clave':'Ponerle una clave nueva'}</button>
        <div id="zonaClave"></div>
      </div>
      <div class="tarjeta">
        <p class="titu-s">Cuándo se abre el muro</p>
        <div class="campo"><label for="lanza">Día y hora</label>
          <input id="lanza" type="datetime-local" value="${esc(m.lanza||'')}"></div>
        <p style="font-size:13px;color:#B5AC9E;line-height:1.7;margin-bottom:18px">
          Hasta esa hora, los invitados ven una cuenta regresiva en vez del
          formulario. Dejalo vacío para que esté abierto desde ya.</p>
        <button class="hilo-btn" id="guardarL">Guardar horario</button>
        ${m.lanza?`<button class="hilo-btn" id="borrarL">Abrir ahora (quitar horario)</button>`:''}
      </div>
      <div class="tarjeta">
        <p class="titu-s">Consignas de la noche</p>
        <textarea id="consignas" placeholder="Una por línea. Si lo dejás vacío usamos las nuestras." style="min-height:104px">${esc((m.consignas||[]).join('\n'))}</textarea>
        <button class="hilo-btn" id="guardarC">Guardar consignas</button>
      </div>
      <div class="llave" style="border-bottom:0">
        <p>Muro cerrado<small>Corta las subidas y publica el álbum final.</small></p>
        <button class="palanca" id="cerr" aria-pressed="${!!m.cerrado}"></button></div>

      ${esAdmin?`<div class="tarjeta peligro" style="margin-top:26px">
        <p class="titu-s">Zona de peligro</p>
        <p>Se borra el evento y todo lo que subieron los invitados. Los archivos
          se eliminan del depósito y no se pueden recuperar.</p>
        <ul>
          <li><b>${idx.length}</b> recuerdo${idx.length===1?'':'s'} en total</li>
          <li><b>${apro.filter(i=>i.kind==='foto').length}</b> fotos ·
              <b>${apro.filter(i=>i.kind==='video').length}</b> videos ·
              <b>${apro.filter(i=>i.kind==='audio').length}</b> audios</li>
          <li>El álbum digital deja de existir</li>
        </ul>
        <div id="zonaBorrar">
          <button class="btn-peligro" id="pedirBorrar">Eliminar este evento</button>
        </div>
      </div>`:''}
    </section>

  </div>

  <nav class="barra-abajo" role="tablist">
    ${solapa('pCompartir',IC.compartir,'Compartir')}
    ${solapa('pModerar',IC.moderar,'Moderar',pend.length?`<span class="globo-n" id="globoPend">${pend.length}</span>`:'')}
    ${solapa('pAjustes',IC.ajustes,'Ajustes')}
  </nav>`;

  app.querySelector('.atras').onclick=()=>ir(HAY_DEMO?'portada':'panel');
  app.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>ir(b.dataset.ir));
  app.querySelectorAll('.estrella').forEach(e=>{ if(!e.innerHTML) e.innerHTML=ESTRELLA; });
  animarCifras();

  /* si hay cosas esperando, abrimos ahí: es lo urgente durante la fiesta */
  /* Con cosas esperando abrimos en Moderar: durante la fiesta es lo urgente.
     En la demostración no: el que entra a mirar tiene que caer en el QR y la
     pantalla del salón, que es lo que explica el producto. */
  /* Y si venimos de guardar algo, en la solapa donde estaba. */
  activarSolapas(abrirEn || (pend.length&&!HAY_DEMO?'pModerar':'pCompartir'),
                 abrirEn ? false : undefined);

  /* ── el panel se entera solo de lo que va llegando ──
     La pantalla del salón se refresca cada siete segundos, pero esta no lo
     hacía: durante la fiesta el organizador se quedaba mirando "Moderar"
     mientras las fotos se apilaban sin aparecer, y con la moderación
     encendida eso quiere decir que no se proyecta nada. Había que salir y
     volver a entrar para verlas, y nadie lo sabe.
     El globo con el número se actualiza siempre; la lista se vuelve a
     dibujar solo si el organizador está mirando Moderar, para no moverle la
     pantalla de abajo del dedo mientras toca otra cosa. */
  if(HAY_NUBE && !m.cerrado){
    /* null = todavía no miramos. La primera vuelta solo anota lo que hay; no
       redibuja. Si se inicializara con lo que se acaba de dibujar, cualquier
       diferencia de forma entre ese dato y el que devuelve esta consulta
       hace que "cambió" sea verdadero para siempre: el panel se redibujaba
       solo, en bucle, bajándose la lista entera cada vez. */
    let ultimaCola = null;
    reloj(async()=>{
      /* si hay una foto abierta en grande o una confirmación a medias, no es
         momento de redibujar nada */
      if(document.querySelector('.visorf, .capa, #zonaBorrar button[data-confirma]')) return;
      /* Solo los que esperan, y solo su id: es lo único que hace falta para
         el globo. Pedir el índice entero cada ocho segundos son 130 MB por
         hora en una fiesta de 1500 recuerdos, y los paga el teléfono del
         organizador con el wifi del salón. */
      let pend2;
      try{
        pend2 = await SB.ver('ce_items',
          `codigo=eq.${encodeURIComponent(codigo)}&estado=eq.pendiente`
          +`&select=id&order=ts.asc&limit=200`, claveDe(codigo)) || [];
      }catch(e){ return; }
      const firma = pend2.map(i=>i.id).join(',');
      if(ultimaCola === null){ ultimaCola = firma; return; }
      if(firma === ultimaCola) return;
      ultimaCola = firma;
      const globo = app.querySelector('#globoPend');
      const enModerar = (app.querySelector('[data-sol="pModerar"]')||{}).getAttribute
        && app.querySelector('[data-sol="pModerar"]').getAttribute('aria-selected')==='true';
      if(enModerar) return redibujar(codigo);
      if(globo) globo.textContent = pend2.length;
      else if(pend2.length) redibujar(codigo);   // no había globo: hay que dibujarlo
      if(pend2.length) recado(pend2.length===1?'Llegó algo nuevo para aprobar'
                                              :`Llegaron ${pend2.length} para aprobar`);
    }, 8000);
  }
  /* con el muro cerrado no hay QR que dibujar: esta solapa es el cierre */
  const cajaQR=app.querySelector('#qr');
  if(cajaQR) pintarQR(cajaQR,enlaceDe(codigo),106);

  const porta=app.querySelector('#porta');
  const hayTapa=!!urlSegura(m.portada);
  porta.innerHTML=`${hayTapa?imgMini(m.portada,'class="mini" alt="Portada"'):`<span class="mini vacia">${ESTRELLA}</span>`}
    <span style="flex:1;font-size:13.5px;color:#B5AC9E;line-height:1.6">${hayTapa?'Se usa en la tapa del álbum.':'Sin elegir: usamos la primera foto que llegue.'}</span>
    <label class="hilo-btn" style="width:auto;margin:0;padding:11px 18px;cursor:pointer">Elegir<input id="fporta" type="file" accept="image/*" hidden></label>`;
  porta.querySelector('#fporta').onchange=async e=>{
    const a=e.target.files[0]; if(!a) return;
    if(!/^image\//.test(a.type)) return recado('Eso no es una imagen');
    recado('Preparando portada…');
    try{
      m.portadaBlob=await comprimirBlob(a,1200,.72);
      await guardarMeta(m);
      delete m.portadaBlob;
      recado('Portada actualizada');
      redibujar(codigo);
    }catch(err){
      delete m.portadaBlob;
      recado('No pude guardar la portada: '+motivo(err));
    }
  };
  const bCopiaAlb=app.querySelector('#copiarAlbum');
  if(bCopiaAlb) bCopiaAlb.onclick=()=>copiarTexto(enlaceAlbumDe(codigo),'Enlace del álbum copiado');
  const bReabrir=app.querySelector('#reabrir');
  if(bReabrir) bReabrir.onclick=async e=>{
    const b=e.currentTarget;
    if(b.dataset.ocupado) return;
    b.dataset.ocupado='1'; b.disabled=true; b.textContent='Reabriendo…';
    m.cerrado=false;
    try{
      await guardarMeta(m);
      recado('Muro abierto de nuevo');
      redibujar(codigo);
    }catch(err){
      m.cerrado=true;
      delete b.dataset.ocupado; b.disabled=false; b.textContent='Reabrir el muro';
    }
  };

  /* Antes, un nombre mal escrito al crear el evento quedaba para siempre. */
  let tonoEd=m.tono||TONOS[0].c;
  app.querySelectorAll('#pAjustes .tono').forEach(b=>b.onclick=()=>{
    app.querySelectorAll('#pAjustes .tono').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); tonoEd=b.dataset.c; tono(tonoEd);
  });
  const bDatos=app.querySelector('#guardarDatos');
  if(bDatos) bDatos.onclick=async e=>{
    const b=e.currentTarget;
    if(b.dataset.ocupado) return;
    const nombre=app.querySelector('#edNombre').value.trim();
    if(!nombre) return recado('El nombre no puede quedar vacío');
    const fecha=app.querySelector('#edFecha').value||m.fecha;
    const antes={nombre:m.nombre,fecha:m.fecha,tono:m.tono,vence:m.vence};
    m.nombre=nombre; m.tono=tonoEd;
    if(fecha!==m.fecha){
      m.fecha=fecha;
      /* el álbum vive 90 días desde la fiesta: si se corrige la fecha, se corre */
      m.vence=venceDe(fecha)||m.vence;
    }
    b.dataset.ocupado='1'; b.disabled=true; b.textContent='Guardando…';
    try{
      await guardarMeta(m);
      recado('Datos guardados');
      redibujar(codigo);
    }catch(err){
      Object.assign(m,antes); tono(m.tono); tonoEd=m.tono;
      delete b.dataset.ocupado; b.disabled=false; b.textContent='Guardar los datos';
    }
  };
  const bTag=app.querySelector('#guardarTag');
  if(bTag) bTag.onclick=async e=>{
    const b=e.currentTarget;
    if(b.dataset.ocupado) return;
    let tag=app.querySelector('#edTag').value.trim().replace(/\s+/g,'');
    if(tag && tag[0]!=='#') tag='#'+tag;
    const lugar=app.querySelector('#edLugar').value.trim();
    const antes={hashtag:m.hashtag,lugar:m.lugar};
    m.hashtag=tag||null; m.lugar=lugar||null;
    b.dataset.ocupado='1'; b.disabled=true; b.textContent='Guardando…';
    try{
      await guardarMeta(m);
      /* si la base todavía no tiene las columnas, no mentimos */
      const faltan=['hashtag','lugar'].filter(sinColumna);
      if(faltan.length){
        Object.assign(m,antes);
        delete b.dataset.ocupado; b.disabled=false; b.textContent='Guardar';
        return recado(`La base todavía no guarda esto: falta la columna "${faltan[0]}".`);
      }
      recado('Guardado');
      redibujar(codigo);
    }catch(err){
      Object.assign(m,antes);
      delete b.dataset.ocupado; b.disabled=false; b.textContent='Guardar';
    }
  };
  const guardarLanza=async(valor,aviso)=>{
    const antes=m.lanza;
    m.lanza=valor||null;
    try{
      await guardarMeta(m);
      if(sinColumna('lanza') && valor){
        /* se guardó todo lo demás, pero el horario no entró: no mentir */
        m.lanza=antes;
        return recado('La base todavía no guarda horarios: falta agregar la columna "lanza".');
      }
      recado(aviso);
      redibujar(codigo);
    }catch(err){ m.lanza=antes; }
  };
  const bL=app.querySelector('#guardarL');
  if(bL) bL.onclick=()=>{
    const v=app.querySelector('#lanza').value;
    if(!v) return recado('Elegí día y hora, o usá "Abrir ahora"');
    guardarLanza(v,'Listo · el muro se abre el '+horaLinda(new Date(v)));
  };
  const bQ=app.querySelector('#borrarL');
  if(bQ) bQ.onclick=()=>guardarLanza('','Muro abierto desde ahora');

  const bCopiaC=app.querySelector('#copiarClaveEv');
  if(bCopiaC) bCopiaC.onclick=()=>copiarTexto(clavesGuardadas()[codigo],'Clave copiada');
  const bCambiaC=app.querySelector('#cambiarClaveEv');
  if(bCambiaC) bCambiaC.onclick=()=>{
    const zona=app.querySelector('#zonaClave');
    const sugerida=nuevaClave();
    zona.innerHTML=`
      <div class="campo" style="margin:18px 0 12px">
        <label for="claveNva">Clave nueva</label>
        <input id="claveNva" type="text" autocapitalize="characters" value="${esc(sugerida)}"
          style="font-size:20px;letter-spacing:.24em"></div>
      <p class="pie-nota" style="text-align:left;margin:0 0 14px">La anterior deja de servir al instante.</p>
      <button class="oro-btn" id="confirmarClave">Guardar la clave nueva</button>`;
    zona.querySelector('#confirmarClave').onclick=async e=>{
      const nva=zona.querySelector('#claveNva').value.trim().toUpperCase();
      if(nva.length<4) return recado('Muy corta: mínimo 4');
      const b=e.currentTarget; b.disabled=true; b.textContent='Guardando…';
      try{
        await SB.cambiarClave(codigo,claveDe(codigo),nva);
        guardarClaveDe(codigo,nva);
        recado('Clave cambiada · '+nva);
        redibujar(codigo);
      }catch(err){
        b.disabled=false; b.textContent='Guardar la clave nueva';
        recado('No se pudo cambiar: '+motivo(err));
      }
    };
  };

  /* Borrar es para siempre: en vez de un aviso que se toca sin querer,
     hay que escribir el código del evento. */
  const pedir=app.querySelector('#pedirBorrar');
  if(pedir) pedir.onclick=()=>{
    const zona=app.querySelector('#zonaBorrar');
    zona.innerHTML=`
      <div class="campo" style="margin-bottom:14px">
        <label for="confirmaCod">Escribí <b style="color:#E08A82">${esc(m.codigo)}</b> para confirmar</label>
        <input id="confirmaCod" type="text" autocomplete="off" autocapitalize="characters"
          placeholder="${esc(m.codigo)}"></div>
      <button class="btn-peligro firme" id="borrarYa" disabled>Eliminar definitivamente</button>
      <button class="hilo-btn" id="dejarlo">Mejor no</button>`;
    const campo=zona.querySelector('#confirmaCod');
    const ok=zona.querySelector('#borrarYa');
    campo.focus();
    campo.oninput=()=>{ ok.disabled = campo.value.trim().toUpperCase()!==m.codigo.toUpperCase(); };
    zona.querySelector('#dejarlo').onclick=()=>redibujar(codigo);
    ok.onclick=async()=>{
      if(ok.disabled) return;
      ok.disabled=true;
      campo.disabled=true;
      try{
        const r=await borrarEvento(codigo,t=>{ ok.textContent=t; });
        recado(`Evento eliminado${r&&r.archivos?` · ${r.archivos} archivos borrados`:''}`);
        ir('panel');
      }catch(err){
        console.error('borrar evento',err);
        ok.disabled=false; campo.disabled=false;
        ok.textContent='Eliminar definitivamente';
        recado('No se pudo eliminar: '+motivo(err));
      }
    };
  };

  app.querySelector('#guardarC').onclick=async e=>{
    const b=e.currentTarget, antes=m.consignas;
    b.disabled=true;
    m.consignas=app.querySelector('#consignas').value.split('\n').map(t=>t.trim()).filter(Boolean);
    try{
      await guardarMeta(m);
      recado(m.consignas.length?m.consignas.length+' consignas guardadas':'Volvemos a las consignas nuestras');
    }catch(err){ m.consignas=antes; }
    b.disabled=false;
  };
  const bCopiar=app.querySelector('#copiar');
  if(bCopiar) bCopiar.onclick=async()=>{
    const enlace=enlaceDe(codigo);
    try{
      if(!navigator.clipboard) throw new Error('sin portapapeles');
      await navigator.clipboard.writeText(enlace);
      return recado('Enlace copiado');
    }catch(e){
      const t=document.createElement('textarea');
      t.value=enlace; t.setAttribute('readonly','');
      t.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0,99999);
      let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
      t.remove();
      recado(ok?'Enlace copiado':'Copialo a mano: '+enlace);
    }
  };
  /* Después de un await, e.currentTarget ya es null: tocar un switch tiraba
     la app entera. Ahora movemos el switch al toque y volvemos atrás si falla. */
  const switche=(sel,campo,siOn,siOff)=>{
    const b=app.querySelector(sel); if(!b) return;
    b.onclick=async()=>{
      if(b.dataset.ocupado) return;           // doble toque
      b.dataset.ocupado='1';
      const antes=!!m[campo];
      m[campo]=!antes;
      b.setAttribute('aria-pressed',String(m[campo]));
      try{
        await guardarMeta(m);
        recado(m[campo]?siOn:siOff);
      }catch(err){
        m[campo]=antes;                       // no quedó guardado: deshacer
        b.setAttribute('aria-pressed',String(antes));
      }
      delete b.dataset.ocupado;
    };
  };
  switche('#mod','moderar','Ahora aprobás vos cada foto','Las fotos van directo a la pantalla');
  switche('#cerr','cerrado','Muro cerrado · álbum publicado','Muro abierto de nuevo');

  const cola=app.querySelector('#cola');
  if(cola) for(const p of pend){
    const it=await item(codigo,p.id); if(!it) continue;
    const d=document.createElement('div'); d.className='espera';
    d.innerHTML=`${it.kind==='foto'?imgMini(it.data,'alt=""'):it.kind==='video'?`<video src="${src(it.data)}" muted></video>`
      :`<div class="tx">${esc(it.texto||'Saludo de voz')}</div>`}
      <div class="par"><button class="si">Aprobar</button><button class="no">Descartar</button></div>`;
    const mover=async(estado,aviso,accion)=>{
      try{
        await cambiarEstado(codigo,p.id,estado);
        recado(aviso,accion);
        if(estado==='pendiente') return redibujar(codigo);   // al recuperar, redibujamos
        /* La ficha se va sola: redibujar todo hacía saltar la pantalla
           justo cuando estás aprobando una atrás de otra. */
        d.classList.add(estado==='aprobado'?'vuela':'se-va');
        d.addEventListener('animationend',()=>{
          d.remove();
          if(estado==='aprobado'){
            const cif=app.querySelector(`[data-kind="${p.kind}"]`);
            if(cif) contarHasta(cif,(Number(cif.dataset.cifra)||0)+1,420),
                    cif.dataset.cifra=(Number(cif.dataset.cifra)||0)+1;
          }
          const quedan=cola.querySelectorAll('.espera').length;
          const globo=app.querySelector('#globoPend');
          if(globo){ if(quedan) globo.textContent=quedan; else globo.remove(); }
          if(!quedan){
            const titulo=app.querySelector('#pModerar .titu-s');
            if(titulo) titulo.remove();
            cola.outerHTML=`<div class="vacio-mod">${ESTRELLA}<br>Listo, no queda nada esperando.</div>`;
          }
        },{once:true});
      }catch(err){ recado('No se pudo: '+motivo(err)); }
    };
    d.querySelector('.si').onclick=()=>mover('aprobado','Ya está en la pantalla');
    /* descartar era irreversible y de un toque: ahora se puede volver atrás */
    d.querySelector('.no').onclick=()=>mover('rechazado','Descartado',{
      texto:'Deshacer',
      hacer:()=>mover('pendiente','Recuperado')
    });
    cola.appendChild(d);
  }

  /* Lo que ya está proyectándose. Hasta ahora, una vez aprobado (o con la
     moderación apagada, que es lo normal) no había forma de bajar nada:
     si alguien subía cualquier cosa, quedaba en la pantalla toda la noche. */
  const publi=app.querySelector('#publi');
  if(publi){
    const nuevos=apro.slice().reverse();          // lo último arriba
    let mostrados=0;
    const dibujar=async cuantos=>{
      const tanda=nuevos.slice(mostrados,mostrados+cuantos);
      mostrados+=tanda.length;
      for(const p of tanda){
        const it=await item(codigo,p.id); if(!it) continue;
        const d=document.createElement('div'); d.className='publi';
        const cara=it.kind==='foto'&&urlSegura(it.data)?imgMini(it.data,'alt="" loading="lazy"')
          :it.kind==='video'&&urlSegura(it.data)?`<video src="${src(it.data)}" muted playsinline></video>`
          :`<div class="tx">${esc(it.texto||(it.kind==='audio'?'Saludo de voz':'Sin texto'))}</div>`;
        d.innerHTML=`${cara}<span class="quien">${esc(it.autor||'Alguien')}</span>`;
        d.onclick=()=>{
          if(d.querySelector('.velo')) return;
          const velo=document.createElement('div'); velo.className='velo';
          velo.innerHTML=`<button class="sacar">Bajar</button><button class="dejar-ahi">Dejarlo</button>`;
          velo.querySelector('.dejar-ahi').onclick=e=>{ e.stopPropagation(); velo.remove(); };
          velo.querySelector('.sacar').onclick=async e=>{
            e.stopPropagation();
            const b=e.currentTarget; b.disabled=true; b.textContent='…';
            try{
              await cambiarEstado(codigo,p.id,'rechazado');
            }catch(err){
              b.disabled=false; b.textContent='Bajar';
              return recado('No se pudo bajar: '+motivo(err));
            }
            recado('Bajado de la pantalla',{
              texto:'Deshacer',
              hacer:async()=>{
                try{ await cambiarEstado(codigo,p.id,'aprobado'); recado('Vuelve a la pantalla'); redibujar(codigo); }
                catch(err){ recado('No se pudo recuperar: '+motivo(err)); }
              }
            });
            d.classList.add('se-va');
            d.addEventListener('animationend',()=>{
              d.remove();
              const cif=app.querySelector(`[data-kind="${p.kind}"]`);
              if(cif){
                const n=Math.max(0,(Number(cif.dataset.cifra)||0)-1);
                contarHasta(cif,n,320); cif.dataset.cifra=n;
              }
            },{once:true});
          };
          d.appendChild(velo);
        };
        publi.appendChild(d);
      }
    };
    await dibujar(TOPE_PUBLI);
    const verTodos=app.querySelector('#verTodosPubli');
    if(verTodos) verTodos.onclick=async()=>{
      verTodos.disabled=true; verTodos.textContent='Cargando…';
      await dibujar(nuevos.length);
      verTodos.remove();
    };
  }
}

async function vSubir(codigo){
  parar();
  const m=await meta(codigo); if(!m) return ir('invitado');
  tono(m.tono);
  if(m.cerrado) return vFinal(m);
  if(estaPorAbrir(m)) return vTodavia(m);
  const lista=(m.consignas&&m.consignas.length)?m.consignas:CONSIGNAS;
  const consigna=lista[Math.floor(Date.now()/60000)%lista.length];
  let modo='captura', medio=null;

  app.innerHTML=`
  <header class="cab-inv">
    <p class="arriba">Subí al muro</p>
    <h1>${esc(m.nombre)}</h1>
    <button class="volver">Salir</button>
  </header>
  <div class="wrap-inv">
    <div class="consigna"><div class="et">${ESTRELLA} Consigna de la noche ${ESTRELLA}</div><p>${esc(consigna)}</p></div>
    <div class="chips" role="group" aria-label="Qué querés mandar">
      <button data-m="captura" aria-pressed="true">${IC.foto}Foto o video</button>
      <button data-m="texto" aria-pressed="false">${IC.texto}Dedicatoria</button>
      <button data-m="voz" aria-pressed="false">${IC.voz}Voz</button>
    </div>
    <div id="zona"></div>
    <div class="campo"><label for="autor">Tu nombre</label>
      <input id="autor" type="text" placeholder="Como querés que salga en la pantalla" maxlength="26"></div>
  <!-- ── el aviso del artículo 6 de la Ley 25.326 ──
       Antes de recolectar un dato personal hay que decir, en forma clara y
       expresa, para qué es, quién lo trata, si darlo es voluntario y cómo
       se pide que lo borren. Hasta acá el invitado mandaba su nombre y su
       foto sin que nadie le dijera una palabra. Va ARRIBA del botón de
       enviar, no en un enlace al pie: el consentimiento se presta sabiendo,
       y "informar" no es "tenerlo escrito en otra página".
       Y va ADENTRO del contenido que scrollea, no entre el contenido y la
       barra de abajo: la barra es position:fixed y le tapaba el aviso
       entero, que quedaba imposible de abrir. -->
  <details class="aviso-datos" id="avisoDatos">
    <summary>Qué pasa con tu foto y tu nombre</summary>
    <div class="cuerpo">
      <p>Lo que mandes se proyecta en la pantalla de <b>esta</b> fiesta y queda en el
      álbum del evento, que se descarga el organizador. No lo usamos para nada más:
      no lo publicamos, no lo vendemos y no hay publicidad.</p>
      <p>Se borra solo a los <b>90 días</b> de la fecha de la fiesta. Mandar algo es
      <b>voluntario</b>: si no mandás nada, no pasa nada.</p>
      <p>Al mandar una foto o un video confirmás que las personas que aparecen están de
      acuerdo con que se proyecte. Si hay menores, el consentimiento lo dan sus padres
      o tutores.</p>
      <p>Podés pedir que lo borremos antes, sin dar explicaciones, escribiendo a
      <a href="mailto:clicketernoeventos@gmail.com">clicketernoeventos@gmail.com</a>.
      Responsable: Click Eterno, Rosario, Santa Fe.
      <a href="/privacidad" target="_blank" rel="noopener">Política de Privacidad</a>.</p>
    </div>
  </details>
  </div>
  <div class="accion-abajo"><div class="dentro">
    <button class="oro-btn" id="enviar">Enviar a la pantalla</button>
    <p class="pie-nota">${m.moderar?'Lo revisa el organizador antes de proyectarlo.':'Aparece en la pantalla del salón en segundos.'}</p>
  </div></div>`;
  app.querySelector('.cab-inv .volver').onclick=()=>ir('invitado');
  const zona=app.querySelector('#zona');

  function pintarZona(){
    if(modo==='captura'){
      zona.innerHTML = medio?`
        <div class="previa">${medio.kind==='video'?`<video src="${medio.previa}" controls playsinline></video>`:`<img src="${medio.previa}" alt="">`}
          <button class="x" aria-label="Quitar">✕</button></div>
        ${medio.pesado?`<p class="aviso-peso">Pesa ${Math.round(medio.blob.size/1048576)} MB. Con poca señal puede tardar un rato: no cierres la pantalla.</p>`:''}
        <div class="campo"><label for="pie">Epígrafe</label><input id="pie" type="text" placeholder="Opcional" maxlength="90"></div>`
      :`<label class="lente" for="file"><span class="aro">${ESTRELLA}</span>
          <b>Elegí una foto o un video</b><span>Se proyecta apenas la mandes</span>
          <input id="file" type="file" accept="image/*,video/*" hidden></label>`;
      const f=zona.querySelector('#file');
      if(f) f.onchange=async e=>{
        const a=e.target.files[0]; if(!a) return;
        recado('Preparando…');
        const esVideo=a.type.startsWith('video');
        const blob=esVideo? a : await comprimirBlob(a);
        if(blob.size>MAX_MB*1024*1024){
          e.target.value='';
          return recado(`Pesa ${Math.round(blob.size/1048576)} MB y el límite es ${MAX_MB}. Probá con algo más corto.`);
        }
        if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
        medio={kind:esVideo?'video':'foto', blob, previa:URL.createObjectURL(blob), pesado:blob.size>8*1024*1024};
        pintarZona();
      };
      const x=zona.querySelector('.x'); if(x) x.onclick=()=>{
        if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
        medio=null;pintarZona();
      };
      contador('#pie');
    }
    if(modo==='texto'){
      medio=null;
      zona.innerHTML=`<div class="campo"><label for="msg">Tu dedicatoria</label>
        <textarea id="msg" placeholder="Se proyecta en grande, así que decí algo lindo." maxlength="180"></textarea></div>`;
      contador('#msg');
    }
    if(modo==='voz'){
      zona.innerHTML=`<div class="lente" style="padding:38px 22px">
        <span class="aro">${ESTRELLA}</span><b>Saludo de voz</b><span>Hasta 15 segundos</span>
        <button class="hilo-btn" id="rec" style="max-width:280px;margin:22px auto 0">Empezar a grabar</button>
        <div id="repro" style="margin-top:16px"></div></div>`;
      zona.querySelector('#rec').onclick=grabar;
    }
  }
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    if(modo===b.dataset.m) return;
    if(mr&&mr.state==='recording'){ try{ mr.stop(); }catch(_){} }
    modo=b.dataset.m;
    /* soltar la foto sin liberar su memoria dejaba el video entero colgado
       del navegador: en un celular, probando de a una, se nota */
    if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
    medio=null;            // lo elegido en la otra solapa no se manda por error
    app.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    pintarZona();
  });
  pintarZona();
  contador('#autor');

  let mr=null,trozos=[],tt=null;
  async function grabar(){
    const btn=this;
    if(mr&&mr.state==='recording'){mr.stop();return;}
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      /* si el invitado se va de la pantalla mientras graba, el micrófono
         quedaba abierto (con el punto rojo del teléfono prendido) hasta
         que saltaba el corte de los 15 segundos */
      window._soltarMicro=()=>{
        try{ if(mr&&mr.state==='recording') mr.stop(); }catch(_){}
        s.getTracks().forEach(t=>t.stop());
        clearTimeout(tt);
      };
      /* el formato lo elige el navegador: en iPhone no es webm, y guardarlo
         con esa etiqueta dejaba el saludo con la extensión equivocada */
      mr=new MediaRecorder(s); trozos=[];
      mr.ondataavailable=e=>trozos.push(e.data);
      mr.onstop=async()=>{
        clearTimeout(tt); s.getTracks().forEach(t=>t.stop());
        window._soltarMicro=null;
        const tipo=(mr&&mr.mimeType)||(trozos[0]&&trozos[0].type)||'audio/webm';
        const blob=new Blob(trozos,{type:tipo.split(';')[0]});
        medio={kind:'audio', blob, previa:URL.createObjectURL(blob)};
        btn.textContent='Grabar de nuevo';
        zona.querySelector('#repro').innerHTML=`<audio src="${medio.previa}" controls style="width:100%"></audio>`;
      };
      mr.start();
      btn.innerHTML=`<span class="onda"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i></span>Grabando · tocá para parar`;
      tt=setTimeout(()=>mr.state==='recording'&&mr.stop(),15000);
    }catch(e){recado('No pude usar el micrófono');}
  }

  app.querySelector('#enviar').onclick=async()=>{
    const autor=app.querySelector('#autor').value.trim()||'Invitado';
    const pie=zona.querySelector('#pie'), msg=zona.querySelector('#msg');
    const texto=(msg?msg.value:pie?pie.value:'').trim();
    if(!medio&&!texto) return recado('Subí algo o escribí una dedicatoria');
    if(medio && !medio.blob) return recado('La foto no quedó lista, elegila de nuevo');
    const btn=app.querySelector('#enviar');
    btn.disabled=true; btn.textContent=medio?'Subiendo…':'Revelando…';
    if(medio) btn.classList.add('subiendo');
    const avance=f=>{
      btn.style.setProperty('--avance',Math.round(f*100)+'%');
      btn.textContent=f>=1?'Revelando…':`Subiendo ${Math.round(f*100)}%`;
    };
    try{
      const idNuevoItem=idNuevo();
      await sumar(codigo,{id:idNuevoItem,
        kind:medio?medio.kind:'mensaje', blob:medio?medio.blob:null, data:'', autor, texto, ts:Date.now(),
        estado:m.moderar?'pendiente':'aprobado'},
        avance);
      borrarseSolo(codigo, idNuevoItem);
      if(medio&&medio.previa) URL.revokeObjectURL(medio.previa);
      vMomento(m,autor);
    }catch(e){
      console.error('subir',e);
      btn.disabled=false; btn.classList.remove('subiendo');
      btn.style.removeProperty('--avance');
      btn.textContent='Enviar a la pantalla';
      recado('Falló al '+(e.paso||'preparar')+' · '+(e.name||'')+' · '+motivo(e));
    }
  };
}

      <span class="cuenta" id="cuenta">0<small>En el muro</small></span>

    </div>
  </div>`;
  const bSalir=app.querySelector('.botones-sala .dejar:last-child');
  if(bSalir) bSalir.onclick=()=>ir(HAY_DEMO?'subir/'+codigo:'evento/'+codigo);
  /* Cuánto mide la fila de modos, de verdad. En un teléfono los botones
     de abajo se apoyan en ella, y si la damos por supuesta —o si cambia
     de alto al envolver— se le montan encima, que es justo lo que hacía
     que desde el celular no se pudiera cambiar de modo. */
  (function medirModos(){
    const fila=app.querySelector('.modos-sala');
    const bots=app.querySelector('.botones-sala');
    const poner=()=>{
      if(fila) document.body.style.setProperty('--modos', (fila.offsetHeight||38)+'px');
      /* y el alto de los botones, que en el teléfono van DEBAJO de la fila
         de modos: sin esto el cartel no sabe cuánto reservar arriba y el
         logo y el nombre de la fiesta quedan tapados. */
      document.body.style.setProperty('--botsala',
        ((bots && !bots.hidden && bots.offsetHeight) || 0)+'px');
    };
    requestAnimationFrame(poner);
    addEventListener('resize',poner);
    addEventListener('orientationchange',poner);
  })();

  /* Reconocer dónde se abre. En el iPhone no existe la pantalla completa
     —Safari no la da para un elemento cualquiera—, así que el botón no
     podía funcionar nunca y el mensaje de respaldo decía "Tocá F11", una
     tecla que ese aparato no tiene. Un botón que no puede hacer su trabajo
     molesta más que no estar: si el navegador no la ofrece, no se dibuja. */
  const hayCompleta = !!(document.documentElement.requestFullscreen
                      || document.documentElement.webkitRequestFullscreen);
  if(!hayCompleta) app.querySelector('#completa').remove();
  else app.querySelector('#completa').onclick=()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen
        ? document.documentElement.requestFullscreen()
        : Promise.resolve(document.documentElement.webkitRequestFullscreen())
      ).catch(()=>recado(matchMedia('(pointer:coarse)').matches
        ? 'Tu navegador no deja poner pantalla completa'
        : 'Tocá F11 para pantalla completa'));
  };

  const cartel=app.querySelector('#salaCartel');
  const tablero=app.querySelector('#salaTablero');
  const MODOS=['cartel','tablero','muro'];
  let modo='cartel';
  const verModo=cual=>{
    modo=MODOS.includes(cual)?cual:'cartel';
    cartel.hidden=modo!=='cartel';
    tablero.hidden=modo!=='tablero';
    app.querySelector('#tela').hidden=modo!=='muro';
    app.querySelector('.sala').classList.toggle('en-cartel',modo!=='muro');
    app.querySelectorAll('[data-modo]').forEach(b=>
      b.setAttribute('aria-pressed',String(b.dataset.modo===modo)));
    if(modo!=='cartel'){
      arrancado=false;              // que vuelva a dibujar en el recuadro nuevo
      revisar().catch(e=>console.error('sala',e));
    }
  };
  app.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>verModo(b.dataset.modo));

  const teclas=e=>{
    if(e.key==='f'||e.key==='F') app.querySelector('#completa')?.click();
    if(e.key===' '){ e.preventDefault(); verModo(MODOS[(MODOS.indexOf(modo)+1)%MODOS.length]); }
    if(e.key==='ArrowRight'&&modo!=='cartel') pasar();
    if(e.key==='Escape'&&!document.fullscreenElement) ir('evento/'+codigo);
  };
  addEventListener('keydown',teclas);
  const limpiar=()=>removeEventListener('keydown',teclas);
  window._limpiarSala=limpiar;
  pintarQR(app.querySelector('#qrs'),enlaceDe(codigo),56);
  pintarQR(app.querySelector('#qrGrande'),enlaceDe(codigo),290);
  pintarQR(app.querySelector('#qrTab'),enlaceDe(codigo),92);
  if(abre&&estaPorAbrir(m))
    contarHacia(app.querySelector('#cuentaCartel'),m,()=>vPantalla(codigo));

  const tela=app.querySelector('#tela'), destello=app.querySelector('#destello');
  let ids=[], cursor=-1, vueltas=0, arrancado=false;
  /* Cada cuántas vueltas del reloj se vuelve a leer TODO. Ver la nota de
     colaNueva(): 30 vueltas de 7 s son tres minutos y medio. */
  const RESINCRO=30;
  let vueltasSondeo=0;

  const telaT=app.querySelector('#telaT');
  /* el tablero y el muro comparten el mismo mecanismo; cambia el recuadro */
  const lienzo=()=> modo==='tablero' ? telaT : tela;
  function marco(html,clases){
    const cont=lienzo();
    const d=document.createElement('div');
    d.className='toma '+(clases||'');
    d.innerHTML=html;
    cont.querySelectorAll('.toma').forEach(v=>{v.classList.remove('on');setTimeout(()=>v.remove(),1500);});
    cont.insertBefore(d,cont.firstChild);
    requestAnimationFrame(()=>d.classList.add('on'));
    return d;
  }
  const inicial=t=>esc(String(t||'?').trim().charAt(0).toUpperCase()||'?');
  const epigrafe=(it,nuevo)=>{
    if(modo==='tablero') return `<div class="epigrafe">
      ${nuevo?`<div class="recien">${ESTRELLA} Recién llegada</div>`:''}
      ${it.texto?`<div class="dice" style="margin:0 0 4px">“${esc(it.texto)}”</div>`:''}
      <div class="autoria"><span class="avatar">${inicial(it.autor)}</span>
        <span class="quien" style="font-size:inherit">${esc(it.autor)}</span>
        <span class="cuando-f">${esc(haceCuanto(it.ts))}</span></div></div>`;
    return `<div class="epigrafe">
      ${nuevo?`<div class="recien">${ESTRELLA} Recién llegada</div>`:''}
      <div class="quien">${esc(it.autor)}</div>
      ${it.texto?`<div class="dice">${esc(it.texto)}</div>`:''}</div>`;
  };

  async function mostrar(id,nuevo){
    const it=await item(codigo,id);
    if(!it||!tela.isConnected) return;        // salimos de la sala mientras cargaba
    const a=tela.querySelector('.aguarda'); if(a) a.remove();
    if(nuevo){destello.classList.remove('va');void destello.offsetWidth;destello.classList.add('va');}
    if((it.kind==='foto'||it.kind==='video')&&!urlSegura(it.data)) return;  // sin archivo
    if(it.kind==='foto') marco(`<img src="${src(it.data)}" alt="">${epigrafe(it,nuevo)}`, nuevo?'revelar':'kb');
    else if(it.kind==='video') marco(`<video src="${src(it.data)}" autoplay muted loop playsinline></video>${epigrafe(it,nuevo)}`, nuevo?'revelar':'');
    else if(it.kind==='audio') marco(`<div class="placa"><div class="cita">Un saludo de voz</div>
      <div class="quien">${esc(it.autor)}</div><audio src="${src(it.data)}" autoplay controls style="margin-top:30px"></audio></div>`,'encaja');
    else marco(`<div class="placa"><div class="cita">“${esc(it.texto)}”</div>
      <div class="quien">${esc(it.autor)}</div></div>`,'encaja');
  }
  /* costado con lo que viene entrando y tira con las dedicatorias */
  async function pintarTablero(){
    const total=app.querySelector('#totalTab');
    if(total&&total.dataset.n!==String(ids.length)){
      total.innerHTML='<b style="font:inherit">0</b><small>recuerdos</small>';
      contarHasta(total.querySelector('b'),ids.length,700);
      total.dataset.n=String(ids.length);
    }
    const cola=app.querySelector('#colaTab');
    if(cola){
      const enPantalla=ids[cursor];
      const proximos=[];
      for(const id of [...ids].reverse()){
        if(id===enPantalla) continue;
        const it=await item(codigo,id);
        if(it) proximos.push(it);
        if(proximos.length>=3) break;
      }
      const marca=proximos.map(i=>i.id).join('|');
      if(cola.dataset.marca!==marca){
        cola.dataset.marca=marca;
        cola.innerHTML=proximos.length?proximos.map(i=>{
          const u=urlSegura(i.data);
          if(i.kind==='foto'&&u) return `<div class="prox">${imgMini(i.data,'alt=""')}
            <span class="nom-p">${esc(i.autor)}</span></div>`;
          if(i.kind==='video'&&u) return `<div class="prox"><video src="${src(i.data)}" muted preload="metadata"></video>
            <span class="nom-p">${esc(i.autor)}</span></div>`;
          return `<div class="prox solo-texto"><span>${esc(i.texto||'Saludo de voz')}</span>
            <span class="nom-p">${esc(i.autor)}</span></div>`;
        }).join(''):`<div class="prox solo-texto"><span>Todavía no llegó nada</span></div>`;
      }
    }
    const tira=app.querySelector('#tiraTab');
    if(tira){
      const dichos=[];
      for(const id of [...ids].reverse()){
        const it=await item(codigo,id);
        if(it&&it.texto&&String(it.texto).trim()) dichos.push(it);
        if(dichos.length>=10) break;
      }
      const marca=dichos.map(i=>i.id).join('|');
      if(tira.dataset.marca!==marca){
        tira.dataset.marca=marca;
        const uno=dichos.length
          ? dichos.map(i=>`<span class="dicho">“${esc(i.texto)}”<b>${esc(i.autor)}</b></span>`).join('')
          : `<span class="vacia">Las dedicatorias van a aparecer acá</span>`;
        acomodarTira(tira, uno);
      }
    }
  }

  /* ── acomodar la cinta de dedicatorias ──
     Tres cosas que no se pueden dejar al CSS solo:
       1. La VELOCIDAD. La duración se calcula del ancho para que sea
          siempre la misma, venga una dedicatoria o vengan diez.
       2. El BUCLE. Se dibuja el contenido DOS veces y se corre media
          tira: así la segunda copia cae donde estaba la primera y no hay
          salto. Con una sola copia la tira volvía de golpe al principio.
       3. NO VOLVER AL PRINCIPIO cuando llega una dedicatoria nueva.
          Reemplazar el HTML reinicia la animación, y en una fiesta llegan
          seguido: la cinta pegaba un tirón cada pocos segundos, que es lo
          que se veía como "se vuelve loca". Se guarda en qué parte del
          giro venía y se la deja ahí. */
  const TIRA_VEL=70;            // píxeles por segundo, siempre
  function acomodarTira(tira, uno){
    /* dónde venía, como fracción del giro, ANTES de tocar nada */
    let donde=0;
    try{
      const a=tira.getAnimations()[0];
      if(a && a.effect){
        const d=a.effect.getTiming().duration;
        if(d) donde=((Number(a.currentTime)||0)/d)%1;
      }
    }catch(e){}

    /* el ancho real de UNA copia: con min-width:100% puesto, scrollWidth
       nunca baja del ancho de la pantalla y no se puede saber si el
       contenido llena o no */
    tira.innerHTML=uno;
    tira.style.minWidth='0';
    const anchoUno=tira.scrollWidth;
    tira.style.minWidth='';
    const cabe=anchoUno <= tira.parentElement.clientWidth;

    if(cabe){                    // no desfila: se queda quieta y centrada
      tira.classList.add('quieta');
      tira.style.removeProperty('--giro');
      return;
    }
    tira.classList.remove('quieta');
    tira.innerHTML=uno+uno;      // la segunda copia es la que tapa el salto
    tira.style.setProperty('--giro', (anchoUno/TIRA_VEL).toFixed(2)+'s');
    /* y la dejamos donde venía, no en cero */
    try{
      const a=tira.getAnimations()[0];
      if(a && a.effect){
        const d=a.effect.getTiming().duration;
        if(d) a.currentTime=donde*d;
      }
    }catch(e){}
  }

  async function mosaico(){
    const fotos=[];
    for(const id of ids.slice(-9)){const it=await item(codigo,id); if(it&&it.kind==='foto'&&urlSegura(it.data)) fotos.push(it);}
    if(fotos.length<4) return false;
    marco(`<div class="mosaico">${fotos.map((f,i)=>`<img src="${src(f.data)}" style="animation-delay:${i*.1}s">`).join('')}</div>`,'encaja');
    return true;
  }
  /* Solo la PUNTA: los aprobados que vienen después de los que ya tenemos.
     Devuelve null si no se pudo pedir así, y entonces el que llama lee todo.

     El sondeo de la pantalla del salón se bajaba el índice ENTERO cada
     siete segundos: medido, 1131 pedidos y 132 MB por hora con 1500
     recuerdos, en el teléfono del organizador y con el wifi del salón. Y
     durante la fiesta las fotos entran de a una, así que casi todo eso era
     volver a bajar lo que ya estaba.

     Como los dos caminos devuelven SOLO lo aprobado y en el mismo orden
     (ts, id), "cuántos llevamos" es un offset exacto. Una foto nueva y una
     que el organizador acaba de aprobar caen las dos acá: las dos suben el
     total de aprobados.

     Lo que esto NO ve es lo que DESAPARECE —un recuerdo borrado, o
     desaprobado—, porque pedir la punta nunca muestra un hueco de más
     atrás. Para eso está la relectura completa cada RESINCRO vueltas: sin
     ella una foto borrada se seguiría proyectando toda la noche. */
  async function colaNueva(cuantosLlevamos){
    if(!HAY_NUBE) return null;
    try{
      if(puedoEditar(codigo))
        return await SB.ver('ce_items',
          `codigo=eq.${encodeURIComponent(codigo)}&estado=eq.aprobado`
          +`&select=id,kind,autor,ts,estado&order=ts.asc,id.asc`
          +`&offset=${cuantosLlevamos}&limit=${POR_TANDA}`, claveDe(codigo));
      if(hayFuncionesNuevas!==false){
        const v=await SB.rpc('ce_items_de',
          {p_codigo:codigo, p_desde:cuantosLlevamos, p_cuanto:POR_TANDA});
        if(Array.isArray(v)) return v;
      }
    }catch(e){ /* que lea todo */ }
    return null;
  }
  async function revisar(){
    const cuenta=app.querySelector('#cuenta');
    if(!cuenta||!tela.isConnected) return false;   // la vista ya no está
    let nuevos;
    /* la primera vuelta y cada RESINCRO: todo. El resto: la punta. */
    const todo = !ids.length || (vueltasSondeo % RESINCRO)===0;
    vueltasSondeo++;
    let cola = todo ? null : await colaNueva(ids.length);
    if(cola===null){
      const idx=(await indice(codigo)).filter(i=>i.estado==='aprobado');
      nuevos=idx.filter(i=>!ids.includes(i.id));
      ids=idx.map(i=>i.id);
    }else{
      /* el camino sin clave trae la fila entera: aprovecharla evita un
         pedido más por foto cuando le toque proyectarse */
      for(const v of cola) if(v && typeof v.url==='string' && !cacheItem[codigo+v.id]){
        v.data=v.url; cacheItem[codigo+v.id]=v;
      }
      nuevos=cola.filter(i=>i.estado==='aprobado' && !ids.includes(i.id));
      ids=ids.concat(nuevos.map(i=>i.id));
    }
    if(cuenta.dataset.n!==String(ids.length)){
      cuenta.innerHTML='<b style="font:inherit">0</b><small>En el muro</small>';
      contarHasta(cuenta.querySelector('b'),ids.length,700);
      cuenta.dataset.n=String(ids.length);
    }
    if(modo==='tablero') await pintarTablero();
    const ya=app.querySelector('#yaHay');
    if(ya) ya.innerHTML=ids.length
      ? `Ya mandaron <b>${ids.length}</b> ${ids.length===1?'recuerdo':'recuerdos'}`
      : '';
    if(nuevos.length){
      const ultimo=nuevos[nuevos.length-1].id;
      cursor=ids.indexOf(ultimo);
      await mostrar(ultimo,arrancado); arrancado=true; return true;
    }
    if(!arrancado&&ids.length){cursor=ids.length-1; await mostrar(ids[cursor],false); arrancado=true;}
    return false;
  }
  async function pasar(){
    if(!ids.length||!tela.isConnected) return;
    vueltas++;
    if(modo==='muro' && vueltas%6===0 && await mosaico()) return;
    cursor=(cursor+1)%ids.length;
    await mostrar(ids[cursor],false);
  }
  await revisar().catch(e=>console.error('sala',e));
  /* En la fiesta arranca en el cartel, que es lo primero que hace falta
     (que escaneen). En la demostración arranca en el MURO: lo que se está
     mostrando es cómo se ve proyectado, no el código. */
  verModo(HAY_DEMO?'muro':'cartel');
  timerSala=setInterval(async()=>{
    try{
      const hubo=await revisar();
      if(!hubo && modo!=='cartel') await pasar();  // en el cartel no se pasan fotos
    }catch(e){ console.error('sala',e); }         // una noche entera sin cortarse
  },7000);
}

  const past=(v,t)=>v?`<span class="pastilla"><b>${v}</b> ${t}</span>`:'';

  app.innerHTML=`
  <button class="volver-flota" aria-label="Volver">←</button>
  <div class="album">
    <header class="tapa-g">
      ${urlSegura(portada)?`<div class="foto" style="background-image:url('${cssUrl(portada)}')"></div>`:''}

          <div class="mosaico-a">${visuales.map(i=>
            /* href solo con direcciones http(s): urlSegura deja pasar
               data:image/... , que sirve para un <img> pero en un enlace es
               abrir un archivo con contenido ajeno desde nuestro sitio. */
            `<a href="${esc(/^https?:\/\//i.test(urlSegura(i.data))?urlSegura(i.data):'')}" target="_blank" rel="noopener noreferrer" title="Abrir en grande">

              <span class="quien-f">${esc(i.autor)}</span></a>`).join('')}</div>`

      </section>

      <section id="aRecuerdos" hidden>
        ${dedis.length?`<div class="seccion-a"><h2>Dedicatorias</h2><span>${dedis.length}</span></div>

            ${items.length} recuerdos de ${gente} ${gente===1?'persona':'personas'}.
            Se descargan en calidad original.</p>
          <div class="acciones" style="margin-top:0"><button id="dl">Descargar todo</button><button id="pdf">Guardar en PDF</button></div>
          ${(()=>{ const v=m.vence||venceDe(m.fecha); return v
            ?`<p class="pie-nota">Disponible para descargar hasta el ${bonito(v)}.</p>`:''; })()}`
        :`<div class="vacio">El álbum está vacío por ahora.</div>`}
        ${sumate('Las fotos de tu fiesta,<br>en la pantalla y para siempre.','Hola! Vi un álbum de Click Eterno y quiero info para mi evento ✨')}
        <div class="pie-marca"><img src="${LOGO_MARK}" alt="Click Eterno"></div>
      </section>
    </div>
  </div>
  <nav class="barra-abajo" role="tablist">
    ${solapa('aFotos',IC.fotos,'Fotos')}
    ${solapa('aRecuerdos',IC.recuerdos,'Recuerdos')}
    ${solapa('aGuardar',IC.guardar,'Guardar')}
  </nav>`;
  app.querySelector('.volver-flota').onclick=()=>ir('evento/'+codigo);
  /* se puede entrar directo a una solapa: #album/CODIGO/guardar */
  const pedida=abrirEn?'a'+abrirEn[0].toUpperCase()+abrirEn.slice(1):'';
  activarSolapas(pedida && app.querySelector(`[data-sol="${pedida}"]`) ? pedida : 'aFotos');
  const dl=app.querySelector('#dl');
  if(dl){
    const base=nombreSeguro(m.nombre);
    dl.onclick=async()=>{
      if(dl.disabled) return;
      dl.disabled=true;
      const total=visuales.length;
      /* El archivo se arma entero en la memoria del aparato. En una compu
         no molesta; en un celular, con cientos de fotos, la pestaña se
         cierra sola a mitad de camino. Mejor avisar antes que perderlo. */
      const pesaMucho=total>150;
      if(pesaMucho && !/compu|escritorio/i.test('') &&
         !confirm(`Son ${total} archivos. Armarlos en un solo ZIP puede ser demasiado `+
                  `para un celular: si podés, hacelo desde una computadora.\n\n¿Seguimos igual?`)){
        dl.disabled=false;
        return;
      }
      let hechos=0, fallados=0;
      const paso=()=>{ dl.textContent=`Bajando ${hechos}/${total}…`; };
      paso();
      try{
        /* Hay que traerse el contenido real: antes se guardaba la dirección
           del archivo como si fuera el archivo, y el ZIP salía vacío. */
        const archivos=[];
        for(const [k,i] of visuales.entries()){
          try{
            const b=await aBlob(i.data);
            if(b&&b.size) archivos.push({
              nombre:`${base}-${String(k+1).padStart(3,'0')}.${EXT[b.type]||(i.kind==='foto'?'jpg':'mp4')}`,
              blob:b});
            else fallados++;
          }catch(err){ fallados++; console.warn('no pude bajar',i.id,err); }
          hechos++; paso();
        }
        if(!archivos.length) throw new Error('no se pudo bajar ningún archivo');

        const dedis=items.filter(i=>i.kind==='mensaje');
        const texto=dedis.length?`${m.nombre} · ${bonito(m.fecha)}\n\n`+
          dedis.map(i=>`"${i.texto}"\n   — ${i.autor}\n`).join('\n'):'';

        /* El zip se pide acá, que es el único lugar del muro que lo usa. */
        try{ await cargarLib('lib/jszip.min.js'); }catch(e){}
        if(window.JSZip){
          dl.textContent='Armando el archivo…';
          const zip=new JSZip();
          archivos.forEach(a=>zip.file(a.nombre,a.blob));
          if(texto) zip.file('dedicatorias.txt',texto);
          bajarBlob(await zip.generateAsync({type:'blob'}),`${base} - Click Eterno.zip`);
          recado(`Listo · ${archivos.length} archivos`+(fallados?` (${fallados} no se pudieron bajar)`:''));
        }else{
          /* Sin la librería (CDN caído): de a uno, pero como blob propio,
             así el navegador descarga en vez de irse de la página. */
          archivos.forEach((a,k)=>setTimeout(()=>bajarBlob(a.blob,a.nombre),k*500));
          if(texto) setTimeout(()=>bajarBlob(new Blob([texto],{type:'text/plain'}),'dedicatorias.txt'),archivos.length*500);
          recado('Descargando de a una');
        }
      }catch(e){
        console.error('descargar album',e);
        recado('No pude preparar la descarga: '+motivo(e));
      }
      dl.disabled=false; dl.textContent='Descargar todo';
    };
    app.querySelector('#pdf').onclick=()=>{
      document.body.classList.add('imp-album');
      const limpiar=()=>document.body.classList.remove('imp-album');
      addEventListener('afterprint',limpiar,{once:true});
      setTimeout(limpiar,4000);
      window.print();
    };
  }
}

async function vDiagnostico(){
  parar(); tono();
  app.innerHTML=`${barra('Diagnóstico','Versión v12')}
  <div class="wrap" style="padding-top:24px">
    <div id="res" style="font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.9;
      white-space:pre-wrap;word-break:break-word;color:#B5AC9E"></div>
    <div id="zonaPrueba" style="margin-top:30px"></div>
  </div>`;
  app.querySelector('.vuelve').onclick=()=>ir('portada');
  const out=app.querySelector('#res');
  const linea=(t,ok)=>{ out.innerHTML += `<div style="color:${ok===true?'#7BE0A5':ok===false?'#FF7B94':'#B5AC9E'}">${esc(t)}</div>`; };
  const titulo=t=>{ out.innerHTML += `<div style="color:var(--oro);margin:18px 0 6px;letter-spacing:.16em;text-transform:uppercase;font-size:10.5px">${esc(t)}</div>`; };
  /* deja anotado si algo salió mal, para el resumen del final */
  const problemas=[];
  const revisar=(t,ok,nota)=>{ linea((ok?'✓ ':'✗ ')+t, ok); if(!ok) problemas.push(nota||t); return ok; };

  titulo('Configuración');
  linea('Versión de la app: v12');
  revisar('La nube está configurada', HAY_NUBE, 'faltan la URL y la clave de Supabase');
  linea('URL: '+NUBE.url);
  linea('Navegador en línea: '+(navigator.onLine?'sí':'no'));

  /* La clave pública trae adentro qué permisos tiene. Si alguna vez se pega
     por error la clave de servicio, cualquiera que abra la página tiene
     permiso total sobre la base: hay que verlo de inmediato. */
  let rol='';
  try{
    const cuerpo=JSON.parse(atob(NUBE.clave.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    rol=cuerpo.role||'';
    if(rol==='service_role'){
      revisar('La clave de la página es la PÚBLICA', false,
        'PELIGRO: está pegada la clave de servicio. Cambiala ya por la anon.');
      linea('  Cualquiera que abra la página tiene permiso TOTAL sobre la base.', false);
    }else revisar('La clave de la página es la pública ('+rol+')', rol==='anon',
      'la clave no parece la anon: revisá cuál pegaste');
    if(cuerpo.exp){
      const vence=new Date(cuerpo.exp*1000);
      const dias=Math.round((vence-Date.now())/86400000);
      revisar('La clave no está vencida (vence en '+dias+' días)', dias>0,
        'la clave de la base está vencida: hay que generar una nueva');
    }
  }catch(e){ linea('No pude leer la clave para revisarla'); }

  titulo('Conexión');
  let hayTablas=false;
  try{
    const r=await fetch(NUBE.url+'/rest/v1/ce_eventos?select=codigo&limit=1',
      {cache:'no-store',headers:{apikey:NUBE.clave,Authorization:'Bearer '+NUBE.clave}});
    const txt=await r.text();
    hayTablas=r.ok;
    revisar('La base contesta ('+r.status+')', r.ok, 'la base no contesta: '+txt.slice(0,80));
    if(!r.ok) linea('  '+txt.slice(0,200), false);
  }catch(e){
    revisar('La base contesta', false, 'no hay conexión con la base: '+e.message);
  }

  titulo('Qué tiene instalado');
  if(hayTablas){
    /* pedir una columna que no existe da error: así sabemos si falta */
    const tieneColumna=async col=>{
      try{ await SB.ver('ce_eventos',`select=${col}&limit=1`); return true; }catch(e){ return false; }
    };
    for(const [col,para] of [['lanza','programar la apertura'],
                             ['hashtag','el hashtag del evento'],
                             ['lugar','el lugar del evento'],
                             ['camara','la cámara descartable']]){
      const hay=await tieneColumna(col);
      revisar(`Columna "${col}" (${para})`, hay, `falta la columna "${col}": correr el SQL que la agrega`);
    }
    const tieneFuncion=async fn=>{
      try{ await SB.rpc(fn,{p_codigo:null}); return true; }
      catch(e){ return !/PGRST202|does not exist|not find the function|404/i.test(String(e.message||'')); }
    };
    const hayClaves=await tieneFuncion('ce_quien_soy');
    revisar('El sistema de claves está instalado', hayClaves,
      'falta correr sql/claves.sql: sin eso cualquiera puede modificar cualquier evento');

    titulo('La clave llega hasta la base');
    try{
      const r=await SB.quienSoy(null,'PRUEBA-DE-CABECERA');
      revisar('La clave viaja entera hasta la base', !!(r&&r.llego_la_clave),
        'la clave no llega: nadie va a poder moderar ni cambiar nada');
      if(claveMaestra){
        const q=await SB.quienSoy(null,claveMaestra);
        revisar('La clave de administrador está reconocida', !!(q&&q.es_maestra),
          'la clave de administrador no la reconoce la base');
      }else linea('  (entrá con la clave de administrador para probarla también)');
    }catch(e){ revisar('La clave viaja hasta la base', false, 'no pude comprobarlo: '+motivo(e)); }
  }else{
    linea('  Sin conexión no se puede revisar el resto.');
  }

  titulo('Resumen');
  if(problemas.length){
    linea(problemas.length+' cosa'+(problemas.length>1?'s':'')+' para arreglar:', false);
    problemas.forEach(p=>linea('  · '+p, false));
  }else linea('Todo en orden.', true);

  /* ── la prueba de fondo: escribe de verdad y después se limpia sola ── */
  const zona=app.querySelector('#zonaPrueba');
  zona.innerHTML=`
    <p style="font-size:13px;color:#B5AC9E;line-height:1.7;margin-bottom:16px">
      La prueba de fondo crea un evento de mentira, comprueba que los permisos
      funcionen de verdad y después lo borra. No toca ninguna fiesta tuya.</p>
    <button class="hilo-btn" id="probarTodo">Probar los permisos de verdad</button>
    <div id="salidaPrueba" style="font-family:ui-monospace,monospace;font-size:12.5px;
      line-height:1.9;white-space:pre-wrap;word-break:break-word;margin-top:18px"></div>`;
  zona.querySelector('#probarTodo').onclick=e=>pruebaDeFondo(e.currentTarget, zona.querySelector('#salidaPrueba'));
}

/* Prueba de fondo contra la base de verdad. Crea un evento propio con un
   código que no se puede confundir con uno real, lo maltrata, y lo borra
   pase lo que pase. Es la única forma de saber que los permisos funcionan
   en tu Supabase y no solo en las pruebas. */
async function pruebaDeFondo(boton, salida){
  if(boton.dataset.ocupado) return;
  boton.dataset.ocupado='1'; boton.disabled=true; boton.textContent='Probando…';
  salida.innerHTML='';
  const fallas=[];
  const di=(t,ok)=>{ salida.innerHTML += `<div style="color:${ok===true?'#7BE0A5':ok===false?'#FF7B94':'#B5AC9E'}">${esc(t)}</div>`; };
  const probar=(t,ok)=>{ di((ok?'✓ ':'✗ ')+t, ok); if(!ok) fallas.push(t); };
  /* el código lleva PRUEBA adelante: si algo queda colgado, se ve enseguida */
  const cod='PRUEBA-'+nuevaClave();
  const clave=nuevaClave(), otraClave=nuevaClave();
  di('Evento de prueba: '+cod);
  try{
    // 1. crear: la base tiene que exigir clave
    try{
      await SB.crear('ce_eventos',{codigo:cod,nombre:'Prueba de Click Eterno',
        fecha:hoy(),tipo:'XV',tono:'#D9AE72',moderar:true,cerrado:false,creado:Date.now()});
      probar('Sin clave NO se puede crear un evento', false);
    }catch(e){ probar('Sin clave NO se puede crear un evento', true); }

    await SB.crear('ce_eventos',{codigo:cod,nombre:'Prueba de Click Eterno',
      fecha:hoy(),tipo:'XV',tono:'#D9AE72',moderar:true,cerrado:false,creado:Date.now()}, clave);
    probar('Con clave sí se crea', !!(await meta(cod)));

    // 2. un invitado sube: la base decide el estado, no el celular
    await SB.crear('ce_items',{id:'p-'+idNuevo(),codigo:cod,kind:'mensaje',url:'',
      autor:'Invitado de prueba',texto:'hola',estado:'aprobado',ts:Date.now()});
    /* CON la clave: desde blindaje.sql, sin ella la base no devuelve ni una
       fila. Sin esto el diagnóstico veía una lista vacía y le informaba al
       dueño "✗ un invitado puede autoaprobarse", que es falso y es justo lo
       contrario de lo que pasa. Un diagnóstico que miente es peor que no
       tenerlo. */
    const subidos=await SB.ver('ce_items',
      `codigo=eq.${encodeURIComponent(cod)}&select=estado`, clave);
    probar('Un invitado no puede autoaprobarse (moderación encendida)',
      subidos.length===1 && subidos[0].estado==='pendiente');

    // 3. sin la clave no se toca nada
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'HACKEADO'}).catch(()=>{});
    probar('Sin clave NO se puede renombrar el evento', (await meta(cod)).nombre!=='HACKEADO');
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{cerrado:true}).catch(()=>{});
    probar('Sin clave NO se puede cerrar el muro', !(await meta(cod)).cerrado);
    await SB.borrar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`).catch(()=>{});
    probar('Sin clave NO se puede borrar el evento', !!(await meta(cod)));

    // 4. con la clave sí
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'Renombrada'},clave);
    probar('Con la clave sí se renombra', (await meta(cod)).nombre==='Renombrada');

    // 5. cambiar la clave deja la vieja sin efecto
    await SB.cambiarClave(cod,clave,otraClave);
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'Con la vieja'},clave).catch(()=>{});
    probar('La clave vieja deja de servir', (await meta(cod)).nombre!=='Con la vieja');
    await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{nombre:'Con la nueva'},otraClave);
    probar('La clave nueva sirve', (await meta(cod)).nombre==='Con la nueva');

    // 6. la clave de otro evento no abre este
    if(claveMaestra){
      await SB.editar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,{tono:'#111111'},claveMaestra);
      probar('La clave de administrador abre cualquier evento', (await meta(cod)).tono==='#111111');
    }else di('  (entrá como administrador para probar también la clave maestra)');
  }catch(e){
    di('La prueba se cortó: '+motivo(e), false);
    fallas.push('se cortó a la mitad');
  }finally{
    /* pase lo que pase, el evento de prueba no queda dando vueltas */
    di('Limpiando…');
    let limpio=false;
    for(const c of [otraClave, clave, claveMaestra].filter(Boolean)){
      try{
        await SB.borrar('ce_items',`codigo=eq.${encodeURIComponent(cod)}`,c);
        await SB.borrar('ce_eventos',`codigo=eq.${encodeURIComponent(cod)}`,c);
        if(!(await meta(cod))){ limpio=true; break; }
      }catch(e){}
    }
    probar('El evento de prueba quedó borrado', limpio);
    if(!limpio) di('  Borralo a mano: '+cod, false);
    di('———');
    if(fallas.length) di(fallas.length+' prueba'+(fallas.length>1?'s':'')+' fallaron. Mandale esta pantalla a Click Eterno.', false);
    else di('Los permisos funcionan como corresponde.', true);
    boton.disabled=false; boton.textContent='Probar de nuevo'; delete boton.dataset.ocupado;
  }
}

/* ══════════ router ══════════ */
/* Antes ir() cambiaba el hash Y pintaba: el evento hashchange volvía a
   pintar, así que cada navegación cargaba todo dos veces. */
/* Empezar de nuevo es recargar: todo lo de la demostración vive en memoria,
   así que la recarga lo limpia entero y vuelve a sembrar la misma fiesta.
   Sin hash, para caer donde cae el que entra por primera vez. */
function reiniciarDemo(){ location.replace(location.pathname+'?demo=1'); }

function ir(ruta){
  const destino='#'+ruta;
  if(location.hash===destino) pintar(ruta);   // mismo hash: no hay evento
  else location.hash=destino;                 // hashchange pinta
}

/* Última red: si una vista falla, el usuario ve una salida, no una pantalla muerta. */
function pantallaError(e){
  console.error('vista',e);
  try{ parar(); }catch(_){}
  app.innerHTML=`
  <div class="final"><div>
    <img src="${LOGO_MARK}" style="width:150px;opacity:.6" alt="Click Eterno">
    <div class="filete" style="max-width:240px;margin:24px auto">${ESTRELLA}</div>
    <p class="espaciado">Algo se cortó</p>
    <h1 class="ital" style="font-size:clamp(30px,8vw,42px);margin:14px 0 14px">Probá de nuevo</h1>
    <p style="color:#B5AC9E;line-height:1.8;max-width:32ch;margin:0 auto;font-size:14.5px">${esc(motivo(e))}</p>
    <div style="max-width:320px;margin:32px auto 0">
      <button class="oro-btn" id="recargar">Recargar</button>
      <button class="hilo-btn" id="alInicio">Volver al inicio</button>
    </div>
  </div></div>`;
  app.querySelector('#recargar').onclick=()=>location.reload();
  app.querySelector('#alInicio').onclick=()=>ir('portada');
}

const PIDE_CODIGO=['evento','subir','pantalla','album','cartel','tarjetas'];
function pintar(ruta){
  const [v,arg,extra]=String(ruta||'').split('/');
  window.scrollTo(0,0);
  if(PIDE_CODIGO.includes(v)&&!arg){        // enlace cortado o mal pegado
    recado('Ese enlace está incompleto');
    return vPortada().catch(pantallaError);
  }
  let p;
  try{
    /* En demostración solo existe lo que ve un invitado: subir algo, la
       pantalla del salón y el álbum. El panel del organizador, el cartel y
       el diagnóstico son herramientas de quien vende el servicio, no parte
       de la muestra. Todo lo demás cae en la pantalla de subir. */
    /* La prueba del muro es la pantalla del salón: es lo que se proyecta y
       es lo que hay que vender. Subir algo y el álbum se llegan desde ahí. */
    if(HAY_DEMO && ['panel','evento','cartel','tarjetas','diagnostico','invitado','proyector','limpieza','central','codigo','portada',''].includes(v))
      return ir('pantalla/DEMO-FIESTA');
    if(v==='panel') p=vAcceso();
    else if(v==='codigo') p=vPorCodigo();
    else if(v==='central'||v==='limpieza') p=vLimpieza();
    else if(v==='diagnostico') p=vDiagnostico();
    else if(v==='evento') p=vEvento(arg);
    else if(v==='invitado') p=vInvitado();
    else if(v==='proyector') p=vElegir('pantalla','Pantalla');
    else if(v==='subir') p=vSubir(arg);
    else if(v==='pantalla') p=vPantalla(arg);
    else if(v==='album') p=vAlbum(arg,extra);
    else if(v==='cartel') p=vCartel(arg);
    else if(v==='tarjetas') p=vTarjetas(arg);
    else p=vPortada();
  }catch(e){ return pantallaError(e); }
  if(p&&typeof p.catch==='function') p.catch(pantallaError);
  return p;
}
addEventListener('hashchange',()=>pintar(location.hash.slice(1)||'portada'));

/* Nada de fallos mudos: si una promesa queda sin capturar, se avisa. */
addEventListener('unhandledrejection',e=>{
  console.error('promesa sin capturar',e.reason);
  recado('Algo falló: '+motivo(e.reason));
  e.preventDefault();
});
/* Y lo mismo con lo que revienta sin promesa de por medio: un toque que
   fallaba dentro de su propio manejador no mostraba nada en pantalla. */
/* Cuando una foto del álbum termina de cargar se marca, y el CSS le hace
   el fundido y le apaga el latido de abajo. En captura y una sola vez por
   imagen, igual que el respaldo de las miniaturas: "load" tampoco burbujea. */
/* En DOCUMENT, no en window. Medido: el "error" de un <img> sí llega a
   window en captura —por eso el respaldo de las miniaturas funciona—
   pero el "load" NO: en window, "load" es el de la página. Puesto en
   window esto no marcaba una sola foto y el álbum quedaba invisible
   entero. */
document.addEventListener('load',e=>{
  const n=e.target;
  if(n && n.tagName==='IMG' && n.closest && n.closest('.mosaico-a')) n.dataset.lista='1';
}, true);
/* Si una miniatura no está —las fotos de antes de esto no la tienen—, la
   imagen se cae sola a la foto entera. En captura, porque los errores de
   un <img> no burbujean y un oyente normal no se entera nunca. */
addEventListener('error',e=>{
  const n=e.target;
  if(n && n.tagName==='IMG' && n.dataset && n.dataset.entera){
    const entera=n.dataset.entera;
    delete n.dataset.entera;          // una sola vez: si la entera tampoco está, no insistimos
    n.src=entera;
  }
}, true);
addEventListener('error',e=>{
  if(e&&e.target&&e.target!==window) return;   // una imagen rota no es esto
  console.error('error suelto',e.error||e.message);
  try{ recado('Algo falló: '+motivo(e.error||{message:e.message})); }catch(_){}
});

(async function(){
  if(HAY_DEMO){
    /* Que el visitante caiga adentro de una fiesta andando, no en una
       pantalla de bienvenida. Si ya la sembró en esta pestaña, se entra
       directo. */
    if(!EN_MARCO) document.body.classList.add('en-demo');
    if(!EN_MARCO) document.body.insertAdjacentHTML('afterbegin', `
      <div id="cinta-demo">
        <span class="mini">Demostración</span>
        <span><b>Demostración</b> · la fiesta y las fotos son inventadas</span>
        <button id="deNuevo">Empezar de nuevo</button>
        ${ENMARCADO?'':'<a href="/">Salir</a>'}
        <button class="plegar" id="plegarCinta" aria-label="Achicar este aviso">✕</button>
      </div>`);
    const bn=document.getElementById('deNuevo');
    if(bn) bn.onclick=reiniciarDemo;
    /* Plegar y desplegar. Plegada, toda la tira es el botón de volver a
       abrirla: 18px de alto son poco para apuntarle, pero es el ancho
       entero de la pantalla. */
    const cinta=document.getElementById('cinta-demo');
    const plegar=document.getElementById('plegarCinta');
    if(plegar) plegar.onclick=e=>{ e.stopPropagation();
      document.body.classList.add('cinta-chica'); };
    if(cinta) cinta.onclick=()=>{
      if(document.body.classList.contains('cinta-chica'))
        document.body.classList.remove('cinta-chica');
      medirCinta();
    };
    /* Cuánto mide de verdad, después de dibujarla. Si la damos por
       supuesta, al envolver en dos líneas la cinta vuelve a taparle los
       botones a la proyección, que es el problema que veníamos a
       resolver. */
    function medirCinta(){
      if(!cinta) return;
      requestAnimationFrame(()=>document.body.style.setProperty(
        '--cinta', (cinta.offsetHeight||38)+'px'));
    }
    if(plegar) plegar.addEventListener('click',medirCinta);
    addEventListener('resize',medirCinta);
    addEventListener('orientationchange',medirCinta);
    medirCinta();
    /* Se siembra SIEMPRE, sin preguntar si ya estaba: es un modo prueba, y
       cada vez que alguien entra tiene que encontrarlo igual que el primero.
       Lo que dejó el anterior no es parte de la muestra. */
    app.innerHTML = `<div class="final"><div>
      <img src="${LOGO_MARK}" style="width:120px;opacity:.6" alt="">
      <p class="espaciado" style="margin-top:24px">Preparando la fiesta de ejemplo…</p>
    </div></div>`;
    try{ await sembrar(); }catch(e){ console.error('demo',e); }
    return;   // sembrar() deja al visitante en la pantalla de subir
  }
  pintar(location.hash.slice(1)||'portada');
})();
</script>
