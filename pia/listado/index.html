<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listado de invitados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- En el repo, no en un CDN: este panel muestra la lista de invitados. -->
<script src="../../lib/xlsx.full.min.js"></script>
<style>
  :root{ --wine:#6b1f36; --rose:#b8677a; --blush:#f3dde3; --blush-light:#fbf1ee; --cream:#fffaf6; --gold:#b8935a; --ink:#3a2a2f; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Jost', sans-serif; background:var(--blush-light); color:var(--ink); min-height:100vh; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:600; }
  .wrap{ max-width:720px; margin:0 auto; padding:32px 20px 60px; }

  /* ---------- Portón de acceso ---------- */
  #gate{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; padding:20px; }
  #gate h1{ font-size:28px; color:var(--wine); margin-bottom:8px; }
  #gate p{ color:#8a7377; font-size:14px; margin-bottom:24px; max-width:280px; }
  #gate input{ width:100%; max-width:300px; padding:13px 16px; border-radius:10px; border:1px solid #e0cdd2; font-family:'Jost',sans-serif; font-size:15px; margin-bottom:14px; }
  #gate button{ background:var(--wine); color:#fff; border:none; padding:13px 32px; border-radius:30px; font-size:14px; cursor:pointer; }
  #gate-error{ color:#c0392b; font-size:13px; margin-top:12px; min-height:18px; }

  /* ---------- Panel ---------- */
  #panel{ display:none; }
  #panel.show{ display:block; }
  header{ text-align:center; margin-bottom:28px; }
  header h1{ font-size:30px; color:var(--wine); }
  header p{ color:#8a7377; font-size:14px; margin-top:4px; }

  .stats{ display:flex; gap:12px; margin-bottom:24px; }
  .stat{ flex:1; background:#fff; border-radius:14px; padding:18px 10px; text-align:center; box-shadow:0 8px 20px -8px rgba(107,31,54,0.15); }
  .stat .n{ font-family:'Cormorant Garamond', serif; font-size:30px; color:var(--wine); font-weight:600; }
  .stat.confirmados .n{ color:#2e8b57; }
  .stat.no-asisten .n{ color:#c0392b; }
  .stat .lbl{ font-size:11px; letter-spacing:0.05em; color:#8a7377; margin-top:4px; text-transform:uppercase; }

  .columnas{ background:#fff; border-radius:14px; padding:16px 18px; margin-bottom:20px; box-shadow:0 8px 20px -8px rgba(107,31,54,0.1); }
  .columnas p{ font-size:12px; color:#8a7377; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em; }
  .col-check{ display:inline-flex; align-items:center; gap:6px; margin:0 12px 8px 0; font-size:13px; }

  .acciones{ display:flex; gap:10px; margin-bottom:24px; }
  .acciones button{ flex:1; padding:13px; border-radius:10px; border:1px solid var(--wine); background:#fff; color:var(--wine); font-size:13px; cursor:pointer; }
  .acciones button.filled{ background:var(--wine); color:#fff; }

  .tabla-wrap{ background:#fff; border-radius:14px; overflow-x:auto; box-shadow:0 8px 20px -8px rgba(107,31,54,0.1); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ padding:12px 14px; text-align:left; white-space:nowrap; }
  th{ background:var(--blush); color:var(--wine); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  tr:not(:last-child) td{ border-bottom:1px solid #f2e5e8; }
  td.confirma-si{ color:#2e8b57; font-weight:600; }
  td.confirma-no{ color:#c0392b; font-weight:600; }

  #empty{ text-align:center; padding:40px 20px; color:#8a7377; font-size:14px; }
  #loading{ text-align:center; padding:40px; color:#8a7377; font-size:14px; }

  @media print{
    #gate, .acciones, .columnas{ display:none !important; }
    body{ background:#fff; }
  }
</style>
</head>
<body>

<!-- El portón de antes comparaba el correo contra uno escrito en esta
     misma página: cualquiera lo leía en el código y entraba. Y aunque no
     entrara, la dirección de la planilla también estaba acá y devolvía la
     lista entera a quien la pidiera. Ahora la clave no está en ninguna
     página: la comprueba el Apps Script (ver apps-script/listado.gs.txt). -->
<div id="gate">
  <h1>Listado de invitados</h1>
  <p>Ingresá la clave del listado para ver quiénes confirmaron.</p>
  <input type="password" id="clave-input" placeholder="clave" autocomplete="current-password">
  <button id="gate-btn">Ver listado</button>
  <div id="gate-error"></div>
</div>

<div id="panel">
  <div class="wrap">
    <header>
      <h1 id="panel-title">Listado de invitados</h1>
      <p id="panel-subtitle"></p>
    </header>

    <div class="stats">
      <div class="stat"><div class="n" id="stat-total">–</div><div class="lbl">En total</div></div>
      <div class="stat confirmados"><div class="n" id="stat-confirmados">–</div><div class="lbl">Confirmados</div></div>
      <div class="stat no-asisten"><div class="n" id="stat-no">–</div><div class="lbl">No asisten</div></div>
    </div>

    <div class="columnas">
      <p>Columnas visibles</p>
      <div id="col-checks"></div>
    </div>

    <div class="acciones">
      <button id="btn-excel" class="filled">Descargar Excel</button>
      <button id="btn-print">Imprimir listado</button>
    </div>

    <div id="loading">Cargando confirmaciones...</div>
    <div id="empty" style="display:none;">Todavía no hay confirmaciones cargadas.</div>
    <div class="tabla-wrap" id="tabla-wrap" style="display:none;">
      <table id="tabla">
        <thead><tr id="tabla-head"></tr></thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ======================================================
   CONFIGURACIÓN — cargar por cada clienta
   ====================================================== */
const CONFIG = {
  // ↓↓↓ LO ÚNICO QUE SE TOCA AL COPIAR ESTA PLANTILLA ↓↓↓
  nombreEvento: "Fiesta de 15 de Pia",
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbyYAQY0rbpCUeLFpKQq4S5O1uWIwt7vDp43g1Hl8kRm6RsTgnBc-Hi3OEflcs5_0V6eZw/exec",
  // ↑↑↑ y nada más ↑↑↑
  // La clave NO va acá: esta página es pública. La guarda el Apps Script en
  // las propiedades del proyecto y la comprueba él. La inventa preparar().
};
/* La clave que escribió quien organiza, guardada en ESTE aparato para no
   tener que escribirla cada vez. Nunca viaja a ningún lado que no sea la
   planilla, y no queda en el código. */
/* Por EVENTO y no una sola para todos: con una clave compartida, el
   segundo listado que abras en el mismo aparato arranca mandando la
   clave del primero y te dice "esa clave no es" sin que hayas escrito
   nada. */
const K_CLAVE = 'ce:listado:' + (CONFIG.appsScriptUrl.match(/\/s\/([^/]+)/) || [0, 'x'])[1].slice(0, 24);
const claveGuardada = () => { try { return localStorage.getItem(K_CLAVE) || ''; } catch (e) { return ''; } };
const guardarClave = v => { try { localStorage.setItem(K_CLAVE, v); } catch (e) {} };
const olvidarClave = () => { try { localStorage.removeItem(K_CLAVE); } catch (e) {} };

/* Lo que escribe un invitado en la confirmación llega tal cual desde la
   planilla y se dibuja en esta tabla. Sin esto, alguien que se anota con el
   nombre <img src=x onerror="..."> ejecuta lo que quiera en la pantalla de
   quien organiza la fiesta, que es justo la que ve la lista entera. */
const esc = v => String(v == null ? '' : v)
  .replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

/* Las columnas NO se escriben acá: salen de lo que manda la planilla.
   Escritas a mano son las del formulario de UNA invitación, y a la
   siguiente —que pregunta otras cosas— la tabla le sale con las seis
   filas vacías y sin un solo error a la vista. Acá cada invitación
   pregunta lo suyo y el Apps Script crea la columna sola, así que la
   única lista que no miente es la que viene con los datos. */
let TODAS_LAS_COLUMNAS = [];

document.getElementById('panel-title').textContent = CONFIG.nombreEvento;
document.getElementById('panel-subtitle').textContent = "Listado en tiempo real";

let invitados = [];
let resumen = null;
let COL_CONFIRMA = 'Confirma';
let COL_NOMBRE = 'Nombre';
let columnasActivas = new Set();

/* ---------- Portón de acceso ---------- */
const campoClave = document.getElementById('clave-input');
const errorGate = document.getElementById('gate-error');

async function entrar(clave) {
  errorGate.textContent = '';
  const btn = document.getElementById('gate-btn');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const r = await cargarDatos(clave);
  btn.disabled = false; btn.textContent = 'Ver listado';
  if (r === true) {
    guardarClave(clave);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('panel').classList.add('show');
    return;
  }
  olvidarClave();
  errorGate.textContent =
      r === 'clave' ? 'Esa clave no es. Probá de nuevo.'
    : r === 'viejo' ? 'La planilla todavía no tiene puesta la clave: falta correr preparar() una vez en el Apps Script.'
    /* "Falta llenar CONFIG" y "se cortó internet" se ven igual desde
       acá —las dos terminan sin datos— y no son lo mismo: una la
       arregla quien publicó la página y la otra se arregla sola. Si
       la dirección está vacía, lo decimos con todas las letras en vez
       de echarle la culpa a la conexión. */
    : r === 'sinconfig' ? 'Falta configurar esta página: el CONFIG.appsScriptUrl está vacío.'
    : 'No se pudo conectar con la planilla. Probá de nuevo en un momento.';
}

document.getElementById('gate-btn').addEventListener('click', () => {
  const v = campoClave.value.trim();
  if (!v) return (errorGate.textContent = 'Escribí la clave.');
  entrar(v);
});
campoClave.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gate-btn').click(); });
/* si ya entró antes en este aparato, no se la volvemos a pedir */
if (claveGuardada()) entrar(claveGuardada());

/* ---------- Checkboxes de columnas ----------
   Se dibujan DESPUÉS de cargar, porque hasta entonces no sabemos qué
   preguntó esta invitación. El orden: primero el nombre y el sí/no,
   que es lo que se mira, y atrás el resto como está en la planilla. */
const colChecksEl = document.getElementById('col-checks');
/* Busca la columna por PALABRA ENTERA, no por "contiene".
   Con "contiene", `confirma` matcheaba primero "Fecha y hora de la
   confirmaCIÓN" —la del reloj— y el listado pintaba el sí/no contra
   una fecha: cero confirmados con la planilla llena, y sin un solo
   error. Por eso también se saca el acento y la puntuación: "¿Confirma?"
   tiene que contar como la palabra `confirma`. */
function buscarCol(claves, palabra){
  const limpiar = t => String(t).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
  return claves.find(c => limpiar(c).split(' ').includes(palabra));
}

function columnasDe(filas){
  const vistas = [];
  filas.forEach(f => Object.keys(f).forEach(k => { if (!vistas.includes(k)) vistas.push(k); }));
  const primeras = [COL_NOMBRE, COL_CONFIRMA].filter(c => vistas.includes(c));
  return primeras.concat(vistas.filter(c => !primeras.includes(c)));
}
function pintarChips(){
  colChecksEl.innerHTML = '';
  TODAS_LAS_COLUMNAS.forEach(col => {
    const label = document.createElement('label');
    label.className = 'col-check';
    const checked = columnasActivas.has(col);
    label.innerHTML = `<input type="checkbox" data-col="${esc(col)}" ${checked ? 'checked' : ''}> ${esc(col)}`;
    colChecksEl.appendChild(label);
  });
}
colChecksEl.addEventListener('change', (e) => {
  if (e.target.matches('input[type="checkbox"]')) {
    const col = e.target.dataset.col;
    if (e.target.checked) columnasActivas.add(col); else columnasActivas.delete(col);
    renderTabla();
  }
});

/* ---------- Carga de datos desde Google Apps Script ----------
   Devuelve true si entró, o el motivo por el que no: 'clave' (la clave está
   mal), 'viejo' (el Apps Script todavía es el de antes, el que contestaba
   sin pedir nada) o 'red'. */
async function cargarDatos(clave){
  if (!CONFIG.appsScriptUrl) return 'sinconfig';
  let data;
  try {
    const res = await fetch(CONFIG.appsScriptUrl + '?clave=' + encodeURIComponent(clave),
                            { cache: 'no-store' });
    data = await res.json();
  } catch (err) {
    return 'red';
  }
  if (data && data.error === 'sin_clave_configurada') return 'viejo';
  if (data && data.error) return 'clave';
  if (!data || !Array.isArray(data.invitados)) return 'red';

  invitados = data.invitados;
  /* El resumen y el nombre de la columna los manda la planilla, que es
     la que tiene los títulos de verdad. Contados también acá, el día
     que la columna se llame distinto esta pantalla diría "0
     confirmaron" con la planilla llena y no habría ningún error. */
  resumen = data.resumen || null;
  if (data.columnas && data.columnas.confirma) COL_CONFIRMA = data.columnas.confirma;
  if (data.columnas && data.columnas.nombre)   COL_NOMBRE   = data.columnas.nombre;
  /* Un Apps Script viejo no dice con qué columnas trabajó, y la suya
     puede llamarse "¿Confirma?" en vez de "Confirma". Sin esto, el
     sí/no se pinta contra una columna que no existe: la tabla sale
     entera pero sin un solo verde, y eso no tira ningún error.
     Esto es adivinar, y adivinar se hace SOLO con el Apps Script
     viejo: con el nuevo, la planilla dice los nombres y no hay nada
     que buscar. */
  const claves = invitados.length ? Object.keys(invitados[0]) : [];
  if (!claves.includes(COL_CONFIRMA)) COL_CONFIRMA = buscarCol(claves, 'confirma') || COL_CONFIRMA;
  if (!claves.includes(COL_NOMBRE))   COL_NOMBRE   = buscarCol(claves, 'nombre')   || COL_NOMBRE;
  TODAS_LAS_COLUMNAS = columnasDe(invitados);
  /* Se muestran las que alguien contestó. Una columna vacía en TODAS
     las filas es una pregunta que no usó nadie —o la "Persona 4" de un
     formulario que admite cinco—: mostrarla son veinte columnas de
     nada y la tabla deja de leerse. Siguen estando, apagadas, a un
     toque. */
  columnasActivas = new Set(TODAS_LAS_COLUMNAS.filter(c =>
    invitados.some(i => String(i[c] == null ? '' : i[c]).trim() !== '')));
  if (!columnasActivas.size) TODAS_LAS_COLUMNAS.forEach(c => columnasActivas.add(c));
  pintarChips();
  document.getElementById('loading').style.display = 'none';
  if (invitados.length === 0) {
    document.getElementById('empty').style.display = 'block';
  } else {
    document.getElementById('tabla-wrap').style.display = 'block';
    actualizarStats();
    renderTabla();
  }
  return true;
}

/* Si la planilla no mandó resumen —un Apps Script viejo— se cuenta acá,
   para que la pantalla no quede en blanco. */
function esSi(v){
  const t = String(v == null ? '' : v).trim().toLowerCase();
  if (!t) return false;
  if (t.indexOf('no') === 0) return false;   // "no voy" no es un sí
  return t[0] === 's' || t.includes('confirm') || t.includes('voy');
}
function actualizarStats(){
  const total = resumen ? resumen.total : invitados.length;
  const confirmados = resumen ? resumen.confirmados
                              : invitados.filter(i => esSi(i[COL_CONFIRMA])).length;
  const noAsisten = resumen ? resumen.no : total - confirmados;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-confirmados').textContent = confirmados;
  document.getElementById('stat-no').textContent = noAsisten;
}

function renderTabla(){
  const cols = TODAS_LAS_COLUMNAS.filter(c => columnasActivas.has(c));
  const head = document.getElementById('tabla-head');
  head.innerHTML = cols.map(c => `<th>${esc(c)}</th>`).join('');

  const body = document.getElementById('tabla-body');
  body.innerHTML = invitados.map(inv => {
    return '<tr>' + cols.map(c => {
      let val = String(inv[c] == null ? '' : inv[c]);
      let cls = '';
      if (c === COL_CONFIRMA) cls = esSi(val) ? 'confirma-si' : 'confirma-no';
      return `<td class="${cls}">${esc(val)}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

/* ---------- Descargar Excel ---------- */
document.getElementById('btn-excel').addEventListener('click', () => {
  const cols = TODAS_LAS_COLUMNAS.filter(c => columnasActivas.has(c));
  const filas = invitados.map(inv => {
    const fila = {};
    cols.forEach(c => { fila[c] = inv[c] || ''; });
    return fila;
  });
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Invitados");
  XLSX.writeFile(wb, `listado-${CONFIG.nombreEvento.replace(/\s+/g, '-')}.xlsx`);
});

/* ---------- Imprimir ---------- */
document.getElementById('btn-print').addEventListener('click', () => window.print());
</script>

</body>
</html>
